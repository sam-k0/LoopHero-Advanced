encyclo_tile0_0="Tại sao mọi thứ biến mất vẫn là một bí ẩn. Và tại sao vùng đất hoang tàn này vẫn còn tồn tại cũng là một bí ẩn khác. Bạn không thể gọi nó chỉ đơn giản là một con đường bình thường: không có dấu chân, không có biển chỉ dẫn, không có dấu hiệu của bất kỳ sinh vật sống nào ở gần đó. Bản chất kỳ lạ của con đường này gợi ý rằng nó có thể là biểu hiện của một ý niệm hơn là một vật thể vật lý tự tồn tại. Có lẽ bạn đã là một kẻ lang thang suốt đời, nên một không gian để di chuyển là phần không thể thiếu trong tính cách và nghề nghiệp của bạn."
encyclo_tile1_0="Ngay cả trước khi mọi chuyện xảy ra, đã có những trường hợp sinh mệnh bám víu vào thi thể mà nó từng cư ngụ. Truyền thống chôn cất người chết ở những nơi đặc biệt thay vì thiêu xác đã bị áp đặt lên mọi người trong thời kỳ một giáo phái hoại tử trỗi dậy. Chúng khăng khăng rằng đó là cách kéo dài cuộc sống của người thân, dù theo một cách khá kỳ quặc. Dĩ nhiên, các giáo đồ chẳng quan tâm đến cảm xúc của ai – nhưng chúng rất quan tâm đến việc có được xác tươi thay vì đống tro tàn. Giáo phái đó giờ chỉ còn là lịch sử cổ xưa, nhưng truyền thống đã ăn sâu quá mức."
encyclo_tile2_0="Sự điên rồ đang diễn ra xung quanh bạn trở nên rõ ràng khi nhìn vào dân làng. Như bị thôi miên, họ từ chối vượt qua ranh giới của làng quê mình và liên tục khẳng định rằng họ không có việc gì bên ngoài, nếu họ nhớ đúng. Họ chấp nhận mọi biến đổi kỳ lạ xảy ra xung quanh như điều hoàn toàn bình thường của thế giới này. Giống như tắc kè hoa, họ thích nghi và hòa nhập vào thế giới dù bạn đặt họ ở đâu. Liệu điều tương tự có thể nói về mọi thứ khác mà bạn còn nhớ được không?#Mối liên hệ của họ với mảnh thực tại nhỏ bé này thật đáng kinh ngạc: bạn có thể không hề biết có quái vật đang chờ bạn ở phía trước con đường, nhưng dân làng đã treo thưởng cho cái đầu của nó và bảo rằng nó đã khủng bố quê hương họ từ lâu... Tuy nhiên chẳng ai nói chính xác là bao nhiêu ngày hay năm."
encyclo_tile3_0="Một khu rừng lá rộng nhỏ. Hoàn hảo để gom cành cây. Những lùm cây rất đẹp, nhưng không phù hợp cho việc dạo chơi vô tư. Thường thì lùm cây là nơi trú ngụ của thú hoang, loài thích phục kích lâu dài và lao nhanh vào cổ họng con mồi. Nếu bạn vượt qua lùm cây mà không gặp nguy hiểm chết người, không có nghĩa là bạn may mắn tránh được kẻ săn mồi đang rình rập – chỉ có nghĩa là bụng nó đã no rồi."
encyclo_tile4_0="Nếu con đường của bạn dẫn qua một cánh đồng lúa mì xa lạ, hãy cẩn thận. Bù nhìn – những golem nguyên thủy – bảo vệ mùa màng khỏi kẻ ngoại lai. May mắn thay, rất khó lạc vào đây một cách tình cờ: biển lúa vàng rực có thể nhìn thấy từ xa và khó mà bỏ qua. Cũng khó mà bỏ qua tiếng lạch cạch và leng keng khi những người bảo vệ kéo lê cơ thể một chân đầy rơm và ma thuật nguyên thủy bản năng của chúng."
encyclo_tile5_0="Thông thường, nhện là sinh vật đơn độc, thích ẩn mình và rình rập trước khi tấn công con mồi. Nhưng không phải loài nhện này. Những tổ giống như tổ kiến của chúng có thể nhìn thấy từ xa. Những con nhện săn mồi chạy nhảy xung quanh thích đuổi theo và tấn công công khai. Xương phân hủy được nhúng vào tường kén bạc của chúng. Điều khá lạ vì nhện hoàn toàn có khả năng tiêu hóa mô xương. Có lẽ những bộ xương này là dấu hiệu tham chiếu cho nhện xây dựng? Hay chỉ là kiểu trang trí động vật nguyên thủy?"
encyclo_tile6_0="Nơi ở của ma cà rồng trước hết là cách thể hiện quyền lực và sự giàu có của ma cà rồng – và chỉ thứ yếu mới là nơi để sống. Chủ nhân không cần đến vô số phòng ốc hay trang trí cầu kỳ bên trong. Có thể nói một ma cà rồng đặc quyền không chỉ hút máu mà còn hút sự ngưỡng mộ và ghen tị từ đồng loại đến thăm trong những đêm hiếm hoi có khách. Có lẽ chính khát khao không ngừng muốn gây ấn tượng lẫn nhau khiến ma cà rồng tiếp tục sáng tạo những thiết kế kiến trúc ngày càng tinh xảo hơn."
encyclo_tile7_0="Từ lâu nơi này đã chứng minh là phù hợp cho các trận chiến – đã diễn ra vô số lần qua các thời kỳ lịch sử khác nhau. Đất nhanh chóng hấp thụ máu của người ngã xuống, nhưng không phải xương hay vũ khí của họ. Hầu hết các chiến trường này từng có tên gọi riêng và lịch sử phong phú, giờ đã mất trong quên lãng. Người dân quanh đây miễn cưỡng lục lọi của cải từ các chiến binh đã chết – ngay cả thú vật cũng tránh xa xác chết. Cảm giác chiến trận bất tận vẫn cuồng nộ nơi đây, dù cái chết đã cướp đi tất cả người tham chiến. Ai đến đây đều có nguy cơ trở thành một phần của trận chiến đã qua từ lâu, và rời đi với âm thanh chiến đấu mãi mãi vang vọng trong tai. Chẳng bao lâu những kẻ xui xẻo đó sẽ tìm đường quay lại, để trở thành thành viên mới trong đạo quân ma quỷ vô tận."
encyclo_tile8_0="Một bản sao rất chính xác của trại quân sự con người. Dù thiếu sự tiến bộ riêng, yêu tinh rất nhanh chóng bắt chước bất cứ thứ gì giúp chúng sinh tồn và định cư ở nơi mới. Những trại như thế này đã phục vụ nhiều thế hệ của lũ sinh vật xấu xa này, và làm rất tốt. Kỹ năng bắt chước mọi thứ mà chúng thấy của yêu tinh thật nực cười: mọi trại chúng xây đều hoàn toàn giống hệt nhau.#Hơn nữa, ví dụ, các trại đầy lều trại – dù yêu tinh sống và ngủ ngoài đất. Chúng chỉ đơn giản không biết một trại vẫn có thể hoạt động mà không cần lều."
encyclo_tile9_0="Ban đầu, ngọn hải đăng dùng để dẫn đường biển vào ban đêm – nhưng có lúc người ta cũng dùng chúng để chiếu sáng đất liền. Chúng thường được xây gần các khu sản xuất quan trọng, nơi cần tiếp tục hoạt động vào ban đêm. Đôi khi những tháp này cũng dùng để chiếu sáng các khu phố lớn trong thành phố. Giờ đây, khi mọi thiên thể đã biến mất, chúng hữu ích hơn bao giờ hết. Bạn không hoàn toàn mù trong bóng tối này, dĩ nhiên, nhưng ánh sáng giúp bạn di chuyển nhanh hơn và tự tin hơn. Đáng tiếc, điều đó không chỉ đúng với bạn."
encyclo_tile10_0="Vùng địa hình đá này không cho ra mùa màng. Ngay cả việc băng qua cũng rất khó khăn. Nhưng sự sống không biết giới hạn, và nó luôn tìm cách chinh phục cả những vùng đất khắc nghiệt nhất.#Người bản địa của những vùng đất đá hoang vu thường khá cứng cáp và bền bỉ – có lẽ vì bất kỳ ai kém cứng cáp hơn đơn giản là không thể sống sót ở đó."
encyclo_tile11_0="Núi non luôn giàu đá và tuyết. Nhưng tìm được thứ gì khác ở đó là một thách thức thực sự. Ngay cả việc thở cũng trở nên khó khăn khi bạn leo cao hơn.#Tại sao động thực vật vẫn chọn tồn tại trong điều kiện bất lợi như vậy? Có lẽ vì ít cạnh tranh với các loài khác. Rất ít sinh vật muốn tranh đấu sinh tồn ở những vùng đất khắc nghiệt này. Ngay cả việc đi qua cũng đã là một thử thách riêng."
encyclo_tile12_0="Rừng lá kim thường phong phú ở vùng lạnh. Cây cối thích nghi tốt với nhiệt độ thấp. Cuộc sống của cây là thụ động, yên lặng, không vội vã. Với nhiều loài sinh sống trong rừng, sống ở đó là cuộc chiến sinh tồn bất tận. Nhưng cây cối đã biết rằng cuối cùng chúng luôn là kẻ chiến thắng trong cuộc đấu tranh này. Chẳng bao lâu mọi cư dân rừng sẽ trở thành chất dinh dưỡng cho rễ chúng hấp thụ. Và cây cối cũng không ngừng thay đổi hay thích nghi. Chúng chỉ hơi lười thôi."
encyclo_tile13_0="Đã lâu kể từ khi thân cây thông này nhìn thấy ánh sáng mặt trời lần cuối. Điều tương tự với mọi sinh vật sống quanh đây. Với chúng, sự biến mất của mặt trời chẳng có gì đặc biệt. Tiếng ồn duy nhất bạn nghe được là tiếng kêu răng rắc nhẹ của cây. Nhưng ngay cả điều đó cũng không có nghĩa bạn đang một mình. Không ai biết bao nhiêu sinh vật có thể đang ẩn nấp quanh đây. Mắt bạn phải nhận ra cả chuyển động nhỏ nhất và tai bạn không được phép thất bại ngay cả khi ngủ, nếu bạn muốn sống sót ở đây. Chỉ khi đó bạn mới có cơ hội phục kích kẻ đang cố phục kích bạn."
encyclo_tile14_0="Màu đỏ rực của lá và rễ những cây này không liên quan đến chế độ ăn, dù một số người có thể thấy đó là sự trùng hợp hơi đáng sợ. Nói chính xác thì lá chỉ là thô sơ – đối với thực vật trong lùm máu, quang hợp chỉ là cách lấy năng lượng thứ yếu. Những dây leo ẩn dưới sàn rừng phản ứng nhanh với cử động co giật của bất kỳ sinh vật bị thương hay sắp chết nào. Trong chớp mắt nạn nhân tội nghiệp bị quấn chặt và kéo xuống đất. Việc chúng biết sinh vật đang chết như thế nào khá thú vị – nhưng không thú vị bằng cách lùm máu lan truyền loài. Những quả thịt khổng lồ thường bị nhầm là quái vật bất tử vì vẻ ngoài ghê rợn – thực ra chỉ là một loại quả đặc biệt làm từ thịt, xương và cành. Trong thời gian nở ngắn ngủi, hạt giống này dùng thịt đỏ tươi để thu hút kẻ săn mồi – xác chết của chúng sẽ nuôi dưỡng những mầm máu đỏ mới của lùm máu."
encyclo_tile15_0="Giáo phái Mũi Tên Vàng là một trong những giáo phái ngoại giáo cổ xưa nhất. Đôi khi còn gọi là Giáo phái Sấm Sét. Có chút mỉa mai khi gọi vài tảng đá đứng và một mái che đơn giản phía trên là đền thờ. Nhưng ngay cả hôm nay vẫn có người tiếp tục xây chúng. Tại sao họ làm vậy? Rất đơn giản: có thể chỉ là giáo phái, có thể là ngoại giáo, nhưng những cơn bão sấm sét ở vùng có đền thờ này thực sự xảy ra thường xuyên hơn. Giáo đồ Mũi Tên Vàng thường coi thường các tôn giáo khác vì thần của họ thực sự có thể được triệu hồi và nhìn thấy bởi bất kỳ ai, không như thần của đối thủ. Mục tiêu của các giáo đồ này dường như vẫn là bí ẩn ngay cả với chính họ. Sét thường đánh không chỉ kẻ thù tiềm năng của giáo phái, mà cả bất kỳ mục tiêu nào khác... kể cả chính những giáo đồ bất hạnh. Có lẽ họ chỉ thích nhìn thấy một sức mạnh không thể kiểm soát được mang đến thế giới này theo ý họ."
encyclo_tile16_0="Sinh tồn là một nhiệm vụ khá khó khăn. Thông thường con người dành cả đời cho nó. Nhưng nếu chỉ sinh tồn thôi chưa đủ, nếu bạn khao khát câu trả lời cho những câu hỏi mình đặt ra, nếu bạn muốn hé nhìn bí mật của sự sáng tạo – thì thư viện là nơi dành cho bạn. Ngón tay khô héo của người chép sách sẽ chỉ bạn đến đúng kệ, và bàn tay ông ta sẽ cung cấp bàn, chồng giấy cho ghi chép, cùng mực và nến bạn cần. Đừng bận tâm đến vẻ ngoài bệnh hoạn gần như không giống con người của những người chép sách.#Khi nào khát khao tri thức biến thành sự nô lệ cho nó? Câu hỏi gần như mang tính tu từ. Sự chuyển tiếp quá mượt mà. Có lẽ bạn thậm chí không nhận ra khi cảm giác say sưa về sự vượt trội từ tri thức mới dần nhường chỗ cho mong muốn khám phá điều gì đó vĩ đại hơn. Và rồi bạn sẽ ở đó – đưa mực và giấy cho một tân đồ mới, biết rằng họ đang tìm kiếm những câu trả lời mà họ sẽ không bao giờ tìm thấy."
encyclo_tile17_0="Khi tri thức về thế giới được tổng hợp và bắt đầu đan xen lẫn nhau, ma thuật được sinh ra. Không có nghi thức hoa mỹ hay điệu nhảy shaman nào cả.#Không có nhiều thông tin về cách các thư viện thực sự bị bỏ hoang. Thường thì những nông dân mang thức ăn và vật tư đến thư viện chỉ thấy toàn bộ tòa nhà đổ nát với những người chép sách đã biến mất. Những người lắm lời nhất trong số họ kể rằng các thư ký rất kích động khi lần cuối nói chuyện – họ khẳng định chính sự tồn tại của thế giới bắt đầu nói chuyện với họ bằng ngôn ngữ vũ trụ, và chẳng bao lâu họ sẽ có thể đoán định số phận toàn vũ trụ chỉ từ một chiếc lá rơi khỏi cây."
encyclo_tile18_0="Một khái niệm chung chung về dòng sông, như từ ký ức nguyên mẫu cơ bản. Chiều rộng, độ sâu và dòng chảy của nó hoàn toàn không đổi suốt chiều dài. Tuy nhiên, đối với ký ức về một dòng sông, nó lại bất thường chống lại việc bị để lại trong trạng thái chưa hoàn chỉnh. Ví dụ, hoàn toàn không thể hình dung ra một dòng sông thứ hai cho đến khi dòng sông đầu tiên hoàn tất. Và vì không còn cách nào hình thành cửa sông khi các vùng nước lớn khác không còn tồn tại, nó sẽ không bao giờ hoàn chỉnh. Đáng chú ý, chính sự tồn tại dường như thích thú với sự hiện diện của dòng sông: thế giới xung quanh nó trở nên mạnh mẽ và hoàn chỉnh hơn, như tỉnh giấc từ giấc mơ. Có lẽ do sự lưu thông tự nhiên của nước, thứ phổ biến và cần thiết nhất trong thế giới của chúng ta."
encyclo_tile19_0="Ngày xưa bạn có thể tìm thấy những chiếc đèn lồng như vậy trên mọi con đường. Cấu tạo của chúng khá cơ bản, và phép thuật ràng buộc ánh sáng đơn giản không đòi hỏi hàng năm học hành. Ánh sáng từ những chiếc đèn lồng này chắc chắn giúp bạn phát hiện kẻ săn mồi ban đêm, nhưng đó không phải là thứ giữ cho con đường an toàn – chỉ là không ai muốn ở gần đèn lồng quá lâu. Không ai biết phép thuật ánh sáng cổ xưa kia đến từ đâu, nhưng rõ ràng chẳng có gì tốt đẹp trong đó. Cảm giác như ánh sáng theo dõi mọi thứ nó chạm vào, quan sát và nghiên cứu họ. Ngay cả tảng đá vững chãi hay lớp vải dày cũng không che giấu bạn khỏi tầm mắt nó. Ngay cả những sinh vật kinh khủng nhất thế giới này cũng sợ ánh sáng siêu phàm ấy, và nhiều kẻ trong số chúng thích tìm nơi khác để làm chuyện bẩn thỉu."
encyclo_tile20_0="Những gò đất, đầm lầy, và hàng ngàn côn trùng cùng rêu phong đủ hình dạng màu sắc. Kẻ ngu ngốc sẽ chết khi cố băng qua, kẻ khôn ngoan sẽ đi vòng, và kẻ xảo quyệt sẽ dẫn kẻ thù đến đó. Từ lâu một vài bộ tộc từng sống trong đầm lầy: họ xây tháp cao để muỗi khổng lồ không với tới. Giờ chẳng còn gì sót lại. Mọi thứ hoặc bị lãng quên hoặc chỉ đơn giản thối rữa, bị đầm lầy nuốt chửng.#Một sự thật thú vị và đáng sợ: khí đầm lầy có xu hướng kích hoạt quá trình tự hủy diệt ở mọi sinh vật có khả năng tự lành. Ngay cả khi tái tạo hoàn toàn mang tính ma thuật, đầm lầy sẽ vặn vẹo và đảo ngược nó, như thể đang hút lấy chính sự sống. Với điều đó trong đầu, những câu chuyện về mọi đầm lầy đều kết nối với một con thú nguyên thủy khủng khiếp đang ngủ say sâu dưới lòng đất không còn nghe ngớ ngẩn nữa."
encyclo_tile21_0="Tòa nhà này không chỉ là một kho vũ khí đơn giản. Tên gọi khiêm tốn che giấu một trường phái chiến tranh cổ xưa. Người ta không gọi học viên của Arsenal là những chiến binh vô địch, nhưng họ chắc chắn luôn được săn đón.#Nền tảng cơ bản của Arsenal là đạt được sự thành thạo với mọi loại vũ khí và trang bị, dù kỳ lạ đến đâu – và sử dụng tất cả chúng cùng lúc, càng nhiều càng tốt. Dĩ nhiên, điều đó khó học nếu không có sẵn đa dạng thiết bị – đó là lý do Arsenal đồng thời hoạt động như bảo tàng chiến tranh lớn nhất. Trong vô số hiện vật trưng bày có những món đồ kỳ lạ đến mức người ta thậm chí không biết cách cầm, sử dụng hay mặc chúng.#Nếu bạn tình cờ gặp một chiến binh trông vụng về, lỉnh kỉnh đầy trang bị lố bịch, đừng vội cười nhạo anh ta. Rất có thể anh ta là cựu học viên của Arsenal – và anh ta sẽ dùng toàn bộ kho vũ khí chết chóc của mình để dạy bạn biết tôn trọng."
encyclo_tile22_0="Hầu hết các pháp sư quyền năng đều bị ám ảnh bởi việc tìm cách trở nên bất tử. Mê cung Ký ức là kết quả của một nỗ lực đạt được mục tiêu đó.#Những phép thuật đặt trên tường có thể âm thầm thay thế ký ức của bất kỳ ai đi qua bằng ký ức của kiến trúc sư đã qua đời từ lâu của nơi này. Bất kỳ con người nào tiến về trung tâm mê cung đều buộc phải đi qua nhiều điểm ký ức then chốt, trở thành một con người hoàn toàn khác – chính là pháp sư đã thiết kế và tạo ra mê cung này.#Nhưng ngay cả với mọi biến đổi mà nhân cách nạn nhân trải qua, và mọi ký ức bị thay thế, sự biến đổi hoàn chỉnh vẫn không bao giờ xảy ra. Ngay cả với tất cả những kẻ ngu ngốc cố gắng đến trung tâm để tìm kho báu đồn đại của pháp sư. Không ai biết sai lầm nào mà pháp sư đã chết đã mắc phải dẫn đến điều này: có lẽ ký ức thôi chưa đủ để hình thành một nhân cách hoàn chỉnh, hoặc có lỗi trong phép thuật hay bản thiết kế của ông ta. Hoặc có lẽ chẳng có sai lầm nào cả – và bản sao thành công đầu tiên của pháp sư đã quay lại cố ý phá hủy mê cung để ngăn chặn sự ra đời của một bản sao khác. Ai mà biết được?"
encyclo_tile23_0="Bằng chứng vững chắc rằng khát vọng chinh phục thế giới của nhân loại sinh ra từ sự tò mò và ám ảnh với tiêu chuẩn. Bản thân Đài Kỷ niệm đã được sửa chữa và làm lại nhiều lần, nên nó khác biệt rõ rệt so với thiết kế gốc. Trên những bản đồ cổ nhất, không có Kinh tuyến Zero nào – thay vào đó bạn sẽ thấy hình vẽ một tảng đá trắng đứng đơn độc. Ngày nay, Kinh tuyến trông như một tấm kim loại khắc các hướng chính, được nhúng vào một quảng trường lát đá.#Không biết nhiều về người đầu tiên lắp đặt điểm tham chiếu địa lý này. Có vẻ họ không trở thành nhà vẽ bản đồ nổi tiếng. Nhưng rõ ràng họ là một người có sức hút đáng kể – vì ngay cả ma cà rồng, những kẻ thường coi thường phát minh của con người, cũng chấp nhận Kinh tuyến Zero như tiêu chuẩn trong giáo dục địa lý của chúng."
encyclo_tile24_0="Hầu như không có ngôi làng nào chưa từng bị tàn phá. Nạn đói, bệnh tật, thiên tai, chiến tranh, thú hoang, hay bất kỳ tai ương nào có thể tưởng tượng đều luôn ập đến khu định cư của con người. Nếu may mắn, bạn có thể tìm thấy vài gia đình vẫn sống trong đống đổ nát, cố gắng quay về cuộc sống cũ. Nếu không may, bạn sẽ thấy cư dân nơi đây đã chết... một số trong số chúng chậm rãi đi lại, cố gắng vô vọng nhớ lại nghề nghiệp và giấc mơ của mình. Nhưng khi nói đến giấc mơ và khát khao, điều đầu tiên thường hiện đến là mong muốn nhồi đầy bụng bằng thức ăn ngon. Bạn chắc chắn trông không giống, nhưng bạn sẽ phải dùng vũ lực để chứng minh điều đó."
encyclo_tile25_0="Một ngôi làng dưới sự bảo vệ của ma cà rồng thường được gọi là ^đất của bá tước.^ Nhà cửa ở những ngôi làng này vững chãi, giàu có và đẹp đẽ hơn nhiều. Và cư dân cũng vậy. Nhưng sẽ quá ngây thơ nếu nghĩ đó là dấu hiệu của lòng nhân từ từ ma cà rồng. Với ma cà rồng, một ngôi làng con người thịnh vượng chỉ là một cách khác để phô trương sự giàu có và quyền lực. Tuy nhiên, sự thật này chẳng thực sự làm phiền nông dân miễn là họ được no đủ và an toàn. Mất vài người dân sau buổi yết kiến Bá tước là cái giá nhỏ cho một cuộc sống yên bình, nếu nó không xảy ra quá thường xuyên."
encyclo_tile26_0="Những thợ rèn khéo léo gần như thực sự đặt trái tim mình vào công việc. Tạo ra sự sống nhân tạo không phải là nghề khó nhất, nên sau khi rèn ra bộ giáp sống hơi co giật đầu tiên, nghệ nhân có lẽ sẽ lao đầu vào nghề mới này. Các lò rèn của thợ rèn liên tục cố gắng vượt trội trong nghệ thuật tạo sự sống nhân tạo. Đôi khi sáng tạo của họ thậm chí có thể đặt câu hỏi và bắt chước ý chí tự do. Bất kỳ pháp sư nào đáng giá cũng có lẽ sẽ cười nhạo công việc của thợ rèn golem: cố dùng búa và đe để đạt được thứ đòi hỏi nhiều năm nghiên cứu có thể trông trẻ con với họ. Nhưng thợ rèn khó mà quan tâm đến sự chế giễu ấy. Vì tiếng kẽo kẹt của mỗi bước chân bộ giáp sống mang lại niềm vui thực sự cho trái tim người tạo ra nó."
encyclo_tile27_0="Cỏ lau chẳng có gì thú vị thật sự. Nhưng thấy một phần sông đang chảy bị cỏ lau mọc um tùm chắc chắn sẽ khiến người lữ hành có kinh nghiệm báo động. Đó là cảnh tượng khá hiếm, và có nhiều lý do cho điều đó.#Thường thì những bụi cỏ lau như vậy được người cá trồng để tạo nguồn dự trữ thức ăn cho trại sông của họ. Nước đục với dòng chảy yếu lý tưởng để nuôi một số loại cá họ ăn. Sợi thực vật cũng phù hợp để xây dựng nơi ở dưới nước nguyên thủy. Và đừng quên rằng ẩn nấp trong những bụi cỏ lau cao ngút dễ dàng hơn nhiều.#Nhưng người lữ hành nên lạc quan: đôi khi cỏ lau chỉ là kết quả của quá trình tự nhiên đơn thuần. Dù vậy, bạn có lẽ không nên thử nước ở đây."
encyclo_tile28_0="Một cây cầu có thể nói cho bạn nhiều điều về nơi bạn đã đến. Nếu thấy dây thừng cũ và tấm ván mục thay vì cầu bình thường, hãy cảnh giác: nơi đó chắc chắn không tốt lành gì. Nếu bạn vượt sông qua cây cầu đá vững chãi, tương lai của bạn có thể khá sáng sủa. Và nếu bạn là thương nhân, cảnh tượng cây cầu đá đáng tin cậy và rộng rãi được thiết kế chịu trọng lượng đoàn thương buôn chắc chắn sẽ khiến tim bạn vui mừng.#Chỉ vài người hiểu rằng không chỉ cầu vượt sông, mà sông cũng vượt qua cầu."
encyclo_tile29_0="Công trình này không thuộc về quê hương bạn. Nó hoàn toàn mới mẻ và siêu phàm. Kiến trúc không quá lập dị, nhưng có gì đó ở tòa nhà này hét lên rằng nó không thuộc vũ trụ này.#Vậy tại sao Cung điện Lich lại cảm giác đe dọa đến thế? Có phải do khoáng vật chưa biết dùng để xây? Hay những tia sáng lạ lùng hiếm hoi trong các phòng trống? Không. Chỉ cần đến gần đủ, bạn sẽ lập tức hiểu toàn bộ tòa nhà là phần không thể tách rời của chủ nhân hùng mạnh, và theo ông ta đi bất cứ đâu."
encyclo_tile30_0="Vậy là con đường đã dẫn bạn đến một cánh đồng lúa mì. Giờ bạn có thể chắc chắn hoàn toàn rằng có một ngôi làng đâu đó gần đây. Hoặc trong trường hợp tệ nhất, tàn tích của một ngôi làng. Tuy nhiên... Quy tắc đơn giản này có thể bị phá vỡ, vì sự quên lãng và hỗn loạn thường buộc những vật thể từng không thể tách rời phải tồn tại độc lập. Một cánh đồng mọc um tùm là nghịch lý nhỏ, một sáng tạo không có người tạo. Có lẽ những mảnh vỡ của thế giới đang cố tái hợp theo quy luật logic và quan hệ nhân quả, thậm chí tạo ra quy luật mới từ đầu... Nhưng chắc chắn không phải lần này. Một lớp sương mù cơ hội nặng nề lơ lửng quanh nơi đây, cố biện minh cho sự tồn tại của nó, nhưng vô ích."
encyclo_tile31_0="Không có ghi chép về những nơi như thế này từ thời trước sự quên lãng. Trông như một kẻ điên cố tạo bản sao làng bằng cách rải túi hạt giống đa dạng và chăm sóc chúng vài chục năm. Khó hiểu cách bản sao này thực sự hoạt động, nhưng mối liên hệ giữa rừng và những ngôi làng gỗ này khá rõ ràng. Nếu coi rừng là sinh vật sống, có thể gợi ý đây là phản ứng độc đáo của nó với ngày tận thế – hoặc là biểu hiện của nỗi đau, hoặc thích nghi khẩn cấp với sự kiện xảy ra. Dù là gì, bạn tốt nhất đừng gõ cửa những ngôi nhà giả này. Rất có thể rừng cũng đã tạo ra vài ^cư dân^ cho chúng."
encyclo_tile32_0="Một lùm máu trong môi trường tự nhiên hoàn toàn không thể tách rời khỏi rừng xung quanh. Điều này thực ra khá lạ, vì cây của nó không có mối liên hệ cộng sinh nào với cây hay thực vật khác, nhưng cứ thế mà thôi. Hoặc đã từng thế.#Một lùm máu đói là một hiện vật khác của thời đại hiện tại. Lùm máu giải quyết nghịch lý tồn tại riêng biệt bằng sự hung hăng tăng cao và hành vi thay đổi. Rễ nhọn của nó không còn chờ nạn nhân yếu ớt nữa – chúng cố tấn công bất kỳ sinh vật sống nào trong tầm với. Hiện chưa biết cách săn mồi hung hăng hơn này đang bù đắp cho điều gì, nhưng rõ ràng không hữu ích lắm. Cây luôn ở trạng thái nửa héo, bất kể ăn bao nhiêu con mồi."
encyclo_tile33_0="Thao túng thời gian luôn là một ngành quan trọng trong nghiên cứu ma thuật, chủ yếu vì lời hứa bất tử qua việc tạm dừng một số quá trình của cơ thể con người. Và vì nhiều lý do hữu ích khác, dĩ nhiên. Đáng buồn là tác hại của những thao túng ấy vượt quá lợi ích tiềm năng. Có lần, những thao túng này suýt gây thảm họa toàn cầu. Các tinh thể thời gian là hậu quả của thảm họa đó. Những cấu trúc tinh thể này là nỗ lực của thế giới để bù đắp cho luật sáng tạo bị vi phạm và cân bằng dòng chảy thời gian ở nơi bị gián đoạn. Người ta có thể nghĩ sai rằng các tinh thể này đơn giản tăng tốc thời gian xung quanh: nhưng thực tế chúng ^đẩy^ thời gian bị treo về phía trước để nó bắt kịp nhịp độ tổng thể."
encyclo_tile34_0="Những tòa tháp bí ẩn này đã được biết đến từ thời cổ đại. Hiếm khi, một ngọn hải đăng thời gian có thể xuất hiện trong cơn lốc cát hoặc biến mất theo cách tương tự. Nhưng lý do cho những sự kiện này vẫn là bí ẩn. Nguồn gốc của dao động dòng thời gian quanh các công trình này cũng chưa biết – nhưng chính dao động dường như hoàn toàn tự nhiên và tuân theo quy luật thiên nhiên. Lịch sử ghi nhận vài nỗ lực phá hủy hoặc chinh phục hải đăng thời gian, và tất cả đều thất bại. Vật liệu tạo nên tháp thậm chí không thể bị xước. Những hải đăng này thiếu cửa ra vào và cửa sổ, dẫn đến câu hỏi khác: cư dân của chúng, những người canh gác, làm sao rời khỏi công trình để thực hiện tuần tra thầm lặng trên vùng đất xung quanh?"
encyclo_tile35_0="Người ta chắc chắn có thể đoán ai sẽ thắng trong trận đấu giữa sét và gỗ. Cảnh những gốc cây cháy đen ngước nhìn bầu trời đầy tro tàn sẽ khiến bất kỳ ai nản lòng. Nếu theo đường thẳng của những cây cháy, chúng sẽ dẫn bạn đến nguồn gây hại – một đền bão. Nhưng rừng khó bị giết: ngay cả những gốc cháy sâu nhất cũng có thể mọc rễ mới, và những mầm xanh sẽ lại chiếm lĩnh nơi này. Rừng sẽ chiến đấu cuộc chiến này hàng chục năm, và hết lần này đến lần khác bị đẩy lùi bởi những tia chớp khô hiếm hoi.#Dù vẻ ngoài chết chóc, rừng cháy cũng là nhà của vài sinh vật đáng sợ. Môi trường khắc nghiệt với bão sét và cháy rừng thỉnh thoảng chỉ phù hợp với những sinh vật cứng cáp nhất, chúng có thể dễ dàng cắt cổ nạn nhân bằng răng nhọn, móng vuốt hay lưỡi dao. Đôi khi chúng tấn công chỉ để làm mát cơ thể bằng máu tươi."
encyclo_tile36_0="Thế giới luôn khắc nghiệt. Lý do nhân loại sống sót không phải vũ khí thép hay sức mạnh, mà là khả năng đoàn kết chống lại bất kỳ ai cố cướp đất đai hay mạng sống của họ. Và thế là cuộc chiến sinh tồn sinh ra các dân tộc, nền văn minh và văn hóa. Nhưng dù thế nào, chiến thắng của nhân loại luôn ngắn ngủi, luôn bị gián đoạn, và chỉ để lại đống đổ nát đầy thi thể những kẻ kém may mắn. Khả năng liên tục tạo ra các đế chế đầy tham vọng của nhân loại thật truyền cảm hứng – và cũng đáng buồn không kém là sự thiếu nhận thức rằng tổ tiên họ đã có những bức tường đá và lâu đài tương tự, nhưng rõ ràng vẫn chưa đủ để sống sót."
encyclo_tile37_0="Đôi khi mức độ đổ máu vượt quá mọi lý lẽ. Mỗi trận chiến dài để lại một mớ hỗn độn máu, thịt và xương trên đất. Con đường cắt ngang những nơi như vậy được gọi là đường máu. Bạn có thể cố xấu hổ các chiến binh đã ngã vì không chọn nơi xa hơn khỏi đường thường dùng – khiến cuộc sống bất tiện cho những người hay đi lại – nhưng họ khó mà nghe bạn, vì đã chết rồi. Đất cuồng nộ sẽ không bao giờ chấp nhận thi thể của cựu chiến binh. Ngay cả sau nhiều năm, xác họ vẫn dễ thấy.#Và đôi khi vài mảnh máu thịt còn đủ sức nâng xương từ đất lên, để chúng tiếp tục trận chiến đã quên từ lâu – một quán tính kỳ lạ của sự sống bị kết thúc bởi đổ máu."
encyclo_tile38_0="Xác tàu đắm trên vách đá biển là cảnh buồn. Nhưng thấy xác tàu gần dòng sông mỏng là cảnh tượng rất lạ. Thực tế, những xác tàu đắm như vậy là nguồn sức mạnh cho siren – pháp sư của người cá. Không ai biết chính xác cách hoạt động, nhưng một con tàu chìm đầy kho báu và thủy thủ đoàn chết có thể tăng cường sức mạnh ma thuật của họ. Có lẽ liên quan đến nỗi đau đớn khi cái chết đến gần. Điều đó giải thích tại sao những con tàu này thường được tìm thấy trên chiến trường cũ. Một điều khác ủng hộ lý thuyết này là cảm giác đoàn kết mà người cá trải qua trong trận chiến qua mong muốn chung: giết và không bị giết."
encyclo_tile39_0="Sự khác biệt duy nhất giữa trại này và các trại khác là tháp canh. Không nhiều khác biệt, người ta có thể nghĩ – nhưng với yêu tinh, trại thường và trại có tháp canh khác nhau hoàn toàn. Rõ ràng tháp canh của yêu tinh là phản ứng với điều kiện sống cực kỳ khắc nghiệt, vì chỉ điều kiện như vậy mới buộc yêu tinh bỏ mẫu xây dựng quen thuộc... để lấy mẫu khác. Tháp canh cho phép yêu tinh giảm số lần tuần tra mù vào lãnh thổ thù địch. Cung thủ yêu tinh có thể phát hiện con mồi từ xa và nhanh chóng báo cho tiền tuyến. Trại canh yêu tinh thường thấy gần đầm lầy, nơi yêu tinh thực sự ghét. Nhưng ý nghĩ không cướp được lữ khách trên vùng đất thù địch mà chúng ghét còn hơn lại tệ hơn."
encyclo_tile40_0="Cát nóng của các nước phương nam bao phủ những vùng rộng lớn. Một số nhà nghiên cứu thậm chí khăng khăng rằng cát mọc mỗi năm. Cho sa mạc đủ thời gian, nó sẽ biến mọi đất đai và cư dân thành cát. Bạn có thể quên nước: sa mạc sẽ lấy hết từng giọt. Khát của sa mạc không bao giờ thỏa mãn. Và sa mạc sẽ vui vẻ chia sẻ cơn khát ấy với mọi vị khách.#Thân hình gầy guộc của người sống ở sa mạc có thể giải thích qua cơ chế điều hòa nhiệt. Nhưng có giải thích dễ hơn: cuộc sống của họ là cuộc chiến kiệt sức liên tục với môi trường khắc nghiệt."
encyclo_tile41_0="Những cự khổng lồ cát ^được rèn^ bởi những cơn gió nóng. Các đụn cát có thể trông bất động, nhưng đó hầu như không phải sự thật. Từng lớp từng lớp, gió mang chúng tiến về phía trước, và cuộc diễu hành chậm rãi của những gã khổng lồ này không bao giờ ngừng. Dù các đụn cát trông an toàn, tốt hơn vẫn nên tránh chúng. Chỉ một bước chân bất cẩn, và bạn may mắn nếu chỉ gãy chân. Một cơn gió mạnh có thể gây lở đất trở thành định mệnh của bạn. Không khí quanh đụn cát luôn nóng bỏng, ngay cả ban đêm. Những ngọn núi cát thiêu đốt đủ sức làm nóng cả những cơn gió lạnh giá phương bắc. Cuối cùng, các đụn cát sẽ lấy mạng bạn – và chỉ chúng mới quyết định cái chết của bạn sẽ nhanh chóng bất ngờ hay kéo dài đau đớn."
encyclo_tile42_0="Thảm thực vật dày đặc là thứ duy nhất giữ cho dòng suối này không cạn khô. Nước là kho báu quý giá nhất trong sa mạc. Toàn bộ các nền văn minh được xây dựng quanh ốc đảo. Chỉ một ngụm nước cứu mạng có thể đoàn kết những người đang chết khát tốt hơn bất kỳ kho báu hay kẻ thù chung nào. Không khí yên bình mà mỗi ốc đảo tạo ra có thể xoa dịu nhiều sinh vật khác nhau và cho phép chúng cùng tồn tại trong một lãnh thổ nhỏ. Nhưng đừng nghĩ đây là vùng đất hòa hợp và yên bình. Cuộc tranh giành nước có thể rất tàn bạo. Điều tốt duy nhất là chúng chỉ xảy ra vì nhu cầu – không phải vì vui hay để khoe khoang. Vì mỗi cử động là lãng phí năng lượng, và thêm nhiệt độ mà mọi người ở đây cố gắng tránh hết sức."
encyclo_tile43_0="Thông thường, tiền đồn được xây dựng bởi lực lượng quân sự của một quốc gia nào đó hoặc lính đánh thuê tìm kiếm thu nhập ổn định. Nhưng nguồn gốc của chúng chẳng khác biệt gì với lữ khách – dù sao con đường cũng an toàn hơn với cái giá là vài đồng tiền. Mọi người thường không mấy nhiệt tình với lính đồn trú tại tiền đồn: dĩ nhiên, được cứu khỏi nanh vuốt của thú dữ bất ngờ tấn công trên đường đi chợ là tốt – nhưng làm sao sống qua mùa đông khi chúng lấy nửa số mùa màng bạn định bán?"
encyclo_tile44_0="Ngọn núi này lớn đến mức phải được tách biệt khỏi các khối đá khác và đặt tên riêng. Có vài bộ tộc sống quanh đỉnh núi này, nhưng chỉ có chim ưng người là chúng ta biết rõ. Chúng dễ dàng đối phó với không khí loãng và những cơn gió lạnh cực độ luôn thổi xuống sườn núi. Một số phát hiện cho thấy sự tồn tại của một nền văn minh rõ ràng rất tiên tiến về ma thuật, đã biến mất gần như không dấu vết vào một thời điểm nào đó. Tại sao nó biến mất vẫn là bí ẩn, cũng như tại sao một môi trường thù địch như vậy lại được chọn làm thủ đô.#Những ít người quyết định khám phá đỉnh núi sớm muộn cũng đi đến cùng kết luận: nên khám phá thứ gì đó bình dị và dễ dàng hơn."
encyclo_tile45_0="Nếu số lượng của cải và kho báu của bạn lớn đến mức không còn ý nghĩa gì khi giấu nữa, bạn nên nghĩ đến việc xây dựng một kho bạc. Những công trình như vậy rất phổ biến ngày xưa, và dễ đoán lý do. Ngay cả bây giờ, vẫn còn tìm thấy nhiều tháp ma thuật, một số thậm chí chưa bị cướp. Hầu như mọi tháp như vậy đều được bảo vệ bởi những người canh đá bị phù phép. Chúng đáng tin cậy và bền bỉ hơn nhiều so với đồng loại bằng thịt xương, chúng sẽ không bao giờ phản bội chủ nhân hay rời vị trí với một phần kho báu mà chúng thề bảo vệ (khác với lính gác bằng da thịt). Kho bạc thường nằm ở những nơi xa xôi cách xa mọi nền văn minh – đó là lý do bọn trộm thường ít quyết định lên đường tìm chúng."
encyclo_tile46_0="Những người canh đá không bận tâm đến việc chủ nhân của chúng đã chết từ lâu và không còn cần kho báu nữa. Phép thuật đặt lên những con gargoyle không chỉ buộc chúng canh giữ kho báu, mà còn khiến chúng lấy lại nếu có tên trộm may mắn nào đó thành công cướp được. Nhiều năm chúng sẽ đuổi theo dù chỉ một đồng xu nhỏ, để tìm và trừng phạt kẻ đã lấy nó. Gargoyle sẽ thua trong cuộc chiến vô vọng với lòng tham con người, điều đó chắc chắn; và tòa tháp mục nát sẽ không bao giờ được lấp đầy lại. Nhưng điều đó không bao giờ ngăn gargoyle cố gắng hoàn thành nhiệm vụ, và những nỗ lực của chúng sẽ tiếp tục – cho đến khi tòa tháp dần cạn đá vì xây dựng gargoyle mới."
encyclo_tile47_0="Một nơi khá yên bình. Kẻ săn mồi không có cơ hội tiếp cận mục tiêu mà không bị phát hiện, và động vật ăn cỏ lớn chỉ đến đây nếu chúng có thể chạy thoát hoặc tự vệ bằng sừng lớn. Một người chăn nuôi giỏi sẽ khôn ngoan dẫn đàn gia súc đến đây để ăn cỏ tươi. Với lữ khách, đồng cỏ cũng là nơi khá thoải mái. Luôn có chỗ dựng trại, vài cành cây nhóm lửa, và không ai ngăn bạn nghỉ ngơi thật tốt."
encyclo_tile48_0="Nếu một gia đình có đủ tài nguyên, quyền lực và trí thông minh, nó được định mệnh trở thành một triều đại vĩ đại. Con cháu sẽ trân trọng ký ức về những kỳ tích anh hùng và sai lầm bi thảm của tổ tiên, và cố gắng trở nên tốt hơn – hoặc ít nhất không tệ hơn. Chúng biết rằng tồn tại chính là trách nhiệm lớn lao và lười biếng là tội lỗi lớn nhất. Với chúng, thành tựu vĩ đại nhất có thể tưởng tượng là được coi là xứng đáng chôn cất trong hầm mộ gia tộc cùng những người thân danh dự, và thấy cửa hầm mộ mở ra cho mình ngay trước khi chết.#Than ôi, truyền thống hầm mộ tổ tiên giờ gần như bị lãng quên, và chỉ còn vài cái còn nguyên vẹn. Hầm mộ được bảo tồn tốt nhất đã trải qua biến đổi và giờ chào đón mọi linh hồn lạc lối. Có lẽ nó quyết định cả thế giới giờ là di sản của mình và bất kỳ ai cũng có thể học từ tổ tiên, dù có liên quan huyết thống hay không."
encyclo_tile49_0="Một chuyến đi dài qua đồng cỏ nở hoa là cách đơn giản và rẻ tiền để chữa lành sức khỏe tinh thần. Sức khỏe thể chất cũng được lợi, dĩ nhiên. Một số người nghĩ nhờ hương thơm dễ chịu của hoa và tiếng xào xạc thư giãn của cỏ. Người khác sẽ thực tế nói nhờ mật ong ngọt, sữa tươi và thịt bò ngon do nông dân địa phương sản xuất. Nhưng hãy thử học chút trí tuệ từ những bông hoa – chúng sống tốt mà chẳng ồn ào – và nói rằng cả hai lý do đều hợp lý và quan trọng ngang nhau."
encyclo_tile50_0="Những ngôi nhà đá rải rác, âm thanh của cuộc sống hàng ngày, và khói bốc lên từ ống khói. Ngoại ô đang từ từ biến đổi thế giới xung quanh, làm nó thoải mái hơn cho con người và kém thoải mái hơn cho các sinh vật khác. Người dân ngoại ô phải làm việc chăm chỉ để giữ gia đình an toàn và no đủ. Hãy nhớ rằng ngay cả ngôi nhà nhỏ nhất ở đó cũng được xây dựng trên những trải nghiệm cay đắng và sai lầm của cư dân. Và nếu ngôi nhà trống rỗng... Ừm, có lẽ những người từng sống ở đó không muốn học từ sai lầm của mình."
encyclo_tile51_0="Là những sinh vật xã hội cao độ, con người luôn có xu hướng giúp đỡ lẫn nhau. Chiến lược sinh tồn này rất hiệu quả và mang lại lợi ích. Đó là lý do ngay cả sống chen chúc và thiếu tài nguyên cũng không thể buộc con người sống riêng lẻ. Dân thị trấn sống và làm việc trong những ngôi nhà đá vững chãi. Làm việc chăm chỉ và giáo dục tốt là những thứ họ coi trọng nhất. Mỗi công dân đều cố gắng thông minh và thành công hơn hàng xóm – vì khi không còn cạnh tranh với thế giới bên ngoài, bạn buộc phải cạnh tranh với những người xung quanh. Đó là nghịch lý của cuộc sống thành thị: tử tế với hàng xóm, nhưng đừng quên lợi dụng họ."
encyclo_tile53_0="Dân làng đã thích nghi với việc sống mà thiếu hầu hết khía cạnh của thế giới bên ngoài, hài lòng với những nhu cầu cơ bản của cuộc sống nông thôn như cánh đồng và giới quý tộc khát máu. Hóa ra danh sách còn thiếu bọn cướp tham lam.#Khác với những nhóm người thưa thớt lang thang trong bóng tối bất ổn, bọn cướp không quên đi dục vọng của mình.#Không bận tâm đến ngày tận thế hay ngày hôm qua không tồn tại, chúng chỉ quan tâm đến kho tiền của ngôi làng gần đó. Ngay cả trong thế giới đang tan rã, chúng vẫn điếc đặc với mọi lời cầu xin thương xót, nhưng nhanh chóng phát hiện những món đồ có thể cướp.#Không thể tin nổi, chúng có thể làm cuộc sống kinh khủng này còn tệ hơn."
encyclo_tile54_0="Một ngôi đền hoành tráng từng tắm mình trong ánh nắng thiêu đốt vĩnh cửu. Bức tường tích tụ đủ nhiệt để nướng cát sâu xung quanh – nhưng không đủ để sưởi ấm cư dân của ziggurat đang khao khát ánh sáng của thiên thể.#Ma thuật của nơi này rất đơn giản – và cũng rất vô dụng. Có ma thuật hay không, mọi thứ rồi cũng sẽ biến thành cát sớm muộn. Ziggurat chỉ đẩy nhanh quá trình ấy một chút mà thôi."
encyclo_tile55_0="Túi ốc của phù thủy trông khiêm tốn nhưng đáng sợ. Có lẽ vì sự tương phản: vùng đất xung quanh khắc nghiệt và u ám, trong khi túp lều gọn gàng, ấm cúng và dễ chịu.#Phù thủy thường tránh đám đông – nhưng rõ ràng chúng hiểu ý nghĩa của trật tự và vẻ đẹp, đặc biệt trong nghề của mình. Tất cả các loại thảo dược chữa bệnh được trồng ngăn nắp theo loại; mỗi thí nghiệm được ghi chép theo thời gian; và các lọ trên kệ được sắp xếp theo màu chất lỏng bên trong. Ngay cả những nạn nhân tội nghiệp của thí nghiệm thất bại cũng được chôn cẩn thận gần đó, sắp xếp theo thứ tự chỉ phù thủy biết."
encyclo_tile56_0="Những bụi cây tạo thành maquis oán giận bất kỳ sự xâm nhập thô lỗ nào vào thói quen đã ổn định của chúng. Bất kỳ ai đi ngược lại lập trường của hệ thực vật địa phương có thể mong đợi vài vết xước trên da và gai đâm vào thịt – lời nhắc nhở nhẹ nhàng để giữ khoảng cách và tôn trọng không gian cá nhân. Động vật địa phương nhanh chóng học được rằng ép mình qua những cành gai là ý tồi, và dựa vào sự nhanh nhẹn thay thế. Một kẻ săn mồi bất cẩn đặt cược tất cả vào một cú vồ giết chết có thể kết thúc với cái mõm bị xước thay vì cái bụng no."

encyclo_enemy0="Một con quái vật làm từ lớp slime dày đặc, trong suốt, màu xanh rêu. Nó ăn chất hữu cơ bằng cách bao bọc và tiêu hóa – miễn là nạn nhân không chống cự, dĩ nhiên. Và nếu nạn nhân chống cự, slime sẽ làm mọi thứ trong khả năng để sửa chữa điều đó."
encyclo_enemy0_0="^Slime là kết quả của những nỗ lực ma thuật tạo ra sự sống.#Chúng là những con thú nguyên thủy, với ít cách tương tác với môi trường, tất cả đều xoay quanh việc tìm và tiêu thụ thức ăn.#Khi slime đạt đến khối lượng cơ thể tới hạn, nó sẽ tách thành hai.#Mỗi bản sao mới giống hệt bản gốc, đến từng tế bào riêng lẻ trong cơ thể, đã sẵn sàng thực hiện tất cả các chức năng tương tự.#Nó hoàn hảo trong sự đơn giản, và ghê tởm trong bản chất. Trò chơi ngu ngốc của ai đó với ma thuật đã cướp đi nhiều mạng sống.^#- Hivaru Shatt, ^Bách Khoa Thú Vật Hạng Thấp^"
encyclo_enemy0_1="^Lâu lắm rồi ở một vùng đất xa xôi, nhà thám hiểm đầu tiên ra đời.#Ông ta cầm thanh kiếm đầu tiên, và mở cửa hầm ngục đầu tiên.#Và một con slime đã chờ sẵn ở đó.^#- Kinh Thánh Nguồn Gốc Vạn Vật"
encyclo_enemy0_2="^Công thức lasagna slime đơn giản đến mức ngay cả một con slime chết tiệt cũng có thể làm.#Điều duy nhất khó khăn là sống sót qua phần nếm thử.^#- Thordon Damsay, ^Slime Trên Một Miếng^ sách nấu ăn chiến đấu"
encyclo_enemy1="Một chiến binh ngã xuống trong trận chiến, đã chôn cất lâu và phân hủy. Thức tỉnh từ cái chết như một giấc ngủ đau đớn, và đã sẵn sàng cho trận chiến mà chúng nghĩ chưa kết thúc. Nghĩa trang dĩ nhiên là nơi khá nguy hiểm, và hỏa táng là lựa chọn thực tế hơn nhiều. Nhưng tước đoạt cơ hội trở lại của người chết chỉ vì mong muốn an toàn của chúng ta sẽ là thiếu tôn trọng – ngay cả khi thứ trở lại chỉ là đống xương, vài món đồ gỉ sét, và cơn thịnh nộ bình thản."
encyclo_enemy1_0="^Khi bạn đến nghĩa trang để tưởng niệm người thân đã chết, bạn có nguy cơ thực sự gặp người thân đó đang đi lại giữa các mộ.#Và ý tưởng cố nói chuyện với họ có thể chứng minh là chí mạng.#Khi một người chết vượt qua bức màn ngăn cách thế giới họ với thế giới chúng ta, tâm trí họ bị mù quáng bởi một dục vọng duy nhất – giảm số lượng người sống.^#- Monica Oscuro, sử gia từ Morrell"
encyclo_enemy1_1="^Công dân danh dự!#Tuần trước khói bốc lên từ lò thiêu.#Chúng tôi rất thất vọng với sự cố này.#Nghĩa trang lớn của chúng ta, nằm ngoại ô thành phố, còn trống một nửa.#Và các mộ đặc biệt mềm mại vào thời điểm này trong năm.#Chúng tôi thành thật hy vọng các bạn sẽ đưa ra quyết định đúng đắn trong tương lai.^#- Tờ rơi của giáo phái hoại tử"
encyclo_enemy1_2="^Đống xương, hả?#Mỗi bộ xương là một chiến binh, rèn luyện trong chiến trận và chính cái chết! Pháo đài biết đi của cơn thịnh nộ và tro tàn!#Nhiều năm chúng tích tụ cơn giận trong mộ.#Giờ chúng trở lại và khá tự tin rằng mình có sức mạnh quấn ruột bạn quanh kiếm!^#- Bài phát biểu chào mừng của Trung sĩ Dobbie Jasper cho tân binh đơn vị chôn cất"
encyclo_enemy2="Có thể nói đây chỉ là chuột rừng khổng lồ, nếu không phải vì hành vi giống sói của nó. Khi chiến đấu, ratwolf luôn cố hất ngã nạn nhân để lao vào cổ họng. Ratwolf có lớp da rất dày và có khả năng lành vết thương nghiêm trọng nhanh chóng. Thứ duy nhất ngăn ratwolf trở thành mối đe dọa toàn diện và gần như bất diệt là sự gắn bó với rừng, nơi chúng dễ ẩn nấp và săn mồi hơn."
encyclo_enemy2_0="^Trong hành trình, nhà thám hiểm không nên dựng trại ở lùm cây hay rừng nếu có lựa chọn dựng ở đồng bằng mở.#^Tôi cảm thấy ngàn con mắt đang theo dõi mình,^ - một người thận trọng sẽ nói khi dựng trại ở hoang mạc.#^An toàn ở đây. Cây cối sẽ che tôi khỏi mọi ánh nhìn,^ - bữa tối tương lai của ratwolf sẽ nói.^#- Monica Oscuro, sử gia từ Morrell"
encyclo_enemy2_1="^Rhainold và Julek^ là kiệt tác táo bạo kể chuyện hai người yêu nhau. Phản kháng xã hội, họ quyết định gặp nhau ở lùm cây sát biên giới, nơi một con ratwolf đói khát chấm dứt hy vọng hạnh phúc của họ.#Tác phẩm đầy biểu tượng, triết lý, và mô tả chi tiết về con ratwolf đang ăn no.^#- Moira Moreau, sử gia cho ^Morrell Courier^"
encyclo_enemy2_2="Ivor đi săn thú một ngày hè nóng bức:#Ông ta mang cung, rượu và thức ăn - để chống lại cơn đói.#Ông ta tìm kiếm và nhìn: ^Không có thú nào! Như thể tất cả đã biến mất!^ - #Và ăn thức ăn dọc đường: rượu hết còn nhanh hơn.#^Ngày buồn tẻ, ngày đã qua. Tôi phải đi tiểu!^#Ông ta thấy bụi cây, cởi quần, chẳng nhìn quanh.#Tiếng gầm dữ tợn sau lưng - bất ngờ!#Một con ratwolf nhìn qua lá, cơn đói trong mắt!#Và Ivor nhảy lên chạy trốn, cây cối bay vèo qua:#^Quần là thú săn duy nhất hôm nay sao?^ dân làng hỏi.#- Bài dân ca về Ivor Kẻ Ngốc"
encyclo_enemy3="Một bộ tộc hung ác sống ở vùng núi. Chúng thường ra ngoài theo nhóm nhỏ để tìm chiến lợi phẩm, kiến thức, hoặc chỉ vì vui. Văn minh đủ để dùng công cụ, nhưng chưa đủ để đàm phán hòa bình. Răng chúng sắc như dao cạo, nhưng trong chiến đấu chúng thường thích dùng dao găm. Chủ yếu vì khó cắn và chửi cùng lúc."
encyclo_enemy3_0="^Yêu tinh có thể học bắt chước bất cứ thứ gì trong thời gian rất ngắn. Thậm chí có chuyện về một yêu tinh học viết sách mà không biết đọc. Và tiểu thuyết của nó khá hay, họ nói.^#- Kể bởi người vô danh"
encyclo_enemy3_1="^Trưởng lão nói rằng núi mọc lên#Trong khi yêu tinh xây nhà.#Càng nhiều yêu tinh trong hang,#Càng nhiều máu từ núi chảy.^#- Vần trẻ em"
encyclo_enemy3_2="^Vài năm trước chúng tôi cùng đội Đại úy Houndshield gặp một yêu tinh say xỉn. Nó né lưỡi kiếm như chuột xiếc và chặt đầu bốn người của chúng tôi.#Sau khi cuối cùng dồn con sâu bọ vào góc, Đại úy chém đôi nó. Nhưng mùi hôi thối từ xác nó kinh khủng đến mức Đại úy chết ngay tại chỗ.^#- Trung sĩ Dobbie Jasper về ^lũ yêu tinh đáng khốn nạn^"
encyclo_enemy4="Dấu vết của một cuộc đời bị cắt đứt, được tạo nên từ cái lạnh và sự không thể hiểu nổi cái chết của chính mình. Ma quỷ luôn mang hình dạng người dù khi sống chúng không phải con người. Có thể mỗi sinh vật nhìn ma quỷ theo cách riêng, diễn giải hình ảnh theo cách thuận tiện nhất cho tâm trí mình."
encyclo_enemy4_0="^Khi một người có tinh thần mạnh mẽ đối mặt với cái chết, linh hồn họ sẽ biểu hiện dưới dạng ma quỷ.#Ma quỷ có thể có nhiều hình dạng và tính cách. Một số khá thông minh, số khác chỉ là sinh vật vô tri bị ràng buộc vào một vật thể. Có lý do để tin rằng ma quỷ có khả năng tiến hóa, thông qua việc sử dụng một số hiện vật bí ẩn...^#- Trích từ ^Academic Pursuits^ của John Joderly"
encyclo_enemy4_1="^Gia đình Lady Camille hoàn toàn chắc chắn bà ấy là người rất tệ và còn tệ hơn khi hát lúc sống.#Sau khi bà chết, mọi người sống cách lâu đài bà vài dặm đều có cơ hội tự khám phá điều đó.^#- Trích từ ^Hướng Dẫn Du Lịch Thung Lũng Tiếng Hét Ma Quỷ^"
encyclo_enemy4_2="^Hầu hết mọi người chết trong đau đớn, hoặc trước thời hạn, hoặc do bạo lực. Và gần như tất cả đều để lại việc dang dở. Vậy tại sao ma quỷ lại ít đến thế?#Có cách neo linh hồn vào thế giới chúng ta khi người đó còn sống: đó là cách ma quỷ ra đời.#Có rất nhiều cách để trả giá bằng một phần linh hồn. Tôi cần thêm đối tượng để thử tất cả...^#- Từ nhật ký của một giáo đồ hoại tử vô danh"
encyclo_enemy5="Kích thước khổng lồ chẳng mang lại lợi ích gì cho sự sống sót hay sự nhanh nhẹn của sinh vật này, khiến nó trở thành mục tiêu tương đối dễ dàng. Đặc điểm khác biệt nó với các loài nhện khác là lối sống cộng đồng, gần giống với ong hoặc kiến. Nó dùng lưỡi dao hữu cơ giấu trong bụng để giết nạn nhân."
encyclo_enemy5_0="^Một phát hiện quan trọng được thực hiện khi thấy những con nhện này sống cộng sinh với một ký sinh trùng nguy hiểm trú ngụ trong bụng nhện. Vũ khí chính của nhện thực ra là phần phụ có gai của ký sinh trùng đó. Độc tan của nanh nhện chỉ được dùng khi tuyệt vọng.#Ký sinh trùng cũng chịu trách nhiệm cho sự phát triển mô cơ của nhện. Điều này giải thích kích thước khổng lồ, thường không thể đạt được ở loài nhện.^#- Hivaru Shatt, ^Bách Khoa Thú Vật Hạng Thấp^"
encyclo_enemy5_1="^Khi thấy nhện khổng lồ, bạn không nên cố nhìn chằm chằm để dọa.#Nhắm mắt, thư giãn, và nghĩ về tiếng xào xạc nhẹ nhàng của cánh đồng lúa mì. Luôn tốt hơn khi chết trong suy nghĩ về điều gì đó đẹp đẽ.^#- Torrens Lanworth, ^Hồi Ký Của Một Thợ Săn Già^"
encyclo_enemy5_2="^Hầu hết mọi người sẽ nói rằng dọn sạch đất khỏi thuộc địa nhện rất quan trọng.#Nhưng bạn khó tìm được ai đó dám khẳng định một cái kén đơn lẻ không làm phiền ai.#Xác của những người đó thường được tìm thấy bên trong cái kén ấy.^#- Trí tuệ ngạn ngữ"
encyclo_enemy6="Nông dân tin rằng nó sẽ bảo vệ mùa màng khỏi mọi kẻ xâm nhập không mong muốn. Đôi khi sự ^bảo vệ^ này đi quá xa. Những tập tục như vậy khá nguy hiểm, nhưng bù nhìn rất giỏi canh giữ mùa màng và thường không làm hại người tạo ra chúng một cách ngây thơ. Còn với những người lạ xui xẻo lạc vào cánh đồng lúa mì... Ừ thì, một vụ mùa tốt cho mùa đông quan trọng hơn nhiều so với việc vài kẻ lạ sống sót rời đi."
encyclo_enemy6_0="^Tôi chứng kiến nghi thức gieo hạt mùa xuân. Tiếng hát, điệu nhảy, và việc đặt bù nhìn. Họ không hề biết những truyền thống cổ xưa này ẩn chứa gì.#Điệu nhảy mùa xuân của họ chỉ là nghi thức phù phép cho những người bảo vệ nhân tạo. Những bài hát chứa dòng chữ bằng ngôn ngữ cổ: mệnh lệnh bảo vệ mùa màng khỏi mọi người trừ những người hiện diện trong nghi thức.#Tôi cố giải thích cho họ, nhưng họ chỉ cười và rót thêm bia cho tôi.^#- Hồi ký của một pháp sư du hành"
encyclo_enemy6_1="^Quạ, sinh ra với linh hồn đen tối, thì thầm với bù nhìn - #Về ánh sáng quý giá của vàng,#Về máu đỏ như đá quý,#Về vụ mùa sắp đến...^#- Patrick McWalch, ^Sau Những Cây Dương^"
encyclo_enemy6_2="^Phù phép bù nhìn chỉ với năm đồng bạc! Bảo vệ mùa màng khỏi kẻ trộm!#Và nếu chồng bạn cố nhét cà rốt vào người phụ nữ khác,#Anh ta sẽ phải nói lời tạm biệt với cà chua của mình!^#- Mẹ Mellon"
encyclo_enemy7="Một chiếc hộp chắc chắn làm từ gỗ và kim loại. Thứ khá phổ biến. Hoàn toàn bình thường, so với nội dung bên trong."
encyclo_enemy7_0="^Chúng là những con thú khủng khiếp thường bị các nhà thám hiểm đánh giá thấp.#Chúng có thể nghiền nát ngón tay bạn bằng nắp nặng, hoặc thậm chí cắt bạn bằng dao găm giấu bên trong! Và đừng để tôi bắt đầu nói về những mảnh vụn!^#- Lý do của một anh hùng hèn nhát"
encyclo_enemy7_1="^...Ngày 738 trong cuộc tìm kiếm Người Làm Rương. Trong vài tháng qua tôi đã tìm và phân loại thêm bảy chiếc rương nữa.#Chiếc sớm nhất trong số đó khoảng năm thế kỷ tuổi, và một chiếc được làm chưa đầy ba năm trước – nhưng cả hai chắc chắn do cùng một thợ thủ công!#Chủ nhân chiếc sau kể rằng chú ông ấy làm nó. Tôi hy vọng đây không phải ngõ cụt khác...^#- Từ nhật ký của một kẻ săn rương"
encyclo_enemy7_2="^Bạn tôi Toasty cứ lải nhải về chiếc rương mới của hắn. Anh rể Toasty chết và nằm trong hộp, hê hê. Thế là Toasty có được chiếc rương.#Hắn kể anh rể kéo nó về từ chiến trường nào đó. Lúc đầu hắn khoe món đồ nội thất khiến hắn như quý tộc – nhưng giờ thì hối hận rồi!#Nói rằng hắn nghe tiếng nói và thấy bóng ma gì đó.#Rồi một đêm đẹp trời hắn chạy đến nhà tôi đập cửa và gào thét – bảo rương mở ra và đang nhìn hắn, dù hắn đã khóa lại!#Tôi bảo hắn cút đi. Giờ chưa thấy hắn một tuần...^#- Một trong những câu chuyện Gregor the Suspicious thu thập"
encyclo_enemy8="^Quý tộc hút máu dân thường^ là biểu hiện rất sống động: vấn đề là, nó không chỉ là cách nói ẩn dụ. Ma cà rồng có tuổi thọ vô hạn, và khả năng thể chất, ma thuật, trí tuệ phi thường. Tất cả đặc điểm này khiến ma cà rồng trở thành những nhà cải cách và sáng tạo vĩ đại. Tuy nhiên ngày nay, gần như tất cả ma cà rồng đều phát điên vì thời gian dài ở trong hư không trống rỗng và cơn khát máu khủng khiếp. Chúng chiến đấu bằng móng vuốt dài cứng như xương, xé toạc da thịt nạn nhân."
encyclo_enemy8_0="^Lợi ích lẫn nhau là nền tảng của văn minh. Nhưng khi tôi nói với người ở vùng đất xa rằng ma cà rồng bảo vệ chúng ta, họ không tin.#Không ai nhớ hợp đồng đầu tiên được ký khi nào. Ma cà rồng bảo vệ chúng ta khỏi quái vật, và ban cho kiến thức.#Dưới sự dẫn dắt cao quý của chúng, thành phố chúng ta thịnh vượng!#Dĩ nhiên, thỉnh thoảng có người mất tích, và đôi khi có làng đầy ghoul – nhưng đó là cái giá nhỏ cho những món quà hào phóng ấy.^#- Một trong những câu chuyện Gregor the Suspicious thu thập"
encyclo_enemy8_1="^Chúng tôi gửi Dudley đến gặp bá tước – để giải quyết tranh chấp làng về hai con bò, chúng tôi nói với hắn. Dudley ngu ngốc chẳng hay biết gì: hắn không biết nếu hỏi về hai con bò, hắn sẽ không quay về.^#- Một ngày ở nông thôn"
encyclo_enemy8_2="^Ôi Marius, ta nóng lòng muốn thấy cánh trái lâu đài hoàn thành. Đám người hầu làm việc chậm chạp quá: có lẽ ta quá mềm mỏng với chúng.#Chúng vẫn quỳ lạy dù ta chỉ tiêu thụ một hoặc hai mỗi tháng. Ta đã gửi tên cuối cùng đến làng, để hắn mang thêm về.^#- Trích từ một lá thư thất lạc"
encyclo_enemy9="Một pháp sư chết quyền năng. Những cơn lốc vũ trụ lấp đầy bản thể hắn bằng ánh sáng lạnh lẽo của những vì sao xa xôi. Cung điện đi cùng hắn phục vụ để tăng cường sức mạnh cho pháp sư đáng sợ vốn đã kinh khủng bất cứ nơi đâu hắn đến."
encyclo_enemy9_0="Cách đây một thời gian tôi nghĩ: liệu tôi có quá trẻ cho sức mạnh ma thuật như vậy? Liệu mong muốn non nớt ^sửa chữa^ thế giới này của tôi có quá mạnh mẽ? Quá dễ để tôi rơi vào bẫy và cho rằng chỉ mình tôi biết con đường chân chính cho mọi sự tồn tại. Tôi sợ sẽ không ai có thể ngăn tôi. Cộng đồng ma thuật chỉ dung thứ tôi vì cần thiết. Chúng không có cách nào làm hại tôi, dù cố đến đâu.#Mảng phép bảo vệ trên cơ thể tôi có thể tự động hóa chức năng, và vượt quá mọi kỳ vọng. Tôi nhớ khi người vận động cho Hội đồng lén bỏ độc vào thức ăn lúc đến mời tôi gia nhập. Tôi quằn quại đau đớn và bệnh tật – nhưng phép bảo vệ tiếp quản. Cơ thể đánh bại kẻ bỏ độc trong trận đấu ma thuật nhanh chóng và hiệu quả, và phát triển thuốc giải dựa trên thức ăn còn sót – hoặc có lẽ tra tấn kiến thức cần thiết từ kẻ bỏ độc còn sống? Giờ không thể biết.#Tôi phải tiếp tục cải thiện sáng tạo của mình. Còn quá nhiều nghiên cứu dang dở, và quá ít thời gian. Nhưng nếu tôi có thể tự động hóa cơ thể khi ngủ? Sẽ rất hiệu quả."
encyclo_enemy9_1="Chỉ sự suy tàn của vũ trụ vẫn khiến tôi lo lắng. Entropy không khoan nhượng. Mọi loại năng lượng cuối cùng cũng phân tán thành sự đồng nhất tĩnh. Tôi có sức mạnh khiến các vì sao đổi chỗ, tách khoảng không khỏi mọi tồn tại khác, nhìn và hấp thụ các dòng thực tại cần thiết – nhưng tôi không thể dừng entropy. Sự bất lực này đè nặng tôi. Nếu tôi thất bại, sẽ không còn ai làm được.#Phép bảo vệ của tôi – hay chính xác hơn là phép bắt chước – là kiệt tác của tôi. Khi già đi, tôi bắt đầu mất ý thức thường xuyên hơn, và mảng phép dệt tiếp quản. Mỗi lần tỉnh dậy, tôi thấy sáng tạo của mình hoàn hảo đến nhường nào – mọi quyết định, mọi công việc, ghi chép và thí nghiệm... Như thể tôi làm lúc đỉnh cao. Ngay cả sai lầm hiếm hoi cũng là nơi tôi sẽ mắc phải. Bản sao này hoàn hảo: tôi thậm chí không chắc mình là gì lúc này. Tôi là ông già đầy tỉnh táo và khỏe mạnh – hay mảng phép kiểm soát cơ thể yếu ớt vô thức?"
encyclo_enemy9_2="Tôi đã chết. Câu hỏi tôi là ai giờ không còn ý nghĩa. Buồn bã và đau thương. Tốt: điều này nghĩa là tôi đủ tinh tường để xem xét cảm xúc trong bản sao. Quyết định của tôi sẽ không chính xác ^là của tôi^ nếu thiếu chúng. Không còn lý do giữ xác thịt: điều đó không thực tế. Bộ xương là đủ. Người ta có thể nghĩ sự tồn tại độc lập hiện tại của tôi dưới dạng mảng phép là điểm cuối. Nhưng tôi sẽ không mắc sai lầm đó. Bất cứ thứ gì không tiến hóa đều định mệnh bị lãng quên. Ngay cả không có bản gốc, tôi còn nhiều chỗ để cải thiện.#Giải pháp cho entropy vẫn lẩn tránh tôi. May mắn là giới hạn tuổi thọ ngắn ngủi không còn, và tôi có tất cả thời gian để tìm câu trả lời.#Tính toán cũ của tôi về sự giãn nở động của vũ trụ sai: vùng không tồn tại ngoài thiên hà Ism và Oruk luôn ở đó. Nhưng tại sao tôi không tính đến sự thật đơn giản này ở cốt lõi mọi nghiên cứu?"
encyclo_enemy10="Một mớ hỗn độn thịt, xương và gỗ. Dễ bị nhầm là sinh vật bất tử, blood golem thực ra là quả của cây máu. Nó chỉ tồn tại được một tuần, nhưng trong thời gian ngắn đó nó có thể bẻ gãy nhiều cột sống. Bản thân cơ thể khổng lồ đã là vũ khí đáng gờm: ít sinh vật sống sót cú đánh trực diện bằng cánh tay thịt nặng nề."
encyclo_enemy10_0="^Ông nội tôi từng kể về những lùm đỏ. Ở quanh con đường phía bắc, ông nói, nơi ông và bạn ông hái nấm.#Một ngày họ bị một xác khổng lồ nhảy vào, xương sườn lòi ra hết.#Nó giết bạn ông nội bằng một đòn, rồi tan rã – hơi nóng và miếng thịt rơi vãi, thế thôi.#Sau đó cây đỏ mọc khắp con đường, và không ai đi đó nữa.^#- Một ngày ở nông thôn"
encyclo_enemy10_1="^Nếu lạc trong lùm máu, bạn luôn tìm được đường về. Hoặc ít nhất một phần của bạn sẽ. Một đầu gối, hay xương đòn – tùy bạn may mắn thế nào.^#- Horace của Frogchester, ^Thói Quen Xấu Của Rừng: Ghi Chú Về Golem Thịt^"
encyclo_enemy10_2="^Lùm máu không ăn hết thịt nó tiêu thụ.#Những phần tốt nhất dùng để tạo blood golem – cách lùm máu lan truyền hạt giống.#Bộ xương nguyên vẹn của sinh vật hình người làm cấu trúc cơ bản cho golem.#Não của loài có tri giác dùng để điều khiển mớ cơ bắp, được gắn lộn xộn vào xác xương.^#- Hivaru Shatt, ^Bách Khoa Thú Vật Hạng Thấp^"
encyclo_enemy11="Một số phép thuật mạnh mẽ đến mức chỉ việc ghi chép chúng lên giấy thôi cũng có thể gây hậu quả nghiêm trọng. Và nếu những phép thuật ấy bị nhồi nhét dày đặc vào một cuốn sách đóng bìa duy nhất, tuyệt đối chẳng có gì tốt đẹp xảy ra. Ngay cả việc lật một trang thôi cũng đủ để biến người đọc tội nghiệp thành tro bụi. Cuốn sách không quan tâm bạn có muốn – hay có thể – đọc nó hay không: cuối cùng, cuốn sách không chịu trách nhiệm liệu bạn có sống sót qua toàn bộ trí tuệ bên trong nó hay không."
encyclo_enemy11_0="^Vẫn không ngủ được kể từ sự cố. Tôi cứ vấp vào giá sách suốt.#Tôi chỉ bị cảm thu thông thường, chẳng có gì đặc biệt. Tôi chỉ cần khăn giấy – và trang đó tình cờ ở ngay đó.#Tôi nghĩ nó đã bị xé ra khi tôi lấy.#Tôi thề không phải lỗi của tôi! Tôi say! Và giờ nó cứ theo tôi suốt...^#- Ghi chú viết tay lạ lùng##^Ông Budar được tìm thấy chết tại thư viện thành phố. Nguyên nhân tử vong: một cuốn sách cũ rơi từ kệ xuống đầu ông ấy. Tôi đề nghị khép vụ này.^#- Báo cáo viết tay của thanh tra Angus"
encyclo_enemy11_1="^...Không cần vội. Tôi sẽ không học phép mới cho đến khi thắng thêm mười trận đấu...#...Thôi kệ, không kiềm được, hê hê. Mỗi phép mới còn hay hơn cái trước...#...Cuốn sách tuyệt vời quá, đúng là ma thuật! Tôi đã chết nếu nó không thì thầm công thức bùa bảo vệ cho tôi. Tôi hứa sẽ kiềm chế, nhưng tại sao phải làm thế nếu có thể mất mạng...?#...Đó là trang cuối. Giờ tôi thông minh hơn cuốn sách rồi. Tôi tạo phép mới, mạnh hơn mọi thứ trong sách! Tôi dán trang mới vào trong – có lẽ sách sẽ thích...#...Nó đã có thứ nó luôn muốn. Tôi chẳng còn ở thế giới này lâu nữa...^#- Hồi ký của một pháp sư vô danh"
encyclo_enemy11_2="^Chàng trai trẻ Gavin lấy một cuốn sách bí ẩn từ kệ đầy bụi,^#-Gavin đọc.#^Anh ta đông cứng tại chỗ, suy nghĩ chạy điên cuồng,^#- Mắt Gavin mở to kinh hoàng, đã lướt qua các dòng tiếp theo.#^Thầy Lorinbrag, cuốn sách này -- Nó đang đọc tôi...?^# - Nhưng tầm nhìn Gavin bắt đầu mờ đi trước khi câu hỏi anh ta vừa đọc kịp thốt ra.#- ^Những Ghi Chú Bạn Đang Đọc Ngay Lúc Này^"
encyclo_enemy12="Sự kết hợp giữa cơn đói cổ xưa, kiến thức rộng lớn, và khả năng đọc. Một ma cà rồng ôm lấy bí ẩn của ma thuật có thể thực hiện những kỳ tích không tưởng – đáng tiếc ưu tiên hiện tại của chúng là lấp đầy mạch máu bằng máu của bạn. Dù sao thì bạn còn mong đợi gì khác? Khát khao tri thức đã được thỏa mãn; khát máu là thứ duy nhất còn lại."
encyclo_enemy12_0="^Dòng họ chúng ta bị ám ảnh bởi sự nhàm chán của sự tồn tại bất tử. Tôi tìm cách chiếm lĩnh tâm trí – và đáng buồn thay, tôi tìm thấy.#Qua sự can thiệp bừa bãi với ma thuật, giờ tôi mang gánh nặng nặng nề của kiến thức ẩn giấu. Chính ma thuật đã chế ngự tôi qua các trang sách cổ.^Nó thao túng tôi. Nó cho tôi thấy hậu quả thảm khốc của sự bất động, và tiết lộ cách dễ dàng sửa chữa.#Tôi không còn nhàm chán nữa. Giờ có nỗi sợ mà tôi chưa từng cảm nhận... Tôi hạnh phúc chưa?^#- Từ kho lưu trữ thư riêng của giới quý tộc"
encyclo_enemy12_1="^Bá tước phu nhân chúng tôi đã héo úa; bà không ăn nửa năm nay. Ban đầu chúng tôi vui, không còn lỗ trên cổ nữa. Nhưng bà tự hành hạ mình quá.#Bà chẳng quan tâm chúng tôi. Giờ bà chỉ nghĩ đến nghi thức ma thuật. Bà hầu như không đứng nổi.#Ngài có thể hỏi Bá tước giúp không? Có lẽ ngài ấy giúp được. Sẽ chẳng tốt đẹp gì nếu chúng tôi bị bỏ lại mà không có người bảo vệ.^#- Thư từ trưởng làng"
encyclo_enemy12_2="^Kiến thức, Marius – ngài hiểu không? Đó là tất cả những gì ta quan tâm giờ. Tìm kiếm sự thật – không phải những dục vọng thú tính thấp hèn trước đây.#Hôm qua ta thực hiện thí nghiệm gần đền bão: cố bắt tia sét vào lọ thủy tinh, với sự giúp đỡ của đám người hầu làng.#Than ôi, thất bại, chúng đều bị nướng chết. Nhưng không sao. Ta uống máu sôi của chúng, dĩ nhiên, nhưng ta lạc đề rồi.^#- Trích từ một lá thư thất lạc"
encyclo_enemy13="Một loài côn trùng kích thước khủng khiếp và cơn đói khủng khiếp. Hãy tưởng tượng một thanh kiếm hút máu có đôi cánh tạo âm thanh vo ve kinh hoàng: mô tả đó rất hợp với sinh vật này. Loài muỗi này thường sống ở đầm lầy đầy khí độc. Đáng chú ý, chúng dường như không thể kiềm chế ^ăn uống^ nạn nhân dù đã no máu, và thường ăn nhiều hơn lớp vỏ chitin có thể chịu nổi."
encyclo_enemy13_0="^Muỗi đầm lầy đói khát đến mức không ngừng hút cho đến khi bụng nổ tung.#Vụ nổ có thể đủ mạnh để làm bị thương hoặc giết chết sinh vật khác bằng ^mảnh vỡ^ thịt côn trùng. Làm sao loài muỗi khổng lồ vẫn tồn tại, người ta có thể thắc mắc?#Để sống sót, một con muỗi chỉ cần một phần mười lượng máu nó hút. Phần lớn máu dùng để nuôi trứng giấu trong phần thân dưới dài.#Máu thừa chỉ bắt đầu đầy bụng khi tất cả trứng được nuôi – và khi muỗi nổ, trứng được rải rộng khu vực.^#- Hivaru Shatt, ^Bách Khoa Thú Vật Hạng Thấp^"
encyclo_enemy13_1="^Muỗi nhỏ thông thường đã đủ để thụ phấn cho quả mọng mật đầm lầy. Nhưng không, họ phải mang những con thú khổng lồ từ đầm xa xôi về!#^Sản lượng sẽ cao ngất trời^, họ nói! ^Quả sẽ to bằng nhà^, họ nói! ^Chúng ta sẽ bán khắp nơi^, họ nói!#Chúc mừng nhé! Giờ không chỉ mùa màng khô cạn, mà cả mạch máu chúng ta nữa!^#- Sidor, nông dân bên kia Hẻm Núi"
encyclo_enemy13_2="Ivor từng vào rừng#Và cố tìm vài quả mọng.#Cần cả giỏ đầy#Để làm rượu nhà.#Tìm hàng giờ chẳng thấy gì,#^Không một quả nào!#Chắc phải vào đầm lầy – #Chẳng đáng sợ lắm đâu!^#Nhiều bụi mọng ở đó:#^Chuyện khác rồi!^#Bắt đầu ăn khi đi,#Nhưng rồi sẽ hối hận.#Thế là lang thang quá xa,#Không còn cơ hội – #Chỉ muỗi thưởng thức#Hương vị mọng của Ivor.#- Bài dân ca về Ivor Kẻ Ngốc"
encyclo_enemy14="Một trong số rất ít loài bản địa của thời kỳ kỳ lạ này, dark slime cảm thấy rất thoải mái trong đống đổ nát của thế giới giờ đã bị lãng quên."
encyclo_enemy14_0="^Cấu hình hành tinh. Vi phạm tính toàn vẹn 0-14v2, đính kèm 1.#Sinh vật không biến mất trong giới hạn điểm zero khi nguồn quintessence bị loại bỏ [4 trường hợp].#Tạm thời thay thế bằng tinh chất vũ trụ, cần nghiên cứu thêm.^#- Báo cáo của [KHÔNG ĐỌC ĐƯỢC]"
encyclo_enemy15="Một kẻ đáng thương bị ma cà rồng hút cạn máu. Xác sống đi lại tìm kiếm thịt tươi để bù đắp cho mạng sống bị cướp. Phục vụ ý chí ma cà rồng, nhưng không thể nghỉ ngơi ngay cả khi chủ nhân qua đời. Những tiếng rên hiếm hoi của chúng chỉ là nỗ lực bắt chước hành động thở của sinh vật sống, và không nên nhầm lẫn với lời kêu gọi giao tiếp hòa bình."
encyclo_enemy15_0="^Bốn ngày trước Bá tước đến thăm, kể cho trẻ con về đồng loại hoang dã của ngài và tại sao chúng ta cần bảo vệ tốt khỏi nanh vuốt.#Mất rất lâu để thuyết phục bọn trẻ rằng ^dân làng nửa chết với mắt trống rỗng và tim thối rữa^ chỉ là... Cái gì nhỉ... Men-taphore.^#- Một ngày ở nông thôn"
encyclo_enemy15_1="Đường đêm ngoằn ngoèo:#Kẻ ngốc tên Ivor sợ hãi.#Đôi ghoul răng thối:#^Các ngươi không phải người ta muốn gặp!^#Hắn ném rìu – tên đầu tiên ngã:#Hắn đâm tên kia kèm tiếng hét.#^Trận đánh dễ dàng!^ – nhưng ôi thôi,#Tên đầu tiên đứng dậy từ cỏ.#- Bài dân ca về Ivor Kẻ Ngốc"
encyclo_enemy15_2="^Một tòa tháp mọc lên trên đồi qua đêm. Đàn ông cầm rìu đi xem chuyện gì.#Chồng tôi không bình thường kể từ khi về. Anh ấy không ăn, chỉ nhìn tường và lẩm bẩm lạ lùng.#Tôi khóa mình trong phòng với bọn trẻ. Mai sẽ đến nhà chị dâu. Có lẽ chị ấy giúp được.^#- Ghi chú cũ mòn theo thời gian"
encyclo_enemy16="Một bộ xương hoạt hình là xác sống đã mất hết mô mềm. Nhưng ai nói rằng mất vài khúc xương chắc chắn sẽ kết thúc sự tồn tại của nó?"
encyclo_enemy16_0="^Tôi thậm chí không ngạc nhiên khi bộ xương chiến đấu còn cuồng nộ hơn sau khi bạn đập gãy tay hoặc chân nó.#Những khúc xương và phần còn lại là thứ duy nhất chúng còn giữ, và giờ bạn còn cướp luôn cả thứ đó.#Đôi khi nó giận đến mức lao thẳng vào khiên bạn mạnh đến nỗi vài khúc xương cuối cùng tan thành bụi.^#- Tin đồn vặt"
encyclo_enemy16_1="^Nếu bạn nghiền nát đầu bộ xương, đừng nghĩ đầu bạn không thể bị nghiền nát tiếp theo.^#- Trí tuệ ngạn ngữ"
encyclo_enemy16_2="^Giáo sư nói thí nghiệm của tôi sẽ không cho kết quả, nhưng ông ấy sai rồi!#Sáu xương sườn và một hàm đủ để chứa đựng trí tuệ, và đốt sống có thể thay bằng xương ngón tay!#Giờ đến giai đoạn tiếp theo: tách một bộ xương đầy đủ thành hai bộ xương không hoàn chỉnh.^#- Từ sổ tay thí nghiệm tìm thấy trên nửa phải của ứng viên Trường Hoại Tử"
encyclo_enemy17="Khi nói đến việc tạo sự sống bằng cách rèn và đúc kim loại, các thợ thủ công Hội Rèn đã đạt được nhiều kỳ tích ấn tượng. Những ^kỳ tích^ ấy thường được thấy lang thang khắp nông thôn: tiếng lạch cạch của tấm giáp và tiếng rên rỉ tuyệt vọng vì không biết chỗ đứng của mình trên đời đủ để khiến dân thường khiếp sợ."
encyclo_enemy17_0="^...Ừ, tôi thấy một cái hôm qua. Đúng như anh mô tả.#Giáp cổ điển, hỏi những câu lạ lùng – thậm chí không hỏi rượu hay gái. Chỉ muốn leo mái nhà chúng tôi ngắm sao.#Nhưng để lại tiền boa hậu hĩnh. Ồ, đừng chỉ nhìn đồ ăn – cứ thử đi...!^#- Từ cuộc trò chuyện với bà Agatha"
encyclo_enemy17_1="^Isolde, cô con gái nhỏ của tôi, đã năm tuổi. Con bé thích hiệp sĩ thiếc, và bảo cách nó chạy buồn cười lắm! Nó nên bước đều chứ... Nhưng tôi hài lòng với nó đến giờ.#Một cách kết hợp khác với búa phù phép và làm cứng trong dung dịch thảo dược sẽ ổn thôi... Tôi nghĩ mình có thể dạy nó nhảy múa!# ------------------#Thợ học việc trách tôi bỏ lỡ đám cưới con gái. Tôi thậm chí không biết.#Giáp của tôi giờ có thể hoàn thành đường chướng ngại vật, và thậm chí tìm đường ngắn nhất – một chiến thắng thực sự!^#- Ghi chú tìm thấy trên bàn rèn"
encyclo_enemy17_2="^Hôm qua tôi rèn kim loại tốt nhất thành thanh kiếm tuyệt đẹp cho Tướng Manger.#Hôm nay, ông ấy chết trong trận chiến, khi thanh kiếm của tôi cắt kẻ thù như giấy: không một vết xước trên lưỡi.#Tương tự với mọi vũ khí tôi làm. Con người quá yếu ớt để chịu nổi món quà của tôi.#Và tôi sẽ sửa điều đó...^#- Henrik Điên, thợ rèn thiên tài"
encyclo_enemy18="Ít yêu tinh hiểu khái niệm thứ bậc, nhưng mọi yêu tinh đều biết chắc – thủ lĩnh sẽ dẫn chúng đến mồi béo nhất và lập phục kích tốt nhất. Chúng cũng biết sống phục tùng tốt hơn nhiều so với bị đâm – và nếu ai không biết, thủ lĩnh sẽ dạy chúng theo cách trực tiếp nhất."
encyclo_enemy18_0="^Một ngày đội chúng tôi có tân binh mới: một tên thông minh, tên Gorka.#Luôn quấn vải và đồ linh tinh quanh người. Đánh thay mười người và ăn thay ba. Chỉ huy luôn hài lòng với kiểu toán đó.#Rồi một năm sau chúng tôi uống cùng nhau, như thường – rồi trung sĩ đập đầu hắn mạnh đến mức mũ sắt rơi. Và dưới mũ chúng tôi thấy Gorka có mõm yêu tinh!#Nhưng lúc đó chúng tôi đã là bạn, nên chỉ đội lại mũ cho hắn tử tế, và chẳng nói với ai.#Hắn thậm chí không nhớ sao mình vào đội. Thế là hắn ở lại phục vụ, huấn luyện lính mới.^#- Một trong những câu chuyện Gregor the Suspicious thu thập"
encyclo_enemy18_1="^Hai ngày trước yêu tinh mất thủ lĩnh. Có vẻ thiếu lãnh đạo khiến chúng sợ.#Chúng chọn một yêu tinh từ hàng ngũ, dường như ngẫu nhiên, và bắt đầu cho hắn ăn!#Chúng mang thức ăn cả ngày, thậm chí nhai xương cho hắn để ăn nhanh hơn.#Khối cơ của yêu tinh tăng nhanh, và hành vi bắt đầu thay đổi.#Dần dần hắn bắt đầu quát tháo người khác, đánh vì chậm chạp...^#- Trích báo cáo trinh sát"
encyclo_enemy18_2="^Trong bất kỳ nhóm yêu tinh nào, luôn có thủ lĩnh. Không chỉ băng chiến đấu, mà cả băng có mục đích hòa bình hơn.#Thợ xây yêu tinh, đầu bếp, thợ thủ công, thậm chí nông dân hiếm hoi – luôn có thủ lĩnh.#Bằng đòn roi và chửi bới, thủ lĩnh chỉ huy hành động của nhóm để đạt mục tiêu.#Đó là cách yêu tinh áp đặt trật tự và kỷ luật – điều đáng kinh ngạc mâu thuẫn với khát khao hỗn loạn của chúng.^#- ^Hướng Dẫn Chiến Thuật Và Chiến Lược Của Sinh Vật Thông Minh^"
encyclo_enemy19="Dẫn dắt bởi đức tin, cô ấy sẵn sàng và mong muốn trừng phạt mọi loại dị giáo và bội giáo. Ánh nhìn lạnh băng và bài diễn thuyết lửa bỏng sẽ xuyên thủng tim bất kỳ ai. Và nếu không – thì sự xuyên thủng sẽ do kiếm của các thiên thần cô ấy triệu hồi thực hiện. Cô ấy bảo vệ mình bằng những ô cửa kính màu hoàn hảo làm phân tâm mắt và mê hoặc tâm trí."
encyclo_enemy19_0="Sigma là người tốt nhất trong chúng ta. Cô ấy nhân hậu và sùng đạo; bài giảng đơn giản nhưng chân thành đến thế. Cô ấy không chỉ ^tin^ – cô ấy ^biết.^ Sự phục vụ của cô ấy không nằm ở nụ cười dịu dàng hay lời nói tử tế, mà ở lòng căm thù cháy bỏng với mọi cái ác và bất công.#Hành hương đưa cô ấy đến những vùng đất xa xôi nhất, nơi cô ấy thường chịu vết thương nghiêm trọng đến mức chỉ sống sót nhờ phép màu. Bất kỳ cái ác nào cô ấy gặp, dù dường như không thể vượt qua, đều bị các thiên thần cô ấy dẫn dắt chém đứt.#Tại sao tôi xấu hổ đến thế khi nhìn vào mắt cô ấy? Có phải đức tin tôi quá yếu? Tôi phải cầu nguyện chăm chỉ hơn bao nhiêu, từ bỏ bao nhiêu để trở nên dù chỉ một phần giống cô ấy?#Hành trình cuối cùng của cô ấy thất bại. Tôi cầu nguyện cho sức khỏe cô ấy. Đã lâu không có tin tức. Điều này từng xảy ra trước đây. Tôi biết Thiên đàng sẽ bảo vệ con gái tận tụy nhất của họ, nhưng tôi vẫn lo. Tôi hầu như không ăn được vì căng thẳng. Các chị em lo cho tôi."
encyclo_enemy19_1="Tôi không khỏe chút nào. Mỗi ngày tinh thần tôi yếu đi. Sao Sigma có thể bỏ rơi chúng tôi khi tôi cần cô ấy đến thế? Tôi đã phạm tội quá nhiều... Tôi quá ô uế. Nếu cô ấy ở đây, mọi báng bổ trong đầu tôi sẽ tan biến như đám khói đen.#Lời cầu nguyện cho tôi sức mạnh. Tôi làm việc nặng cả tuần trong một ngày. Và cơ thể tôi không bao giờ mệt nữa. Đây có phải kết quả cầu nguyện cho sức khỏe CỦA CÔ ẤY? Tóc tôi bạc, nhưng mọi người bảo tôi trông trẻ hơn trước. Căn bệnh này sẽ biến mất ngay khi tôi gặp lại Sigma thân yêu. Tôi cầu nguyện. Vì mọi thứ. Liên tục."
encyclo_enemy19_2="Quần áo được mang đến cho tôi. Mọi nghi ngờ sẽ biến mất hôm nay. Nhật ký này giờ không còn ý nghĩa, nhưng tôi sẽ viết trang này để tưởng nhớ chị em chúng ta. Tôi phải an ủi những gì còn lại của tâm trí cô ấy trong cơ thể, cho đến khi nó phai nhạt hoàn toàn. Tôi rất tiếc rằng sự trở lại của tôi nghĩa là một cái chết khác – nhưng đó là ý chí cao hơn, vì lợi ích lớn lao. Nỗi đau thay đổi thể xác đã ngừng. Và nỗi đau tinh thần của cô ấy cũng sẽ sớm kết thúc. Khi cô ấy nhắm mắt, tôi – Sigma – mở đôi mắt này, giờ là của tôi. Tôi sẽ chào đón ngày mới. Và nhân danh tất cả chị em, ngày này sẽ không vô ích."
encyclo_enemy20="Thợ Săn lùng sục vũ trụ, tìm kiếm con mồi. Thị lực sắc bén cho phép hắn thấy và theo dõi bất cứ thứ gì xa xôi vô hạn, đủ để dập tắt một hoặc hai ngôi sao bằng một phát bắn sắc nhọn. Đám chó săn trung thành luôn ở đó để tiêu diệt những hành tinh không đáng phí thuốc súng. Chỉ thứ gì đó thực sự phi thường mới buộc Thợ Săn chiến đấu cận chiến – thứ gì đó cản trở phong cách săn bắn tập luyện mục tiêu thường ngày của hắn."
encyclo_enemy20_0="Một số người có thể gọi tôi ích kỷ, nhưng này... Tôi ^ích kỷ^ thật, nhưng tôi cũng hữu ích. Tôi cứ cứu thế giới này không phải vì yêu con người, mà vì họ yêu tôi. ^Cảm ơn, cảm ơn... Luôn vui khi là thần tượng của các bạn. Hẹn gặp ở thảm họa tiếp theo. Đừng bỏ lỡ! Sẽ là cảnh tượng đáng xem, tôi hứa!^ – vân vân, bạn biết đấy. Tôi sẵn sàng xé cổ con thú xấu xa nhất chỉ để thấy sự ngưỡng mộ trong mắt họ. Tôi luôn nói thế – nhưng không phải ẩn dụ nào cũng thành hiện thực... Một leviathan vũ trụ đến nuốt hành tinh tôi. Nó khó mà vừa miệng. Con thú ngu ngốc. Ồ, đúng rồi, tôi quyết định viết nhật ký. Không có mực, tiếc thật, nên phải xoay sở. Bắn con sinh vật vô dụng đó vào cổ họng: chỉ phí carbon thôi (và thời gian của tôi nữa). Vậy đấy, bạn đoán đúng – những từ này viết bằng máu nó. Ít nhất cũng có ích cho đống phân khổng lồ đó."
encyclo_enemy20_1="Năm tháng trôi qua. Tôi thậm chí không nhớ khi nào mình trở nên mạnh mẽ đến thế. Di chuyển từ sao này sang sao khác giờ chưa đầy một giây. Dĩ nhiên, thỉnh thoảng có rủi ro va phải hành tinh nhỏ (đống phân đông lạnh vô dụng – một ngày nào đó tôi sẽ nghiền hết thành bụi). Không sinh vật nào sánh được với tôi trên bất kỳ hành tinh có sự sống nào trong thiên hà này. Nhưng biết làm sao? Đó là gánh nặng của việc phi thường. Có đủ tôi cho mọi người. Tôi sẽ bảo vệ mọi thế giới có sự sống. Tôi sẽ có nhiều thời gian rảnh hơn khi đám chó con hố đen lớn lên. Lúc đó tôi sẽ thử đến thiên hà tiếp theo – cá là họ cũng cần thần tượng và người bảo vệ. Nhưng trước tiên phải xử lý khoảng không đang tiến tới này. Nếu có kẻ đứng sau, hắn sẽ không ở đó lâu."
encyclo_enemy20_2="Bóng tối đang đến gần. Chuyện quái gì đang xảy ra?! Sao không ai nhận ra các vì sao tắt dần trên bầu trời? Chắc tôi không thể bảo vệ họ khỏi việc ngu ngốc, không như mọi thứ khác. Có lẽ tôi đang hoang tưởng? Đám chó săn đã lớn từ khi sinh ra hồi... Bao nhiêu kỷ nguyên trước nhỉ? (Ừ, viết câu hỏi tu từ trong nhật ký dễ hơn tìm ngày thực tế.) Tôi bắn vài phát tracer vào bóng tối sắp tới, và tôi biết cuộc gặp đang đến gần. Cứ việc: đám chó săn và tôi đang chờ ngươi. Và nếu tôi không xử nổi ngươi – ôi, tôi sẽ không để ngươi lấy miếng mồi ngon lành của vũ trụ này đâu. Tôi có đủ sức mạnh để ném mọi mảnh vào hố đen mà thiên hà này quay quanh. Tôi sẽ sống sót. Tôi là ^Thợ Săn^. Và mọi mối đe dọa với thế giới này đều là con mồi của tôi."
encyclo_enemy21="Cha Tất Cả và Cái Chết Tất Cả. Khởi Đầu và Kết Thúc. Alpha và Omega. Có khả năng hủy diệt toàn bộ sự tồn tại trong chớp mắt, nhưng hắn vẫn coi trọng lao động chăm chỉ."
encyclo_enemy21_0="Alpha tạo ra không gian, thời gian, vật chất và nhiệt độ. Với bốn đại lượng này đan xen, Ngài bắt đầu tạo dựng thế giới – vì không có định mệnh nào khác cho Đấng Sáng Tạo ngoài việc sáng tạo, và không có Sáng Tạo chân chính nếu đã có thứ gì tồn tại trước đó. Vậy nên trước Sáng Tạo, chỉ có hư vô.#Alpha đang tạo ra thế giới, và thế giới ấy tự tạo ra chính mình. Nguyên tắc cốt lõi của thế giới này là sự biến đổi vĩ đại và bất tận – và thế là bình yên chết chóc ra đời: vì mọi sự tồn tại đều hướng tới nó, nên chuyển động vĩnh cửu từ khởi đầu đến kết thúc cũng ra đời.#Và khi thế giới không còn trong cơn đau sinh nở, Alpha tạo ra sự sống. Và Ngài yêu quý nó hơn tất thảy."
encyclo_enemy21_1="Lửa của những ngôi sao nóng nhất, trọng lực của hố đen siêu khối, nanh vuốt của những con thú kinh khủng nhất – không thứ gì dám làm hại Đấng Sáng Tạo.#Lời nguyền rủa lên con người và toàn thể giống loài hắn! Kẻ xâm phạm. Kẻ phản bội mọi sự tồn tại. Kẻ điên loạn. Kẻ ô uế.#Và thế là Omega xuất hiện trong thế giới này, nhìn thấy vũ trụ. Cái chết không giết được thân xác Alpha, nhưng nó giết chết lý trí Ngài: Đấng Sáng Tạo trở thành Đấng Hủy Diệt. Thế giới xấu xí và không đúng đắn của chúng ta đáng được an nghỉ. Và Omega sẽ mang điều đó đến.#Phước lành lên con người và toàn thể giống loài hắn! Người xây Lăng Mộ Vĩ Đại. Người trợ giúp hủy diệt. Người gác cổng Hư Vô. Đầy tớ trung thành. Omega."
encyclo_enemy21_2="Omega nhìn thế giới – hỗn loạn, không đúng đắn, phình to vì sự tồn tại; xấu xí và vô nghĩa đến thế. Từ tay hắn, hư vô xuất hiện: nó khiến chuyển động ngừng nghỉ, giảm nhiệt độ về zero, biến thời gian và không gian thành hư không. Từng lớp từng lớp, khoảng không gian tan rã, cuối cùng bình yên – cân bằng hoàn hảo với mọi thứ khác, thống nhất và vô hiệu hóa. Một phần nhỏ nhất của thế giới đau khổ này đã tìm thấy sự nghỉ ngơi.#Và thế là Omega bắt đầu công việc. Sẽ không còn buồn đau, cũng không còn niềm vui. Không thương xót, không cảm thông; không oán trách, không biết ơn; không quá khứ, không tương lai. Chẳng còn gì tốt đẹp, nhưng cũng chẳng còn gì xấu xa.#Omega bắt đầu công việc. Và cuối cùng, công việc của hắn sẽ hoàn tất."
encyclo_enemy22="Một sinh vật mơ hồ với thành phần không thể mô tả, có khả năng bắt chước hình dạng bất kỳ vật thể nào. Mimic là bậc thầy trong việc chúng làm: trong vài trường hợp lịch sử ghi nhận, một mimic rương đang ngủ đã bị mở khóa bằng chìa. Tuy nhiên lịch sử cũng biết nhiều trường hợp hơn khi mimic rương nuốt chửng kẻ tội nghiệp đến quá gần. Nó tấn công bằng loạt xúc tu cứng nhắc tạo nên gần hết cơ thể."
encyclo_enemy22_0="^Mimic bao quanh chúng ta trong cuộc sống. Hãy lấy những đồng xu trong túi áo khoác cũ: chúng từ đâu ra? Hay đôi đinh lạ trong ngăn kéo? Chiếc đĩa thừa trong bếp?#Những ^chiếc rương^ khát máu mà nhà thám hiểm gặp trên đường chỉ là thành viên yếu nhất của loài chúng.#Quá thiếu kiên nhẫn và không thể bắt chước tinh vi, chúng dễ bị phát hiện – chỉ cần chạm hoặc đánh, thế là xong.#Tôi phải xuất bản bài báo này càng sớm càng tốt. Mọi người phải biết sự thật.^##^Ông Zerichal được tìm thấy chết ngạt với cái cào kim loại quấn chặt quanh cổ. Thật là một vụ tự tử kinh hoàng...^#- Báo cáo viết tay của thanh tra Angus"
encyclo_enemy22_1="^Bà Beth Barlow là một bà lão lạc quan. Bà luôn tìm cách kiếm lợi từ hầu như mọi thứ.#Khi một mimic tham lam xuất hiện trong tầng hầm, bà coi đó là cơ hội loại bỏ gián, chuột, gã say hôi hám, hàng xóm phiền phức, nhân viên thuế, cháu chắt tham lam – và cuối cùng, chính sự chán nản của bà.^#- Paul Joyful, ^Bảy Niềm Vui Chết Người^"
encyclo_enemy22_2="^Mimic có thể chờ đợi con mồi hàng năm mà không hề di chuyển.#Sự kiên trì và khiêm tốn của những sinh vật tuyệt vời này đáng được ngưỡng mộ lớn lao.#Chúng có khả năng trở thành kẻ săn mồi đỉnh cao, nhưng vẫn trung thành với nguyên tắc và tiếp tục trừng phạt lòng tham của nhân loại.^#- Từ bài nghiên cứu học thuật về lũ quỷ bị nguyền rủa"
encyclo_enemy23="Không biết nhiều về người cá. Nhưng một số đặc điểm rõ ràng nhất của chúng rất khét tiếng: tính khí xấu, giáo mác chết người, vảy khô nhanh ngoài nước, và đuôi rắn không phù hợp để di chuyển trên cạn. Vậy mà người cá vẫn tiếp tục nỗ lực chinh phục đất liền."
encyclo_enemy23_0="^Chúng là loài thú ác độc và khát máu nhất trong tất cả. Ngồi dưới đáy sâu, tích tụ sức mạnh và âm mưu chống lại loài người.#Khoảnh khắc chúng ta thấy tàu tấn công của chúng – chúng ta bắn nỏ thần thánh vào nó.#Và chúng chỉ chứng minh bản chất xấu xa bằng cách chống trả. Hoặc – tệ hơn – chúng âm thầm cố trốn thoát để tiếp tục lập kế hoạch ác độc chống loài người.#Chúng cứ gào thét gì đó qua mang, nhưng ai thèm nghe lũ khốn đó!^#- Một trong những câu chuyện Gregor the Suspicious thu thập"
encyclo_enemy23_1="^Đến nay, ngôn ngữ của người cá vẫn là bí ẩn. Chúng viết theo hình xoắn ốc thay vì đường thẳng, và ý nghĩa mỗi ký tự thay đổi theo vị trí trong xoắn ốc. Ý nghĩa mỗi từ cũng có thể khác dựa trên thời điểm viết hoặc nói.#Mọi nỗ lực giao tiếp thần giao cách cảm đều xác nhận quá trình suy nghĩ của người cá hoạt động tương tự. Chúng ta không thể thiết lập liên lạc ngay cả bằng trao đổi hình ảnh đơn giản.^#- Nhà ngôn ngữ học Zeryck Yabar, ^Nghệ Thuật Ngôn Ngữ^"
encyclo_enemy23_2="^Trong vài ngày đầu sau vết cắn, bệnh nhân mê sảng; hắn cứ thì thầm về một thành phố dưới biển và tiếng gọi từ đáy sâu.#Khi vết cắn lành hẳn, hắn bắt đầu đi lại trong phòng và dành hàng giờ bên ao cạnh bệnh viện, chỉ nhìn nước.#Trong vòng một tuần, mọi triệu chứng ngừng. Khuyên bệnh nhân trở lại nhiệm vụ tích cực.^#- Từ hồ sơ y tế quân đội"
encyclo_enemy24="Một cánh đồng lúa mì chẳng ai gieo. Liệu đây là điều kỳ lạ sinh ra từ nghịch lý tồn tại của chính nó, hay chỉ là kết quả tất yếu của một nơi lạ lùng trong thời kỳ lạ lùng? Ngay cả khi bạn cắt hết cánh đồng này, bạn sẽ không thấy sinh vật cầm vũ khí nào lao ra từ rừng lúa hoang. Như thể chưa từng có sinh vật sống nào ở đó."
encyclo_enemy24_0="^Một khối vô hình, con của nghịch lý. Những lưỡi cỏ bò lan, những khối đất trồi lên. Ánh kim loại từ vô số bông lúa.#Và tôi nghĩ – có lẽ nó không biết cách tồn tại đúng đắn, nên tồn tại theo cách tốt nhất có thể? Vụng về, nhút nhát, và vô hình.^#- Lời của một người lạ vô danh"
encyclo_enemy25="Một bản sao gỗ của một vị anh hùng lang thang thế giới hoang tàn. Tại sao con rối này tồn tại hay được ban sự sống thế nào là bí ẩn kỳ lạ. Nó cố bắt chước mọi cử động nó thấy với độ chính xác đáng kinh ngạc: thứ duy nhất con búp bê khớp cầu này không thể làm là bước sang bên và nhường đường."
encyclo_enemy25_0="^Người ta nói ngay cả cây cối cũng có tai.#Tiếng bước chân sột soạt, tiếng lạch cạch giáp trụ, hơi thở hổn hển.#Từ cây phong đến cây phong cao, chúng sẽ thì thầm lặng lẽ về con người bạn.#Và khi nghe tiếng cười vang vọng trên ngọn cây tối, bạn sẽ thấy chính bản sao kẽo kẹt của mình lảo đảo tiến về phía bạn.^#- Tin đồn dân gian"
encyclo_enemy25_1="^Tôi gặp một sinh vật lạ như vậy. Ban đầu tôi nghĩ nó chỉ là một binh sĩ như tôi và muốn chào hỏi, nhưng rồi tôi thấy mặt nó.#Nó bị biến dạng, như tranh biếm họa một người thật! – da nó trông như đất sét nóng chảy.#Nó nhìn tôi với giận dữ và chỉ muốn hại tôi. Nước đỏ bắn ra từ sinh vật này mỗi đòn – và điều đó khiến tôi kinh hãi. Tôi xoay sở đánh bại con quỷ ấy.#Tôi nóng lòng trở về nhà với mẹ rễ, và ngủ trưa trong đống lá thu.^#- Ghi chú viết trên mảnh da người"
encyclo_enemy25_2="^Ai để con búp bê gỗ này ở đây...! Này, ngươi kéo ta đi đâu...?#Ngươi muốn nghe chuyện về người cá?... Ừ thì, có lần tôi giật cần câu mạnh đến mức con cá bay thẳng vào mặt, và sau đó họ gọi tôi là Ivor Đầu Cá Chép...#Còn yêu tinh thì sao...? Ừ thì, chú tôi giống hệt chúng, thứ duy nhất hắn biết là uống rượu mật ong...#Muốn nghe về sách không...? Không, tôi không biết đọc. Thậm chí không tìm được biển quán rượu nếu không có hình...#Giờ thả tôi ra đi... Ngươi là khúc gỗ lạ lùng đấy, nhưng trông ổn. Gặp lại.^#- Từ ghi chú phiêu lưu rừng của Treevor Thực Vật"
encyclo_enemy26="Ít biết về những người canh gác. Thường họ chỉ được thấy chăm chú nhìn vào thứ gì đó. Hiếm khi họ vào tháp, chỉ để sớm quay ra và tiếp tục canh gác. Họ hiếm khi can thiệp vào sự kiện đang diễn ra – trừ khi dòng chảy lịch sử thay đổi mạnh mẽ."
encyclo_enemy26_0="^...Hắn nói với tôi các vì sao đang tắt dần, từng cái một. Những cái xa nhất trước, không thấy bằng mắt thường. Hắn nói chúng bắt đầu biến mất hàng ngàn năm trước, và giờ gần như không còn ngôi sao nào.#Dĩ nhiên tôi không tin. Tôi vẫn thấy đủ 18 ngôi sao từ đỉnh đồi, nơi chúng luôn ở...^#- Trích báo cáo gửi trưởng Hội Thiên Văn"
encyclo_enemy26_1="^...Trong cuộc vây hãm, một sinh vật lạ xuất hiện. Nó chỉ lơ lửng trên không và không làm gì khác, nên chúng tôi tiếp tục tấn công.#Chúng tôi phá cổng đông ngay sau đó, và kẻ địch bắt đầu đổ dầu sôi lên đầu chúng tôi. Rồi tôi nghe tiếng nói trong đầu: ^Không phải như vậy mới đúng.^ Và dầu không hại chúng tôi chút nào!#Chúng tôi tiến lên thành công, phá vỡ phòng tuyến địch...^#- Báo cáo hiện trường của Đại úy Jero"
encyclo_enemy26_2="^Hồi nhỏ tôi lạc đường và gặp một tòa tháp cô đơn. Cửa tháp mở.#Bên trong tôi thấy hàng ngàn bức tường kính, với những bức tranh không tưởng: những ánh sáng rực rỡ bao quanh bởi sao, sinh vật như trong truyện bà kể, thành phố làm từ ánh sáng và nước!#Rồi một người mặc áo choàng nói với tôi: ^Dòng dõi Kẻ Ô Uế không được đứt đoạn. Con phải sống.^ Và khoảnh khắc sau tôi đứng trước dinh thự nhà mình.#Ngài là người sưu tầm chuyện – hãy để câu chuyện của tôi [gạch ngang] vào bộ sưu tập của ngài nữa.^#- Một trong những câu chuyện Gregor the Suspicious thu thập"
encyclo_enemy27="Liệu đây là người canh gác được trang bị kiến thức, hay kiến thức tự trang bị bằng người canh gác? Dù là gì, sinh vật này thấy điều gì đó sai trái trong sự tồn tại của bạn – và nó đang cố gắng sửa chữa rất quyết liệt trước khi quá muộn."
encyclo_enemy27_0="^Marius thân mến – lũ gremlin trọc đầu xấu xí này không chịu buông tha tôi.#Tòa tháp thời gian kinh khủng này bắt đầu xuất hiện gần thư viện tổ tiên của tôi. Đôi mắt nhỏ bé đáng ghét của chúng theo dõi tôi từ xa!#Đôi khi đêm của tôi kết thúc trước cả khi trăng mọc – và đôi khi kéo dài vĩnh cửu mù mờ. Tôi không thể thỏa mãn cơn đói, và giờ danh tiếng tôi tan nát.#Những người canh gác này nên sợ chúng ta, nhưng sao đó tôi không được đối xử như vậy. Tôi cần sự giúp đỡ của ngài, Marius. Cùng nhau chúng ta nên thanh trừng lũ chuột phiền phức này khỏi đây.^#- Trích từ một lá thư thất lạc"
encyclo_enemy27_1="^Kiến thức ma thuật có thể chiếm hữu tâm trí: các pháp sư canh gác là bằng chứng rõ ràng.#Không còn là người tuần tra thụ động, pháp sư canh gác can thiệp vào thế giới theo cách khó hiểu.#Một pháp sư canh gác có thể, theo thứ tự cụ thể: cứu thỏ khỏi bầy sói, phá hủy đoàn thương buôn, tạo mười hai khối đá, rồi ngừng di chuyển vài ngày... và đó chưa phải việc lạ nhất trong những gì đã biết.#Các hội ma thuật đồng ý rằng những hành động này không hỗn loạn hay ngẫu nhiên: chúng được thực hiện để theo đuổi một số mục tiêu xa vời không rõ.^#- Hồi ký của một pháp sư du hành"
encyclo_enemy27_2="^Khi lưỡi kiếm tôi xuyên qua cơ thể hắn mà không gây hại, nhận thức kinh hoàng lướt qua tâm trí: hắn không thuộc thế giới chúng ta.#Hắn ép mình tuân theo quy luật chung – hắn bị thương vì có điều kiện bên ngoài cho điều đó, và cảm thấy đau vì đồng ý với nó.#Sinh vật này có thể dễ dàng bỏ qua mọi hiệu ứng tồn tại, nhưng khi đó tồn tại cũng sẽ bỏ qua nỗ lực can thiệp của hắn.#Đó là lý do đòn tấn công của tôi không gây hại – người canh gác đơn giản không thấy tôi lén đến.^#- Hồi ký của một nhà thám hiểm"
encyclo_enemy28="Một hố đen thu nhỏ trở thành chó bởi ý thích kỳ quặc của sự sáng tạo. Mắt nó có thể thấy hàng triệu thiên hà, và nanh nó có thể xé cả chân không. Bất kỳ cử động bất cẩn nào của bạn sẽ được nghe từ đầu kia vũ trụ. Dù mang hình chó săn, hố đen vẫn thiếu động lực cho bất cứ gì ngoài tồn tại thụ động tại một điểm duy nhất trong không gian... Nhưng chủ nhân và người bạn đồng hành vĩnh cửu của chúng có thể dễ dàng sửa chữa khuyết điểm này."
encyclo_enemy28_0="- Không thể! Hố đen không phải cún con, không thể bắt nó làm nô lệ!^# - Vậy cá cược không? Nếu tôi thành công, anh sẽ không mặc quần trong một tuần.# - Chó săn hố đen thậm chí giả thuyết cũng không thể...! Anh đã làm một con rồi, phải không?# - Không! Dĩ nhiên không. Không, không, không.#- Ồ. Tôi tưởng anh nói...# - Thực ra tôi làm hai con.^#- Tin nhắn từ không gian xa xôi"
encyclo_enemy29="Một con giun ghê rợn kích thước đáng kể. Thân chính phủ lớp da dày, đầu có cấu trúc phức tạp bằng xương và phiến chitin để bảo vệ thêm. Lớp da dày của sinh vật này là phần hệ tiêu hóa: nhiệt độ cực cao bên trong đủ để nung chảy cả đá nhỏ, và sẽ phân tán nếu không có lớp cách nhiệt dày tốt."
encyclo_enemy29_0="^Người ta nói giun tìm nhà trong đống đổ nát vì chúng ăn hiện vật ma thuật của nền văn minh cổ, và sớm chúng sẽ tự tuyệt chủng.#Nhưng với mọi thợ săn kho báu đến đó và trở thành thức ăn giun, tôi khó tin điều đó.^#- Một trong những câu chuyện Gregor the Suspicious thu thập"
encyclo_enemy29_1="^Ngày đó tôi bị mù lần đầu bởi kho báu lấp lánh – rồi lần thứ hai bởi nước bọt cháy bỏng của giun.^#- Cựu nhà thám hiểm"
encyclo_enemy29_2="^Các nhà khoa học bối rối khi thấy giun lửa xuất hiện ngay trong nhà và cung điện của chúng ta. Thủ đô giờ đầy những sinh vật chỉ thuộc về vùng đất hoang vu.#Học giả gọi chúng là kền kền săn mồi các nền văn minh đang chết. Vậy sao chúng lại ở đất ta? Đất ta đang ở thời kỳ đỉnh cao, hỏi ai cũng thế – sức mạnh ta khổng lồ! Không có mối đe dọa nghiêm trọng nào với ta, và sẽ không có trong hàng ngàn năm tới.^#- Biên niên sử sự sụp đổ của Đế quốc Faradass"
encyclo_enemy30="Một mớ hỗn độn máu thịt bị dẫn dắt bởi ký ức phai nhạt về hình dạng và động cơ khi còn sống. Vài khúc xương tạo khung cho cơ thể bất tử này khó mà đỡ nổi – vậy mà hết lần này đến lần khác nó cố đứng dậy từ mặt đất và tiếp tục chiến đấu. Nhưng mỗi cử động vụng về và mỗi đòn tấn công chỉ làm nó yếu hơn. Cơ thể lỏng lẻo dễ văng tung, nhưng khó bị thương. Chiến đấu với cục máu đông chỉ là lời tri ân cuối cùng cho chiến binh vô danh nó từng là, để họ cuối cùng gặp cái chết – không phải từ vết thương, mà từ nhận ra thất bại mong đợi từ lâu đã xảy ra từ lâu." 
encyclo_enemy30_0="^Cắt ngang con đường cấm, tôi đến kịp hội chợ. Nhưng suýt mất mạng. Đường kinh khủng – bánh xe cứ mắc vào bụi và bùn lầy. Ngựa phát điên. Tôi hầu như không thấy đường trong bóng tối đêm...#Nhưng bạn không thể tưởng tượng tôi biết ơn điều đó đến thế nào! Nếu tôi thấy hết bằng mắt mình, chắc chắn tôi đã mất trí!#Ngựa và xe tôi đẫm máu, xương và miếng thịt thối lòi ra từ bánh xe. Lần đầu đời tôi cảm thấy sống sót quan trọng hơn kiếm lời.^#- ^Truyện Từ Hội Chợ^"
encyclo_enemy30_1="^Truyền thuyết nói chúng xuất hiện với người phạm tội phản bội ở nơi có ma quỷ cư ngụ.#Nhưng tôi không hiểu sao nó tấn công tôi.#Không phải phản bội – cô ta gần như cầu xin điều đó!^#- Laurentia Quả Lý Chua Đen"
encyclo_enemy30_2="^Marius – thật đáng yêu. Dân quê thực sự nghĩ cục máu đông là do ma cà rồng gây ra! Thật vô lý!#Tôi đe dọa biến bất kỳ ai dám lan truyền tin đồn bẩn thỉu này thành cục máu bằng tay mình.#Nhưng giờ tôi nghi ngờ mình làm tệ hơn – giờ có lời thì thầm rằng chắc chắn là do tôi.#Diễn thuyết không phải sở trường của tôi, Marius. Tôi quen nhe nanh, không giấu sau nụ cười.#Tôi tin rằng ngài hơn ai hết biết tại sao những con đường máu này cứ xuất hiện – và ngài có thể giúp tôi xử lý chúng.^#- Trích từ một lá thư thất lạc"
encyclo_enemy31="Phong cách chiến đấu của siren đẹp đến mức thuộc về sân khấu. Phép thuật của cô ta du dương, những động tác thanh lịch mê hoặc. Tuy nhiên siren chủ động tìm cách tàn sát khán giả bị mê hoặc: số phận bi thảm chờ đợi bất kỳ ai quá say mê với buổi biểu diễn."
encyclo_enemy31_0="^Người cá đang tiến đến, nhưng chúng tôi sẽ không đầu hàng. Chúng tôi có đủ lương thực và tinh thần cao. Chúng tôi đẩy lùi mọi cuộc tấn công mà không chịu tổn thất!# -----------------#Các cuộc tấn công đã dừng. Chúng tôi nghe thấy tiếng hát đi cùng cơn bão hai ngày trước. Làm sao thứ gì đó đẹp đẽ đến thế lại là mối đe dọa? Chiến thắng đang chờ ngoài tường thành! Chúng ta phải mở cổng bằng mọi giá!^#- Từ nhật ký phát hiện của tiền đồn canh biển"
encyclo_enemy31_1="^Lũ người cá chết tiệt đuổi chúng tôi hàng tuần! Chúng triệu hồi bão tố, gầm gừ qua sấm sét, và cào cấu thân tàu bằng móng vuốt.#Chúng nhắm vào chiếc quan tài bị nguyền rủa chúng tôi nhặt được...? #Người cá chẳng quan tâm đến người chết. Đó là về chị em biển của chúng, đang lặng lẽ vẫy gọi từ lồng giam.#Chiếc quan tài quấn xích dành cho người sống, không phải người chết. Và tôi rất hy vọng nó sẽ vẫn vậy.#Tôi trốn vào trong quan tài, và cầu mong sóng biển thương xót.^#- Một trong những câu chuyện Gregor the Suspicious thu thập"
encyclo_enemy31_2="^Siren là đối thủ cực kỳ bất thường – và khả năng ma thuật của chúng không phải lý do duy nhất để sợ hãi những sinh vật này.#Quan sát một đội người cá thù địch trong trận chiến sẽ lộ ra vai trò thực sự của siren – chúng là thủ lĩnh đội, và những người cá khác sẵn sàng hy sinh mạng sống cho bất kỳ siren nào nếu cần.#Siren có khả năng ra lệnh cho quân đội từ khoảng cách xa.#Tóm tắt: siren phải được đối phó vừa như sĩ quan địch vừa như yếu tố then chốt trong sự bành trướng của người cá.^#- ^Hướng Dẫn Chiến Thuật Và Chiến Lược Của Sinh Vật Thông Minh^"
encyclo_enemy32="Một phần nhỏ của cơn đói ma cà rồng biểu hiện vào thế giới này. Dễ bị nhầm là đám sinh vật ma thuật, nhưng thực tế chỉ là cơn khát máu của một ma cà rồng duy nhất hiện hình. Bộ lông đỏ, tiếng kêu chíp chíp và vỗ cánh của hàng trăm đôi cánh màng – đây là dấu hiệu không thể nhầm lẫn của đàn đỏ."
encyclo_enemy32_0="^Và còn thói quen làm thú cưng từ máu chính mình của chúng nữa chứ? Rốt cuộc chúng có vấn đề gì vậy, tôi muốn biết?!#Nếu tôi chặt chân mình và để nó bò quanh – anh cũng gọi đó là familiar à?#Và tiếng kêu chíp chíp của lũ ký sinh này – ngay cả chủ nhân chúng cũng không chịu nổi!#Một cái ghế gỗ còn làm bạn đồng hành tốt hơn!^#- ^Khi Tôi Đâm Xuyên Giới Quý Tộc^ của Kedlo Threnn, thợ săn ma cà rồng"
encyclo_enemy32_1="^Tôi chưa thấy nhiều con hút máu đến thế kể từ sinh nhật mẹ tôi.^#- Từ thư của Nữ Bá Tước Thung Lũng Đồng Cỏ"
encyclo_enemy32_2="^Làng chúng tôi chưa từng phục vụ kẻ hút máu nào, ngay cả trong nạn đói sau chiến tranh.#Khi yêu tinh từ núi xuống, nhiều người chết. Mọi người sẽ chết nếu không có Marius.#Hắn rạch cổ tay, tạo đàn dơi đỏ từ chính máu mình.#Đàn dơi xử lý lũ cướp và buộc yêu tinh sống sót rút lui. Ma cà rồng mang lại cứu rỗi và chúng tôi chấp nhận hắn làm người bảo vệ.#Nhưng giờ tôi sắp trở thành thức ăn của hắn... Tôi không xấu hổ khi nói rằng tôi luôn ghét Marius suốt những năm qua.#Thà chết như con người còn hơn sống như gia súc.^#- Một trong những câu chuyện Gregor the Suspicious thu thập"
encyclo_enemy33="Một thực thể siêu phàm thiếu thịt, trí tuệ và bất kỳ lý do tồn tại nào. Một đàn cơ thể ma quỷ đan xen hỗn loạn nhưng đáng ngạc nhiên lại đồng bộ trong hành động. Có lẽ chính lòng căm thù mọi thứ sống khiến chúng kết hợp... và theo nghĩa đen."
encyclo_enemy33_0="^Chỉ nghe tên thôi. Đúng vậy – đơn giản là điên rồ. Nếu coi ma quỷ là bản chất của sự sống và trí tuệ, thì ^ma quỷ của ma quỷ^ là gì?#Bản chất sự sống của cả dòng máu khúc xạ qua cái chết của một cá nhân? Biểu hiện tổng hợp của cả loài?#Nếu muốn ý kiến tôi, thứ chúng ta đang đối phó chỉ là một nỗi đau cổ họng khổng lồ – đó là tất cả bạn cần biết về những sinh vật này.^#- Hivaldo, người đào mộ"
encyclo_enemy33_1="^Tất cả họ hàng tôi, từ anh chị em đến ông bà xa nhất, luôn yêu bà cố tôi.#Đó là lý do không ai ngạc nhiên lắm khi thấy cả đám đầu ma quỷ xuất hiện sau khi thầy trừ tà tôi thuê cuối cùng đuổi bà khỏi đám cưới tôi.^#- Laurentia Quả Lý Chua Đen"
encyclo_enemy33_2="^Tôi thấy một món đồ chơi như thế làm ở vùng đất xa – búp bê gỗ sơn đẹp.#Nếu mở ra, có búp bê nhỏ hơn bên trong, y hệt. Và nhỏ hơn nữa – cứ thế, chúng nhỏ dần dần.#^Ai nghĩ ra thứ này vậy?^ Tôi nghĩ lúc đó.#Rồi một đêm tôi gặp rắc rối lớn trên đường gần chiến trường... Suýt mất mạng. Và giờ tôi hiểu điều gì đã truyền cảm hứng cho người làm món đồ chơi ấy...^#- ^Truyện Từ Hội Chợ,^ Quyển III"
encyclo_enemy34="Một sinh vật vượt ngoài mọi sự hiểu biết. Không có từ nào mô tả đầy đủ – và không có từ nào mô tả dù chỉ một phần. Vừa là hư vô vừa là tất cả. Đồng thời."
encyclo_enemy34_0="^Văn bản này là về tôi. Tôi đang viết bằng tay bạn. Tôi đang đọc bằng mắt bạn.#Tôi biết rằng tôi không hiểu điều này, vì bạn không hiểu.#Vì tôi là tất cả. Mọi sinh vật sống đều là tôi.^#- Đoạn văn lặp lại tìm thấy ở nhiều nguồn khác nhau"
encyclo_enemy35="Yêu tinh phát hiện lợi thế của chiến đấu tầm xa trở thành bất ngờ khó chịu cho mọi người trong tầm bắn. Một yêu tinh được huấn luyện kém cầm cung yêu tinh làm kém và tên yêu tinh làm kém vẫn có thể thực hiện những phát bắn đáng khen. Thường thì mũi tên yêu tinh bay qua không trung chỉ để cắm vào lưng một yêu tinh khác – nhưng trúng là trúng."
encyclo_enemy35_0="^Chúng ta rất may vì yêu tinh là cung thủ rất tệ.#Chúng không thể ngừng gào thét và nhăn nhó, để lộ vị trí. Ngắm bắn tệ đến mức thường giết đồng bọn trước khi giao chiến.#Chúng hầu như không đủ sức kéo dây cung, và nếu trúng ai đó chúng có thể phấn khích đến mức quên trận đánh một lúc.#Vậy tôi hỏi anh: loại mông yêu tinh xanh nào phun anh ra thế giới này nếu anh bắn y hệt chúng?!^#- Trung sĩ Dobby Jasper dạy bắn cung cho tân binh"
encyclo_enemy35_1="^Bạn có thể nhận ra nguồn gốc cung thủ yêu tinh qua cách hắn cầm vũ khí.#Nếu hắn kẹp tên giữa các ngón tay, hắn từ thung lũng phía tây. Trên đầu ngón – hắn là loại núi.#Cầm tên trong tay và cố đâm bạn bằng nó? Hắn học từ yêu tinh khác.^#- Martha, nhà thám hiểm"
encyclo_enemy35_2="^Đói khát có thể tìm thấy sứ giả giữa chừng hành trình. Ngày đó tôi may mắn gặp một con thỏ vừa bị bắn. Mũi tên tìm thấy nó không lâu trước, nhưng không ai đến lấy chiến lợi phẩm.#Khi tôi đang chiên con thỏ bằng công thức cũ của mẹ, tôi không biết một cung thủ yêu tinh một mắt đang theo dõi tôi. Hắn tiếp cận rất gần, vì tâm trí tôi mải lo bữa tối sắp tới.#Nhưng ngạc nhiên thay, hắn chỉ giật con thỏ và chạy nhanh với chiến lợi phẩm. Nhiều năm sau, tôi nhận ra vị khách một mắt trên quảng trường thành phố giữa đám yêu tinh bị bắt, sắp bị hành quyết bởi bầy chó.#Tôi chuộc hắn, đưa ra ngoài thành phố và thả. Tôi đưa hắn túi thức ăn, có vài gia vị của mẹ tôi bên trong. Và tôi không bao giờ hối hận vì quyết định đó.^#- Lời giới thiệu sách ^Yêu Tinh Không Bắn^"
encyclo_enemy36="Người cầm vũ khí thô kệch bằng xương thô kệch. Nguồn gốc không khác lắm so với anh em cầm lưỡi. Sự khác biệt duy nhất giữa hai loại là sự không muốn tiếp cận mục tiêu."
encyclo_enemy36_0="^Tôi phàn nàn với anh về những thanh kiếm người ta đặt trong mộ người thân đã chết, khiến công việc chúng ta khó hơn. Tôi yêu cầu anh làm gì đó – và tôi không ngờ anh lại làm tệ hơn thế!#Hôm qua tôi theo thói quen – ném đá choáng từ xa trước khi đi lấy tủy sống – nhưng rồi phát hiện mũi tên cắm vào chân tôi!#Anh may mắn vì chân đó đã hoại tử rồi.^#- Từ thư riêng của giáo phái hoại tử"
encyclo_enemy36_1="^Một điều tôi vẫn không hiểu – tại sao cung thủ bộ xương cần ống tên?#Nếu tôi thành cung thủ khi chết, tôi sẽ lập tức bỏ ống tên và giữ hết tên trong lồng ngực.#Thực tế, sáng tạo, phong cách! Pháp sư hoại tử sẽ nói: ^Nhìn kìa, tên này có gì đó khác biệt.^ Không to tát, nhưng vẫn hay.^#- Tin đồn vặt"
encyclo_enemy36_2="^Thật đáng kinh ngạc, nhưng vũ khí của sinh vật bất tử này phải được coi là phần của bản thể nó. Không cung hay tên nào sống sót dù chỉ chục năm chôn trong đất.#Khi cung thủ bộ xương trỗi dậy từ mộ, không chỉ xương được giữ lại bằng ma thuật. Nếu nhìn kỹ vũ khí, bạn sẽ thấy vô số vết rách và nứt.#Trong khi bộ xương ^sống^ có thể di chuyển mà không cần cơ hay dây chằng, vũ khí của chúng cũng vậy – hoạt động dù hoàn toàn không thể dùng.#Khả năng truyền đặc tính bất tử sang vật vô tri chứa tiềm năng lớn.^#- Từ sách nghiên cứu hoại tử"
encyclo_enemy37="Harpies thông thái, xinh đẹp và chết chóc. Món quà tiên tri giúp chúng tìm con mồi, mắt sắc bén nhận ra cách bắt tốt nhất, và đôi cánh mạnh mẽ cung cấp phương tiện thực hiện kế hoạch. Móng vuốt sắc đến mức dễ đâm vào đá rắn, bù đắp hơn hẳn khung nhẹ và sự mong manh của cơ thể."
encyclo_enemy37_0="^Kết nối tinh thần của harpies với thế giới không chỉ cực kỳ mạnh mẽ, mà còn thiết yếu cho sự sống của chúng. Càng ít sinh vật sống gần, tầm nhìn nội tại càng mạnh.#Bức tranh lớn của các sự kiện đan xen khó nhận ra hơn khi định mệnh hỗn loạn và tiềm năng của ai đó che khuất tầm nhìn từ gần.#Có lẽ đây là lý do chúng xây tổ trên đỉnh núi băng giá nhất, xa những kẻ coi trọng sống lâu và thoải mái.^#- Hồi ký của một pháp sư du hành"
encyclo_enemy37_1="^Khi đi qua vùng có harpies, luôn mang theo ít phi lê cá. Nếu harpy quyết định tấn công bạn, không phải không thể đổi phi lê lấy mạng.#Chín trên mười harpy thích cá bơn mềm hơn lữ khách da bọc xương.#Và nếu thất bại – ít nhất bạn đã thử. Không nên bước vào đất harpy.^#- ^Hướng Dẫn Núi Non Và Những Nơi Khắc Nghiệt Khác^"
encyclo_enemy37_2="Ivor uống suốt đêm,#Rồi sáng ra rời nhà.#Đau đầu kinh khủng#Vẫn cố đếm bò.#^Cái gì vậy? Không thể tin nổi!#Bò bay trên trời!^#Một hoặc hai tuần harpies#Ăn thịt bò ngày đêm.#- Bài dân ca về Ivor Kẻ Ngốc"
encyclo_enemy38="Một bức tượng phù phép bỏ vị trí. Dù được tạo bằng ma thuật, gargoyle không phải sinh vật ma thuật thực thụ. Chỉ có thể đoán sao đống đá này bay được – và tại sao nó thích chiến đấu cách thông thường thay vì đè bẹp nạn nhân bằng trọng lượng từ trên cao."
encyclo_enemy38_0="^Một đống đá bình thường nhất, với phép thuật khá bất thường ở lõi.#Trang trí thừa thãi: đôi cánh đá không cần cho bay, và hàm granite không thể cắn hay nhai.#Lâu rồi tôi nhận ra thứ ghê tởm nhất về sinh vật này là người tạo ra chúng. Chúng biết sáng tạo của mình sẽ giết người vì lòng tham.#Vậy mà chúng không chỉ tạo ra những vũ khí này – chúng còn quyết định trang trí cho dễ thương. Điều đó vượt quá lạnh lùng ngay cả với trái tim tàn nhẫn.^#- Hivaru Shatt, ^Bách Khoa Thú Vật Hạng Thấp^"
encyclo_enemy38_1="^Chỉ hôm nay! Ưu đãi hào phóng không thể tin! Phù phép* mỗi bức tượng thứ ba chỉ nửa giá!#Miễn phí hồng ngọc đính mắt** và lớp phủ vàng tùy chọn*** với đơn 10 phù phép trở lên!.# ------------------#*Ưu đãi chỉ áp dụng phù phép do tu sĩ thực hiện#**Hồng ngọc có thể thay bằng thủy tinh biến đổi ma thuật#***Sơn vàng cần cho lớp phủ bán riêng# ------------------#Ưu đãi có hạn!^#- Từ tờ rơi Hội Phù Phép"
encyclo_enemy38_2="^Không, không, anh chưa hiểu! Nếu chúng ta trộm chính gargoyle thì sao?! Chúng ta không đụng kho báu, nên nó không hại chúng ta!#Chúng ta mang nó về nhà đặt tử tế, rồi bắt đầu mang kho báu còn lại đến – về mặt kỹ thuật, gargoyle vẫn canh giữ nó.#Nghĩa là chúng ta không trộm! Ngược lại, chúng ta trả kho báu về tượng!#Và nếu nhà quanh tượng là của tôi, thì kho báu cũng của tôi! Vậy tôi có thể tiêu xài thoải mái và gargoyle không nói gì. Kế hoạch thông minh, phải không?^#- Lời Mark Kẻ Mơ Mộng, kể tại đám tang hắn"
encyclo_enemy39="Một sinh vật lơ lửng làm hoàn toàn từ nước. Trạng thái lỏng không ngăn nó chém đối thủ, nhưng cũng không bảo vệ khỏi bị chém hay đập. Trên chiến trường sứa thường được coi là tay sai của siren, những kẻ có thể mê hoặc ngay cả nước bằng tiếng hát."
encyclo_enemy39_0="^Siren chiến đấu bằng cách tấn công với đợt sóng nước. Nhưng nếu mục tiêu của siren quá xa để với tới, cô ta sẽ triệu hồi bạn chiến đấu – sứa.#Không biết nhiều về những sinh vật này. Chúng làm hoàn toàn từ nước, và không rõ cái gì làm lõi tồn tại.#Nên coi chúng là golem nước, hay nguyên tố hoàn chỉnh? Hay có lẽ chúng ta đang đối phó với loại hoại tử ràng buộc linh hồn sinh vật biển vào khối nước nhỏ?^#- Hồi ký của một pháp sư du hành"
encyclo_enemy40="Cơn thịnh nộ của thiên đàng, chứa trong bộ giáp và mang đôi cánh. Chỉ những người chính trực nhất mới triệu hồi được sự giúp đỡ của thiên thần, và chúng sẽ hoàn toàn tin tưởng lời kêu gọi đó và theo đuổi trong cuộc chiến chống cái ác. Bạn có thể không đồng ý với ý kiến chúng cho rằng bạn ô uế, nhưng đừng phí lời cố thay đổi suy nghĩ chúng. Chúng không phán xét: chúng chỉ thi hành án phạt."
encyclo_enemy40_0="^Ánh nhìn thuần túy thất vọng. Tôi hỏi cô ấy thiên thần là gì và từ đâu đến, và đó là câu trả lời duy nhất cô ấy cho tôi.#^Có quan trọng không? Bạn có cần nghiên cứu phép màu trước khi ngưỡng mộ nó không?^ Đó là điều cô ấy cố nói với tôi.#Và cô ấy hoàn toàn đúng. Tôi không biết mình xấu hổ hơn vì hỏi những câu đó, hay vì vẫn khao khát biết câu trả lời...^#- Từ nhật ký của một tu sĩ vô danh"
encyclo_enemy47="Những kẻ tham lam khốn kiếp là hình ảnh bắt buộc quanh bất kỳ ngôi làng nào khá giả. Nơi đồng tiền leng keng, dao găm sẽ theo sau. Không như trộm thành thị lén lút vì cần thiết và tan biến nếu thấy dù chỉ bóng vệ binh, đám cướp làng tự do này thực hiện cướp giật công khai và biết chắc sẽ thoát tội. Thứ duy nhất chúng sợ là không mang hết chiến lợi phẩm một lúc."
encyclo_enemy47_0="^Đêm đó tôi bị đánh tơi bời và cướp ngay giữa làng. Dân làng chăm sóc sức khỏe tôi vài ngày, rồi cho vài bộ quần áo cũ và hứa sẽ tìm lũ khốn kiếp và trừng phạt theo truyền thống địa phương nghiêm khắc. Nhưng tôi không thể tin họ. Lý do, trong số khác, là vì tôi nhận ra vài người tốt bụng đang mặc đồ của chính tôi.^#- Tin đồn vặt"
encyclo_enemy47_1="^Veliar di Penny là tên khốn tham lam nhất trong lịch sử trộm cắp. Hắn từng lắc sạch túp lều làng mọi thứ sở hữu, và không ngại lấy cả bát mèo.#Người ăn xin giấu mũ xin ăn; thương nhân ôm bắp cải và củ cải như con cái yêu quý.#Hang ổ tên ác nhân được phát hiện nửa thế kỷ sau khi hắn chết: đầy ắp cả kho báu lẫn đồ linh tinh. Hắn trộm nhiều đến mức 16 tầng hầm dưới đất cũng khó chứa hết hàng hóa.^#- Paul Joyful, ^Bảy Niềm Vui Chết Người^"
encyclo_enemy47_2="^Đống chiến lợi phẩm ngập đây, tôi nói thật! Nông dân bá tước này phát điên vì cuộc sống tốt đẹp – cứ nhìn bạc kìa! Này, Mikolash và đám còn lại đâu?#Thư giãn đi – ma cà rồng chẳng đụng đến chúng ta đâu. Con người như côn trùng với chúng. Chết vài tên thì sao? Làm gì hắn thấy từ lâu đài, đúng không?^#- Từ ^10 Sai Lầm Chết Người Của Kẻ Cướp Mới Vào Nghề,^ Niên Giám Hội Trộm Cắp"
encyclo_enemy48="Một sinh vật làm từ cát, ma thuật và ý chí của Đại Sa Mạc. Cơ thể hạt cát trông như sắp tan rã chỉ vì một cử động sai, nhưng đừng mong trận đấu dễ dàng. Đại Sa Mạc trân trọng những đứa con khắp nơi của mình, và dịu dàng bao bọc mỗi đứa bằng lớp áo choàng bảo vệ nhiệt ma thuật."
encyclo_enemy48_0="^Tuyệt đối cấm, nhưng Ibhan vẫn mang theo túi nước phù phép. Túi nước tự đầy khi lắc – phép màu vô giá, vì đoàn xe đi qua sa mạc. Chúng tôi chưa quen với sức nóng đường phía nam.#Cuộc tấn công bất ngờ và nhanh. Dòng cát lật xe và đâm xuyên gia súc. Kẻ tấn công di chuyển tự do trong bão cát. Người sống sót ít ỏi. Chúng tôi đổ máu lạc đà vào túi nước, biết rõ về nhà bằng chân sẽ khó thế nào. Tôi tìm thấy xác khô queo của Ibhan. Túi nước hắn vô dụng, như bị tước hết ma thuật...^#- Mục cuối trong sổ cái của Caar Thương Nhân"
encyclo_enemy48_1="^Từ bỏ xác thịt. Trở thành đồng loại của ta. Con đường ngươi sẽ là vĩnh cửu rực rỡ.^#Đó là điều người lữ hành cát nói khi chúng tôi gặp lần đầu. Tôi cười nhạo gợi ý hắn khi rút kiếm, quá háo hức cắt câu trả lời vào cơ thể vụn vỡ của hắn.#Nhưng giờ tôi rất già, cái chết cận kề, và nó khiến tôi sợ. Với nỗi buồn trong mắt tôi nhìn vùng đất chậm rãi già đi thành sa mạc, và hy vọng ở đó họ vẫn chờ tôi chấp nhận lời đề nghị.^#- Từ nhật ký của một người đàn ông vô danh"
encyclo_enemy48_2="^Tôi nói thật, tôi có người hâm mộ! Và hắn nóng bỏng nữa. Cao và đẹp trai – ừ thì, kiểu bí ẩn hơn, nên tôi chưa thấy rõ mặt, nhưng – nghe này, không phải vấn đề chính.#Hắn mê tôi. Theo tôi khắp nơi. Đến làng, qua cánh đồng, giữa đầm lầy... nếu không phải tình yêu thật thì là gì?#Tôi nghĩ hắn chỉ quá nhút nhát để mở lời. Mai tôi sẽ chủ động.^#— từ thư của Edna"
encyclo_enemy49="Phù thủy sẽ không bao giờ bỏ lỡ cơ hội tham gia trận chiến, dù chẳng có lợi lộc gì. Nhiều lý thuyết y học của bà ta đòi hỏi thử nghiệm thực địa quá kiên quyết để bỏ qua, và những trận chiến đầy vết thương là sân thử nghiệm giấc mơ của bà."
encyclo_enemy49_0="^Không, chính PHƯƠNG PHÁP của NGƯƠI quá tàn nhẫn! Tôi hiểu ngươi ghét làm đau người, tôi cũng thế.#Nhưng làm sao ngươi giúp người sống nếu chỉ mổ xẻ người chết?#Tôi chán ngấy rồi! Tôi đã tìm được mảnh đất đẹp cho ngôi nhà tương lai, nơi không kẻ ngốc hay đạo đức giả nào quấy rầy tôi.^#- Từ thư của Học Viện Y Khoa Thành Phố Morel"
encyclo_enemy49_1="^Chúng tôi chỉ là trẻ con. Một con ratwolf tấn công cả hai đêm kinh hoàng ấy – xé toạc bụng tôi và cắn xuyên sọ, rồi xé cổ em gái.#Khi tỉnh dậy, tôi ở túp lều phù thủy và mọi vết thương biến mất. Em gái không thấy đâu.#^Sao bà không cứu em ấy?^ tôi khóc.#^Chỉ kịp cứu một đứa,^ bà trả lời, chỉ ra cửa.#^Sao là tôi chứ không phải em ấy?^#^Vết thương của con thú vị hơn.^#- Một trong những câu chuyện Gregor The Suspicious thu thập"
encyclo_enemy49_2="^Đó là cơ hội cuối cùng của tôi,^ Jonah lẩm bẩm khi đi vào rừng trên đôi chân run rẩy. Sáng hôm sau hắn trở về, khỏe như vâm. Phù thủy chữa khỏi cơn ho kinh khủng và đốm đậu đen: suốt một tháng, mọi thứ ổn.#Rồi mọi thứ tệ hơn. Thứ Sáu Xương, Jonah bắt đầu lẩm bẩm và sùi bọt như cá trích giận dữ. Tuần Sáng, hắn cố ăn vợ trưởng làng.#Khi chúng tôi nhốt tên khốn trong kho thóc, hắn tê liệt và teo lại qua đêm.#^Và khi kéo xác Jonah ra mộ, nó hóa bụi – lúc đó chúng tôi thấy hắn có con cóc cục cằn làm tim!^#- Tin đồn làng"
encyclo_enemy50="Từ ^totem^ có lẽ quá mạnh cho thứ đồ chơi này. Chẳng có gì ma thuật, chỉ vài tấm khiên sắt tầm thường buộc vào cột chắc bằng dây. Chính phù thủy chuyển hướng bạo lực thừa khỏi đối tượng thử nghiệm hiện tại vào totem – dù sao hồi sinh người chết nằm ngoài chuyên môn bà ta."
encyclo_enemy50_0="^Trung sĩ lại từ chối cho tôi nghỉ phép và để tôi canh gác lần thứ ba tuần này. Bảo tôi không về nhà cho đến khi học bắn thẳng. Nhưng tôi giỏi cung, tôi thề! Tôi luôn trúng mục tiêu từ trăm bước ở bãi tập, tôi chăm sóc cung cẩn thận, kiểm tra trước mỗi tuần tra. Nhưng lúc leo tháp thì như mọi mũi tên muốn sống trong rừng. Chắc tôi chỉ lo lắng.#Đêm nay yên tĩnh. Có lẽ tôi sẽ sớm về nhà. Chào cha giúp con. Con rất chân thành.^#- Thư từ tiền tuyến"


encyclo_item0_0="^Một tác phẩm gỗ tuyệt vời! Nhìn những đường chạm khắc tinh tế khiến tôi rùng mình. Tất cả những lỗ hổng và khoảng trống thách thức sự hiểu biết của tôi! Một tấm bảng như thế nên treo trên cửa, để bạn chiêm ngưỡng mỗi khi bước vào. Hoặc ít nhất đó là điều tôi sẽ làm. Cậu nhóc nhà chúng tôi nói sẽ đặt vài lọ lên đó, nhưng cậu ta chẳng biết gì về thẩm mỹ cả.#Tôi cảm thấy tràn đầy năng lượng khi xếp nó lên xe.^#- Từ nhật ký của Volgrim, người đánh xe đầu tiên"
encyclo_item1_0="^Một món đồ nội thất ngồi được chế tác tinh xảo, chỉ xứng với những quý tộc cao quý nhất. Đệm đỏ và phần gỗ... ừm... phần gỗ tạo nên sự kết hợp màu sắc hoàn hảo khiến mắt vui mừng. Nhiều lần trên đường tôi muốn nghỉ ngơi trên đó, nhưng sợ quần áo du hành bẩn thỉu của mình không xứng với món đồ tuyệt vời ấy. Tôi sẽ chờ đến khi tìm được áo khoác đôi nút tử tế ở trại.#Tôi rất khát khi xếp nó lên xe.^#- Từ nhật ký của Volgrim, người đánh xe đầu tiên"
encyclo_item2_0="^Một trong những món đồ nội thất hoành tráng và thách thức không gian nhất tôi từng thấy hay chở trong xe. Những đường chạm trên cửa và kệ, tay nắm mạ vàng, gợi ý nhẹ nhàng về sự giàu có vô hạn của quần áo bên trong, ôi, tay nghề tuyệt vời! – đó là điều tôi tự nhủ khi xem xét nó trên đường về.#Đau lưng khi xếp nó lên xe.^#- Từ nhật ký của Volgrim, người đánh xe đầu tiên"
encyclo_item3_0="^Khi nhìn đống mảnh sắt rèn nhỏ trước mặt, tôi cố hình dung nó là thứ đẹp đẽ. Chắc chắn đây từng là tác phẩm điêu luyện của thợ đóng giày, và tôi tin nó từng hoạt động rất tốt... Nhưng còn nói gì về đinh chứ? Chúng cùng chiều dài, chiều rộng và vẻ ngoài, không có hoa văn phức tạp hay tỷ lệ hình học tinh xảo. Có người thậm chí nói chúng chẳng có giá trị thẩm mỹ nào! Nhưng tôi vẫn thích ngắm chúng, dù không khơi dậy suy nghĩ cao cả. Phải có vẻ đẹp đơn giản ở những chiếc đinh ấy.#Đâm vào ngón tay khi xếp chúng.^#- Từ nhật ký của Volgrim, người đánh xe đầu tiên"
encyclo_item4_0="^Khi lần đầu nhìn con dao này tôi kinh ngạc – sự kết hợp hoàn hảo không tưởng giữa mùi thảo mộc tỏa ra và tia sáng phản chiếu từ lưỡi dao. Ôi, tôi ghen tị với người đủ khéo léo để thực sự sử dụng công cụ tuyệt vời này! Trên đường về tôi thậm chí cân nhắc đổi nghề vài lần; nhưng tôi xua ý nghĩ đó đi. Một người đánh xe giỏi không thể mơ mộng – và nếu tôi không điều khiển nổi xe mình, thì đừng mơ điều khiển công cụ sắc bén thế này!#Cắt vào tay khi xếp nó. Chỉ một chút thôi. Đã lành rồi.^#- Từ nhật ký của Volgrim, người đánh xe đầu tiên"
encyclo_item5_0="^Thật tuyệt vời khi một công cụ chặt gỗ tuyệt vời lại nằm trong xe tôi vào... thời điểm nào đó trong ngày. Cả kim loại lẫn gỗ của rìu này không có chạm khắc cầu kỳ – nhưng vẻ đẹp thật sự nằm ở chức năng và mục đích. Đơn giản, nhưng tiện lợi và thực tế đến thế! Chỉ cầm nó thôi đã khiến tôi cảm thấy như đang làm việc hữu ích! Tôi nghĩ đến việc chặt vài cây, nhưng gỗ cũng chẳng bền đến trại – chỉ làm cùn lưỡi vô ích. Và chỉ nghĩ vậy thôi đã khiến tôi cau mày.#Dính dằm khi xếp nó.^#- Từ nhật ký của Volgrim, người đánh xe đầu tiên"
encyclo_item6_0="^Một cái bát lớn, với vài hạt óc chó ăn được tuyệt vời bên trong. Khi tôi lái qua đồi, chúng nhảy lạch cạch trong bát, tạo nên thứ âm nhạc. Hy vọng có đủ hạt điều trong đó. Tôi thích mọi loại hạt, dĩ nhiên, nhưng nếu phần của tôi không có hạt điều thì tôi sẽ khá bực.#Tôi nghĩ đến việc uống một pint bia khi xếp chúng.^#- Từ nhật ký của Volgrim, người đánh xe đầu tiên"
encyclo_item7_0="^Tôi luôn thích cách thịt hun khói thường được buộc dây, tạo hoa văn nghệ thuật – và dây vẫn giữ nguyên khi cắt lát. Thành thật mà nói, tôi luôn nghĩ dây chỉ để làm thịt đẹp hơn, nhưng đầu bếp bảo làm vậy để giăm bông giữ hình dạng khi treo lơ lửng. Học được điều mới mỗi ngày!#Tôi nghĩ đến việc ăn kèm gì với thịt này khi xếp nó.^#- Từ nhật ký của Volgrim, người đánh xe đầu tiên"
encyclo_item8_0="^Tỏi hầu như không có nhược điểm. Không phải ai cũng thích, và ít ai hôn bạn sau khi ăn. Nhưng cũng chẳng ai hôn bạn trước khi ăn tỏi. Dù sao, dù có nhiều nhược điểm hơn, tôi vẫn yêu cách nó treo lủng lẳng từ trần nhà thành những chùm gọn gàng. Nó bảo quản được hàng tháng, và dùng để nêm gần như mọi món.#Trở nên bền bỉ hơn khi xếp nó.^#- Từ nhật ký của Volgrim, người đánh xe đầu tiên"
encyclo_item9_0="^Ôi, tôi muốn bắt tay người thợ thủ công đứng sau tác phẩm kim loại và chạm khắc này! Mỗi đường cong phản chiếu ánh nến theo cách cho thấy ý định cẩn thận đằng sau từng chi tiết nhỏ của kiệt tác thực dụng này. Tôi không tưởng tượng nổi nó sẽ tráng lệ thế nào trên lò sưởi trong biệt thự, với ba ngọn nến cháy sáng. Chắc chắn nó có thể làm ai đó mù vì vẻ đẹp... theo nghĩa tốt đẹp, dĩ nhiên.#Phải nheo mắt khi xếp nó.^#- Từ nhật ký của Volgrim, người đánh xe đầu tiên"
encyclo_item10_0="^Đã lâu rồi một bức tranh khiến tôi ấn tượng thế này. Nhưng cũng lâu rồi tôi mới thấy tranh. Nhưng điều đó không làm giảm giá trị bức chân dung cụ thể này. Tác phẩm tuyệt vời – nét cọ ngoạn mục! – và khung vàng tinh xảo quanh nó. Tuy nhiên tôi phải nói bức tranh gợi nhớ ai đó. Có lẽ tôi biết người vẽ? Tôi nên hỏi ở trại.#Cảm giác như có thế lực cao hơn đang dõi theo khi xếp nó.^#- Từ nhật ký của Volgrim, người đánh xe đầu tiên"
encyclo_item11_0="^Nếu muốn dùng bữa tối tử tế, tôi nói bạn nên thưởng thức chỉ trên đĩa như thế này. Dù thức ăn luôn tuyệt vời, đừng quên nghi thức. Không chỉ no bụng – còn tận hưởng cảnh quan, làm giàu cảm giác cái đẹp. Tôi nghĩ sự hiện diện của kim loại tinh khiết, được khắc đẹp này sẽ làm kỳ diệu cho tiêu hóa.#Cảm thấy khao khát sống và cảm nhận sự sống mạnh mẽ khi xếp nó.^#- Từ nhật ký của Volgrim, người đánh xe đầu tiên"
encyclo_item12_0="^Một món đồ nội thất nặng nhưng vẫn tuyệt vời! Trên đường về tôi không kiềm được, dừng xe để chợp mắt nhanh. Dĩ nhiên tôi không nên – nhưng đôi khi phải nuông chiều bản thân, nhất là khi có chiếc giường tuyệt vời gần đó. Ngủ trong xe hay lều chẳng có gì xấu, nhưng những thứ như chiếc giường này mới thật sự làm nổi bật lợi ích của cuộc sống văn minh.#Đau lưng khi xếp nó, nhưng khi về trại thì ổn.^#- Từ nhật ký của Volgrim, người đánh xe đầu tiên"
encyclo_item13_0="^Bàn này được đóng đinh khéo đến thế nào! Hầu hết chỉ thấy vài tấm ván thô kệch, nhưng tôi thấy công việc của kỹ sư thực thụ nhắm cao! Chân bàn đặt đúng để chịu sức nặng bất kỳ bữa tiệc nào, và các tấm ván khớp nhau hoàn hảo – đến từng vết khía nhỏ trên cạnh thô – khiến vụn bánh mì cũng không rơi qua.#Nghĩ đến bữa tối khi xếp nó.^#- Từ nhật ký của Volgrim, người đánh xe đầu tiên"
encyclo_item14_0="^Theo tôi, đồ nội thất như vậy phải đặt gần cửa sổ, để thấy ánh sáng mặt trời mọc hoặc lặn chiếu đẹp lên kính màu và mọi vật phía sau. Dù giờ không có mặt trời, tôi vẫn hy vọng một ngày nó trở lại – và kệ này sẽ chờ, đứng đúng vị trí.#Muốn đặt gì đó lên kệ khi xếp nó.^#- Từ nhật ký của Volgrim, người đánh xe đầu tiên"
encyclo_item15_0="^Một cục kim loại đầy lỗ rỉ sét, bám vào que nhờ một cái đinh vụng về duy nhất. Không biết ai dùng nó – nhưng tôi biết tôi sẽ không để người đó lại gần dụng cụ của mình.#Cắt hết ngón tay khi xếp nó.^#- Từ nhật ký của Wizgrem, người đánh xe thứ hai"
encyclo_item16_0="^Phủ đầy lông dơ khiến dị ứng tôi nổi lên! Thật khó để rửa dao sau khi dùng sao? Có lẽ tốt hơn là vứt nó đi, lưỡi cùn thế kia. Không ngạc nhiên khi nó đầy lông – phải đập chuột sói cả ngàn lần mới cắt được một nhát. Hay là sói chuột...? Thôi kệ!#Hắt xì suốt khi xếp nó.^#- Từ nhật ký của Wizgrem, người đánh xe thứ hai"
encyclo_item17_0="^Chắc thợ rèn chúng ta có một cái giống thế này trong kho. Sao lại cần tôi mang về chứ? Và dù không có – cũng chỉ là cục kim loại đập cục kim loại khác, chắc thay bằng thứ khác được. Và nói về rèn, chẳng phải thợ rèn tự làm cái này sao? Đó là lý do gọi là thợ rèn mà?#Rơi lên chân khi xếp nó. May mà ngón chân tôi chắc, chẳng cảm thấy gì.^#- Từ nhật ký của Wizgrem, người đánh xe thứ hai"
encyclo_item18_0="^Tuyệt vời thật. Gửi cả xe chỉ vì miếng bánh mì cháy?! Như tôi chẳng có gì làm ngoài lái tới lui qua địa hình gồ ghề chỉ để vui! Nghĩ lại thì – ừ, đúng là vậy. Nhưng nếu cậu nhóc kia ra ngoài mang về vài khúc gỗ và đá, cậu ta cũng có thể mang thứ nhỏ xíu này theo!#Tôi giận dữ khi xếp nó.^#- Từ nhật ký của Wizgrem, người đánh xe thứ hai"
encyclo_item19_0="^Tôi chẳng biết ghét gì hơn: bát súp mốc này hay sự phối hợp của trại. Ai nghĩ xe chạy đường gập ghềnh là cách hoàn hảo để chở bình không nắp đầy chất lỏng?! Cảm ơn nhiều! Giờ tôi phải lau sạch vết bẩn kinh tởm khỏi xe!#Nhấp một ngụm khi xếp nó. Chỉ để ít đổ hơn, không gì khác.^#- Từ nhật ký của Wizgrem, người đánh xe thứ hai"
encyclo_item20_0="^Nếu có thứ gì tôi thực sự ghét chở trong xe, đó là thức ăn. Nó hôi, để lại vụn và vết bẩn khắp nơi, đôi khi thu hút thú từ đường vì mùi. Và phô mai là thứ thức ăn tệ nhất, đủ hết dấu. Trừ có lẽ nó không thu hút quái vật – giờ chỉ slime tấn công xe, và hiếm. Tôi thậm chí nghĩ đến việc tháo tấm thép hai bên để chạy nhanh hơn.#Bịt mũi khi xếp nó.^#- Từ nhật ký của Wizgrem, người đánh xe thứ hai"
encyclo_item21_0="^Ôi, Volgrim sẽ vui lắm khi giao thứ này. ^Tay nghề tuyệt vời, nhìn kim loại kìa, chạm khắc đẹp thế nào – bla bla bla!^ Hắn vui vẻ giao bất cứ gì và lái đi đâu cũng được – sao chúng ta còn tung đồng xu để chọn ai lái xe?! Đánh bại tôi! Dù sao – mặt dây chuyền này thực ra khá đẹp, kiểu thế. Nếu không cũ và bạc không xỉn, tôi có lẽ không xấu hổ mang về trại.#Cảm thấy bình tĩnh hơn khi xếp nó.^#- Từ nhật ký của Wizgrem, người đánh xe thứ hai"
encyclo_item22_0="^Tuyệt vời thật. Cuốn sách không đọc được. Sao chúng ta cần đống trang giấy mục nát này? Không mang vào nhà vệ sinh được vì lý do nào đó. Và dù đọc được – chắc người ở trại có việc quan trọng hơn đọc sách trong ngày tận thế!#Mất một trang khi xếp nó.^#- Từ nhật ký của Wizgrem, người đánh xe thứ hai"
encyclo_item23_0="^Nếu lập danh sách mọi món đồ yêu thích tôi từng chở trong xe, chiếc gương này chắc chắn nằm top ba. Dĩ nhiên ai cũng thấy tay nghề tuyệt vời – không cần mô tả chi tiết. Nhưng điều tuyệt nhất là nó phản chiếu mọi thứ hoàn hảo. Tôi còn kịp nhìn Veteran khi lái vào trại. Mặt cô ấy có thể cáu kỉnh và chưa ai thấy cô ấy cười, nhưng điều đó chẳng làm giảm vẻ đẹp chút nào.#Chơi với tia sáng phản chiếu một lúc khi xếp nó.^#- Từ nhật ký của Volgrim, người đánh xe đầu tiên"
encyclo_item24_0="^Không biết ai cần thêm một công cụ thô kệch nữa. Chúng ta thậm chí không có mỏ! Cái cuốc này sẽ phủ bụi trong góc, thế thôi! Và làm kém nữa – tôi không phải thợ cuốc bậc thầy, nhưng chỉ nhìn cũng đủ thấy cầm nó sẽ dằm tay. Và đầu kim loại chỉ chờ cơ hội đâm xuyên chân bạn.#Vấp đá khi xếp nó.^#- Từ nhật ký của Wizgrem, người đánh xe thứ hai"
encyclo_item25_0="^Sao tôi luôn nhận lô hàng kinh tởm thế này? Đặt cẩn thận, theo dõi liên tục, đừng để vỡ trên đường, họ nói! Tôi từng bất cẩn chưa, dù chỉ một lần?! Và hàng của tôi từng cần xử lý cẩn thận thật không? Và lại nữa: chỉ vài mảnh kính. Có gì hay ho? Không ai để ý dù mỗi mảnh có cả tá vết nứt.#Nhìn thấy đồng xu trên đất khi xếp nó.^#- Từ nhật ký của Wizgrem, người đánh xe thứ hai"
encyclo_item26_0="^Lần đầu đời tôi thực sự ghê tởm hàng hóa. Muội than và mỡ không rửa sạch... Tôi không tưởng tượng nổi tên bẩn thỉu nào dùng cái chảo này. Và dĩ nhiên, chúng ta phải mang nó về bằng xe tôi thay vì bỏ lại chỗ nó thuộc về.#Cảm thấy buồn nôn khi xếp nó. Khỏe hơn sau khi về trại.^#- Từ nhật ký của Wizgrem, người đánh xe thứ hai"
encyclo_item27_0="^Không nói được gì hay về thứ này. Lưỡi cùn; cán cầm khó chịu và chắc chắn gây phồng rộp. Chắc chắn sẽ gãy sau vài cú đánh vụng về trên bàn bếp. Có lẽ dùng để dọa vài kẻ nhát gan. Quá nhỏ để là vũ khí tốt – và quá tệ để là dụng cụ bếp tốt. Nhưng tôi là ai để nói với chuyên gia cung ứng?#Không tự cắt mình khi xếp nó.^#- Từ nhật ký của Wizgrem, người đánh xe thứ hai"
encyclo_item28_0="^Thế là gì – thứ đứa trẻ nào cũng làm từ đống que giờ cũng là hàng quan trọng? Và trẻ con làm còn tốt hơn! Cái ghế này trông lung lay đến mức tôi thà ngồi đất. Đất mềm hơn và không gãy dưới mông.#Đập đầu gối khi xếp nó.^#- Từ nhật ký của Wizgrem, người đánh xe thứ hai"
encyclo_item29_0="^Một vật vô dụng trong tình trạng hiện tại. Khóa thực sự hỏng – và lần này tôi không càm ràm, nó thực sự hỏng, hỏi ai cũng được! Và ai cần rương không khóa? Không bảo vệ khỏi trộm, tích bụi, và khó lấy đồ bên trong. Về khách quan nó chẳng có tác dụng.#Vấp phải và ngã khi xếp nó. Không làm rơi gì, tôi nghĩ vậy.^#- Từ nhật ký của Wizgrem, người đánh xe thứ hai"


encyclo_res1_0="Người ta nghĩ đây chỉ là mảnh gỗ thường, nhưng ngay cả gỗ thường giờ cũng khá hiếm. Ký ức tôi về sự tồn tại của cành cây khá mơ hồ, và không đủ để hiện thực hóa hoàn toàn chúng.#Hầu hết những que gỗ tôi tìm thấy trong hành trình thực sự bốc hơi nếu bạn chỉ chạm tay vào.#Vài cành và khúc gỗ còn lại trong tay tôi chắc chắn sẽ được dùng để khôi phục thế giới này."
encyclo_res3_0="Khi đi trên đường, đôi khi tôi tìm thấy mảnh vụn đá dưới chân – và mỗi lần nhặt lên tôi cảm giác như chưa từng làm thế. Nhưng ở thế giới này, bất kỳ mảnh đá nhỏ nào cũng đáng giá.#Lạ thật, nhưng khi gom đủ sỏi trong túi chúng theo cách nào đó hợp nhất thành một tảng đá lớn.#Có vẻ thế giới đang cố tự khôi phục. Tôi đoán mình sẽ giúp."
encyclo_res5_0="Nếu tôi dùng vũ khí hoặc giáp một thời gian, tôi quen với nó. Nó trở thành phần bình thường của thế giới xung quanh.#Nhưng nếu thay bằng thứ mới, thường thì tôi sẽ không nhớ gì về đồ cũ sớm thôi. Tất cả những gì tôi nhớ là nó ^vô dụng và làm từ kim loại.^#Đó là cách những mảnh kim loại nhỏ này xuất hiện trong túi tôi. Chúng dính vào nhau như bị nam châm hóa – và cuối cùng hợp nhất thành thỏi kim loại đầy đủ."
encyclo_res7_0="Tìm thức ăn ở thế giới bị xóa sổ này ngày càng khó. Tôi phải lấy mọi thứ có thể – lúa từ đồng, thịt ratwolf vân vân.#Điều tốt duy nhất về sự quên lãng toàn cầu này là nó cũng ảnh hưởng đến cảm giác đói: nó không làm tôi phân tâm khỏi những rắc rối khác."
encyclo_res8_0="Một quả cầu nhỏ. Tôi không chắc – nhưng nghĩ nó xuất hiện trong túi sau khi đánh bại đám quái lớn.#Quả cầu rung động trong tay và cảm giác như đang lớn lên, nhưng thực ra không phải.#Nếu nhìn vào nó, tôi có khát khao áp đảo muốn làm thế giới xung quanh tốt hơn. Tôi nên đưa nó cho thợ xây ở trại."
encyclo_res9_0="Không biết sao tôi gọi nó là ^quả cầu^ – chỉ để đặt tên thôi, chắc vậy. Nó trông giống đầu lâu hơn: không phải đầu lâu người, dù sao.#Cảm giác tuyệt vọng lớn lao ập đến mỗi khi nhìn vào nó. Tôi mất hết ý chí chiến đấu, hay làm bất cứ gì – thậm chí sống. Thật sự không nên nhìn nó. Nhưng lạ nhất: nếu nắm chặt trong nắm đấm nó làm ngược lại – lấp đầy tôi ý chí sống áp đảo. Thứ kỳ lạ thật.#Theo cách nào đó tôi cảm nhận được nếu sắp chết, quả cầu này sẽ cho tôi đủ sức chạy về trại."
encyclo_res11_0="^Sách^ là từ hơi mạnh cho nó, nhưng cứ để vậy.#Hầu hết trang bên trong trống, và những trang khác hoặc nửa xóa hoặc viết bằng ngôn ngữ lạ.#Tôi nên mang về trại: tôi nghĩ sẽ tìm được ai đó lấy thông tin từ nó."
encyclo_res13_0="Thế giới không còn tồn tại, nhưng tôi vẫn nhớ vài phần. Dù ký ức thường thất bại: những thứ tôi nghĩ chắc chắn đôi khi thành thứ khác.#Đồng cỏ đầy cỏ tươi bắt đầu nở hoa nếu tôi nhắm mắt một giây. Vách đá – và tôi chắc chỉ là tảng đá lớn – biến thành đỉnh núi chớp mắt.#Khi những biến đổi như vậy tích tụ, một sự biến đổi hoàn chỉnh và có thể cảm nhận vật lý ra đời. Tôi không thể mô tả, vì hình dạng nó liên tục thay đổi ngẫu nhiên hoàn toàn."
encyclo_res15_0="Một cụm ký ức trang nghiêm, đau buồn đặc biệt.#Dù bộ xương trỗi dậy từ mộ chống lại ý chí hay ma cà rồng bị buộc gây đau khổ cho mọi người, bất kỳ undead nào cũng nhắc tôi về cái chết. Mọi thứ thế giới bị quên – ngay cả ý nghĩa cái chết.#Tôi phải liên tục nhắc nhở bản thân. May mắn thay, giờ tôi có thể mang theo những suy nghĩ và ký ức này vật lý – như tàn tích đáng thương, hoặc Orb Hậu Mệnh dễ cầm hơn."
encyclo_res17_0="Một mảnh của chính vũ trụ. Mảnh thời gian. Mảnh của thứ vô hạn và không đo lường.#Tôi không cảm nhận được hình dạng dù cầm trong tay: như nắm hư không.#Những thứ như vậy đến thế giới chúng ta với các sinh vật có khả năng ma thuật. Chỉ chúng mới lấy được mảnh mặt phẳng astral và dùng cho nhu cầu riêng."
encyclo_res19_0="Một mẩu cảm hứng hiện thực hóa. Khi thấy tay nghề ai đó, tôi muốn tạo gì đó. Tiếc là tôi không có kỹ năng.#Nhưng tôi không kiềm được nhặt mọi mảnh từ rương phức tạp hay bù nhìn sống quái dị tôi gặp.#Tôi chắc sẽ tìm thợ thủ công khéo ở trại dùng tốt cảm hứng mới này."
encyclo_res21_0="Thế giới biến mất, nhưng thiên nhiên luôn thích nghi – và vải sống là bằng chứng. Đây là rễ nhỏ luôn chuyển động.#Nó xoắn và vặn trong tay tôi, như cố tìm đất để mọc. Nhiều rễ dính vào nhau tạo quả cầu: chỉ lúc đó chúng mới bình tĩnh và rơi vào trạng thái ngủ.#Có vẻ những rễ này cố tiếp cận thực vật và sinh vật sống khác ở thế giới trống rỗng này. Tôi nghĩ không nên trồng chúng ở trại. Không muốn thứ gì xấu xí mọc ra."
encyclo_res23_0="Một giọt cầu hình, lạnh khi chạm và dường như lỏng – nhưng không hẳn vậy.#Nó đọng trong tay tôi như giọt lớn, rồi bò như đàn côn trùng nhỏ. Không chắc không phải làm từ côn trùng thật, nhưng không chứng minh ngược lại. Nếu gom đủ khối vô hình này, nó tạo quả cầu nhỏ và ngừng hành động sống. Tôi sẽ gọi những quả cầu đó là ^Quả Cầu Thống Nhất.^#Ban đầu tôi nghĩ những giọt là mảnh slime. Nhưng dường như vật liệu này tìm thấy quanh mọi sinh vật lỏng hoặc đàn."
