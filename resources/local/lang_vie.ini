text_3="Tại sao đường không có ngã ba?#Tại sao ta trông giống nhau trong các bộ giáp khác nhau?"
text_4="...Và làm sao ta còn thấy được gì khi mặt trời đã biến mất?"
text_5="Hãy nói về mặt trời trước.#Ngươi thấy đấy, Lich tước đoạt môi trường khỏi vô số điều kiện và định luật vật lý, buộc nó tồn tại như thể mọi thứ khác chưa từng tồn tại."
text_6="Nếu chúng ta tước đoạt một không gian cụ thể khỏi mọi nguồn sáng, nhưng vẫn còn sinh vật có khả năng nhìn trong đó, bản chất tồn tại trong không gian kín ấy sẽ tạo ra điều kiện giả, nói vậy - không có ánh sáng, nhưng sinh vật vẫn có thể thấy."
text_7="Vậy tại sao lửa không làm ta mù?"
text_8="Ừm..."
text_9="Sự thật này... quá phức tạp để một phàm nhân hiểu. Có lẽ chúng ta nên giết hắn đi?"
text_10="Đúng. Ta đồng ý."
text_11="Nghe hợp lý đấy."

[dia_bosssecretwin0]
dialog_list=H,-Dec,-Lim,-Fin,-Blin;
dialog_place=4,1,3,2,0,3,1,2;
text_0="Hmm... Điều này có được dự đoán không?"
text_1="Chúng ta đã để lại vài cửa hậu, công bằng thì công bằng."
text_2="Chúng ta sẽ không có cuộc trò chuyện này nếu không có-"
text_3="Đó không phải vấn đề. Giờ chúng ta làm gì?"
text_4="Nói về câu hỏi. Như ta nhớ, ta có vài câu hỏi. Và giờ ta đã kiếm được câu trả lời."
text_5="Vậy là thế. Có vẻ chúng ta không còn lựa chọn nào khác."
text_6="Ngươi đúng, nên học cách chấp nhận thất bại..."
text_7="Nhưng không phải bây giờ!"

[dia_bosssecret1]
dialog_list=H,-Dec,-Lim,-Fin,-Blin;
dialog_place=1,2,0,4;
text_0="Và chào lại."
text_1="Lần này ngươi tìm sự thật gì?"
text_2="Ta có nhiều câu hỏi mới, nhưng các ngươi vẫn chưa trả lời câu cũ."
text_3="Ồ, thôi cứ đánh nhau lần nữa đi!"

[dia_bosssecretwin1]
dialog_list=H,-Dec,-Lim,-Fin,-Blin;
dialog_place=1,4,0,3,2;
text_0="Hắn làm lại rồi!"
text_1="Ừ, chúng ta có giải pháp."
text_2="Này, không công bằng, các ngươi không thể cứ--"
text_3=")"
text_4="))"

[dia_camp_bld2_1]
dialog_list=H,-COOK;
dialog_place=1,1,1,1;
text_0="Chúc mừng, anh hùng! Những cái vạc mới này sẽ làm cuộc sống tốt hơn không chỉ cho anh, mà cho cả trại."
text_1="Để ăn mừng, anh có thể ghi lại một công thức mới:"
text_2="Nạo bốn củ khoai tây và nửa khối phô mai, trộn với một nồi kem chua, rồi nướng một giờ."
text_3="Chỉ có trứng chiên là dễ và ngon hơn món này."

[dia_camp_bld2_2]
dialog_list=H,-COOK;
dialog_place=1,1,1;
text_0="Nhà bếp của tôi ngày càng tốt hơn. Đây là công thức mới cho anh:"
text_1="Cắt gà thành khối, rồi xào với nước tương và hai thìa mật ong."
text_2="Tôi thường thêm hạt mè, nhưng thế thì gần với ẩm thực cao cấp rồi."

[dia_camp_bld2_3]
dialog_list=H,-COOK;
dialog_place=1,1,1,1,1,1;
text_0="Ừm. Tôi không ngờ cái lều khiêm tốn của mình lại phát triển thế này. Thu hút quá nhiều sự chú ý khiến tôi hơi ngại."
text_1="Vì điều đó, tôi sẽ kể anh công thức đặc trưng của tôi. Nó khó và nguy hiểm... nhiều đầu bếp đã buông dao khi cố làm chủ nó."
text_2="Đun sôi nước."
text_3="Thả sủi cảo thịt vào."
text_4="Khi chúng nổi lên, là lúc dọn ra."
text_5="Đi đi, và dùng kiến thức này vì điều thiện lớn lao."

[dia_camp_bld16_2]
dialog_list=H,-GRKEEP;
dialog_place=1,1;
text_0="Ngươi đứng dậy và đi. Nhưng ngươi khập khiễng. Không tốt.#Người dân địa phương nói tôi cách ngừng khập khiễng nhiều thế."
text_1="Giờ sẽ tốt hơn, tin tôi đi."

[dia_camp_bld16_3]
dialog_list=H,-GRKEEP;
dialog_place=1,1;
text_0="Đây là mộ. Một mộ đặc biệt. Một pháp sư nằm đây. Nhưng hắn đã đi.#Tự đi, không cần tôi giúp."
text_1="Hắn để lại một cuốn sách. Có thể hữu ích."

[dia_camp_bld16_4]
dialog_list=H,-GRKEEP;
dialog_place=1,1,1;
text_0="Tôi chưa từng có tham vọng. Nên tôi không nghĩ mình có thể đạt được kỹ năng thế này. Có vẻ sự quan tâm chân thành dành cho người khác thực sự có thể thay đổi một người."
text_1="..."
text_2="Cảm ơn anh, anh hùng. Xin lỗi vì bài nói dài."

[dia_camp_bld20_n1]
dialog_list=H,-SOLD;
dialog_place=1,1,1;
text_0="Làm tốt lắm! Nhiều tháp hơn nghĩa là nhiều lính hơn."
text_1="Nhiều lính hơn nghĩa là nhiều tên hơn!"
text_2="Nhiều tên hơn... Nghĩa là nhiều tên hơn!"

[dia_camp_bld20_1]
dialog_list=H,-SOLD;
dialog_place=1,1;
text_0="Cái tháp nhỏ này sẽ cho chúng ta thấy quái vật từ xa trại."
text_1="Nhưng đừng lo, lũ thú đó không dọa được người của tôi đâu!"

[dia_camp_bld20_2]
dialog_list=H,-SOLD;
dialog_place=1,1;
text_0="Tốt lắm, tốt lắm. Rất chắc chắn.#Tháp trông còn đẹp hơn trước."
text_1="Tôi sẽ lập kế hoạch huấn luyện mới cho lính gác để anh ta không làm hỏng ấn tượng tốt."

[dia_camp_bld20_3]
dialog_list=H,-SOLD;
dialog_place=1,1,1;
text_0="Đôi khi tôi tự canh gác.#Nó rèn luyện tinh thần, và nhắc tôi cách chĩa nỏ đúng hướng!"
text_1="Trong các chuyến thám hiểm của anh, chúng tôi thấy bóng tối rút lui và thế giới vĩ đại hiện ra."
text_2="Hy vọng một ngày tôi có thể tham gia cuộc tấn công của anh."

[dia_camp_bld20_4]
dialog_list=H,-SOLD;
dialog_place=1,1;
text_0="Treo mục tiêu mới! Kéo dây cung nhanh hơn! Có vai không? Vậy thì dùng sức vào!"
text_1="Chúng tôi đang huấn luyện, như anh thấy.#Đóng góp của anh sẽ không phí."

[dia_camp_bld20_5]
dialog_list=H,-SOLD;
dialog_place=1,1,1;
text_0="Cấu trúc tuyệt vời!#Tầm nhìn chưa từng có, leo dễ hơn bao giờ hết, và khe bắn dường như dẫn đường tên hoàn hảo!"
text_1="N	ghe như tôi đang tự rao bán nó cho mình ấy nhỉ."
text_2="Đã lâu rồi tôi mới gọi được thứ gì đó là cơ sở quân sự đúng nghĩa. Cảm ơn."



[dia_camp_bld3_1]
dialog_list=H,-HEAL;
dialog_place=1,1,0,1;
text_0="Giờ chỗ này rộng rãi hơn nhiều.#Để bày tỏ lòng biết ơn, tôi sẽ kể anh một công thức chữa lành đặc biệt:#15 quả chanh, 2 thìa mật ong, 3 tép tỏi, và 10 bông lúa mì."
text_1="Ném hết vào nồi nước và để ngấm một chút. Thuốc tốt nhất cho đau khớp!"
text_2="..."
text_3="Đừng nhìn tôi kiểu đó. 15 năm nữa hoặc lâu hơn anh sẽ cảm ơn tôi đấy."

[dia_camp_bld3_2]
dialog_list=H,-HEAL;
dialog_place=1,1;
text_0="Nhiều lọ hơn nghĩa là nhiều thuốc hơn!"
text_1="Mỗi ngụm tăng cơ hội anh về nguyên vẹn. Và tất nhiên mang thêm nguyên liệu về nhé."

[dia_camp_bld3_3]
dialog_list=H,-HEAL;
dialog_place=1,0,1,1,1;
text_0="Anh có biết thảo dược chữa lành không phải lúc nào cũng chữa lành không?"
text_1="Ừ, đôi khi thuốc của cô chẳng giúp tôi gì cả."
text_2="Tôi không nói cái đó.#Với liều lượng đúng, anh có thể biến thuốc thành độc."
text_3="Đó chính là tính hai mặt của sự sống. Thứ anh coi là ác cũng có thể tốt từ góc nhìn khác."
text_4="Nhưng đừng lo.#Không phải anh sắp đối mặt với những tình thế tiến thoái lưỡng nan như vậy đâu, đúng không?"

[dia_camp_bld3_4]
dialog_list=H,-HEAL;
dialog_place=1,0,1,1;
text_0="Nghề nghiệp chúng ta giống nhau lắm, anh biết không."
text_1="Không chắc. Tôi không nghĩ lưỡi kiếm của tôi từng chữa lành ai."
text_2="Thảo dược của tôi chữa vết thương và đau nhức, nhưng hành động của anh chữa lành chính thế giới."
text_3="Cuộc hành trình của anh khôi phục dòng chảy sự sống.#Dù anh phải giết chóc trên đường đi."

[dia_camp_bld18_1]
dialog_list=H,-SOLD;
dialog_place=1,1,1;
text_0="Gì vậy, anh mệt sau vài vòng quanh trại thôi à?!"
text_1="Thôi nào.#Thất bại không đáng xấu hổ. Nhưng không cố gắng cải thiện mới đáng xấu hổ."
text_2="Vậy chạy thêm một vòng nữa đi! Ngay bây giờ! Và đừng dừng cho đến khi chân anh khuỵu xuống!"

[dia_camp_bld18_2]
dialog_list=H,-SOLD;
dialog_place=1,0,1,1;
text_0="Tốt. Giờ tôi bắt đầu thấy anh đang đấu kiếm chứ không phải chặt củi."
text_1="^Chặt củi^ đến giờ vẫn hiệu quả với tôi lắm."
text_2="Và khi nó không còn hiệu quả thì anh sẽ than vãn với ai? Luôn nghĩ trước một bước."
text_3="Vậy đừng nói thẳng thừng thế...#Biết gì không? Chúng ta ôn lại vũ khí cùn đi..."

[dia_camp_bld18_3]
dialog_list=H,-SOLD;
dialog_place=1,0,1;
text_0="Tốt, tốt. Còn hai mươi lần nữa là kết thúc buổi huấn luyện.#Anh đang vượt tiến độ đấy, anh hùng!"
text_1="Chúng ta có lịch trình á!? Tôi tưởng chỉ huấn luyện đến khi tôi sắp chết lịm."
text_2="Ha-ha! Đùa hay đấy!#Có lịch trình, nhưng thường anh bất tỉnh khi tôi nói về nó."

[dia_camp_bld18_4]
dialog_list=H,-SOLD;
dialog_place=1,1,1,1;
text_0="Tôi ấn tượng đấy. Ngay cả mấy máy tập mới này cũng không phải đối thủ của anh."
text_1="Nhớ nhé, nếu anh thả lỏng dù chỉ chút, anh sẽ mất hết những gì đã vất vả đạt được."
text_2="Vậy tôi sẽ đợi anh sau chuyến thám hiểm tiếp theo."
text_3="Và mang gì đó để pha trà nhé."

[dia_camp_bld5_1]
dialog_list=H,-YOTA;
dialog_place=1,0,1,0;
text_0="Anh không tưởng tượng nổi mọi người vui thế nào.#Hôm qua tường nhà còn làm bằng bùn, giờ họ sống trong nhà thật sự."
text_1="Giờ tôi có thể tự xưng là Thị trưởng chưa?"
text_2="Bình tĩnh nào. Chúng ta xử lý được tận thế, nhưng không xử lý nổi chính trị gia đâu."
text_3="..."

[dia_camp_bld5_2]
dialog_list=H,-YOTA;
dialog_place=1,1,0,1,0;
text_0="Đó là dinh thự thật sự.#Mới đây chúng tôi còn không dám mơ đến thứ như thế này, giờ chúng tôi sống tốt và xua tan nỗi buồn."
text_1="Anh biết không, anh nên nói chuyện với mọi người thường xuyên hơn.#Không thì người mang lại sự ổn định cho họ có thể trở thành hình ảnh mơ hồ. Anh hùng luôn đi làm nhiệm vụ mà họ chẳng biết gì."
text_2="Nhưng cô nhớ những chiến công anh hùng của tôi chứ?"
text_3="Chiến công nào?"
text_4="...."

[dia_camp_bld5_3]
dialog_list=H,-YOTA;
dialog_place=1,0,1,0,1,0,1;
text_0="Anh có từng nghĩ khi mọi chuyện kết thúc sẽ xây cho mình một dinh thự thế này không? Để sống cuộc sống bình thường?"
text_1="Còn xa quá.#Tôi vẫn chưa biết cách ghép thế giới lại, và không chắc mình có làm được không."
text_2="Anh đã xây dựng khu định cư thế này cho mọi người. Chỉ riêng điều đó đã là phép màu.#Mọi người trong trại tin anh có thể cứu thế giới."
text_3="Kể cả cô?"
text_4="Kể cả tôi."
text_5="..."
text_6="Tôi nói thật lòng. Lần này không đùa đâu."

[dia_camp_bld22_1]
dialog_list=H,-SCIENT;
dialog_place=1,1,1;
text_0="A, một ngôi đền kiến thức thực thụ. Ngôi đền tốt nhất."
text_1="Tiếp thu kiến thức mới, nhồi nhét và rèn luyện trí nhớ.#Ừ thì ít nhất là trí nhớ cơ bắp..."
text_2="Tôi thấy tiếc cho khoa học địa lý lắm. Giờ anh có thể học hết chỉ trong vài giờ."

[dia_camp_bld4_1]
dialog_list=H,-SMITH;
dialog_place=1,1,1;
text_0="Lò của tôi bị nguyền rủa! Tôi từng chỉ là cậu bé trên boong dưới... giờ tôi là thuyền trưởng thực thụ của chiến hạm thợ rèn!"
text_1="Yar-har-har! Giờ đến lượt tôi giữ lò này tránh gió.#Anh sẽ nhận được nhiều hàng từ cảng lửa của tôi, tôi thề bằng cái kìm của mình!"
text_2="Từ giờ, khoang hàng của anh sẽ đầy vũ khí mỗi khi bắt đầu chuyến thám hiểm mới!"

[dia_camp_bld4_2]
dialog_list=H,-SMITH;
dialog_place=1,1;
text_0="Yar-har-har! Thùng luyện kim đẹp quá! Thêm than vào! Mảnh kim loại đi!"
text_1="Này nhóc, cậu biết bí mật của giáp chắc chắn không? Là cơ thể chắc chắn bên dưới! Ha-har!#Tôi có thể làm mọi thứ chắc chắn hơn. Thậm chí áo sơ mi hay tất, tùy cậu thích."
text_2="Cậu sẽ đi xa dưới những cánh buồm này. Không bão nào cản được. Và cậu biết tại sao? Vì bão sẽ ở phe cậu, nhóc!"



