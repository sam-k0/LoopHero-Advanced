cmp1_0_2="Đống lửa trại thông thường. Ấm áp và dễ chịu. Quái vật tránh xa nó, nên đây là nơi nghỉ ngơi tốt giữa các chuyến đi. Đây cũng là trung tâm trại và điểm khởi đầu phiêu lưu của bạn."
cmp1_0_3="• Anh hùng hồi @% HP tối đa khi vào ô lửa trại."
cmp2_0_1="Nhà bếp dã chiến"
cmp2_0_2="Nơi rất quan trọng cho mọi trại. Nếu mũi bạn không lừa, có đồ ăn ngon ở đây."
cmp2_0_3="• +10% sức mạnh hồi máu của lửa trại.#• Mở khóa lá bài ^Lùm máu^."
cmp2_1_1="Căng tin"
cmp2_1_2="Nơi rất quan trọng cho mọi trại. Mùi súp thoang thoảng từ đây."
cmp2_1_3="• +18% sức mạnh hồi máu của lửa trại.#• Mở khóa lá bài ^Lùm máu^."
cmp2_2_1="Quán ăn"
cmp2_2_2="Nơi rất quan trọng cho mọi trại. Bạn được chào đón bởi hương thơm cay nồng khi tiếp cận."
cmp2_2_3="• +24% sức mạnh hồi máu lửa trại.#• Anh hùng có thể nghỉ thêm ở đây trước khi đấu boss.#• Mở khóa lá bài ^Lùm máu^."
cmp2_3_1="Quán rượu"
cmp2_3_2="Nơi rất quan trọng cho mọi trại. Bạn có thể nếm vị món ngon tuyệt vời từ xa."
cmp2_3_3="• +40% sức mạnh hồi máu lửa trại.#• Anh hùng có thể nghỉ thêm ở đây trước khi đấu boss.#• Mở khóa lá bài ^Lùm máu^."
cmp3_0_1="Túi thảo dược sư"
cmp3_0_2="Bàn tay thảo dược sư luôn nhớ cách trộn thảo dược khô và pha thuốc hồi máu."
cmp3_0_3="• Thuốc hồi 4% hp tối đa.#• Bạn có thể mang tối đa 3 thuốc; 2 thuốc được nạp lại ở trại.#• Mở khóa lá bài ^Đầm lầy^."
cmp3_1_1="Túi người chữa lành"
cmp3_1_2="Người chữa lành biết công thức nhiều thuốc hiệu quả. Nhưng vườn cô ấy chỉ có nguyên liệu cho một số loại."
cmp3_1_3="• Hồi 6% hp tối đa.#• Mang tối đa 5 thuốc; 2 thuốc nạp lại ở trại.#• Mở khóa lá bài ^Đầm lầy^."
cmp3_2_1="Túi người làm thuốc"
cmp3_2_2="Sử dụng kiến thức pha chế bí ẩn, người làm thuốc có thể pha thuốc hồi máu khá tốt."
cmp3_2_3="• Thuốc giờ hồi 7% HP tối đa.#• Tối đa 6 thuốc; mỗi lần thăm Lửa trại nạp 3 thuốc.#• Mở khóa lá bài ^Đầm lầy^.#• Lá bài ^Túi phù thủy^ có thể xuất hiện trong chuyến thám hiểm."
cmp3_3_1="Túi nhà thuốc"
cmp3_3_2="Trộn thảo dược đúng tỷ lệ, nhà thuốc có thể pha thuốc hồi máu xuất sắc."
cmp3_3_3="• Thuốc giờ hồi 8% HP tối đa.#• Tối đa 6 thuốc; mỗi lần thăm Lửa trại nạp 4 thuốc.#• Mở khóa lá bài ^Đầm lầy^.#• Lá bài ^Túi phù thủy^ có thể xuất hiện trong chuyến thám hiểm."
cmp3_4_1="Túi bác sĩ"
cmp3_4_2="Kiến thức chưng cất và lọc cho phép bác sĩ chế tạo thuốc hồi máu trong suốt, hoàn hảo."
cmp3_4_3="• Thuốc giờ hồi 10% HP tối đa.#• Tối đa 6 thuốc; mỗi lần thăm Lửa trại nạp 4 thuốc.#• Mở khóa lá bài ^Đầm lầy^.#• Lá bài ^Túi phù thủy^ có thể xuất hiện trong chuyến thám hiểm."
cmp4_0_1="Lò rèn"
cmp4_0_2="Luôn có việc cho thợ rèn, tận thế hay không."
cmp4_0_3="• Cung cấp trang bị Chiến binh cơ bản đầu mỗi chuyến thám hiểm.#• Mở khóa khả năng ^Chế tạo^ công cụ cho trại nếu có Kho cung cấp."
cmp4_1_1="Lò rèn tử tế"
cmp4_1_2="Công cụ tốt hơn cho phép thợ rèn chế tạo thứ gì đó tinh xảo hơn khiên thô."
cmp4_1_3="• Cung cấp trang bị lớp hiện tại cơ bản đầu mỗi chuyến thám hiểm.#• Mở khóa khả năng ^Chế tạo^ công cụ cho trại nếu có Kho cung cấp.#• Mở khóa lá bài ^Lò rèn thợ rèn^."
cmp5_0_1="Túi đất"
cmp5_0_2="Túi lều làm từ que và bùn. Nhà một người. Mỗi cư dân đưa bạn gần chiến thắng hơn. Xây thêm nhà!"
cmp5_0_3="• Bạn có thể cho cư dân đồ nội thất hoặc thức ăn để lưu trữ."
cmp5_1_1="Lều"
cmp5_1_2="Lều nhỏ làm từ lá, đá, cành. Nhà hai người. Mỗi cư dân đưa bạn gần chiến thắng hơn. Xây thêm nhà!"
cmp5_1_3="• Bạn có thể cho cư dân một món nội thất, công cụ, hoặc thức ăn để lưu trữ."
cmp5_2_1="Nhà nhỏ"
cmp5_2_2="Nhà đơn giản làm từ gỗ, đá, rơm. Nhà ba người. Mỗi cư dân đưa bạn gần chiến thắng hơn. Xây thêm nhà!"
cmp5_2_3="• Bạn có thể cho cư dân hai món nội thất, công cụ, thức ăn, hoặc trang sức để lưu trữ."
cmp5_3_1="Nhà"
cmp5_3_2="Nhà xây tốt từ gạch, ngói, đá phiến. Nhà bốn người. Mỗi cư dân đưa bạn gần chiến thắng hơn. Xây thêm nhà!"
cmp5_3_3="• Bạn có thể cho cư dân hai món nội thất, công cụ, thức ăn, hoặc trang sức để lưu trữ."
cmp6_0_1="Kho cung cấp"
cmp6_0_2="Người định giá sẽ vui lòng nhận dạng mọi thứ lạ bạn tìm trên đường, và chuyển cho người cần nhất."
cmp6_0_3="• Mở khóa tính năng ^Cung cấp^.#• Từ giờ bạn sẽ tìm thấy vật phẩm cung cấp hữu ích cho dân trại.#• Mở khóa khả năng ^Chế tạo^ vật phẩm cung cấp nếu có tòa nhà cần thiết.#• Mở khóa lá bài ^Di tích^."
cmp7_0_1="Người đốn củi"
cmp7_0_2="Người đốn củi u ám nhưng lành nghề thích cây và rìu hơn."
cmp7_0_3="• Sau chuyến thám hiểm, cho bạn 1 cành ổn định cho mỗi loop hoàn thành, nhưng không quá số ô quanh túi người đốn củi.#• Mở khóa khả năng ^chế tạo^ nội thất nếu có kho cung cấp."
