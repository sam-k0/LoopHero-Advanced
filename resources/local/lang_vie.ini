[dia_enemywin23]
dialog_list=H,-EMPTY;
dialog_place=0,0;
text_0="Chúng từ đâu ra vậy? Đại dương ở rất xa đây. Thật ra giờ nó thậm chí không còn tồn tại.#Thế giới mới sẽ tốt hơn nếu không có chúng."
