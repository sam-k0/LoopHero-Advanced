text_7="Tâm trí ngươi dễ bị lừa.#Nhưng ngươi không lừa được cơn đói của ta."
text_8="Nó đòi hỏi được lấp đầy.#Mỗi ngụm, mỗi giọt máu sẽ đi để thỏa mãn nó."
