text_11="Vậy nên hãy biết ơn công sức vất vả của ta và cứ để ta hút cạn máu ngươi đi!"

[dia_enemywin8]
dialog_list=H,-EMPTY;
dialog_place=0,0,0;
text_0="Ma cà rồng từng sở hữu đất đai của chúng tôi, họ giữ hòa bình, và giúp các khu định cư thịnh vượng."
text_1="Nhưng giờ thì không được rồi. Giờ họ chỉ là bóng mờ nhợt nhạt của chính mình trước đây, cả về thể chất lẫn tinh thần. Hình như máu của sinh vật khác không duy trì được họ."
