text_3="Thực ra nghĩ lại thì tôi có thể hại rất nhiều người...#Thôi kệ. Tôi đang cố cứu thế giới này và tôi cần giúp đỡ."
text_4="Ồ thật sao? Và cậu định cứu thế giới thế nào? Bằng cách làm sống lại xác người thân của chúng tôi từ dưới đất à?#Có lẽ cậu có thể hồi sinh người chết, nhưng không phải mong muốn giúp đỡ cậu."
text_5="Tất cả xác sống này thật ghê tởm. Đó là bệnh dịch phải bị tiêu diệt. Và kẻ lan truyền nó nên chết đầu tiên."
