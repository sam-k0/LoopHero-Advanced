[dia_enemy47]
dialog_list=H,-BAND;
dialog_place=1,0,1,1,1,0,0,1;
text_0="Này! Ta không nhớ ngươi. Ngươi không trông như người địa phương."
text_1="Vì ta không phải."
text_2="Ta thấy rồi. Và ngươi nghĩ có thể lang thang ở đây mà không hậu quả à?"
text_3="Thời buổi khó khăn, ngươi biết đấy. Không gì để cắn, không gì để uống. VÀ chúng ta còn phải đối phó với kẻ lạ mặt không thương xót cho sự nghèo khổ của chúng ta..."
text_4="Gì? Nghĩ mình hơn chúng ta à?!"
text_5="...#Không."
text_6="Ta đoán đúng à? Đây là câu trả lời đúng?#Vì ta có cảm giác đây là trường hợp câu trả lời của ta chẳng ảnh hưởng gì đến chuyện sắp xảy ra."
