[dia_enemywin47]
dialog_list=H,-EMPTY;
dialog_place=0,0;
text_0="Nghĩ lại thì kẻ giết người và kẻ trộm cũng là phần của thế giới này.#Nếu sứ mệnh của ta là đưa mọi thứ về bình thường, ta có nên vui khi chúng xuất hiện lại không?"
text_1="Mặt khác, ghê tởm giết chóc và trộm cắp cũng là phần của thế giới này, nên chắc ta không nợ ai phải vui vì điều đó."

[dia_enemy48]
dialog_list=H,-SAND;
dialog_place=1,0,1,1,0,1,1,1,0;
text_0="Ngươi!"
text_1="Vậy là nó biết nói! Ngươi là sinh vật gì vậy?"
text_2="Ban đầu ta từng giống ngươi. Nhưng rồi cát lấy ta. Giờ ta chỉ là nắm hạt thạch anh gắn kết bởi ma thuật nguyên thủy.#Ta có kiến thức. Và quan trọng hơn, cái nhìn thấu đáo."
text_3="Chúng ta không ổn định, thoáng qua, và vùng đất này cũng vậy. Vô hình hơn cả cát chuyển động. Ngươi là kẻ ít ảo tưởng nhất trong chúng ta.#Chúng ta cần sự giúp đỡ của ngươi."
text_4="Cuối cùng! Ta đã chờ nghe điều này. Không ai dường như nhận ra chuyện gì đang xảy ra. Mọi người chỉ giả vờ như mọi thứ luôn thế này!#Ta thật sự muốn giúp ai đó."
text_5="...Chúng ta nói về hai chuyện khác nhau. Ngươi là sự tồn tại cố định. Cát và ma thuật có thể làm nhiều, nhưng chúng ta cần tồn tại đủ lâu. Chúng ta vừa thành hình đã tan biến lại."
text_6="Ta muốn ngươi theo ta xuống con đường của sức nóng và mặt trời. Ngươi sẽ trở thành một trong chúng ta – và cơ hội mới cho Sa mạc.#Một lớp cát tồn tại, sống động và rộng lớn. Chúng ta sẽ lấp đầy khoảng trống lạnh lẽo này đến tràn."
text_7="Thậm chí tràn quá mức."
text_8="Ngươi muốn ta thành cát? Không đời nào.#Chúng ta rồi cũng tan rã thôi, chắc chắn, nhưng ta không đi dễ dàng thế. Và giờ ta sẽ kháng cự."

[dia_enemywin48]
dialog_list=H,-SAND;
dialog_place=1,0;
text_0="Ta cũng từng kháng cự khi còn sống. Ta hối tiếc khi tái sinh.#Ngươi rồi cũng sẽ thế thôi."
text_1="Để rồi xem."

[dia_enemy49]
dialog_list=H,-WITCH;
dialog_place=1,0,1,1,0,1,1;
text_0="Nhìn kìa! Thật là một mẫu vật thú vị.#Ngươi mang gì cho ta? Chảy máu? Xương gãy? Tổn thương mô mềm nghiêm trọng?"
text_1="Tùy ngươi đứng ở đâu. Ta không làm hại ai không làm hại ta."
text_2="Ngươi nói không làm hại ai à?#Nhưng đó chính là điều ta muốn ngươi làm. Cứ đi, rạch thịt kẻ thù ngươi bằng càng nhiều vết thương càng tốt."
text_3="Sự sống mong manh. Dễ gãy. Tìm cách mới để vá và chữa lành... Đó là đam mê của ta.#Ta không phải kẻ thù của ngươi, ôi không. Kẻ thù của ta là chính Cái Chết."
text_4="Ta tôn trọng điều đó. Có một khu định cư nhỏ ta biết sẽ rất vui nhận sự giúp đỡ của ngươi."
text_5="Ngươi muốn ta chữa đau bụng và phồng rộp tay à? Cảm ơn, nhưng ta từ chối.#Thực hành thảm hại như vậy không làm ta thành bậc thầy chữa lành. Ồ, nhưng tưởng tượng xem ta có thể cứu bao nhiêu mạng khi cuối cùng làm chủ nghề của mình!"
text_6="Giờ làm ơn, tử tế giết hết mọi người ở đây đi. Ta cần vật liệu thực hành."

[dia_enemywin49]
dialog_list=H,-WITCH;
dialog_place=1,0,1,1;
text_0="Thật kém hiệu quả. Thuốc này quá yếu.#Khốn kiếp! Ta đã chắc chắn phương pháp mới có thể đánh bại Cái Chết...#Thật đáng tiếc."
text_1="Đáng tiếc thật.#Ta thích đam mê trở thành người chữa lành giỏi hơn của ngươi, nhưng rồi ngươi đặt mạng sống ta vào nguy hiểm. Ngươi quá nguy hiểm."
text_2="Chết tiệt. Chưa chữa được chứng bi quan mãn tính nghiêm trọng thế này.#Ngươi không nên phán xét người khác quá nhanh."
text_3="Ta cũng có thứ cho ngươi. Ta nghĩ ngươi có thể dùng một lọ thuốc hồi máu tiêu chuẩn, phải không?#Còn ta, ta tin ngay cả thứ nhạt nhẽo thế này cũng có thể cải thiện. Lần sau ta nên thử nguyên liệu mới, hoặc thay đổi liều lượng."

