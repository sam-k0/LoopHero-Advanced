text_3="Sao ngươi...? Nhưng tại sao ^không^?"
text_4="Chúng ta thấy xa. Chúng ta thấy sâu bên trong. Đã lâu rồi bầu trời chỉ là khoảng trống, nhưng điều đó không ngăn chúng ta nhìn."
text_5="Việc cứu thế giới của ngươi là một chiều và ngây thơ. Mỗi người thấy cách cứu thế giới riêng. Đó là lý do không ai sẽ tham gia cùng ngươi."
text_6="Được rồi. Ta không hoàn toàn hiểu, nhưng nói ta nghe phiên bản của ngươi đi.#Ngươi thấy cứu thế giới thế nào?"
text_7="Bằng con cháu và họ hàng của ta. Mong chúng sống và mạnh mẽ. Mong chúng tham gia vòng tuần hoàn sống chết.#Đó là sự sống. Đó là thế giới."
text_8="Ta sẽ giết ngươi và cho thịt ngươi nuôi những đứa con đang đói của ta. Và sự sống sẽ tiếp diễn.#Còn lưỡi kiếm của ngươi kéo dài được bao nhiêu mạng khi ngươi giết hết lần này đến lần khác?"
text_9="Chỉ một."
text_10="Ta không muốn ngươi chết, và ta không muốn con cái ngươi chết đói.#Làm ơn, hãy cố nhìn nhận lý lẽ."
text_11="Nếu sứ mệnh của ta thành công, lũ harpy có thể có cả bầu trời và mọi khu săn bắn chúng cần."
text_12="Ta không thể nuôi con bằng những lời đẹp đẽ của ngươi.#Tạm biệt."

[dia_enemywin37]
