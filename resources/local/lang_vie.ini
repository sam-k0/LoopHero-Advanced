[furniture]
frn0_1="Kệ giả kim sư"
frn0_2="Kệ có ô cho lọ và thuốc thử, nhãn chai, và đồ bí ẩn khác của chủ cũ."
frn0_3="+@ số thuốc tối đa$."
frn1_1="Ghế Bá tước"
frn1_2="Dù chủ cũ là ma cà rồng, ghế này trang trí số lượng cọc gỗ đáng ngạc nhiên. Vẫn còn dấu hào quang hút sự sống."
frn1_3="+@% hút máu nếu anh hùng đã có$."
frn2_1="Tủ cổ"
frn2_2="Tủ cổ đẹp. Nhân chứng thầm lặng của nhiều thế hệ thời trang."
frn2_3="Hồi @ HP mỗi khi trang bị vật phẩm mới$."
frn3_1="Đinh giày"
frn3_2="Nhúm đinh nhỏ để sửa đế và gót. Nên bọc vải nếu muốn mang theo."
frn3_3="Kẻ tấn công nhận @ sát thương sau mỗi đòn$."
frn4_1="Liềm thảo dược sư"
frn4_2="Hữu ích khi cần hái thảo dược quý cẩn thận. Mọi thảo dược sư đều trân trọng sự tiện lợi và mùi kim loại bạc hà từ lưỡi cong."
frn4_3="+@% HP tối đa hồi từ thuốc$."
frn5_1="Rìu lâm nhân"
frn5_2="Cũ nhưng vẫn đáng tin và chắc chắn. Khả năng chặt gỗ đi kèm chai tay."
frn5_3="Mỗi lần anh hùng nhận cành ổn định, có @% cơ hội nhận thêm$."
frn6_1="Hạt hỗn hợp"
frn6_2="Giỏ nhỏ các loại hạt. Không hỏng và nuôi tốt. Loại thức ăn tuyệt vời để trữ đông và ăn tối."
frn6_3="+@ HP tối đa cho mỗi điểm phòng thủ anh hùng có$."
frn7_1="Thịt hun khói"
frn7_2="Thịt hun khói ngon luôn là khách quý trên bàn ăn."
frn7_3="Hồi @ HP đầu mỗi ngày$."
frn8_1="Tỏi"
frn8_2="Vị tỏi đặc trưng làm mọi món ngon hơn. Không ai biết sao ma cà rồng không thích tỏi. Có lẽ là cái giá cho sức mạnh phi thường?"
frn8_3="+@ sát thương anh hùng với tất cả ma cà rồng$."
frn9_1="Chân nến đồng"
frn9_2="Chủ yếu là tác phẩm nghệ thuật. Nhưng vẫn hữu ích. Đốt ba nến cùng lúc thật lãng phí, nhưng ai từ chối sự ấm áp của ánh sáng trong thời khắc tối tăm?"
frn9_3="Sát thương anh hùng tăng 5% khi trong phạm vi Đèn đường hoặc Hải đăng$."
frn10_1="Tranh cổ"
frn10_2="Chỉ nhìn tranh này thôi cũng khiến bạn nhớ ai đó. Nhưng vẫn không nhớ là ai. Vải bố. Sơn dầu. Năm và tác giả không rõ."
frn10_3="Tăng sát thương gây cho boss @%$."
frn11_1="Bộ đồ bạc"
frn11_2="Bộ dao nĩa nhỏ làm ăn uống thoải mái hơn. Đồ bạc cần chăm sóc đặc biệt nhưng vẫn tốt khi có. Một số khắc cổ vẫn thấy trên đĩa, nhưng không đọc được."
frn11_3="+@ sát thương anh hùng với tất cả xác sống$."
frn12_1="Giường sồi"
frn12_2="Nặng, chắc, cũ. Ngủ rất thoải mái. Nhưng cẩn thận đừng đánh thức mọi người bằng tiếng kêu to."
frn12_3="+@% HP tối đa anh hùng, nhưng –@% hồi từ Lửa trại$."
frn13_1="Bàn ăn"
frn13_2="Dù tên thế, bạn cũng có thể ăn sáng và trưa trên đó. Nên dọn sau mỗi bữa. Hoặc ít nhất cuối ngày."
frn13_3="+[@*loop] hồi thêm khi đi qua Lửa trại."
frn14_1="Kệ cổ"
frn14_2="Nội dung được bảo vệ khỏi bụi và ẩm bằng lớp kính, nhưng vẫn có thể nhìn. Đồ nội thất này từng có ngày tốt đẹp hơn, nên đừng dùng quá thường."
frn14_3="+@ HP tối đa cho mỗi tài nguyên nguyên nhận trong chuyến thám hiểm này$."
frn15_1="Liềm nông dân"
frn15_2="Hơi gỉ, nhưng đá mài sửa được. Ngoài ra là công cụ tốt để thu hoạch lúa mì hoặc gom rơm."
frn15_3="@% cơ hội nhận 1 Khẩu phần khi đi qua Cánh đồng lúa mì. @% sát thương anh hùng trở thành sát thương cho tất cả$."
frn16_1="Dao lột da"
frn16_2="Dao làm việc với da thú. Không mới nhưng vẫn hữu ích trong tay khéo."
frn16_3="@% cơ hội nhận 1 Khẩu phần sau khi giết Ratwolf. +@ sát thương anh hùng với tất cả Ratwolf$."
frn17_1="Búa thợ rèn"
frn17_2="Công cụ này vô địch tạo tia lửa. Người bạn trung thành của mọi thợ rèn. Tôn trọng công việc chăm chỉ và bàn tay vững."
frn17_3="+@ phòng thủ$."
frn18_1="Bánh mì"
frn18_2="Hơi cháy một mặt, nhưng vẫn tốt. Hình ảnh đáng hoan nghênh trên bàn ăn của giàu nghèo."
frn18_3="+@ HP tối đa$."
frn19_1="Thịt hầm"
frn19_2="Bát hầm nóng là cách tốt nhất giữ ấm đêm đông lạnh. Tất nhiên vẫn ngon mọi lúc khác. Thêm thảo dược khô."
frn19_3="Nhận thêm @ HP khi đi qua làng$."
frn20_1="Phô mai"
frn20_2="Loại thức ăn ngon và trữ lâu tiện lợi. Đừng buồn nếu không có rượu. Phô mai ngon riêng lẻ."
frn20_3="Hồi @ HP sau khi giết kẻ thù$."
frn21_1="Mặt dây bạc"
frn21_2="Trang sức cổ đẹp. Mặt dây là huy hiệu nhỏ hình dơi bám vào dây bạc bằng móng nhỏ."
frn21_3="- @ sát thương từ tất cả ma cà rồng$."
frn22_1="Sách hiếm"
frn22_2="Thời gian tàn nhẫn với cuốn sách này và không đọc được nữa. Mảnh văn bản nhỏ kể về thời và nơi đã quên lâu, nhưng không đủ để có ký ức hay kiến thức hoàn chỉnh."
frn22_3="+@ phòng thủ cho mỗi lá bài trong tay người chơi$."
frn23_1="Gương tinh xảo"
frn23_2="Hơi mờ nhưng vẫn tốt hơn mặt hồ hay tấm kim loại. Khung trang trí tia sét nhỏ."
frn23_3="@% cơ hội chuyển sét Đền bão hoặc đòn Sát thương chuẩn khác sang kẻ thù ngẫu nhiên$."
frn24_1="Cuốc thợ mỏ"
frn24_2="Vũ khí tốt nhất nếu đấu với núi. Bất kỳ tảng đá nào khác cũng không có cơ hội."
frn24_3="+@ Đá cuội được bảo tồn nữa khi đi qua ô Lửa trại$."
frn25_1="Kính thợ kim hoàn"
frn25_2="Nhiều thấu kính phóng đại khác nhau trong khung có tay cầm sơn. Giúp thợ kim hoàn giỏi hơn."
frn25_3="Tăng cơ hội tìm vật phẩm hiếm @%$."
frn26_1="Chảo cũ"
frn26_2="Đồ dùng nhà bếp đơn giản nhưng không thể thay thế. Thường không cần giới thiệu. Vũ khí chết người trong tay bà nội trợ giận dữ."
frn26_3="Hồi thêm @ HP khi anh hùng đi qua ô Lửa trại$."
frn27_1="Dao bếp"
frn27_2="Thường dùng cắt và gọt rau, nhưng cũng nguy hiểm cho ngón tay đầu bếp vụng."
frn27_3="+@% HP cơ bản cho mỗi vật phẩm ^thức ăn^ đặt trong trại$."
frn28_1="Ghế đẩu chắc chắn"
frn28_2="Thoải mái hơn và dễ mang hơn khúc gỗ. Cũng trông đẹp hơn. Có thể giúp với giá cao nếu cần."
frn28_3="+@ hồi mỗi giây nếu anh hùng đã có$."
frn29_1="Rương"
frn29_2="Nắp nặng, nên chỉ mở khi thực sự cần. Có cơ chế khóa đã hỏng lâu."
frn29_3="Giảm phạt tài nguyên khi chết hoặc rút lui @%$."
