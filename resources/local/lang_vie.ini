[tutorial]
tutorial_pc="(Space, click phải, chuyển chế độ)"
tutorial_mob="(Nút chuyển ở trên cùng hoặc bên phải màn hình)"
tutorial_joy="(%btn2)"
tutorial_1="Để chuyển giữa chế độ ^Phiêu lưu^ (di chuyển trên bản đồ) và ^Lập kế hoạch^ (dừng) nhấn nút chuyển"
tutorial_1_1=", Click phải hoặc Space.##"
tutorial_1_2="Hoặc chỉ cần nhấn nút ở góc dưới bên phải.##"
tutorial_1_3="- Tiếp tục hành trình bằng cách chuyển chế độ trò chơi."
tutorial_1_joy="Để chuyển giữa chế độ ^Phiêu lưu^ (di chuyển trên bản đồ) và ^Lập kế hoạch^ (dừng) nhấn %btn2.##"
tutorial_2="Chú ý thanh tiến độ ngày ở trên cùng màn hình. Kẻ thù mới thường xuất hiện cuối ngày.##- Tiếp tục hành trình bằng cách chuyển chế độ trò chơi."
tutorial_3="Di chuyển, chiến đấu và hầu hết hành động khác diễn ra tự động. Người chơi không thể ảnh hưởng trực tiếp.##- Nhấn bất kỳ đâu để tiếp tục."
tutorial_3_joy="Di chuyển, chiến đấu và hầu hết hành động khác diễn ra tự động. Người chơi không thể ảnh hưởng trực tiếp.##- Nhấn %btn1 để tiếp tục."
tutorial_4="Bạn có kho và ô vật phẩm. Bạn biết phải làm gì.##- Trang bị vật phẩm để tiếp tục."
tutorial_4_1="(Giữ %btnZR để chuyển sang chọn vật phẩm và trang bị Kiếm bằng %btn1)"
tutorial_5="Bạn có thể dùng lá bài còn lại sau khi đánh bại kẻ thù để thêm các đối tượng mới vào bản đồ. Đó là mục đích của chế độ ^Lập kế hoạch^.##- Kéo lá bài đến vị trí phù hợp để ^Nhớ^ vùng đất."
tutorial_5_1="(Giữ %btnZL để chuyển sang chọn lá bài và đặt lá bằng Cần trái và %btn1)"
tutorial_6="Tốt.##- Bây giờ tiếp tục hành trình."
tutorial_8="Như bạn có lẽ đã nhận ra, bạn có thể nhận vật phẩm và lá bài mới trong trận.#Một số vật phẩm có tính năng độc đáo, giống hầu hết lá bài.@##- Trang bị vũ khí mới và đặt lá bài mới lên bản đồ để tiếp tục."
tutorial_8_1="Di chuột qua vật phẩm hoặc lá bài để xem thuộc tính."
tutorial_8_2="Click vào vật phẩm hoặc lá bài để xem thuộc tính."
tutorial_8_3="Giữ %btnZR hoặc %btnZL và chọn vật phẩm hoặc lá bài để xem thuộc tính."
tutorial_9="Một số hành động sẽ mang lại tài nguyên cần sau này, nhưng không phải ngay bây giờ. Nhưng điều đó không ngăn bạn xem chúng ngay.##- Tiếp tục hành trình bằng cách chuyển chế độ trò chơi."
tutorial_10="Trò chơi là hành trình trên đường vòng lặp. Chỉ bạn quyết định khi nào anh hùng về trại... Hoặc nanh vuốt kẻ thù, tất nhiên.#Bạn có thể rút lui hầu như bất kỳ lúc nào, nhưng hiệu ứng đặc biệt sẽ cho biết khi nào an toàn hơn.##- Rút lui về trại bằng cách nhấn nút."
tutorial_10_joy="Trò chơi là hành trình trên đường vòng lặp. Chỉ bạn quyết định khi nào anh hùng về trại... Hoặc nanh vuốt kẻ thù, tất nhiên.#Bạn có thể rút lui hầu như bất kỳ lúc nào, nhưng hiệu ứng đặc biệt sẽ cho biết khi nào an toàn hơn.##- Rút lui về trại bằng cách nhấn %btn4"
tutorial_11="Nơi tuyệt vời để lập trại.#Đây là lúc tất cả tài nguyên bạn gom được sẽ hữu ích. Ai ngờ? Bạn vừa đủ gỗ và đá để làm lửa trại! Trùng hợp hay!#Xây lửa trại bằng chức năng xây dựng khi ở trại.##- Nhấn nút Xây dựng, chọn lửa trại, và đặt nó."
tutorial_12="Chúc mừng! Bạn đã vượt qua hướng dẫn phiền phức này.#Bây giờ bạn có thể bắt đầu chuyến thám hiểm đầu tiên... Hoặc không... Tùy bạn.##- Click bất kỳ đâu để hoàn thành hướng dẫn."
