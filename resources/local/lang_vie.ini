text_2="Thợ săn với đôi mắt điên loạn. Hắn từ đâu đến?"
text_3="Tau. Thợ săn không nhà. Hắn từng bảo vệ thế giới của mình, chỉ để sau đó hành quyết nó. Hắn là người bảo vệ đáng tin cậy của hành tinh quê hương. Thiên hà hắn đầy mối đe dọa, vậy mà hắn giữ hành tinh an toàn khỏi tất cả. Bất chấp giá nào."
text_4="Khi ta tiếp cận, tôi nghĩ đó là lần đầu hắn không tìm được cách cứu quê hương. Cuối cùng, ý chí sống của hắn vượt qua nghĩa vụ người bảo vệ."
text_5="Hắn tự tay hủy diệt thế giới mình. Biến nó thành hố đen. Và với điều đó, hắn vào phục vụ ta - bằng cách săn đuổi không thương tiếc mọi thế giới trốn thoát định mệnh, tìm cách ẩn mình khỏi tầm mắt ta."
text_6="Hắn liên tục tự trách mình hèn nhát và phản bội. Thế giới đã chết của hắn, giờ là hố đen, sẽ không bao giờ buông tha hắn."
text_7="Hắn phải chọn giữa làm thợ săn hay nạn nhân.#Và có vẻ hắn đã chọn."

