res3_1="Đá được bảo tồn"
res3_2="Dường như không bị ảnh hưởng bởi lời nguyền Lich và phù hợp xây dựng dù thế giới vô hình."
res4_1="Mảnh kim loại"
res4_2="Những mảnh kim loại nhỏ sống sót qua lời nguyền Lich. Đôi khi đây là tất cả còn lại từ giáp hoặc kiếm bạn chưa nhìn lâu."
res4_3="mảnh kim loại tạo thành một thỏi kim loại ổn định."
res5_1="Kim loại ổn định"
res5_2="Khối kim loại được cứu khỏi bị Lich nuốt. Các mảnh dính lại như bị từ hóa."
res6_1="Khẩu phần"
res6_2="Lượng thức ăn nhỏ. Ngạc nhiên là vẫn thỏa mãn cơn đói. Đây là thứ xa xỉ thực sự bây giờ."
res6_3="khẩu phần tạo thành nguồn cung thực phẩm."
res7_1="Nguồn cung thực phẩm"
res7_2="Gói thức ăn nhỏ tìm thấy trong tàn tích thế giới mới. Khác với phần còn lại của thế giới, cơn đói vẫn tồn tại, và bạn cần mọi cách để chống lại nó."
res8_1="Quả cầu mở rộng"
res8_2="Biểu hiện vật lý của không gian mở rộng dưới dạng quả cầu nhỏ."
res9_1="Quả cầu bất tử"
res9_2="Thường thì cái chết không ổn định. Quả cầu này làm nó ổn định không tồn tại vài giây. Thường đủ để tránh số phận kinh hoàng này."
res10_1="Mảnh ký ức"
res10_2="Tin đồn, thần thoại, và ảo tưởng của ai đó. Mất hàng tuần để hiểu hết. Và hàng năm để quyết định bạn có thực sự cần không."
res10_3="mảnh tạo thành cuốn sách ký ức hoàn chỉnh."
res11_1="Sách ký ức"
res11_2="Chỉ sự thật thực và nhiều chân lý. Nhưng chỉ về một thứ. Và một thời điểm."
res12_1="Thay đổi đáng kể"
res12_2="Đủ để biến sâu thành bướm, hạt thành mầm, giọt nước thành hơi. Cũng sẽ biến chính nó thành thứ khác nếu bạn gom đủ."
res12_3="thay đổi tạo thành biến thái hoàn chỉnh."
res13_1="Biến thái"
res13_2="Khả năng thay đổi và biến hình của thế giới được tách cẩn thận khỏi sự tồn tại, đặt vào quả cầu và phá hủy. May là không không thể đảo ngược."
res14_1="Tàn tích đáng thương"
res14_2="Cuộc đời ai đó sống. Mong muốn tiếp tục sống. Số phận buồn."
res14_3="tàn tích tạo thành quả cầu kiếp sau."
res15_1="Quả cầu kiếp sau"
res15_2="Khả năng chết của mọi sự tồn tại. Bạn có thể thấy kinh khủng, nhưng thế giới không thể tồn tại nếu không có sự mong manh và ngắn ngủi."
res16_1="Mảnh thời gian"
res16_2="Luật thế giới thường dựa trên không gian và thời gian. Nhưng không gian vỡ. Thời gian cũng vậy, như bạn thấy."
res16_3="mảnh tạo thành quả cầu hư vô hoàn chỉnh."
res17_1="Quả cầu hư vô"
res17_2="Khoảng trống đầy tiếng vọng ánh sáng sao xa. Thiếu sao trên trời cho thấy chúng cũng bị lấy khỏi thế giới này."
res18_1="Mảnh chế tác"
res18_2="Phụ kiện tinh xảo, chạm khắc bậc thầy. Mảnh công việc của bàn tay khéo léo."
res18_3="mảnh tạo thành quả cầu chế tác hoàn chỉnh."
res19_1="Quả cầu chế tác"
res19_2="Công việc hoàn hảo. Cuộc đời tìm kiếm sự hoàn mỹ."
res20_1="Sợi sống"
res20_2="Mảnh vải sống, phát triển, thậm chí già đi. Nói chung là chất có cấu trúc rất tò mò."
res20_3="mảnh sợi tạo thành quả cầu tiến hóa hoàn chỉnh."
res21_1="Quả cầu tiến hóa"
res21_2="Nỗ lực cải thiện, thích nghi, sinh tồn. Cuộc chiến vĩnh cửu cho chỗ dưới nắng."
res22_1="Khối vô hình"
res22_2="Khối chất lỏng các yếu tố đồng nhất. Hình ảnh linh hoạt của tính dẻo thụ động."
res22_3="giọt tạo thành quả cầu đoàn kết hoàn chỉnh."
res23_1="Quả cầu đoàn kết"
res23_2="Sự tách rời trở thành toàn vẹn. Cách trở thành hơn tổng các thành phần. Trật tự từ hỗn loạn."
