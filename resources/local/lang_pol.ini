text_3="Dlaczego na drodze nie ma rozwidleń? #Dlaczego w różnych zbrojach wyglądam tak samo?"
text_4="...I jak ja w ogóle mogę coś widzieć, skoro nie ma już słońca?"
text_5="Porozmawiajmy najpierw o słońcu.Widzisz, Licz pozbawia środowisko licznych warunków i praw fizyki, zmuszając je do istnienia tak, jakby wszystko inne nigdy nie istniało."
text_6="Jeśli pozbawimy daną przestrzeń każdego źródła światła, ale w jej obrębie nadal znajdują się jakiekolwiek istoty zdolne do widzenia, to natura istnienia w tej zamkniętej przestrzeni stworzy fałszywe warunki, że tak powiem - w których nie ma światła, ale istoty nadal są w stanie widzieć."
text_7="Dlaczego więc ogień nas nie oślepia?"
text_8="No cóż..."
text_9="E...ta prawda... jest zbyt skomplikowana, aby zwykły śmiertelnik mógł ją zrozumieć. Może więc powinniśmy go po prostu zabić?"
text_10="Tak, zgadzam się."
text_11="To brzmi rozsądnie."

[dia_bosssecretwin0]
dialog_list=H,-Dec,-Lim,-Fin,-Blin;
dialog_place=4,1,3,2,0,3,1,2;
text_0="Hmm... Czy to było w ogóle przewidziane?"
text_1="Zostawiliśmy kilka backdoorów, fair to fair".
text_2="Nie prowadzilibyśmy tej rozmowy, gdyby nie..."
text_3="To nie jest pytanie. Co zamierzamy teraz zrobić?"
text_4="Skoro mowa o pytaniach. Jak sobie przypominam, to rzeczywiście mam ich kilka. A teraz zasłużyłem na odpowiedzi."
text_5="A więc tak to wygląda. Wygląda na to, że nie mamy innego wyjścia."
text_6="Masz rację, trzeba się nauczyć akceptować porażkę..."
text_7="Ale nie musimy się tego uczyć teraz!"

[dia_bosssecret1]
dialog_list=H,-Dec,-Lim,-Fin,-Blin;
dialog_place=1,2,0,4;
text_0="I jeszcze raz pozdrawiam".
text_1="Jakiej prawdy szukasz tym razem?"
text_2="Mam wiele nowych pytań, ale na stare nadal nie odpowiedziałeś."
text_3="Och, zamiast tego urządźmy sobie kolejną walkę!"

[dia_bosssecretwin1]
dialog_list=H,-Dec,-Lim,-Fin,-Blin;
dialog_place=1,4,0,3,2;
text_0="Znowu to zrobił!"
text_1="Cóż, mamy rozwiązanie."
text_2="Hej, to nie fair, nie możecie po prostu..."
text_3=")"
text_4="))"



[dia_camp_bld2_1]
dialog_list=H,-COOK;
dialog_place=1,1,1,1;
text_0="Gratulacje, bohaterze! Te nowe kociołki sprawią, że życie stanie się lepsze nie tylko dla ciebie, ale i dla całego obozu."
text_1="Aby uczcić, możesz zapisać nowy przepis:"
text_2="Zetrzyj na tarce cztery ziemniaki i pół bloku sera, wymieszaj razem z garnkiem kwaśnej śmietany, a następnie zapiekaj przez godzinę."
text_3="Łatwiejsze i smaczniejsze od tego są tylko jajka sadzone."

[dia_camp_bld2_2]
dialog_list=H,-COOK;
dialog_place=1,1,1;
text_0="Moja kuchnia wciąż staje się lepsza. Oto nowy przepis dla Ciebie:"
text_1="Pokrój trochę kurczaka w kostkę, a następnie usmaż go z sosem sojowym i dwiema łyżkami miodu."
text_2="Zwykle dodaję trochę nasion sezamu, ale tutaj to graniczy z pięciogwiazdkowym obiadem"

[dia_camp_bld2_3]
dialog_list=H,-COOK;
dialog_place=1,1,1,1,1,1;
text_0="No cóż. Nigdy nie sądziłem, że mój skromny namiot tak bardzo się rozrośnie. Zwracanie na siebie tak dużej uwagi jest trochę kłopotliwe."
text_1="Za to zdradzę wam mój charakterystyczny przepis. Jest trudny i zdradliwy... wielu kucharzy odłożyło swoje noże próbując go opanować."
text_2="Zagotuj trochę wody."
text_3="Wrzuć kilka pierogów z mięsem."
text_4="Kiedy wypłyną na powierzchnię, czas je podać."
text_5="Idź teraz i wykorzystaj tę wiedzę dla większego dobra".



[dia_camp_bld16_2]
dialog_list=H,-GRKEEP;
dialog_place=1,1;
text_0="Wstajesz i chodzisz. Ale kulejesz. Niedobrze.Miejscowi powiedzieli mi jak przestać tak kuleć."
text_1="Teraz będzie lepiej, zaufaj mi."

[dia_camp_bld16_3]
dialog_list=H,-GRKEEP;
dialog_place=1,1;
text_0="To jest grób. Szczególny. Leżał tu pewien czarodziej. Ale odszedł.#Samodzielnie, bez mojej pomocy."
text_1="Zostawił po sobie książkę. Może się przydać."



[dia_camp_bld16_4]
dialog_list=H,-GRKEEP;
dialog_place=1,1,1;
text_0="Nigdy nie miałem ambicji. Nie sądziłem więc, że będę w stanie osiągnąć taką umiejętność. Wygląda na to, że szczera troska o innych faktycznie potrafi zmienić człowieka."
text_1="..."
text_2="Dziękuję, bohaterze. Przepraszam za długą wypowiedź."



[dia_camp_bld20_n1]
dialog_list=H,-SOLD;
dialog_place=1,1,1;
text_0="Dobra robota! Więcej wież oznacza więcej żołnierzy."
text_1="Więcej żołnierzy oznacza więcej strzał!".
text_2="Więcej strzał... Oznacza więcej strzał!"

[dia_camp_bld20_1]
dialog_list=H,-SOLD;
dialog_place=1,1;
text_0="Ta mała wieża pozwoli nam zobaczyć potwory nawet daleko od obozu".
text_1="Ale nie martw się, te bestie nie przestraszą moich ludzi!".

[dia_camp_bld20_2]
dialog_list=H,-SOLD;
dialog_place=1,1;
text_0="Bardzo dobrze, bardzo dobrze. Całkiem solidna.#Wieża wygląda jeszcze lepiej niż wcześniej."
text_1="Ułożę nowy plan treningowy dla stróża, żeby nie popsuł dobrego wrażenia."

[dia_camp_bld20_3]
dialog_list=H,-SOLD;
dialog_place=1,1,1;
text_0="Czasami sama trzymam wartę.#To wzmacnia ducha i przypomina mi, jak skierować kuszę we właściwym kierunku!".
text_1="Podczas Twoich wypraw możemy zobaczyć jak mrok się cofa i odsłania się wielki świat."
text_2="Mam nadzieję, że pewnego dnia będę mogła dołączyć do twojej walki."

[dia_camp_bld20_4]
dialog_list=H,-SOLD;
dialog_place=1,1;
text_0="Zawieś nowe cele! Naciągnij szybciej tę cięciwę łuku! Czy masz ramiona? To włóż w nie trochę siły z powrotem!"
text_1="Jesteśmy w trakcie treningu, jak widzisz.#Twój wkład nie pójdzie na marne."

[dia_camp_bld20_5]
dialog_list=H,-SOLD;
dialog_place=1,1,1;
text_0="Co za wspaniała struktura!#Widok jest niespotykany, wspinaczka łatwiejsza niż kiedykolwiek, a strzałki wydają się idealnie kierować strzały!".
text_1="Brzmię, jakbym próbował sprzedać to sobie, nieprawdaż."
text_2="Tak dawno nie mogłem nazwać czegoś porządnym obiektem wojskowym. Dziękuję."



[dia_camp_bld3_1]
dialog_list=H,-HEAL;
dialog_place=1,1,0,1;
text_0="Teraz jest tu znacznie więcej miejsca.Aby wyrazić moją wdzięczność, zdradzę ci specjalny przepis na uzdrowienie:#15 cytryn, 2 łyżki miodu, 3 ząbki czosnku i 10 kłosów pszenicy."
text_1="Wrzuć to wszystko do garnka z wodą i niech się trochę zaparzy. Najlepsze lekarstwo na bolące stawy!"
text_2="..."
text_3="Nie patrz tak na mnie. Będziesz mi wdzięczny za jakieś 15 lat."

[dia_camp_bld3_2]
dialog_list=H,-HEAL;
dialog_place=1,1;
text_0="Więcej fiolek oznacza więcej eliksirów!".
text_1="Każdy łyk zwiększa twoje szanse na powrót w jednym kawałku. I przynieś ze sobą jeszcze kilka składników, oczywiście."

[dia_camp_bld3_3]
dialog_list=H,-HEAL;
dialog_place=1,0,1,1,1;
text_0="Czy wiesz, że zioła lecznicze nie zawsze leczą?".
text_1="Tak, czasami twoje mikstury w ogóle mi nie pomagają."
text_2="Nie o tym mówię.#Przy odpowiednim dawkowaniu można zmienić lekarstwo w truciznę."
text_3="Na tym polega dwoistość samego życia. Coś, co ty uważasz za zło, może być również dobre z innego punktu widzenia."
text_4="Ale nie pocieszaj się tym, #to nie tak, że w najbliższym czasie staniesz przed takimi dylematami, prawda?"

[dia_camp_bld3_4]
dialog_list=H,-HEAL;
dialog_place=1,0,1,1;
text_0="Nasze zawody są bardzo podobne, wiesz."
text_1="Nie jestem pewien. Nie sądzę, by moje ostrze kiedykolwiek kogoś uzdrowiło."
text_2="Moje zioła leczą rany i bóle, ale twoje działania uzdrawiają sam świat."
text_3="Twój marsz przywraca przepływ życia.Nawet jeśli musisz zabijać na swojej drodze."



[dia_camp_bld18_1]
dialog_list=H,-SOLD;
dialog_place=1,1,1;
text_0="Co, zmęczyłeś się już po kilku okrążeniach wokół obozu?!".
text_1="Już, już.#Nie ma wstydu w porażce. Ale wstyd jest, gdy nie próbujesz się poprawić."
text_2="Więc, pobiegnij jeszcze raz! Właśnie teraz! I nie zatrzymuj się, dopóki nogi ci nie wysiądą!"

[dia_camp_bld18_2]
dialog_list=H,-SOLD;
dialog_place=1,0,1,1;
text_0="Dobrze. Teraz zaczynam widzieć, że się szermierką zajmujesz, a nie rąbaniem drewna."
text_1="^Rąbanie drewna^ jak na razie całkiem dobrze mi wychodziło."
text_2="A do kogo będziesz się skarżył, gdy przestanie działać? Zawsze myśl o jeden krok do przodu."
text_3="Więc nie mów tak dosadnie...#Wiesz co? Przejdźmy jeszcze raz do tępienia broni..."

[dia_camp_bld18_3]
dialog_list=H,-SOLD;
dialog_place=1,0,1;
text_0="Dobrze, dobrze. Jeszcze dwadzieścia razy i sesja treningowa się skończy.#Jesteś przed czasem, bohaterze!".
text_1="Mamy jakiś harmonogram!? Myślałem, że trenujemy tylko do momentu, w którym mam paść trupem".
text_2="Ha-ha! Dobry żart!#Jest harmonogram, ale zazwyczaj jesteś nieprzytomny, gdy o nim mówię."

[dia_camp_bld18_4]
dialog_list=H,-SOLD;
dialog_place=1,1,1,1;
text_0="Jestem pod wrażeniem. Nawet te nowe maszyny treningowe nie mają sobie równych."
text_1="Pamiętaj tylko, że jeśli rozluźnisz się choćby trochę, stracisz wszystko, na co tak ciężko pracowałeś."
text_2="Więc będę na ciebie czekała po twojej następnej wyprawie."
text_3="I przynieś coś na herbatę, czyż nie?".


[dia_camp_bld5_1]
dialog_list=H,-YOTA;
dialog_place=1,0,1,0;
text_0="Nawet nie wyobrażacie sobie jak szczęśliwi są ludzie.Jeszcze wczoraj ściany ich schronień były z błota, a teraz mieszkają w prawdziwych domach."
text_1="Czy mogę być teraz uznany za burmistrza?"
text_2="Spokojnie tam. Z apokalipsą sobie poradzimy, ale nie z politykiem."
text_3="..."

[dia_camp_bld5_2]
dialog_list=H,-YOTA;
dialog_place=1,1,0,1,0;
text_0="To prawdziwa rezydencja.Jeszcze niedawno nie mogliśmy nawet marzyć o czymś takim, a teraz mamy okazję dobrze żyć i przeganiać nasze nieszczęścia."
text_1="Wiesz, powinieneś częściej rozmawiać z ludźmi.#Bo człowiek, który dał im całą tę stabilizację, może stać się dla nich wszystkich tylko mglistym obrazem. Bohaterem, który zawsze wyrusza na wyprawę, o której nic nie wiedzą."
text_2="Ale pamiętasz moje bohaterskie czyny, prawda?"
text_3="Jakie czyny?"
text_4="...."

[dia_camp_bld5_3]
dialog_list=H,-YOTA;
dialog_place=1,0,1,0,1,0,1;
text_0="Czy myślałeś kiedyś o tym, żeby wybudować sobie taką rezydencję, kiedy to się skończy? By móc normalnie żyć?"
text_1="To zbyt daleka przyszłość.#Wciąż nie wiem jak poskładać świat do kupy i nie jestem pewien czy kiedykolwiek to zrobię."
text_2="Zbudowaliście taką osadę dla tych wszystkich ludzi. Sam ten fakt jest cudem.#Każda osoba w tym obozie wierzy, że możesz uratować świat."
text_3="Nawet ty?"
text_4="Nawet ja."
text_5="..."
text_6="Jestem szczery. Tym razem nie ma żartów."



[dia_camp_bld22_1]
dialog_list=H,-SCIENT;
dialog_place=1,1,1;
text_0="Ach, prawdziwa świątynia wiedzy. Najlepsza świątynia jaka istnieje."
text_1="Zdobywanie nowej wiedzy, zakuwanie i ćwiczenie pamięci.#Cóż, przynajmniej pamięci mięśniowej..."
text_2="Bardzo mi jednak szkoda nauk geograficznych. Teraz można się wszystkiego nauczyć w kilka godzin."

[dia_camp_bld4_1]
dialog_list=H,-SMITH;
dialog_place=1,1,1;
text_0="Niech mnie szlag trafi! Kiedyś byłem tylko chłopcem pokładowym na słupie... a teraz jestem prawdziwym kapitanem kowalskiego pancernika!".
text_1="Yar-har-har! Teraz moja kolej, by utrzymać ten piec pod wiatr. Możecie spodziewać się wielu dostaw z mojego ognistego portu, przysięgam na moje szczypce!"
text_2="Od tej pory twoja ładownia będzie pełna broni, gdy tylko wyruszysz na nową wyprawę!"




