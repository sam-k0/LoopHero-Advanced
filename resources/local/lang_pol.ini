[furniture]
frn0_1="Półka Alchemika"
frn0_2="Półka z gniazdami na fiolki i odczynniki, etykiety na butelki i inne tajemnicze rzeczy, które należały do poprzedniego właściciela."
frn0_3="+@ do maksymalnej liczby eliksirów$."

frn1_1="Fotel hrabiego"
frn1_2="Mimo, że poprzedni właściciel tego krzesła był wampirem, jest ono ozdobione zaskakująco dużą ilością drewnianych kołków. Wciąż posiada śladową ilość aury pochłaniającej życie.."
frn1_3="+@% do Wampiryzmu, jeśli już go masz$."

frn2_1="Antyczna szafa"
frn2_2="Piękna zabytkowa szafa. Niemy świadek kilku pokoleń stylu."
frn2_3="Leczy +@ hp za każdym razem, gdy bohater wyposaży się w nowy przedmiot ekwipunku$."

frn3_1="Gwoździe do obuwia"
frn3_2="Garść małych gwoździ do mocowania podeszew i małych obcasów. Lepiej zawiń je w kawałek materiału, jeśli chcesz je zabrać ze sobą."
frn3_3="Wrogowie atakujący bohatera otrzymują @ obrażeń odwetowych po każdym trafieniu$."

frn4_1="Klinga zielarza"
frn4_2="Przydaje się, gdy trzeba ostrożnie zebrać jakieś rzadkie zioła. Każdy zielarz w trakcie prac doceni zarówno wygodę tego narzędzia, jak i przyjemny zapach metalu i mięty wydobywający się z jego zakrzywionego ostrza."
frn4_3="+@% do mocy leczniczej eliksirów$."

frn5_1="Siekiera drwala"
frn5_2="Stare, ale wciąż niezawodne i solidne narzędzie. Umiejętność rąbania drewna jest okupiona odciskami na dłoniach."
frn5_3="Za każdym razem, gdy bohater otrzymuje Kawałek patyka, ma @% szans na otrzymanie kolejnego$."

frn6_1="Mieszanka orzechowa"
frn6_2="Mały koszyk z różnymi orzechami. Nie zepsują się i będą cię dobrze karmić. Świetny rodzaj żywności do przechowywania na zimę i miła przekąska na wieczór."
frn6_3="+@ max. hp za każdy punkt defensywy, który posiada/otrzyma bohater$."

frn7_1="Wędzona szynka"
frn7_2="Smaczne wędzone mięso jest zawsze mile widzianym gościem na każdym stole."
frn7_3="Leczy @ hp na początku każdego dnia$."

frn8_1="Czosnek"
frn8_2="Charakterystyczny smak czosnku sprawi, że każda potrawa będzie smaczniejsza. Nikt nie wie, dlaczego wampiry nie lubią czosnku. Może to cena, którą muszą zapłacić za swoje niezwykłe moce?"
frn8_3="+@ do obrażeń bohatera przeciwko wszystkim Wampirom$."

frn9_1="Mosiężny świecznik"
frn9_2="Tersz to tylko dzieło sztuki. Ale wciąż całkiem użyteczny. To prawdziwe marnotrawstwo palić trzy świece na raz, ale kto może odmówić komfortu ciepłego światła w tych mrocznych czasach?"
frn9_3="Obrażenia bohatera zostają zwiększone o 5%, gdy znajduje się on w zasięgu Latarni ulicznej lub Lampionu$."

frn10_1="Stare malowidło"
frn10_2="Już jedno spojrzenie na ten obraz przypomina ci kogoś. Ale wciąż nie możesz sobie przypomnieć, kto to może być. Płótno. Farby olejne. Rok i twórca nieznani."
frn10_3="Zwiększa obrażenia zadawane Bossom o @%$."

frn11_1="Srebrne sztućce"
frn11_2="Mały zestaw sztućców, który sprawia, że jedzenie staje się o wiele wygodniejsze. Srebrne sztućce wymagają specjalnego traktowania, ale i tak miło jest je mieć. Na naczyniach widać jeszcze stare grawerunki."
frn11_3="+@ do obrażeń bohatera przeciwko wszystkim Nieumarłym$."

frn12_1="Dębowe łóżko"
frn12_2="Ciężkie, solidne i stare. Spanie na nim jest bardzo wygodne. Ale trzeba uważać, żeby nie obudzić wszystkich w domu jego głośnym skrzypieniem."
frn12_3="+@% hp za przejście przez Przytulne obozowisko, ale max hp jest obniżone o @% od bazowej wartości.$"

frn13_1="Stół obiadowy"
frn13_2="Wbrew nazwie, można na nim jeść również śniadania i kolacje. Powinien być oczyszczany po każdym posiłku. Albo przynajmniej do końca dnia."
frn13_3="+@*pętla hp do leczenia w Przytulnym obozowisku$."

frn14_1="Antyczny regał"
frn14_2="Jego zawartość jest chroniona przed kurzem i wilgocią przez warstwę szkła, ale nadal możesz zajrzeć do wewnątrz. Ten mebel widział już lepsze dni, więc lepiej nie używaj go zbyt często."
frn14_3="+@ do max hp za każdy kompletny zasób zdobyty podczas tej wyprawy$."

frn15_1="Kosa farmera"
frn15_2="Trochę zardzewiała, ale nic, czego nie naprawi osełka. Poza tym, to dobre narzędzie do zbierania pszenicy lub siana."
frn15_3="@% szansa na otrzymanie 1 Racji żywnościowej podczas przechodzenia przez Pole pszenicy. @% obrażeń zadawanych przez bohatera, staje się obrażeniami obszarowymi$."

frn16_1="Nóż do skórowania"
frn16_2="Nóż przeznaczony do obróbki skór zwierzęcych. Nie jest w najlepszym stanie, ale w sprawnych rękach jest całkiem użyteczny."
frn16_3="@% szansy na otrzymanie 1 Racji żywnościowej po zabiciu Szczurowilka. +@ obrażeń bohatera przeciwko Szczurowilkom$."

frn17_1="Młot kowalski"
frn17_2="To narzędzie jest niezrównane w wytwarzaniu dużej ilości iskier. Wierny towarzysz wszystkich kowali. Szanuje ciężką pracę i pewną rękę."
frn17_3="+@ defensywa$."

frn18_1="Bochenek chleba"
frn18_2="Trochę zwęglony z jednej strony, ale nadal dobry. Mile widziany na stole zarówno wśród bogatych, jak i biednych."
frn18_3="+@ max hp$."

frn19_1="Gulasz"
frn19_2="Miska gorącego gulaszu to najlepszy sposób na ogrzanie się w mroźną zimową noc. Oczywiście nadal jest dobry o każdej innej porze. Przyprawiony kilkoma suszonymi ziołami."
frn19_3="Otrzymasz dodatkowe @ hp podczas przechodzenia przez Wioskę$."

frn20_1="Ser"
frn20_2="Rodzaj żywności, która jest smaczna i może być wygodnie przechowywana przez długi czas. Nie smuć się, jeśli nie masz do tego kieliszka wina. Ser jest całkiem smaczny sam w sobie."
frn20_3="Leczy +@ hp po zabiciu wroga$."

frn21_1="Srebrny wisior"
frn21_2="Piękny egzemplarz zabytkowej biżuterii. Wisiorek ten to niewielki medalion w kształcie nietoperza, który swoimi maleńkimi pazurkami trzyma się srebrnego łańcuszka."
frn21_3="-@ obrażeń zadawanych przez wszystkie Wampiry$."

frn22_1="Rzadko spotykana książka"
frn22_2="Czas był dla tej książki bezlitosny i nie sposób już jej czytać. Drobne fragmenty tekstu opowiadają o czasach i miejscach dawno zapomnianych, ale to za mało, by uzyskać kompletne wspomnienie czy kawałek wiedzy."
frn22_3="+@ defensywy za każdą kartę w ręce gracza$."

frn23_1="Wykwintne lustro"
frn23_2="Jest nieco sfatygowane, ale i tak robi lepszą robotę niż tafla jeziora czy metalowa płytka. Rama jest ozdobiona małymi błyskawicami."
frn23_3="@% szansy na przekierowanie błyskawicy (ze Świątyni Burzy) lub magicznego ataku na losowego przeciwnika$."

frn24_1="kilof Górniczy"
frn24_2="Najlepsza broń w starciu z górą. Oczywiście każda inna skała też nie ma z nim szans."
frn24_3="+@ kamyczków po przejściu przez Przytulne obozowisko$."

frn25_1="Soczewka jubilerska"
frn25_2="Wiele soczewek o różnych zdolnościach powiększających umieszczonych w jednej oprawie z lakierowaną rączką. Pozwala jubilerowi stać się jeszcze lepszym w tym co robi."
frn25_3="Zwiększa szansę na znalezienie rzadkiego przedmiotu o @%$."

frn26_1="Stara patelnia"
frn26_2="Proste, ale niezastąpione narzędzie kuchenne. Raczej wszyscy je znają. Śmiertelna broń w rękach zdenerwowanej gospodyni domowej."
frn26_3="Dodatkowo leczy @ hp, przy przejściu przez Przytulne obozowisko$."

frn27_1="Nóż kuchenny"
frn27_2="Zazwyczaj używany do krojenia i obierania warzyw, ale może być również dość niebezpieczny dla palców niezdarnego kucharza."
frn27_3="+@% do bazowego hp za każdą sztukę ^Żywności^ wyekwipowaną w twoim Magazynie zasobów$."

frn28_1="Mocny stołek"
frn28_2="Trochę wygodniejszy i łatwiejszy do przenoszenia niż zwykła kłoda. Wygląda też trochę ładniej. Może pomóc w sięgnięciu na górną półkę, jeśli zajdzie taka potrzeba."
frn28_3="+@ regeneracji hp na sekundę, jeśli już ją masz$."

frn29_1="Skrzynia"
frn29_2="Pokrywa jest bardzo ciężka, więc powinieneś ją otwierać tylko wtedy, gdy naprawdę musisz. Wyposażony w dawno zepsuty mechanizm blokujący."
frn29_3="Zmniejsza karę dla zgromadzonych (w trakcie wyprawy) zasobów za śmierć lub odwrót o @%$."



