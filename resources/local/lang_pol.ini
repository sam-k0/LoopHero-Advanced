encyclo_tile0_0="Dlaczego wszystko zniknęło jest tajemnicą. I dlaczego to pustkowie wciąż tu jest, też jest tajemnicą. Nie można tego nazwać zwykłą drogą: nie ma na niej żadnych śladów, żadnych drogowskazów, żadnych śladów jakichkolwiek żywych istot w jej pobliżu. Niesamowita natura tej drogi sugeruje, że może być ona raczej manifestacją idei niż samodzielnym obiektem fizycznym. Prawdopodobnie przez całe życie byłeś wędrowcem, więc przestrzeń, w której możesz podróżować, jest nieodzowną częścią twojej osobowości i zawodu."
encyclo_tile1_0="Jeszcze przed tym wszystkim zdarzały się wypadki, kiedy życie miało tendencję do trzymania się martwego ciała, które kiedyś zamieszkiwało. Tradycja grzebania zmarłych w specjalnych miejscach zamiast palenia ciał została narzucona ludziom podczas powstania kultu nekrotycznego. Twierdzili oni, że jest to sposób na przedłużenie życia swoich krewnych, choć w dość osobliwy sposób. Kultystów, rzecz jasna, nigdy nie obchodziły niczyje uczucia - ale zależało im na tym, by zamiast stosów popiołu mieć świeże ciała. Ten kult to teraz starożytna historia, ale tradycja zakorzeniła się aż za dobrze."
encyclo_tile2_0="Szaleństwo toczące się wokół ciebie jest wyraźnie widoczne, gdy spojrzysz na mieszkańców wioski. Jakby zahipnotyzowani, odmawiają przekroczenia granic swoich rodzinnych osad i nieustannie zapewniają cię, że nie mają żadnych interesów poza nimi, o ile dobrze pamiętają. Wszelkie zewnętrzne metamorfozy zachodzące wokół nich przyjmują jako coś absolutnie normalnego dla tego świata. Jak kameleony, pasują i dostosowują się do świata bez względu na to, gdzie ich umieścisz. Czy to samo można powiedzieć o wszystkim innym, co udało ci się zapamiętać? Ich związek z tym małym fragmentem rzeczywistości jest zdumiewający: możesz nie mieć pojęcia, że za drogą czeka na ciebie potwór, ale mieszkańcy wioski już wyznaczyli nagrodę za jego głowę i powiedzą ci, że terroryzuje ich dom od wieków... Jednak nikt nie powie ci, jak dokładnie od ilu dni czy lat."
encyclo_tile3_0="Mały las liściasty. Idealny do zbierania gałęzi. Gaje są piękne, ale raczej nie nadają się na bezczynne spacery. Często gaje służą za dom dla dzikich bestii, których ulubioną taktyką jest długa zasadzka i szybki skok do gardła ofiary. Jeśli uda ci się przejść przez gaj nie napotykając niczego zagrażającego życiu, nie oznacza to, że miałeś szczęście uniknąć czającego się drapieżnika - oznacza to jedynie, że jego brzuch był już pełny."
encyclo_tile4_0="Jeśli twoja droga prowadzi przez nieznane pole pszenicy, uważaj. Strachy na wróble - prymitywne golemy - strzegą upraw przed przybyszami z zewnątrz. Na szczęście trudno tu zabłądzić przez przypadek: złote morze pszenicy widać z daleka i trudno je przeoczyć. Trudno też przegapić brzęczące i grzechoczące dźwięki, jakie wydają jego strażnicy, gdy wloką za sobą swoje jednonogie ciała, wypełnione słomą i instynktowną, prymitywną magią."
encyclo_tile5_0="Zazwyczaj pająki to samotne stworzenia, które wolą pozostać niewidoczne i przyczaić się przed zaatakowaniem swojej ofiary. Jednak nie te gatunki pająków. Ich mrowiskowe gniazda można dostrzec z daleka. Pająki-myśliwi, które buszują po okolicy, wolą otwarcie ścigać i atakować swoją ofiarę. Rozkładające się kości są osadzone w srebrnych ścianach ich pajęczych kokonów. Co jest dość dziwne, bo pająki doskonale radzą sobie z konsumpcją tkanki kostnej. Może te kości służą pająkom budowniczym jako punkty odniesienia? A może są jakimś rodzajem prymitywnej, animalistycznej dekoracji?".
encyclo_tile6_0="Mieszkanie wampira, to przede wszystkim sposób na zademonstrowanie jego potęgi i bogactwa - a dopiero w drugiej kolejności miejsce do życia. Właściciel nie ma potrzeby posiadania w nim licznych pokoi czy wykwintnych dekoracji. Można nawet powiedzieć, że uprzywilejowany wampir żywi się nie tylko krwią, ale także podziwem i zazdrością swoich braci, którzy przychodzą w odwiedziny podczas rzadkich nocy gościnnych. Może to właśnie niekończąca się chęć zaimponowania sobie nawzajem zmusza wampiry do ciągłego wymyślania coraz bardziej wyszukanych projektów architektonicznych."
encyclo_tile7_0="Od dawna to miejsce okazało się zdatne do bitew - które odbywały się tu wielokrotnie w różnych okresach historii. Ziemia szybko wchłaniała krew poległych, ale nie ich kości czy uzbrojenie. Większość z tych pól bitewnych miała odpowiednie nazwy i bogate historie, teraz zagubione poza pamięcią. Ludzie mieszkający w okolicy niechętnie sięgają po bogactwa poległych wojowników - nawet zwierzęta starają się trzymać z dala od trupów.Wciąż panuje tu poczucie niekończącej się walki, nawet jeśli śmierć zabrała wszystkich jej uczestników. Każdy, kto tu trafi, ryzykuje, że stanie się częścią dawno minionej bitwy i odejdzie z odgłosami walki na zawsze utkwionymi w jego uszach. Prędzej czy później ci pechowcy trafiają tu z powrotem, tylko po to, by stać się nowymi członkami niepoliczalnej armii duchów."
encyclo_tile8_0="Bardzo dokładna imitacja ludzkiego obozu wojskowego. Choć brakuje im własnego postępu, gobliny bardzo szybko naśladują wszystko, co może pomóc im przetrwać i zasiedlić nowe miejsca. Obozy takie jak ten służyły już wielu pokoleniom tych plugawych stworzeń i robią to bardzo dobrze. Umiejętność naśladowania przez gobliny wszystkiego, co widzą, jest bardzo dobra: wszystkie obozy, które budują, są całkowicie identyczne ze sobą.#Co więcej, na przykład obozy są również pełne namiotów - mimo że gobliny żyją i śpią na ziemi na zewnątrz. Po prostu nie wiedzą, że obóz mógłby nadal funkcjonować tak samo bez namiotów."
encyclo_tile9_0="Pierwotnie latarnie morskie służyły do nawigacji morskiej w nocy - ale w pewnym momencie ludzie zaczęli ich używać także do oświetlania lądu. Zwykle budowano je w pobliżu ważnych zakładów produkcyjnych, które musiały kontynuować swoją produkcję nawet w nocy. Czasami wieże te były również używane do oświetlania dzielnic dużych miast. Teraz, odkąd wszystkie ciała niebieskie zniknęły, są one bardziej przydatne niż kiedykolwiek. Oczywiście nie jesteś całkowicie ślepy w tej ciemności, ale światło może pomóc ci poruszać się szybciej i z większą pewnością siebie. Niestety, jest to prawda nie tylko dla ciebie".
encyclo_tile10_0="Ten skalisty krajobraz nie daje żadnych plonów. Nawet przejście przez niego jest bardzo trudne. Ale życie nie zna granic i zawsze znajdzie sposób, by pokonać nawet najsurowsze ziemie.#Rodzice tych skalistych pustkowi są zazwyczaj dość wytrzymali i twardzi - prawdopodobnie dlatego, że ktoś mniej wytrzymały po prostu nie byłby w stanie tam przetrwać."
encyclo_tile11_0="Góry zawsze są bogate w skały i śnieg. Ale znalezienie czegokolwiek innego może być tam prawdziwym wyzwaniem. Nawet oddychanie staje się trudne w miarę wspinania się wyżej.#Dlaczego zwierzęta i rośliny wciąż wybierają egzystencję w tak niesprzyjających warunkach? Prawdopodobnie dlatego, że jest tam bardzo mała konkurencja z innymi gatunkami. Niewiele stworzeń chciałoby walczyć o przetrwanie w tych surowych krainach. Nawet przejście przez te ziemie jest wyzwaniem samym w sobie."
encyclo_tile12_0="Lasy iglaste zwykle obfitują w zimne regiony. Drzewa te są dobrze przystosowane do niskich temperatur. Życie drzewa jest bierne, spokojne i bez pośpiechu. Dla wielu gatunków zamieszkujących las, życie w nim to niekończąca się walka o przetrwanie. Ale drzewa już wiedzą, że w końcu zawsze będą zwycięzcami tej walki. Prędzej czy później każdy mieszkaniec lasu stanie się pożywką dla ich korzeni. Drzewa nigdy też nie przestały się zmieniać i dostosowywać. Są w tym po prostu  leniwe".
encyclo_tile13_0="Minęło sporo czasu, odkąd pnie tych jodeł po raz ostatni widziały światło słoneczne. To samo dotyczy wszystkich żyjących tu stworzeń. Dla nich zniknięcie słońca nie jest niczym szczególnym. Jedyny hałas, jaki można usłyszeć, to miękkie skrzypienie drzew. Ale nawet to nie oznacza, że jesteście sami. Nikt nie wie, ile stworzeń może się tu kryć. Twoje oczy muszą wyłapywać nawet najmniejsze ruchy, a uszy nie mogą cię zawieść nawet podczas snu, jeśli chcesz tu przetrwać. Tylko wtedy masz szansę na zasadzkę na tych, którzy próbują zasadzić się na ciebie".
encyclo_tile14_0="Jaskrawoczerwony kolor liści i korzeni tych drzew nie ma żadnego związku z ich dietą, choć niektórzy mogą uznać to za nieco złowrogi zbieg okoliczności. Ściśle rzecz biorąc, liście są tylko rudymentarne - dla roślin z krwawego gaju fotosynteza jest jedynie drugorzędnym sposobem pozyskiwania energii. Pnącza ukryte w leśnym podłożu szybko reagują na drgające ruchy każdej rannej lub umierającej istoty. W jednej chwili biedna ofiara zostaje w nie zaplątana, by zostać wciągnięta pod ziemię. Sposób, w jaki potrafią rozpoznać, że stworzenie umiera, jest dość ciekawy - ale nie tak ciekawy jak metoda rozmnażania gatunku przez Krwawy Gaj. Te mięsiste olbrzymy często mylone z nieumarłymi potworami ze względu na swój groteskowy wygląd - w rzeczywistości są tylko osobliwym rodzajem owocu, stworzonym z mięsa, kości i gałęzi. Podczas swojego krótkiego ^kwitnienia,^ to ^ziarno^ wykorzystuje swoje nagie, krwawe ciało do przyciągnięcia drapieżników - których martwe ciała odżywią karmazynowe kiełki nowego gaju krwi."
encyclo_tile15_0="Kult Złotej Strzały jest jednym z najbardziej starożytnych kultów pogańskich. Czasami nazywa się go również Kultem Grzmotu i Błyskawicy. Jest jednak pewna ironia w nazywaniu świątynią kilku stojących kamieni i prostego ^dachu^ nad nimi. Ale nawet dziś niektórzy ludzie wciąż je budują. Dlaczego to robią? To dość proste: może to tylko kult i może to być pogańskie, ale burze z piorunami w regionach, w których znajdują się te świątynie, faktycznie zdarzają się częściej. Kultyści Złotej Strzały mają tendencję do patrzenia z góry na inne religie, ponieważ ich bóg może być faktycznie przywołany i widziany przez każdego, w przeciwieństwie do bogów ich przeciwników. Cele tych kultystów wydają się pozostawać tajemnicą nawet dla nich samych. Piorun ma tendencję do uderzania nie tylko w potencjalnych wrogów kultu, ale także we wszelkie inne cele... W tym także w samych nieszczęsnych kultystów. Być może po prostu uwielbiają widzieć niekontrolowaną moc przychodzącą na ten świat z ich woli."
encyclo_tile16_0="Przetrwanie to dość trudne zadanie. Zazwyczaj ludzie poświęcają mu całe swoje życie. Jeśli jednak samo przetrwanie nie wystarcza, jeśli łakniesz odpowiedzi na zadawane pytania, jeśli chcesz zerknąć na tajemnice stworzenia - to księgarnia jest miejscem dla Ciebie. Zwiędły palec skryby wskaże ci właściwą półkę, a jego ręce zapewnią ci stół, stos papieru na notatki, atrament i świece, których możesz potrzebować. Nie zwracaj uwagi na chorobliwy i niemal nieludzki wygląd skrybów.#Kiedy dokładnie pragnienie wiedzy zmienia się w służbę wobec niej? Pytanie jest niemal retoryczne. Przejście jest zbyt płynne. Prawdopodobnie nawet nie zauważysz, jak odurzające uczucie wyższości uzyskane dzięki nowej wiedzy ustępuje miejsca pragnieniu odkrycia czegoś jeszcze większego. I będziesz tam - podając atrament i papier nowemu neoficie, wiedząc, że szukają odpowiedzi, których nigdy nie znajdą."
encyclo_tile17_0="Kiedy wiedza o świecie zaczyna być skompilowana i zaczyna się przeplatać i mieszać, wtedy rodzi się magia. Nie ma tu wymyślnych rytuałów ani szamańskich tańców.#Nie ma zbyt wielu informacji na temat tego, jak księgarnie faktycznie stają się opuszczone. Zazwyczaj rolnicy, którzy przynoszą do księgarni jedzenie i zapasy, po prostu zastają cały budynek zrujnowany wraz z odejściem skrybów. Najgadatliwsi z nich mówią, że skrybowie byli bardzo wzburzeni, gdy ostatni raz z nimi rozmawiali - twierdząc, że samo istnienie świata zaczęło do nich przemawiać w języku kosmosu i wkrótce będą w stanie opowiedzieć o losie całego wszechświata na podstawie zaledwie jednego liścia spadającego z drzewa."
encyclo_tile18_0="Ogólnikowe pojęcie rzeki, jakby z podstawowej pamięci archetypowej. Jej szerokość, głębokość i nurt są absolutnie stałe na całej jej długości. Jednak jak na wspomnienie rzeki, w charakterystyczny sposób opiera się ono pozostawieniu w stanie niekompletnym. Po pierwsze, nie da się wyobrazić sobie drugiej rzeki, dopóki pierwsza nie będzie kompletna. A ponieważ nie ma sposobu na utworzenie ujścia, gdyż inne duże zbiorniki wodne już nie istnieją, nigdy nie będzie kompletna. Co ciekawe, sam byt zdaje się cieszyć z obecności rzeki: świat wokół niego staje się silniejszy i pełniejszy, jak gdyby budził się ze snu. Może to zasługa naturalnego obiegu wody, najbardziej powszechnej i niezbędnej rzeczy w naszym świecie."
encyclo_tile19_0="W dawnych czasach można było spotkać takie latarnie na każdej drodze. Ich konstrukcja jest dość podstawowa, a proste zaklęcie wiążące światło nie wymaga lat nauki. Światło z takich latarni z pewnością pomoże Ci dostrzec nocnego drapieżnika, ale nie to decyduje o bezpieczeństwie na drogach - po prostu nikt nie chce przebywać zbyt długo w pobliżu latarni. Nikt nie wie, skąd wzięło się stare zaklęcie światła, ale wyraźnie nie ma w nim nic dobrego. Ma się wrażenie, że światło podąża za każdym, kogo dotknie, obserwując go i badając. Nawet lita skała czy gruba tkanina nie ukryje cię przed jego wzrokiem. Nawet najstraszniejsze stworzenia tego świata obawiają się jego nieziemskiego światła, a wiele z nich woli znaleźć inne miejsce dla swoich brudnych czynów."
encyclo_tile20_0="Kopce, bagna, oraz tysiące owadów i mchów o wszelkich kształtach i kolorach. Głupi podróżnik zginie próbując ją przekroczyć, sprytny obejdzie ją dookoła, a przebiegły doprowadzi do niej swoich wrogów. Dawno temu na bagnach żyło kilka plemion, które budowały wysokie wieże, by nie dosięgły ich olbrzymie komary. Teraz nic po nich nie zostało. Wszystko zostało albo zapomniane, albo tylko zgniło, pochłonięte przez bagno.#Ciekawy i przerażający fakt: gazy bagienne mają tendencję do wywoływania procesów samozniszczenia u wszystkich istot zdolnych do samoleczenia. Nawet jeśli regeneracja ma charakter czysto magiczny, bagno wykrzywi ją i odwróci, jakby samo wypłukiwało życie. Mając to na uwadze, opowieści o tym, że wszystkie bagna są połączone ze straszliwą pierwotną bestią drzemiącą głęboko pod ziemią, nie brzmią już tak głupio."
encyclo_tile21_0="Ten budynek nie jest ^tylko^  zwykłym arsenałem. Skromna nazwa kryje w sobie starożytną szkołę rzemiosła wojennego. Nie można by nazwać uczniów Arsenału niezrównanymi wojownikami, ale na pewno są zawsze poszukiwani.#Podstawową podstawą Arsenału jest osiągnięcie mistrzostwa nad każdym rodzajem broni i ekwipunku, nieważne jak egzotycznym - i używanie ich wszystkich razem, ile się da. Oczywiście trudno byłoby się tego nauczyć bez dużej ilości sprzętu pod ręką - dlatego też Arsenał funkcjonuje również jako największe muzeum sztuki wojennej. Wśród jego licznych eksponatów znajdują się przedmioty tak egzotyczne, że nie wiadomo nawet jak się nimi posługiwać, jak ich używać, czy jak je nosić. Całkiem możliwe, że jest on absolwentem Arsenału - i wykorzysta cały swój śmiercionośny ekwipunek, by nauczyć cię szacunku."
encyclo_tile22_0="Prawie wszyscy potężni magowie mają obsesję na punkcie znalezienia sposobu na stanie się nieśmiertelnym. Labirynt Wspomnień jest wynikiem próby osiągnięcia tego celu.Zaklęcia umieszczone na jego ścianach mogą ukradkiem zastąpić wspomnienia każdego, kto go przemierza, wspomnieniami dawno minionego architekta tego miejsca. Każdy człowiek zmierzający do centrum Labiryntu jest zobowiązany do przejścia przez wiele kluczowych punktów pamięci, stając się zupełnie inną osobą - magiem, który zaprojektował i stworzył ten Labirynt. Nawet dla wszystkich głupców, którzy próbują dotrzeć do centrum w pogoni za podobno skarbem maga. Nie wiadomo, jaki błąd popełnił zmarły mag, który doprowadził do takiej sytuacji: może wspomnienia nie wystarczą, by uformować pełną osobowość, a może w jego zaklęciach lub projektach były błędy. A może w ogóle nie było żadnych błędów - a pierwsza udana kopia maga cofnęła się i celowo uszkodziła Labirynt, by zapobiec narodzinom kolejnej. Kto wie?"
encyclo_tile23_0="Solidny jak skała dowód na to, że chęć ludzkości do podboju tego świata zrodziła się z ich ciekawości i obsesji na punkcie standardów. Sam Monument był wielokrotnie naprawiany i przerabiany, więc zauważalnie różni się od pierwotnego projektu. Na najstarszych mapach nie znajdziemy południka zerowego - zamiast niego zobaczymy rysunek samotnego, białego, stojącego kamienia. Obecnie południk wygląda jak metalowa płytka z wyrytymi kierunkami kardynalnymi, osadzona na placu wyłożonym płytami kamiennymi.#Niewiele wiadomo o osobie, która jako pierwsza zainstalowała ten geograficzny punkt odniesienia. Wydaje się, że nie wyrosła ona na słynnego kartografa. Ale widać, że była to osoba niezwykle charyzmatyczna - ponieważ nawet wampiry, które mają tendencję do patrzenia z góry na ludzkie wynalazki, również akceptują południk zerowy jako standard w swoich naukach geograficznych."
encyclo_tile24_0="Mało która wioska nigdy nie została spustoszona. Głód, choroby, klęski żywiołowe, wojny, dzikie zwierzęta, czy jakiekolwiek inne zło, jakie można sobie wyobrazić, zawsze nawiedzi ludzką osadę. Jeśli masz szczęście, będziesz w stanie znaleźć kilka rodzin, które wciąż żyją w ruinach, próbując wrócić do swojego dawnego życia. Jeśli nie będziesz miał tyle szczęścia, znajdziesz mieszkańców tego miejsca już martwych... niektórzy z nich powoli chodzą po okolicy, próbując na próżno przypomnieć sobie swoje zawody i marzenia z życia. Ale jeśli chodzi o ich marzenia i pragnienia, pierwszą rzeczą, która przychodzi im do głowy jest zazwyczaj chęć napchania brzuchów pysznym jedzeniem. Z pewnością nie wyglądasz na takiego, ale będziesz musiał użyć siły, by to udowodnić."
encyclo_tile25_0="Wioska pod opieką wampira często nazywana jest ^ziemią hrabiego ^ Domy w tych wioskach są o wiele bardziej solidne, bogate i piękne. I to samo tyczy się ich mieszkańców. Ale byłoby zbyt naiwne sądzić, że to oznaka filantropii wampira. Dla wampira dobrze prosperująca ludzka wioska to tylko kolejny sposób na zademonstrowanie swojego bogactwa i władzy. Ten fakt jednak nie bardzo martwi farmerów, dopóki są dobrze odżywieni i bezpieczni. Kilku wieśniaków zaginionych po audiencji u hrabiego to niewielka cena za spokojne życie, o ile nie musi się to zdarzać zbyt często."
encyclo_tile26_0="Zręczni kowale niemal dosłownie wkładają serce w swoją pracę. Tworzenie sztucznego życia nie należy do najtrudniejszych rzemiosł, więc po spreparowaniu swojej pierwszej lekko drgającej żywej zbroi rzemieślnik zapewne zagłębi się w to nowe zajęcie z głową. Kowale nieustannie starają się doskonalić w sztuce tworzenia sztucznego życia. Czasami ich twory są nawet w stanie zadawać pytania i imitować wolną wolę. Każdy ceniący się mag prawdopodobnie wyśmiałby pracę kowala zajmującego się golemingiem: próba użycia młota i kowadła do osiągnięcia czegoś, co wymaga lat nauki, może wyglądać dla niego dziecinnie. Ale kowal nie przejąłby się takimi kpinami. Bo skrzypiący dźwięk każdego kroku żywej zbroi przynosi prawdziwą radość sercu jej twórcy."
encyclo_tile27_0="W trzcinach nie ma nic naprawdę ciekawego. Ale zobaczenie fragmentu płynącej rzeki porośniętego trzciną z pewnością zaalarmuje doświadczonego podróżnika. To dość rzadki widok, a powodów jest kilka.#Częściej takie zarośla trzcinowe sadzą rybiarze, by stworzyć rezerwę żywności dla swoich rzecznych obozów. Błotnista woda ze słabym prądem jest idealna do hodowli pewnych gatunków ryb, które spożywają. Włókna roślin nadają się również do budowy ich prymitywnych podwodnych mieszkań. I nie zapominajmy, że o wiele łatwiej ukryć się w licznych wysokich trzcinach.#Ale podróżnik powinien zachować pozytywne nastawienie: czasami trzciny nie są niczym więcej niż zwykłym wynikiem prostych procesów naturalnych. Mimo to, prawdopodobnie nie powinieneś testować tych wód".
encyclo_tile28_0="Most może powiedzieć ci wiele rzeczy o miejscu, w którym się skończył. Jeśli zamiast normalnego mostu widzisz jakieś stare liny i spróchniałą deskę, zachowaj czujność: to miejsce na pewno nie jest dobre. Jeśli jednak przejdziesz przez rzekę po solidnym kamiennym moście, Twoja przyszłość może wyglądać całkiem dobrze. A jeśli jesteś kupcem z zawodu, widok niezawodnego i szerokiego kamiennego mostu, zaprojektowanego tak, by utrzymać ciężar karawany handlowej, z pewnością przyniesie radość twojemu sercu.#Tylko nieliczni rozumieją, że nie tylko most przecina rzekę, ale i rzeka przecina most."
encyclo_tile29_0="Ta konstrukcja nie należy do waszych ojczyzn. To coś zupełnie nowego i z innego świata. Architektura nie jest przesadnie ekscentryczna, ale coś w tej budowli po prostu krzyczy, że nie jest z tego uniwersum.#Czemu więc Pałac Liczów sprawia wrażenie tak groźnego? Czy to nieznany minerał, z którego został zbudowany? A może to rzadkie przebłyski dziwnego światła w jego pustych pomieszczeniach? Nie. Wystarczy podejść wystarczająco blisko, a natychmiast zrozumiesz, że cały budynek jest nierozerwalną częścią samego swojego potężnego pana i podąża za nim, gdziekolwiek się udaje."
encyclo_tile30_0="A więc twoja ścieżka doprowadziła cię do pola pszenicy. Teraz możesz być całkowicie pewien, że gdzieś w pobliżu znajduje się wioska. Albo, w najgorszym wypadku, pozostałości po wiosce. Jednak... Ta prosta zasada może zostać złamana, gdyż zapomnienie i chaos często zmuszają niegdyś nierozłączne obiekty do samodzielnego istnienia. Zarośnięte pole to trochę paradoks, twór bez twórcy. Może rozrzucone kawałki świata próbują się na nowo połączyć zgodnie z prawami logiki i związkami przyczynowo-skutkowymi, może nawet tworzą nowe prawa od podstaw... Ale na pewno nie tym razem. Ciężka mgła możliwości snuje się wokół tego miejsca, próbując uzasadnić swoje istnienie, ale bezskutecznie."
encyclo_tile31_0="Nie ma żadnych wzmianek o takich miejscach z czasów przed zapomnieniem. Wygląda to tak, jakby jakiś szaleniec próbował stworzyć imitację wioski rozrzucając worek z różnymi nasionami i pielęgnując je przez kilkadziesiąt lat. Trudno zrozumieć, jak właściwie działa ta imitacja, ale związek między lasem a tymi drewnianymi wioskami jest dość oczywisty. Jeśli przyjmiemy, że las jest żywym organizmem, można zasugerować, że może to być jego wyjątkowa reakcja na apokalipsę - albo jako wyraz bólu, albo jako awaryjna adaptacja do wydarzeń, które miały miejsce. Cokolwiek to jest, lepiej nie pukaj do drzwi tych fałszywych domów. Całkiem możliwe, że las również stworzył dla nich jakichś ^mieszkańców^."
encyclo_tile32_0="Krwawy gaj w swoim naturalnym środowisku jest całkowicie nierozerwalnie związany z otaczającymi go lasami. Co jest właściwie dość dziwne, biorąc pod uwagę, że jego drzewa nie mają absolutnie żadnych symbiotycznych związków z żadnymi innymi drzewami czy roślinami, ale tak po prostu jest. Albo było.#Głodny gaj krwi to kolejny artefakt współczesności. Krwawy gaj rozwiązuje paradoks swojego oddzielnego istnienia poprzez zwiększoną agresję i zmodyfikowane zachowanie. Jego ostre korzenie nie czekają już tylko na osłabioną ofiarę - starają się zaatakować każdą żywą istotę, która znajdzie się w ich zasięgu. Na razie nie wiadomo, co dokładnie rekompensuje ten bardziej agresywny sposób polowania, ale oczywiście nie jest to zbyt pomocne. Drzewa są zawsze w stanie na wpół żywym, niezależnie od tego, ile ofiar pochłoną."
encyclo_tile33_0="Manipulacja czasem zawsze była ważną dyscypliną studiów magicznych, głównie ze względu na obietnicę nieśmiertelności poprzez zawieszenie pewnych procesów ludzkiego ciała. I oczywiście z wielu innych pożytecznych powodów. Niestety, szkody, jakie przynoszą takie manipulacje, przewyższały potencjalne korzyści. Pewnego razu te manipulacje nawet prawie spowodowały globalną katastrofę. Kryształy chrono są pokłosiem tej katastrofy. Te kryształowe formacje są próbą zrekompensowania światu naruszonych praw tworzenia i wyrównania przepływu czasu tam, gdzie został on zakłócony. Można pomyśleć, błędnie, że te kryształy po prostu przyspieszają czas wokół nich: ale to, co faktycznie robią, to ^przesunięcie^ do przodu zawieszonego czasu, aby mógł on dogonić ogólne tempo."
encyclo_tile34_0="Te tajemnicze wieże znane są od czasów starożytnych. W rzadkich przypadkach, czasowa latarnia może po prostu pojawić się w wirze piasku lub zniknąć w ten sam sposób. Jednak powód tych zdarzeń nadal pozostaje tajemnicą. Nieznane jest również pochodzenie fluktuacji przepływu czasu wokół tych konstrukcji - jednak same fluktuacje wydają się całkowicie naturalne i zgodne z prawami natury. Historia zna niewiele prób zniszczenia lub zdobycia latarni temporalnych, a wszystkie zakończyły się niepowodzeniem. Materiału, który tworzy te wieże, nie da się nawet zarysować. Latarniom tym brakuje drzwi i okien, co prowadzi nas do kolejnego pytania: w jaki sposób ich mieszkańcy, obserwatorzy, mogą opuszczać te konstrukcje, by pełnić swój cichy patrol otaczających je ziem?"
encyclo_tile35_0="Z pewnością można się domyślić, kto byłby zwycięzcą w walce pomiędzy piorunem a drewnem. Widok tych zwęglonych kikutów wpatrzonych w niebo pełne popiołu zniechęciłby każdego. Jeśli podążysz za prostymi liniami zwęglonych drzew, doprowadzą cię one do źródła zniszczeń - świątyni burzy. Ale las trudno zabić: nawet najgłębiej spalone pniaki są w stanie zapuścić nowe korzenie, a nowe zielone pędy ponownie opanują to miejsce. Las będzie toczył tę walkę przez dziesiątki lat, i raz po raz będzie odpychany przez rzadkie przebłyski suchych burz.#Pomimo martwego wyglądu, spalone lasy są również domem dla niektórych przerażających stworzeń. To surowe środowisko z okazjonalną burzą z piorunami i pożarem lasu przystoi tylko najtwardszym stworzeniom, które z łatwością potrafią rozciąć gardła swoich ofiar ostrymi zębami, pazurami lub ostrzami. Czasem atakują tylko po to, by schłodzić swoje ciało świeżą krwią."
encyclo_tile36_0="Świat zawsze był surowy. Powodem przetrwania ludzkości nie jest stalowa broń czy siła, jest to ludzka zdolność do zjednoczenia się przeciwko każdemu, kto próbuje odebrać im ziemie lub życie. I tak walka o przetrwanie rodzi narody, cywilizacje i kultury. Ale tak czy inaczej, triumf ludzkości zawsze będzie ulotny, zawsze zostanie przerwany i pozostawi po sobie jedynie ruiny wypełnione szczątkami biednych, pozbawionych szczęścia ludzi. Zdolność ludzkości do ciągłego tworzenia nowych ambitnych imperiów jest naprawdę inspirująca - i równie smutna jest ludzka niezdolność do uświadomienia sobie, że ich poprzednicy mieli już takie same kamienne mury i zamki, a jednak najwyraźniej nie wystarczyło im to do przetrwania."
encyclo_tile37_0="Czasami rozmiary rozlewu krwi zaczynają przeczyć wszelkiemu rozsądkowi. Każda długa bitwa pozostawia po sobie krwawą plątaninę ziemi, ciała i kości. Droga przechodząca przez takie miejsca nazywana jest krwawą ścieżką. Możesz próbować zawstydzić poległych wojowników za to, że nie wybrali miejsca bardziej oddalonego od uczęszczanych dróg - i czyniącego życie dość uciążliwym dla tych, którzy często je przemierzają - ale oni raczej cię nie usłyszą, będąc martwymi. Szalejąca ziemia nigdy nie przyjmie ciał byłych bojowników. Nawet po wielu latach ich zwłoki wciąż można łatwo dostrzec.#A czasem niektóre krwawe szczątki znajdują nawet dość siły, by podnieść kości z ziemi, by mogły jeszcze raz stoczyć swoją dawno zapomnianą walkę - dziwny bezwład życia zakończonego rozlewem krwi."
encyclo_tile38_0="Wrak statku na morskim klifie to smutny widok. Ale zobaczyć wrak w pobliżu cienkiej rzeki to rzeczywiście bardzo dziwny widok. W rzeczywistości takie wraki statków służą jako źródła mocy dla syren - magów rybiarzy. Nikt nie wie dokładnie jak to działa, ale zatopiony statek wypełniony skarbami i martwą załogą jest w stanie zwiększyć ich magiczne moce. Prawdopodobnie ma to coś wspólnego z agonią zbliżającej się śmierci. To by wyjaśniało, dlaczego statki te są często odkrywane na starych polach bitew. Inną rzeczą, która wspiera tę teorię, jest poczucie jedności, jakiego rybacy doświadczają podczas bitwy poprzez wspólne pragnienie zabijania i nie bycia zabitym."
encyclo_tile39_0="Jedyną różnicą między tym obozem a wszystkimi innymi jest wieża widokowa. Niewielkie rozróżnienie, można by pomyśleć - ale dla goblinów zwykły obóz i wieża widokowa są drastycznie niepodobne do siebie. Jest dość oczywiste, że goblińska wieża widokowa jest reakcją na wyjątkowo nieprzyjazne warunki życia, ponieważ takie warunki są jedyną rzeczą, która może zmusić gobliny do porzucenia ich zwykłego szablonu budowlanego... na rzecz innego szablonu. Wieża widokowa pozwala goblinom ograniczyć liczbę ślepych patroli na wrogie terytoria. Goblińscy łucznicy są w stanie dostrzec swoją ofiarę z daleka i mogą szybko poinformować o tym reszte. Goblińskie punkty obserwacyjne można zwykle znaleźć w pobliżu bagien, których gobliny naprawdę nienawidzą. Ale myśli o tym, że nie okradają podróżnych na wrogich ziemiach nienawidzą jeszcze bardziej."
encyclo_tile40_0="Gorące piaski krajów południowych pokrywają ogromne terytoria. Niektórzy badacze upierają się nawet, że piaski rosną z każdym rokiem. Daj pustyni wystarczająco dużo czasu, a zamieni ona w piasek wszystkie tereny i ich mieszkańców. Możesz zapomnieć o wodzie: pustynia zabierze każdą kroplę. Pragnienie pustyni nigdy nie może być zaspokojone. A pustynia chętnie podzieli się tym pragnieniem z każdym przybyszem.#Chudą konstytucję ludzi żyjących na pustyni można wyjaśnić poprzez ich mechanizmy termoregulacji. Ale istnieje łatwiejsze wyjaśnienie: ich życie to nieustanna wyczerpująca walka z surowym środowiskiem."
encyclo_tile41_0="Piaskowe giganty ^wykuwane^ przez gorące wiatry. Wydmy piaskowe mogą wyglądać na nieruchome, ale to raczej nie jest prawda. Warstwa po warstwie wiatr przenosi je dalej, a powolny marsz tych olbrzymów nigdy się nie zatrzymuje. Choć wydmy mogą wyglądać bezpiecznie, lepiej ich unikać. Wystarczy jeden bezmyślny krok, a będziesz miał szczęście, jeśli tylko złamiesz nogę. Jeden podmuch wiatru może spowodować osuwisko, które stanie się Twoją zgubą. Powietrze wokół wydm jest zawsze gorące, nawet w nocy. Parzące góry piasku są wystarczająco potężne, by ogrzać nawet najzimniejsze północne wiatry. W końcu wydmy odbiorą ci życie - i tylko one zdecydują, czy twoja śmierć będzie szybka i nagła, czy długa i bolesna."
encyclo_tile42_0="Gęsta roślinność to jedyna rzecz, która chroni ten strumień przed wyschnięciem. Woda jest najcenniejszym skarbem na pustyni. Wokół oaz budowano całe cywilizacje. Jeden ratujący życie łyk wody może zjednoczyć ludzi umierających z pragnienia lepiej niż jakikolwiek skarb czy wspólny wróg. Spokojna atmosfera, jaką tworzy każda oaza, może uspokoić różne stworzenia i pozwolić im współistnieć na niewielkim terytorium. Nie myśl jednak, że jest to kraina harmonii i spokoju. Walki o wodę mogą być bardzo brutalne. Jedynym plusem jest to, że zdarzają się tylko z konieczności - nie dla zabawy czy na pokaz. Bo każdy ruch to strata energii i więcej ciepła, którego wszyscy tutaj tak bardzo starają się uniknąć."
encyclo_tile43_0="Zazwyczaj placówki budowane są albo przez siły wojskowe jakiegoś państwa, albo przez najemników szukających stałego zarobku. Ich pochodzenie nie robi jednak podróżnikowi różnicy - tak czy inaczej drogi stają się bezpieczniejsze kosztem jakiejś monety. Ludzie zwykle nie wykazują entuzjazmu wobec żołnierzy stacjonujących na placówce: to oczywiście miłe, być uratowanym przed zębami i pazurami bestii, która nagle zaatakowała cię w drodze na targ - ale jak masz przetrwać zimę teraz, gdy zabrali ci połowę plonów, które chciałeś sprzedać?"
encyclo_tile44_0="Ta góra jest tak duża, że trzeba było ją wyróżnić spośród innych formacji skalnych i nadać jej osobną nazwę. Wokół tego szczytu górskiego żyje kilka plemion, ale tylko harpie są nam dobrze znane. Z łatwością radzą sobie z rozrzedzonym powietrzem i niezwykle zimnymi wiatrami, które zawsze wieją w dół zboczy szczytu. Pewne odkrycia wskazują na istnienie cywilizacji wyraźnie bardzo zaawansowanej w sztukach magicznych, która w pewnym momencie zniknęła niemal bez śladu. Dlaczego zniknęła, pozostaje tajemnicą, podobnie jak to, dlaczego na jej stolicę wybrano tak nieprzyjazne środowisko.#Nieliczni ludzie, którzy decydują się na zbadanie szczytu, prędzej czy później dochodzą do tego samego wniosku: należało zbadać coś bardziej prostego i łatwego."
encyclo_tile45_0="Jeśli ilość twoich bogactw i skarbów stanie się tak duża, że nie ma już sensu jej ukrywać, powinieneś pomyśleć o budowie skarbca. Takie konstrukcje były bardzo powszechne w dawnych czasach i łatwo można się domyślić dlaczego. Nawet teraz wciąż znajdowane są kolejne zaczarowane wieże, niektóre z nich nie zostały nawet splądrowane. Praktycznie każda taka wieża jest chroniona przez zaklętych kamiennych strażników. O wiele bardziej niezawodni i wytrzymali niż ich żywe odpowiedniki, nigdy nie zdradzą swojego pana ani nie opuszczą swojego posterunku z częścią bogactw, które przysięgali chronić (w przeciwieństwie do strażników z krwi i kości). Skarbce znajdują się zazwyczaj w odległych miejscach, z dala od jakiejkolwiek cywilizacji - dlatego zwykli złodzieje rzadko decydują się na wyprawę w ich poszukiwaniu."
encyclo_tile46_0="Kamienni strażnicy nie przejmują się tym, że ich panowie od dawna nie żyją i nie mają już potrzeby korzystania z ich bogactw. Zaklęcie nałożone na gargulce nie tylko zmusza je do pilnowania skarbów, ale także każe im je zwrócić, jeśli jakiemuś szczęśliwemu złodziejowi uda się jakiś skraść. Przez lata będą gonić za nawet najmniejszą monetą, by znaleźć i ukarać osobę, która ją ukradła. Gargulce przegrają beznadziejną walkę z ludzką chciwością, to pewne, a zniszczona wieża już nigdy nie zostanie napełniona. Ale to nigdy nie powstrzyma gargulców przed próbą wypełnienia swoich obowiązków, a ich próby będą trwały - aż do momentu, gdy wieża wyczerpie zapasy kamienia, gdy będzie budować nowe gargulce."
encyclo_tile47_0="Dość spokojne miejsce. Drapieżniki nie mają szans podejść do celu niezauważone, a duże zwierzęta roślinożerne zapuszczają się tam tylko wtedy, gdy są w stanie uciec lub bronić się swoimi wielkimi rogami. Dobry ranczer mądrze poprowadziłby tu swoje stado, by zdobyć trochę świeżej trawy. Dla podróżnika łąka to także całkiem wygodne miejsce. Zawsze znajdzie się miejsce na rozbicie obozu, trochę gałęzi na rozpalenie ognia i nikt nie przeszkodzi ci w dobrym odpoczynku."
encyclo_tile48_0="Jeśli rodzina ma wystarczająco dużo zasobów, władzy i sprytu, jest skazana na stanie się wielką dynastią. Potomstwo będzie pielęgnować wspomnienia o bohaterskich czynach i tragicznych błędach swoich przodków i będzie starało się być jeszcze lepsze - a przynajmniej nie stać się gorsze. Wiedzą, że samo istnienie to wielka odpowiedzialność, a bezczynność to największy z grzechów. Dla nich największym wyobrażalnym osiągnięciem jest być uznanym za godnego pochowania w rodzinnej krypcie wśród swoich honorowych krewnych i zobaczyć, jak drzwi krypty otwierają się przed nimi tuż przed śmiercią.#Niestety, tradycja krypty przodków jest już prawie zapomniana i tylko kilka z nich pozostało nienaruszonych. Najlepiej zachowana krypta przeszła transformację i teraz wita każdą zagubioną duszę. Może uznała, że cały świat jest teraz jej dziedzictwem i każdy może się uczyć od przodków, niezależnie od tego, czy jest spokrewniony, czy nie."
encyclo_tile49_0="Długi spacer po kwitnącej łące to prosty i tani sposób na naprawienie zdrowia psychicznego. Czyjeś zdrowie fizyczne też by na tym skorzystało, oczywiście. Niektórzy uważają, że to dzięki przyjemnym zapachom kwiatów i relaksującemu szelestowi trawy. Inni pragmatycznie powiedzą, że to za sprawą słodkiego miodu, świeżego mleka i pysznej wołowiny produkowanej przez lokalnych rolników. Spróbujmy jednak nauczyć się trochę mądrości od kwiatów - które dogadują się po prostu dobrze bez żadnego zamieszania - i powiedzieć, że oba powody są słuszne i równie ważne."
encyclo_tile50_0="Rozproszenie kamiennych domów, odgłosy codziennego życia i dym unoszący się z kominów. Przedmieścia powoli przekształcają otaczający je świat, czyniąc go wygodniejszym dla ludzi i mniej wygodnym dla innych żywych istot. Ludzie mieszkający na przedmieściach muszą ciężko pracować, aby ich rodziny były bezpieczne i dobrze odżywione. Pamiętajcie, że nawet najmniejszy tamtejszy dom zbudowany jest na gorzkich doświadczeniach i błędach jego mieszkańców. A jeśli dom jest pusty... Cóż, może ludzie, którzy tam mieszkali, nie chcieli uczyć się na swoich błędach".
encyclo_tile51_0="Będąc wysoce społecznymi istotami, ludzie zawsze mają tendencję do pomagania sobie nawzajem. Ta strategia przetrwania jest bardzo skuteczna i opłacalna. Dlatego nawet zatłoczone mieszkanie i brak zasobów nie są w stanie zmusić ludzi do życia osobno. Mieszkańcy miast żyją i pracują w solidnych kamiennych domach. Ciężka praca i dobre wykształcenie to rzeczy, które cenią najbardziej. Każdy obywatel stara się być mądrzejszy i odnosić większe sukcesy niż jego sąsiad - ponieważ kiedy nie ma już konkurencji ze światem zewnętrznym, jesteś zmuszony konkurować z ludźmi wokół ciebie. Taki jest paradoks życia w mieście: bądź uprzejmy dla swoich sąsiadów, ale nie zapomnij wykorzystać ich na swoją korzyść."
encyclo_tile53_0="Wieśniacy przystosowali się do życia bez większości aspektów świata zewnętrznego, zadowalając się gołymi koniecznościami życia na wsi, takimi jak ich pola i krwiożerczy arystokraci. Okazuje się, że lista ta była niepełna bez chciwych bandytów.W przeciwieństwie do innych skąpych grup ludzi błąkających się w niestabilnych ciemnościach, bandyci nie zapomnieli o swoich pragnieniach.Nie przejmując się końcem świata czy wczorajszym, nieistniejącym dniem, dbają jedynie o kasę pobliskiej wioski. Nawet w rozpływającym się świecie pozostają głuche na wszelkie błagania o litość, jednak szybko dostrzegają przedmioty, które mogą ukraść.Niewiarygodne, że potrafią uczynić to straszne życie jeszcze gorszym."
encyclo_tile54_0="Monumentalna świątynia, która niegdyś pławiła się w wiecznie palącym słońcu. Jej mury gromadziły wystarczająco dużo ciepła, by ugotować otaczające ją głębokie piaski - ale nie dość, by ogrzać mieszkańców zigguratu tęskniących za blaskiem niebiańskiej kuli.#Magia tego miejsca jest bardzo prosta - a także bardzo bezużyteczna. Z magią czy bez, wszystko prędzej czy później zamieni się w piasek. Ziggurat jedynie przyśpiesza ten proces w tak niewielkim stopniu."
encyclo_tile55_0="Chata czarownicy jest niepozorna, a jednocześnie przerażająca. Być może chodzi o kontrast: otaczające ją ziemie są surowe i ponure, podczas gdy chata jest schludna, domowa i przytulna. #Wiedźmy zwykle unikają towarzystwa - ale najwyraźniej znają znaczenie porządku i piękna, zwłaszcza w swoim rzemiośle. Wszystkie różne zioła lecznicze są uporządkowane według rodzajów; każdy eksperyment jest chronologicznie zapisany na papierze; a fiolki na półkach są posortowane według koloru płynów w środku. Nawet biedne ofiary ich nieudanych eksperymentów są skrupulatnie pochowane w pobliżu, ułożone w porządku znanym tylko samej czarownicy."
encyclo_tile56_0="Krzewy tworzące makie brzydzą się każdym ordynarnym wtargnięciem w ich dobrze ułożoną rutynę. Każdy, kto sprzeciwia się postawie miejscowej flory, może spodziewać się kilku zadrapań na skórze i cierni w ciele - delikatnego przypomnienia o zachowaniu dystansu i poszanowaniu przestrzeni osobistej. Miejscowa fauna szybko uczy się, że przedzieranie się przez cierniste gałęzie to zły pomysł i polega na zwinności. Nieostrożny drapieżnik, który postawi wszystko na jeden zabójczy skok, może skończyć z podrapaną paszczą zamiast pełnym brzuchem."

encyclo_enemy0="Potwór zbudowany z gęstego, półprzezroczystego, śluzu. Żywi się materiałem organicznym, otulając go i trawiąc - oczywiście tak długo, jak ofiara nie walczy. A jeśli to zrobi, szlam zrobi wszystko, by to naprawić".
encyclo_enemy0_0="^Szlam jest wynikiem magicznych prób stworzenia życia.Są to prymitywne bestie, z nielicznymi sposobami interakcji z otoczeniem, z których wszystkie obracają się wokół znalezienia i skonsumowania pożywienia.Kiedy szlam osiągnie krytyczną masę ciała, podzieli się na dwie części.Każda nowa kopia jest identyczna z oryginałem, aż do każdej pojedynczej komórki w jej ciele, już przygotowana do wykonywania wszystkich tych samych funkcji.Jest doskonała w swojej prostocie i obrzydliwa w swojej naturze. Czyjeś głupie zabawy z magią kosztowały wiele istnień.^#- Hivaru Shatt, ^Mniejsze Kompendium Bestii^"
encyclo_enemy0_1="^Dawno temu, w krainie daleko, daleko, urodził się pierwszy poszukiwacz przygód.#Wziął pierwszy miecz i otworzył drzwi pierwszego lochu.#A tam już czekał na niego szlam.^#- Pismo o pochodzeniu wszystkiego"
encyclo_enemy0_2="^Przepis na szlamową lazanię jest tak prosty, że nawet sam cholerny szlam mógłby ją zrobić.Jedyną podstępną rzeczą jest przetrwanie degustacji.^#- Thordon Damsay, ^Szlam na talerzu^ bojowa książka kucharska"
encyclo_enemy1="Wojownik, który poległ w walce, długo pogrzebany i rozłożony. Obudzony ze śmierci jak z agonalnego snu, a już nastawiony na walkę, która według nich nigdy się nie skończyła. Cmentarz to oczywiście dość niebezpieczne miejsce, a kremacja jest dużo bardziej praktycznym wyborem. Ale pozbawianie zmarłych szansy na powrót tylko z powodu naszego pragnienia bezpieczeństwa byłoby jawnym brakiem szacunku - nawet jeśli wszystko, co wraca, to kupa kości, trochę zardzewiałego sprzętu i spokojna furia."
encyclo_enemy1_0="^Jak uczęszczasz na cmentarz, by opłakiwać zmarłego krewnego, możesz ryzykować, że faktycznie spotkasz tego krewnego przechadzającego się wśród grobów.#A myśl o próbie rozmowy z nim może okazać się śmiertelna.#Kiedy zmarły przechodzi przez zasłonę, która oddziela jego świat od naszego, jego umysł staje się zaślepiony jedynym pragnieniem - zmniejszenia liczby żywych.^#- Monica Oscuro, kronikarka z Morrell"
encyclo_enemy1_1="^Szanowni obywatele!#W zeszłym tygodniu widziano dym unoszący się nad krematorium.#Jesteśmy głęboko rozczarowani tym incydentem.#Nasz wielki cmentarz, położony na obrzeżach miasta, jest w połowie pusty.#A groby są szczególnie miękkie o tej porze roku.#Szczerze liczymy, że w przyszłości podejmiecie właściwą decyzję.^#- Ulotka kultu nekrotycznego"
encyclo_enemy1_2="^Stawka kości, co? #Każdy szkielet to wojownik, wykuty w bitwach i w samej śmierci! Chodząca forteca gniewu i popiołów! Przez lata gromadzili ten gniew w swoich grobach. Teraz wrócili i są całkiem pewni, że mają siłę, by owinąć twoje wnętrzności wokół swoich mieczy! ^# - przemówienie powitalne sierżanta Dobbiego Jaspera dla nowych rekrutów jednostki grzebiącej w ziemi."
encyclo_enemy2="Można by powiedzieć, że to po prostu olbrzymi szczur leśny, gdyby nie jego wilcze zachowanie. Kiedy szczurowilk walczy, zawsze stara się odrzucić ofiarę, by przejść do gardła. Szczurowilki mają bardzo grube skóry i są w stanie szybko wyleczyć nawet najcięższe rany. Jedyną rzeczą, która powstrzymuje szczurowilki przed staniem się wszechobecnym i niemal niezniszczalnym zagrożeniem, jest ich przywiązanie do lasów, gdzie znacznie łatwiej jest im się ukryć i polować."
encyclo_enemy2_0="^Podczas swoich podróży poszukiwacze przygód nie powinni rozbić swoich obozów w gajach czy lasach, jeśli mają możliwość zrobienia tego na otwartych równinach.#^Czuję, że obserwuje mnie tysiąc oczu,^ - powiedziałby ostrożny człowiek podczas rozbijania obozu na pustkowiu.#^Tutaj jest bezpiecznie. Drzewa ukryją mnie przed wzrokiem wszystkich,^ - powiedziałby przyszły obiad szczurowilka.^#- Monika Oscuro, kronikarka z Morrell"
encyclo_enemy2_1="^Romea i Julek^ to brawurowe dzieło opowiadające historię dwojga kochanków. Idąc na przekór społeczeństwu, postanowili spotkać się w gaju przylegającym do granicy, gdzie głodny szczurowilk położył kres ich nadziejom na szczęście.Dzieło jest pełne symboliki, filozofii i bardzo szczegółowych opisów ucztującego szczurowilka.^#- Moira Moreau, kronikarz dla ^Morrell Courier^"
encyclo_enemy2_2="Ivor poszedł upolować jakąś zwierzynę pewnego gorącego dnia w lecie:#Zabrał swój łuk, trochę wina i jedzenia - dla odpierania głodu.#Szukał i szukał: ^Nie było żadnej zwierzyny w zasięgu wzroku! Jakby wszystko zniknęło!^ - #I zjadł jedzenie po drodze: wino nawet szybciej wypił.#^Dzień był nudny, dzień minął. Muszę się odlać!^#Zobaczył krzak, zdjął spodnie, dookoła nie zaglądał.^Złośliwe warczenie za plecami - zaskoczyło go!^ Szczurowilk gapił się przez liście, głód w oczach!^ A Ivor skoczył i biegł po życie, drzewa przelatywały obok niego:^Czy spodnie to jedyna strata dzisiaj?^ - pytali wieśniacy.^- Ludowa piosenka o Ivorze Głupku"
encyclo_enemy3="Złośliwe plemię zamieszkujące górskie regiony. Zwykle wyruszają na zewnątrz w małych grupach, aby znaleźć łupy, zdobyć wiedzę lub po prostu dla zabawy. Cywilizowani na tyle, by używać narzędzi, ale nie na tyle, by angażować się w pokojowe negocjacje. Ich zęby są ostre jak brzytwa, ale w bitwach zazwyczaj wolą używać sztyletów. Głównie dlatego, że zbyt trudno jest gryźć i kląć jednocześnie."
encyclo_enemy3_0="^Gobliny potrafią w bardzo krótkim czasie nauczyć się naśladować wszystko. Jest nawet historia o goblinie, który nauczył się pisać książki, nie potrafiąc jednocześnie czytać. I jego powieści były całkiem niezłe, podobno.^#- Jak opowiadała nieznana osoba"
encyclo_enemy3_1="^Starcy mówią, że góry rosną#W czasie gdy gobliny budują swoje domy.^#Im więcej goblinów w norach,#tym więcej krwi z gór płynie.^#- Rymowanka dla dzieci"
encyclo_enemy3_2="^Kilka lat temu wraz z oddziałem kapitana Houndshielda natrafiliśmy na pijanego goblina. Unikał on naszych ostrzy jak szczur cyrkowy i ściął czterech naszych ludzi.#Po tym, jak w końcu udało się zabić szkodnika, kapitan przeciął go na pół. Jednak smród jaki wydobywał się z jego zwłok był tak plugawy, że Kapitan natychmiast umarł tam gdzie stał.^#- Sierżant Dobbie Jasper o ^zabójczych goblinach^"
encyclo_enemy4="Ślad po skróconym życiu, powstały z zimna i niemożności pojmowania własnego upadku. Duchy zawsze są antropomorficzne, nawet jeśli za życia nie były ludźmi. Możliwe, że każda istota widzi duchy na swój sposób, interpretując obraz w sposób najwygodniejszy dla swojego umysłu."
encyclo_enemy4_0="^Gdy człowiek o silnym duchu stanie w obliczu śmierci, jego dusza objawi się w postaci ducha.Duchy mogą mieć różne kształty i usposobienie. Niektóre z nich mogą być całkiem inteligentne, podczas gdy inne są po prostu bezmyślnymi istotami przywiązanymi do jakiegoś przedmiotu. Istnieją powody, by wierzyć, że duchy posiadają zdolność do ewolucji, dzięki wykorzystaniu pewnych tajemniczych artefaktów...^#- Fragment z książki Johna Joderly'ego ^Akademickie Pościgi^".
encyclo_enemy4_1="^Rodzina lady Camille była absolutnie pewna, że była ona dość okropna jako osoba i jeszcze gorsza piosenkarka za życia.#Po jej śmierci wszyscy ludzie, którzy mieszkali w promieniu mil wokół jej zamku, dostali szansę, by przekonać się o tym osobiście.^#- Cytat z ^Dolina Upiornych Krzyków - Przewodnik turystyczny^"
encyclo_enemy4_2="^Większość ludzi umiera w agonii, albo przed czasem, albo przemocą. I prawie wszyscy mają jeszcze jakieś niedokończone sprawy. Dlaczego więc duchy są tak rzadkie? Czy coś jeszcze jest potrzebne, by utrzymać duszę na tym świecie? #Są sposoby na przypięcie duszy do naszego świata, gdy osoba jeszcze żyje: tak rodzą się duchy.#Jest mnóstwo sposobów na zapłacenie częścią swojej duszy. Potrzebuję więcej tematów, by wypróbować je wszystkie...^#- Z pamiętnika nieznanego nekrotycznego kultysty"
encyclo_enemy5="Ogromne rozmiary nie robią nic dobrego dla przetrwania czy zwinności tej istoty, czyniąc ją stosunkowo łatwym celem. Kolejną cechą odróżniającą ją od innych pajęczaków jest jej wspólnotowy sposób życia, ściśle przypominający życie pszczół czy mrówek. Do zabijania swoich ofiar używa organicznego ostrza ukrytego w odwłoku."
encyclo_enemy5_0="^ Ważnego odkrycia dokonano, gdy stwierdzono, że pająki te żyją w symbiotycznym związku z groźnym pasożytem zamieszkującym odwłok pająka. Główną bronią pajęczaka jest tak naprawdę kolczasty wyrostek wspomnianego pasożyta. Rozpuszczająca trucizna kłów pająka używana jest tylko w ostateczności.#Pasożyt odpowiada również za rozrost tkanki mięśniowej pająka. Może to tłumaczyć gigantyczne rozmiary, które zazwyczaj są nieosiągalne dla pajęczaków.^#- Hivaru Shatt, ^Mniejsze Kompendium Bestii^"
encyclo_enemy5_1="^Po zobaczeniu gigantycznego pająka nie powinieneś próbować wpatrywać się w niego.#Zamknij oczy, zrelaksuj się i pomyśl o miękkich szeleszczących dźwiękach pól pszenicy. Zawsze lepiej jest umrzeć myśląc o czymś miłym.^#- Torrens Lanworth, ^Wspomnienia starego Łowcy^"
encyclo_enemy5_2="^Większość ludzi powie ci, że oczyszczanie ziem z kolonii pająków jest bardzo ważne.^#Ale miałbyś problem ze znalezieniem tych, którzy będą twierdzić, że pojedynczy kokon nikomu nie przeszkadza.^#Szczątki tych ludzi zwykle znajdują się wewnątrz wspomnianego kokonu.^#- Ludowa mądrość."
encyclo_enemy6="Rolnicy wierzą, że będzie on strzegł ich upraw przed nieproszonymi gośćmi. Czasami ta ^ochrona^ jest brana zbyt daleko. Takie praktyki są dość niebezpieczne, ale strachy na wróble bardzo dobrze strzegą upraw i zazwyczaj nie robią krzywdy swoim naiwnym twórcom. Co do wszelkich obcych, którzy mają pecha znaleźć się na polu pszenicy... Cóż, dobre zbiory na zimę są znacznie ważniejsze niż jacyś obcy odchodzący z życiem."
encyclo_enemy6_0="^Byłam świadkiem wiosennego rytuału siewu. Śpiew, taniec i ustawianie strachów na wróble. Nie mają pojęcia, co kryje się w tych prastarych tradycjach.Ich wiosenny taniec to nic innego jak rytuał zaczarowania tych sztucznych opiekunów. Pieśni zawierają wersy w pradawnym języku: nakazy ochrony plonów przed wszystkimi poza ludźmi obecnymi na rytuale.#Próbowałem im to wyjaśnić, ale tylko się roześmiali i nalali mi jeszcze trochę piwa.^#- Wspomnienia podróżującego maga"
encyclo_enemy6_1="^Kruki, zrodzone z poczerniałych dusz, szepczą do strachów na wróble - #o drogocennym blasku złota,#o krwi, czerwonej jak kamienie szlachetne,#o żniwach, które nadejdą...^#- Patrick McWalch, ^Za topolami^"
encyclo_enemy6_2="^Zaczaruj swojego stracha na wróble za jedyne pięć srebrnych monet! Chroń swoje uprawy przed złodziejami!#A jeśli twój mąż spróbuje wsadzić swoją marchewkę w jakąś inną kobietę,#Będzie musiał pożegnać się ze swoimi pomidorami!^#- Matka Mellon".
encyclo_enemy7="Solidna skrzynia wykonana z drewna i metalu. Dość pospolita rzecz. Zupełnie niewarta uwagi, w porównaniu do jej zawartości."
encyclo_enemy7_0="^To straszne bestie często niedoceniane przez poszukiwaczy przygód.Mogą zmiażdżyć ci palce swoimi ciężkimi pokrywami, a nawet skaleczyć cię ukrytym w środku sztyletem! I nawet nie zaczynaj mi mówić o wszystkich drzazgach!^#- Wymówki tchórzliwego bohatera".
encyclo_enemy7_1="^...Dzień 738 w poszukiwaniu Skrzyniarza. W ciągu ostatnich kilku miesięcy znalazłem i sklasyfikowałem siedem kolejnych skrzyń.Najwcześniejsza z tej gromadki ma około pięciu wieków, a jedna z nich została wykonana niecałe trzy lata temu - ale obie z pewnością zostały wykonane przez tego samego rzemieślnika!#Właściciel tej ostatniej skrzyni powiedział mi, że wykonał ją jego wuj. Mam nadzieję, że to nie jest kolejny ślepy zaułek...^#- Z pamiętnika poszukiwacza skrzyń"
encyclo_enemy7_2="^Mój przyjaciel Toasty właśnie nie przestawał jojczyć o nowej swojej skrzyni. Szwagier Toasty'ego kopnął wiadro i skończył w skrzyni, heh-heh. Więc Toasty skończył ze skrzynią.#Powiedział mi, że szwagier przywlókł ją z jakiegoś pola bitwy czy innego. Najpierw chwalił się, że ten mebel uczynił go szlachetnym, a teraz przeprasza za to! Powiedział, że słyszy głosy, widzi cienie i takie tam. Pewnej pięknej nocy przybiegł do mojego domu i zaczął walić w drzwi i wyć z bólu - powiedział, że skrzynia była otwarta i go obserwowała, i to po tym, jak ją zamknął! Powiedziałem mu, żeby się odczepił. Nie widziałem go od tygodnia...^#- Jedna z historii zebranych przez Gregora Podejrzanego"
encyclo_enemy8="^Szlachetny żywiący się krwią pospólstwa^ to bardzo żywe określenie: rzecz w tym, że nie jest to tylko gra słów. Wampir cieszy się nieskończoną długością życia, oraz fenomenalnymi zdolnościami fizycznymi, magicznymi i intelektualnymi. Wszystkie te cechy czynią z wampirów wielkich reformatorów i innowatorów. W dzisiejszych czasach jednak prawie wszystkie wampiry popadły w obłęd z powodu długiego pobytu w pustce i ogromnego głodu krwi. Walczą długimi pazurami twardymi jak kość, rozrywając ciało swoich ofiar."
encyclo_enemy8_0="^Wspólne korzyści to kamień węgielny cywilizacji. Jednak kiedy mówiłem ludziom z dalekich krain, że wampiry nas chronią, nie chcieli mi uwierzyć.#Nikt nie pamięta, kiedy podpisano pierwszą umowę. Wampiry oferują nam ochronę przed potworami i obdarzają nas wiedzą.Pod ich szlachetnym przewodnictwem nasze miasta kwitną!#Oczywiście, od czasu do czasu niektórzy ludzie giną, a od czasu zdarza się wioska pełna ghuli - ale to niewielka cena za tak hojne dary.^#- Jedno z opowiadań zebranych przez Gregora Podejrzanego"
encyclo_enemy8_1="^Wysłaliśmy Dudleya do hrabiego - by rozstrzygnął wiejski spór o dwie krowy, tak mu powiedzieliśmy. Pyskaty Dudley nie był mądry: nie wiedział, że jeśli pytasz o dwie krowy, to już nie wracasz.^#- Dzień z życia wsi"
encyclo_enemy8_2="^O Mariuszu, nie mogę się doczekać, kiedy lewe skrzydło zamku zostanie wykończone. Robotnicy-słudzy stali się zbyt powolni: być może zbyt łagodnie podchodzę do nich.#Oni wciąż się płaszczą, nawet gdy zjadam tylko jednego lub dwóch na miesiąc. Ostatniego wysłałem posłańca do wioski, aby przynieśli mi ich więcej.^#- Fragment zaginionego listu"
encyclo_enemy9="Potężny martwy mag. Kosmiczne sztormy wypełniają jego istotę zimnym światłem odległych gwiazd. Pałac, z którym podróżuje, służy dalszemu wzmacnianiu i tak już przerażającego czarodzieja, gdziekolwiek się znajdzie."
encyclo_enemy9_0="Jakiś czas temu naszła mnie myśl: a co jeśli jestem za młody na taką magiczną moc? Co jeśli moje młodzieńcze pragnienie ^naprawienia^ tego świata jest zbyt potężne? Zbyt łatwo jest mi wpaść w pułapkę i założyć, że tylko ja znam jedyną prawdziwą ścieżkę dla całego istnienia. Obawiam się, że nie będzie nikogo, kto byłby w stanie mnie powstrzymać. Magiczna społeczność toleruje mnie tylko z konieczności. Nie mają sposobu, by mnie skrzywdzić, choćby nie wiem jak się starali.#Mój wachlarz zaklęć ochronnych na moim ciele potrafi zautomatyzować jego funkcje i przekracza wszelkie oczekiwania. Pamiętam, jak działacz na rzecz Rady przemycił truciznę do mojego jedzenia, gdy przyszedł zabiegać o moje członkostwo. Podwoiłem się z bólu i choroby - ale zaklęcia ochronne przejęły kontrolę. Ciało potrafiło tak szybko i sprawnie pokonać truciciela w magicznym pojedynku i opracowało antidotum na bazie resztek jedzenia - a może wymęczyło niezbędną wiedzę z wciąż żyjącego truciciela? Teraz nie wiadomo.#Muszę nadal ulepszać swoje dzieło. Tyle niedokończonych badań, a tak mało czasu. A gdyby tak zautomatyzować moje ciało podczas snu? To byłoby bardzo wydajne."
encyclo_enemy9_1="Tylko rozpad kosmosu martwi mnie nadal. Entropia jest bezlitosna. Wszystkie rodzaje energii nieuchronnie rozpraszają się, gdy zapanowuje statyczna jednorodność. Mam moc sprawić, by gwiazdy na niebie zamieniły się miejscami, mogę oddzielić ekspansje od wszelkiego innego istnienia, mogę widzieć i wchłaniać niezbędne strumienie rzeczywistości - a jednak nie mogę zatrzymać entropii. Ta bezradność ciąży na mnie. Jeśli zawiodę, nie pozostanie nikt, kto by to zrobił.#Moje zaklęcia ochronne - a dokładniej zaklęcia imitacyjne - to moje magnum opus. Z wiekiem zaczynam częściej tracić przytomność, a utkana tablica zaklęć przejmuje kontrolę. Za każdym razem, gdy się budzę, widzę, jak naprawdę doskonałe jest moje dzieło - każda decyzja, cała praca, notatki i eksperymenty... Jakbym stworzył je w czasach swojej świetności. Nawet rzadki błąd jest tam, gdzie sam bym go popełnił. Ta imitacja jest bezbłędna: Nie jestem nawet pewien, czym jestem w tej chwili. Czy jestem starcem pełnym rozsądku i zdrowia - czy splotem kontrolującym nieświadome słabe ciało?"
encyclo_enemy9_2="Jestem martwy. Pytanie o to, kim jestem, jest teraz bezprzedmiotowe". Smutek i żal. Dobrze: oznacza to, że byłem na tyle przebiegły, by uwzględnić emocje w imitacji. Moje decyzje nie byłyby bez nich dokładnie ^moje^. Nie ma już powodu, by zachować ciało: to byłoby niepraktyczne. Szkielet powinien wystarczyć. Można by pomyśleć, że moje obecne niezależne istnienie jako tablica zaklęć jest punktem końcowym. Ale nie popełnię tego błędu. Wszystko, co nie ewoluuje, skazane jest na zapomnienie. Nawet bez mojego pierwowzoru mam wiele możliwości do poprawy.#Rozwiązanie entropii wciąż mi się wymyka. Na szczęście ograniczenia wynikające z krótkiego czasu życia już nie istnieją i mam cały czas na znalezienie odpowiedzi.#Moje stare obliczenia dotyczące dynamicznej ekspansji wszechświata są błędne: strefa niebytu poza galaktykami Ism i Oruk istniała zawsze. Ale dlaczego nie uwzględniłem tego prostego faktu u podstaw wszystkich moich badań?"
encyclo_enemy10="Zlepek mięsa, kości i drewna. Łatwy do pomylenia z nieumarłym stworzeniem, leśny golem jest w rzeczywistości owocem drzewa krwi. Może przetrwać ledwie tydzień, ale w tym krótkim czasie jest w stanie złamać wiele kręgosłupów. Samo masywne ciało jest groźną bronią: niewiele stworzeń może przetrwać bezpośrednie uderzenie ciężkim, mięsistym ramieniem."
encyclo_enemy10_0="^Mój Dziadzia opowiadał mi kiedyś o czerwonych zaroślach. To było wokół północnej drogi, powiedział, gdzie on i jego przyjaciel zwykli zbierać grzyby.#Jednego dnia wyskoczyła na nich ogromna tusza, żebra wystające i wszystko.#Zabiła przyjaciela dziadka jednym uderzeniem, a potem po prostu się rozpadła - gorąca para i kawałki mięsa, i to wszystko.#Potem czerwone drzewa wyrosły na całej tej drodze, i nikt już tam nie chodzi.^#- Dzień z życia na wsi"
encyclo_enemy10_1="^Jeśli zgubisz się w gaju krwi, zawsze znajdziesz drogę powrotną. A przynajmniej jakaś część ciebie to zrobi. Kolano, albo obojczyk - zależy od tego, ile masz szczęścia.^#- Horacy z Frogchester, ^Złe zwyczaje lasów: o Leśnych Golemach^"
encyclo_enemy10_2="^Krwawy gaj nie żywi się całym mięsem, które pochłania.#Najlepsze kawałki są wykorzystywane do stworzenia leśnego golema - sposobu rozmnażania nasion przez gaj.#Nienaruszony szkielet antropomorficznej istoty służy jako struktura bazowa golema. #Mózgi czujących gatunków są wykorzystywane do kontrolowania różnych mięśni, które są przypadkowo przymocowane do tuszy kości.^#- Hivaru Shatt, ^Mniejsze kompedium bestii^".
encyclo_enemy11="Niektóre zaklęcia są tak potężne, że sam akt przepisania ich na papier może mieć tragiczne konsekwencje. A jeśli takie zaklęcia zostaną zapchane do jednej oprawionej księgi, nie wyniknie z tego absolutnie nic dobrego. Nawet przewrócenie jednej strony może wystarczyć, by biedny czytelnik zmienił się w popiół. Tomiszcze nie dba o to, czy chcesz - lub możesz - w ogóle go czytać: w końcu księga nie odpowiada za to, czy przetrwasz całą zawartą w niej mądrość."
encyclo_enemy11_0="^Wciąż nie mogę zasnąć od czasu tego incydentu. Cały czas potykam się o półki z książkami.#Miałam jedynie zwykłe jesienne przeziębienie, nic szczególnego. Potrzebowałam tylko chusteczki - a ta strona akurat była pod ręką.#Myślałam, że była już wyrwana, kiedy ją wzięłam.#Przysięgam, że to nie moja wina! Byłam pijana! A teraz chodzi za mną cały czas...^#- Dziwnie napisana notatka##^Pan Budar został znaleziony martwy w miejskiej bibliotece. Przyczyna śmierci: stara książka spadła z półki i na jego głowę. Zalecam zamknięcie tej sprawy.^#- Pisemny raport inspektora Angusa"
encyclo_enemy11_1="^...Nie trzeba się spieszyć. Nie nauczę się nowego zaklęcia, dopóki nie wygram dziesięciu kolejnych pojedynków...#...Nah, nie mogłem się powstrzymać, heh-heh. Każde nowe zaklęcie jest jeszcze lepsze od poprzedniego...#...Co za wspaniała książka, jest po prostu magiczna! Byłbym martwy, gdyby nie podszepnęła mi receptury na uroki ochronne. Obiecałem, że się powstrzymam, ale dlaczego miałbym to robić, skoro może mnie to kosztować życie...?#...To była ostatnia strona. Teraz jestem mądrzejszy od książki. Stworzyłem nowe zaklęcie, potężniejsze niż wszystko inne w tej książce! Wkleiłem nową stronę do środka - może książka ją polubi...#...Dostała to, czego zawsze chciała. Teraz już nie będę długo na tym świecie...^#- Wspomnienia nieznanego czarodzieja"
encyclo_enemy11_2="^Młody Gavin wziął tajemniczą księgę z zakurzonej półki,^#-Gavin czytał.Zamarł w miejscu, jego myśli ścigały się jak szalone,^#- Oczy Gavina były szeroko otwarte z przerażenia, już przeglądał kolejne linijki. #^Mistrzu Lorinbrag, ta książka - czy ona mnie czyta...? ^# - Ale wzrok Gavina zaczął się rozmywać, zanim pytanie, które właśnie przeczytał, zdążyło wydostać się z jego ust.#- ^Zapiski, które właśnie czytasz^"
encyclo_enemy12="Połączenie starożytnego głodu, ogromnej wiedzy i umiejętności czytania. Wampir, który ogarnął tajemnice magii, jest zdolny do niesamowitych wyczynów - szkoda, że ich obecnym priorytetem jest napełnianie żył twoją krwią. Ale czego innego oczekujesz od nich? Ich pragnienie wiedzy zostało zaspokojone; pozostało jedynie pragnienie krwi".
encyclo_enemy12_0="^Naszą rodzinę dręczy nuda nieśmiertelnej egzystencji. Szukałem sposobów na zajęcie umysłu - i ku mojemu nieszczęściu znalazłem je.#Przez moje frywolne wtrącanie się w magię, noszę teraz ciężkie brzemię ukrytej wiedzy. Sama magia obezwładniła mnie poprzez strony starożytnego tomu.#Manipuluje mną. Pokazuje mi katastrofalne skutki moich zaniechań i ujawnia łatwe sposoby ich zmiany. Nie jestem już znudzony. Teraz jest strach, którego nigdy nie czułem... Czy jestem teraz szczęśliwy? ^#- Z archiwum prywatnych listów szlachty"
encyclo_enemy12_1="^Nasza hrabina zwiędła; nie je już od pół roku. Z początku byliśmy szczęśliwi, nie ma już dziur w szyjach i takich tam. Ale ona jest zbyt surowa dla siebie.#Nie dba o nas. Jedyne, o czym teraz myśli, to jej magiczne rytuały. Trudno jej wytrzymać. #Mogłabyś zapytać o to swojego hrabiego? Może on będzie w stanie pomóc. Nic dobrego nie przyjdzie, jeśli zostaniemy sami bez naszego opiekuna.^#- List od starszego wioski"
encyclo_enemy12_2="^Wiedza, Mariuszu - rozumiesz? Tylko to mnie teraz obchodzi. Poszukiwanie prawdy - a nie niskie, bestialskie popędy, które miałem wcześniej.^#Wczoraj przeprowadziłem eksperyment w pobliżu świątyni burzy: próbę złapania pioruna do szklanego słoja, przy pomocy sług z mojej wioski.^#Niestety, nie udało mi się, wszyscy usmażyli się na śmierć. Ale nieważne. Wypiłem ich wrzącą krew, naturalnie, ale wciąż błądze.^#- Fragment zaginionego listu"
encyclo_enemy13="Owad o niesamowitych rozmiarach i wilczym głodzie. Wyobraź sobie krwiopijcę z parą skrzydeł, który wydaje straszliwe brzęczące dźwięki: ten opis całkiem dobrze pasuje do tego stworzenia. Takie komary żyją zazwyczaj na bagnach wypełnionych cuchnącymi gazami. Co niezwykłe, wydają się nie być w stanie powstrzymać się od ^żerowania^ na swoich ofiarach nawet wtedy, gdy są wypełnione krwią, i często zjadają więcej, niż ich chitynowy pancerz jest w stanie udźwignąć."
encyclo_enemy13_0="^Komar bagienny jest tak nienasycony w swoim głodzie, że nie przestanie się pożywiać, dopóki jego odwłok nie eksploduje.#Wybuch może być na tyle potężny, że może zranić lub nawet zabić inne istoty za pomocą ^odłamków^ ciała owada. Jak to się stało, że gatunek komara olbrzymiego wciąż istnieje? #Dla własnego przetrwania pojedynczy komar potrzebuje tylko dziesiątej części krwi, którą spożywa. Większość wypijanej przez niego krwi służy do karmienia jaj ukrytych w jego podłużnym dolnym ciele.#Nadmiar krwi zacznie wypełniać brzuch dopiero wtedy, gdy wszystkie jaja zostaną odżywione - a gdy komar eksploduje, jaja zostają rozrzucone na dużym obszarze.^#- Hivaru Shatt, ^Mniejsze kompendium bestii^"
encyclo_enemy13_1="^Zwykłe malutkie komary w zupełności wystarczały do zapylania bagiennej miodunki. Ale nie, musieli sprowadzić te gigantyczne bestie z dalekich torfowisk!#^Nasza produkcja będzie niebotycznie wysoka^, mówili! Jagody będą wielkości domu^, mówili! Będziemy je sprzedawać na całe królestwo^, mówili!#Cóż, gratulacje! Teraz nie tylko nasze plony są wysuszone, ale nasze żyły również!^#- Sidor, rolnik z drugiego końca Kanionu".
encyclo_enemy13_2="Ivor poszedł kiedyś do lasu#I próbował znaleźć jakieś jagody.Potrzebował cały koszyczek#Aby zrobić trochę domowej ognistej wody.Szukał godzinami i nic nie znalazł,#^Żadnej jagody!^Cóż, w takim razie pójde na bagna - #Nie boje sie jak jakaś stara panna! Zaczął je jeść, gdy szedł, ale wkrótce tego pożałował. Nie zawędrował zbyt daleko - i tylko komary delektowały się jagodowym smakiem głupka Ivora. Ludowa piosenka o Ivorze Głupku.
encyclo_enemy14="Jeden z niewielu rdzennych gatunków tych dziwnych czasów, mroczny szlam czuje się bardzo dobrze w ruinach zapomnianego już świata."
encyclo_enemy14_0="^Konfiguracja planety. Naruszenie integralności 0-14v2. 1.#Stwór nie znika w granicach punktu zerowego po usunięciu źródła kwintesencji [4 przypadki].#Tymczasowo zastąpiony koncentratem kosmosu, wymagane dalsze badania.^#- Raport [WYMAZANO]".
encyclo_enemy15="Biedak wyssany do sucha przez wampira. Chodzący trup szukający żywego ciała, aby zrekompensować życie, które zostało mu odebrane. Służy woli wampira, ale nie może odpocząć nawet po śmierci swojego pana. Rzadkie jęki tych istot są jedynie próbą naśladowania aktu oddychania żywej istoty i nie należy ich mylić z wezwaniami do pokojowej komunikacji."
encyclo_enemy15_0="^Cztery dni temu hrabia złożył nam wizytę, by opowiedzieć dzieciom o swoich dzikich braciach i o tym, dlaczego powinniśmy się dobrze zabezpieczyć przed ich kłami i pazurami.#Długo nam zajęło przekonanie dzieciaków, że ^półmartwi wieśniacy o pustych oczach i zgniłych sercach^ to tylko... Jak to było... Me-tafora.^#- Dzień z życia na wsi"
encyclo_enemy15_1="Droga była zamknięta w nocy:#Dziadek o imieniu Ivor miał stracha.^Para ghuli ze zgniłymi zębami:^Nie jesteście moimi towarzyszami!^#Rzucił swój topór - pierwszy odpadł:^Nakłuł drugiego z krzykiem.^Walka wydawała się łatwa!^ - ale niestety,^Pierwszy nogami już szyki gmatwa.^- Piosenka ludowa o Ivorze Głupku"
encyclo_enemy15_2="^Wieża przez noc pojawiła się na wzgórzu. Mężczyźni wzięli swoje siekiery i poszli zobaczyć co się dzieje.#Mój mąż od powrotu nie był sobą. Nie je, tylko wpatruje się w ścianę i mamrocze coś dziwnego.#Zamknęłam się w pokoju z dziećmi. Jutro pójdę do szwagierki. Może ona będzie w stanie pomóc.^#- Zużyta na czas notatka"
encyclo_enemy16="Ożywiony szkielet to żywy trup wyzbyty tkanki miękkiej. Ale kto powiedział, że utrata części kości na pewno zakończy jego istnienie?"
encyclo_enemy16_0="^Nie dziwi mnie nawet, że szkielet walczy jeszcze bardziej wściekle po tym, jak rozwalisz mu rękę lub nogę.#Te kości i szczątki to jedyne, co im zostało, a teraz zabierasz nawet to.#Niekiedy staje się tak wściekły, że trzaska w twoją tarczę tak mocno, że ostatnie kości zamieniają się w pył.^#- Trochę plotek"
encyclo_enemy16_1="^Jeśli zmiażdżysz głowę szkieletowi, nie myśl, że twoja głowa nie może zostać zmiażdżona w następnej kolejności.^#- Ludowa mądrość"
encyclo_enemy16_2="^Profesor mówił, że moje eksperymenty nie dadzą żadnych rezultatów, ale się mylił!#Sześć żeber i jedna szczęka to więcej niż wystarczająco, by pomieścić umysł, a kręgi można zastąpić kośćmi paliczkowymi!#Teraz nadchodzi mój kolejny etap: rozszczepienie jednego pełnego szkieletu na dwa częściowe.^#- Z zeszytu laboratoryjnego znalezionego na prawej połówce aplikanta Szkoły Nekromancji."
encyclo_enemy17="Jeśli chodzi o tworzenie życia poprzez kucie i formowanie metalu, rzemieślnicy z Gildii Kowali osiągnęli wiele imponujących wyczynów. Te ich ^wynalazki^ często widuje się wędrując po wsiach: brzęk zbroi i jęki rozpaczy z powodu nieznajomości swojego miejsca na świecie wystarczą, by wzbudzić przerażenie u zwykłych ludzi."
encyclo_enemy17_0="^...Tak, widziałem jednego wczoraj. Dokładnie taki jak opisałeś.#Staroświecka zbroja, zadawanie dziwnych pytań - nawet nie poprosił o napój czy plotki. Chciał tylko wejść na nasz dach i oglądać gwiazdy.#Zostawił jednak dobrą wskazówkę. Aha, nie patrz tylko na jedzenie - śmiało, spróbuj...!^#- Z rozmowy z Madam Agathą".
encyclo_enemy17_1="^Izolda, moja mała dziewczynka, ma już pięć lat. Spodobał jej się blaszany rycerz i powiedziała, że sposób, w jaki biega, jest taki zabawny! Powinien jednak maszerować... Ale jak na razie jestem z niego zadowolony.#Inna kombinacja uderzeń zaczarowanym młotkiem i trochę hartowania w roztworze ziół powinny załatwić sprawę... Myślę, że mogę nauczyć go tańczyć!# ------------------# Czeladnik obwiniał mnie o przegapienie wesela córki. Nawet o tym nie wiedziałem.#Moja zbroja może teraz pokonać tor przeszkód, a nawet potrafi znaleźć najkrótszą drogę przez niego - Prawdziwy triumf!^#- Notatki znalezione na stole w kuźni"
encyclo_enemy17_2="^Wczoraj wykułem mój najlepszy metal na wspaniały miecz dla generała Mangera.#Dziś zginął on w walce, gdyż mój miecz przecinał wrogów jak papier: ani jednego skrawka na ostrzu.#To samo dotyczy wszystkich broni, które tworzę. Ludzie są po prostu zbyt delikatni, by poradzić sobie z moim darem.I zamierzam to naprawić...^#- Szalony Henrik, genialny kowal".
encyclo_enemy18="Niewiele goblinów pojmuje pojęcie hierarchii, ale każdy goblin wie na pewno - przywódca zaprowadzi ich do najtłustszej zdobyczy i zastawi najlepszą zasadzkę. Wiedzą też, że życie w poddaństwie jest znacznie lepsze niż bycie zasztyletowanym - a jeśli ktoś tego nie wie, przywódca wyedukuje go w najbardziej bezpośredni sposób, jaki istnieje."
encyclo_enemy18_0="^Jednego dnia nasza załoga miała nowego rekruta: sprytny, Gorka się chyba nazywał.#Zawsze chodził owinięty w szmaty i inne rzeczy. Walczył za dziesięciu ludzi, a jadł za trzech. Nasz dowódca był zawsze zadowolony z takiej matematyki.#W rok później piliśmy razem, jak to się robi - wtedy sierżant uderzył go w głowę tak mocno, że spadł mu hełm. Pod tym hełmem zobaczyliśmy, że Gorka ma pysk goblina! #Ale wszyscy byliśmy już wtedy przyjaciółmi, więc po prostu wzięliśmy ten hełm, ładnie założyliśmy go z powrotem na głowę i nie powiedzieliśmy nikomu.#Nie mógł nawet pamiętać, dlaczego w ogóle dostał się do naszego oddziału. Więc po prostu został, by służyć z nami, szkoląc żółtodziobów.^#- Jedno z opowiadań zebranych przez Gregora Podejrzanego"
encyclo_enemy18_1="^Dwa dni temu gobliny straciły swojego przywódcę. Wygląda na to, że brak przywódcy ich przeraża.#Wybrały jednego goblina ze swoich szeregów, pozornie przypadkowo, i zaczęły go karmić!#Przynosiły mu jedzenie przez cały dzień, a nawet przeżuwały dla niego kości, żeby mógł jeść szybciej.#Masa mięśniowa goblina gwałtownie wzrosła, a jego zachowanie zaczęło się zmieniać.#Mało tego, zaczął krzyczeć na innych i bić ich za to, że są zbyt powolni...^#- Fragment raportu zwiadowcy"
encyclo_enemy18_2="^W każdej grupie goblinów zawsze znajdzie się przywódca. Nie tylko w walczącej bandzie, ale nawet w gangu o bardziej pokojowych celach.^Gobliny budowniczowie, kucharze, rzemieślnicy, nawet tak bardzo rzadcy rolnicy - zawsze mają przywódcę.^Poprzez bicie i przeklinanie, przywódca ten kieruje poczynaniami bandy tak, aby mogła ona osiągnąć swoje cele.^jak u ruskich,to jest gobliński sposób na wpajanie porządku i dyscypliny - co w sposób porażający przeczy pragnieniu goblinów do chaosu.^#- ^Przewodnik po taktyce i strategii inteligentnych stworzeń^"
encyclo_enemy19="Kierowana przez swoją wiarę, jest gotowa i chętna do karania heretyków i apostatów wszelkiej maści. Jej lodowate spojrzenie i ogniste przemowy przeszyją serce każdego. A jeśli nie - to przeszyją je miecze przyzwanych przez nią aniołów. Chroni się nieskazitelnymi oknami z kolorowymi witrażami, które rozpraszają oko i hipnotyzują umysł."
encyclo_enemy19_0="Sigma jest najlepszą z nas. Jest miła i pobożna; jej kazania są proste, ale tak szczere. Ona nie tylko ^wierzy^ - ona ^wie... Jej służba nie polega na łagodnym uśmiechu czy życzliwych słowach, ale na palącej nienawiści do wszelkiego zła i niesprawiedliwości.#Jej pielgrzymka prowadzi ją do najbardziej odległych krain, gdzie często odnosi rany tak ciężkie, że przeżywa tylko cudem. Każde zło, które napotyka, choćby wydawało się nie do pokonania, jest ścinane przez aniołów, których prowadzi. #Dlaczego tak bardzo wstydzę się spojrzeć jej w oczy? Czy to dlatego, że moja wiara jest zbyt słaba? Jak bardzo powinnam się modlić, jak bardzo powinnam zrezygnować, by stać się choć w ułamku taka jak ona? Jej ostatnia podróż zakończyła się porażką. Modlę się o jej zdrowie. Od dłuższego czasu nie było o niej żadnych wiadomości. To już się kiedyś zdarzyło. Wiem, że Niebiosa ochronią swoją najbardziej oddaną córkę, ale wciąż się martwię. Z powodu stresu ledwo mogę jeść. Siostry martwią się o mnie".
encyclo_enemy19_1="W ogóle nie czuję się dobrze. Każdego dnia mój duch słabnie. Jak Sigma mogła nas opuścić, kiedy tak jej potrzebuję? Zbyt wiele zgrzeszyłam... Jestem zbyt nieczysta. Gdyby tu była, całe to bluźnierstwo w mojej głowie po prostu rozwiałoby się jak chmura czarnego dymu.#Moje modlitwy dają mi siłę. Wykonuję tygodniową ciężką pracę w jeden dzień. A moje ciało już nigdy nie rośnie zmęczone. Czy to wynik moich modlitw o JEJ zdrowie? Moje włosy posiwiały, ale wszyscy mówią mi, że wyglądam jeszcze młodziej niż wcześniej. Ta choroba powinna zniknąć, jak tylko zobaczę naszą drogą Sigmę ponownie. Modlę się. Za wszystko. Nieustannie."
encyclo_enemy19_2="Przyniesiono mi moje ubranie. Wszystkie wątpliwości znikną dzisiaj. Ten pamiętnik nie ma teraz żadnego znaczenia, ale napiszę tę stronę ku pamięci naszej siostry. Mam pocieszać to, co pozostało z jej umysłu w jej ciele, dopóki nie zaniknie całkowicie. Bardzo mi przykro, że mój powrót oznacza kolejną śmierć - ale taka jest wyższa wola, więc to dla większego dobra. Ból związany z jej fizycznymi zmianami ustał. I jej duchowe cierpienie też wkrótce się skończy. Gdy ona zamyka oczy, ja - Sigma - otwieram te oczy, teraz moje. Powitam nowy dzień. I w imię wszystkich moich sióstr, ten dzień nie będzie na nic".
encyclo_enemy20="Łowca przemierza kosmos, szukając swojej ofiary. Jego ostry wzrok pozwala mu widzieć i śledzić wszystko niezmiernie daleko, na tyle, by jednym ostrym strzałem zgasić gwiazdę lub dwie. Jego wierne psy gończe zawsze są na miejscu, by zlikwidować planety, które nie są warte prochu. Tylko coś naprawdę niezwykłego zmusiłoby Łowcę do walki w zwarciu - coś, co zakłóciłoby jego zwykły styl polowania na cele."
encyclo_enemy20_0="Niektórzy mogą nazwać mnie egoistą, ale hej... Ja ^jestem^ egoistą, ale przydatnym egoistą. Ciągle ratuję ten świat nie dlatego, że kocham ludzi, ale dlatego, że oni kochają mnie. ^Dziękuję, dziękuję... Zawsze szczęśliwy, że mogę być twoim idolem. Do zobaczenia w następnym kataklizmie. Nie przegapcie go!!! To będzie zajebisty widok, obiecuję!^^ - i tak dalej, wiecie jak to jest. Jestem gotów wyrwać gardło największej złej bestii, byle tylko zobaczyć podziw w ich oczach. Tak zawsze mówiłem - ale nie każda metafora jest przeznaczona do urzeczywistnienia... Kosmiczny lewiatan przybył, by pożreć moją planetę. Z trudem mieściła się w jego paszczy. Głupia bestia. A tak, postanowiłem założyć pamiętnik. Niestety nie miałem pod ręką atramentu, więc musiałem inaczej zadowolić. Strzeliłem temu bezużytecznemu stworzeniu w gardło: i tak było to tylko marnowanie prochu (i mojego czasu też). Więc tak, masz rację - te słowa są napisane jego krwią. Przynajmniej jakiś pożytek z tego gigantycznego kawałka gówna".
encyclo_enemy20_1="Lata mijają. Nawet nie pamiętam, kiedy stałem się tak potężnym złodupcem. Przedostanie się z jednej gwiazdy na drugą zajmuje teraz mniej niż sekundę. Oczywiście istnieje sporadyczne ryzyko uderzenia w planetoidę (bezużyteczne sterty zamrożonych odchodów - pewnego dnia zmielę je wszystkie w pył). Nie ma istoty, która mogłaby rywalizować ze mną na jakiejkolwiek zamieszkałej planecie w tej galaktyce. Ale co można zrobić? Taki jest mój ciężar bycia fenomenalnym. Wystarczy mnie dla wszystkich. Będę chronił wszystkie zamieszkane światy. Będę miał więcej wolnego czasu, gdy moje czarnookie szczenięta podrosną. Spróbuję wtedy dotrzeć do następnej galaktyki - założę się, że oni też potrzebują idola i obrońcy. Ale najpierw muszę się uporać z tą postępującą pustką. Jeśli ktoś za nią stoi, nie pozostanie tam długo."
encyclo_enemy20_2="Zbliża się ciemność. Co się dzieje, do cholery! Dlaczego nikt nie zauważa gwiazd mrugających na niebie? Chyba nie mogę ich uchronić przed byciem kretynami, w przeciwieństwie do wszystkiego innego. Może popadam w paranoję? Ogary urosły od czasu ich narodzin w... Ile to było eonów temu? (Tak, o wiele łatwiej jest mi napisać w dzienniku pytanie retoryczne, niż próbować znaleźć faktyczną datę). Wystrzeliłem kilka pocisków smugowych w nadciągającą ciemność i mogę powiedzieć, że nasze spotkanie jest bliskie. Jasne, śmiało: moje ogary i ja czekamy na ciebie. A jeśli nie dam sobie z tobą rady - och, i tak nie pozwolę ci zdobyć tego soczystego kąska wszechświata. Mam dość mocy, by każdy jego kawałek nakarmić w czarną dziurę, wokół której krąży ta galaktyka. Przetrwam. Jestem ^Łowcą^. A każde zagrożenie dla tego świata jest moją ofiarą".
encyclo_enemy21="Wszechojciec i zwiastun wszelkiej śmierci. Początek i Koniec. Alfa i Omega. Zdolny do zniszczenia wszelkiego istnienia w mgnieniu oka, wciąż ceni ciężką pracę."
encyclo_enemy21_0="Alfa stworzył przestrzeń, czas, materię i temperaturę. Mając te cztery wielkości splecione ze sobą, zaczął tworzyć świat - nie ma bowiem innego przeznaczenia dla Stwórcy, jak tylko tworzenie, a nie ma prawdziwego Stworzenia, jeśli coś istniało przed nim. I tak przed Stworzeniem było tylko nic.#Alfa tworzył świat, który z kolei tworzył siebie. A podstawową zasadą tego świata była wielka i niekończąca się przemiana - i tak powstał śmiertelny pokój: i jak wszelkie istnienie dąży do jego osiągnięcia, tak powstał wieczny ruch od początku do końca.#A kiedy świat nie był już w fazie narodzin, Alfa stworzył życie. I upodobał je sobie ponad wszystko".
encyclo_enemy21_1="Ogień najgorętszych gwiazd, grawitacja supermasywnych czarnych dziur, kły i pazury najstraszliwszych bestii - żadna nie odważyłaby się skrzywdzić swego Stwórcy.#Przekleństwo człowieka i wszystkich jego rodzajów! Zdrajca. Zdrajca wszelkiego istnienia. Głupiec. I tak Omega pojawił się na tym świecie i zobaczył kosmos. Śmierć nie mogła zabić ciała Alfy, ale zabiła jego rozum: Stwórca stał się Niszczycielem. Nasz brzydki i niewłaściwy świat zasługuje na to, by go uśpić. I Omega go przyniesie. Błogosławieństwo dla człowieka i wszystkich jego rodzajów! Budowniczy Wielkiego Grobowca. Pomocnik zniszczenia. Strażnik Zagłady. Lojalny sługa. Omega."
encyclo_enemy21_2="Omega zobaczył świat - rojny, niewłaściwy, rozdęty istnieniem; tak brzydki i pozbawiony sensu. Z jego rąk wyszło nieistnienie: wstrzymało ruch i zredukowało temperaturę do zera, a czas i przestrzeń zamieniło w nicość. Warstwa po warstwie rozpadały się przestrzenie, nareszcie w spokoju - doskonale zrównoważone ze wszystkim innym, zjednoczone i zniweczone. Najmniejszy ułamek tego cierpiącego świata znalazł swój odpoczynek.#I tak Omega zaczął działać. Nie będzie już smutku, ani żadnej radości. Żadnej litości, ani współczucia; żadnego żalu, ani wdzięczności; żadnej przeszłości, ani przyszłości. Nic dobrego nie pozostanie, ale nic złego również nie pozostanie.#Omega zaczął pracować. I w końcu jego dzieło zostanie wykonane".
encyclo_enemy22="Mgławicowa istota o nieopisanym składzie, potrafiąca naśladować formę dowolnego obiektu. Mimiki są najlepsze w tym, co robią: w kilku znanych historii przypadkach mimik śpiącej skrzyni została odblokowana kluczem. Historia zna jednak o wiele więcej przypadków, gdy mimik pożarł biedną duszę, która podeszła do niego zbyt blisko. Atakuje za pomocą szeregu sztywnych pseudołupin, które obejmują prawie całe jego ciało."
encyclo_enemy22_0="^Mimiki otaczają nas w życiu. Weźmy monety w kieszeni starej kurtki: skąd się wzięły? Albo dziwna para gwoździ w szufladzie? Zapasowy talerz w kuchni?# Krwiożercze ^kostki^, które spotykają na swojej drodze poszukiwacze przygód, są tylko najsłabszymi przedstawicielami swojego gatunku.#Zbyt niecierpliwi i niezdolni do wyszukanej mimiki, są zbyt łatwo odkrywani - wystarczy wyciągnąć rękę lub uderzyć ich, i to wszystko.#Muszę opublikować ten artykuł jak najszybciej. Wszyscy muszą poznać prawdę.^##Pan Zerichal został znaleziony zadławiony na śmierć metalowymi grabiami ciasno owiniętymi wokół szyi. Cóż za straszne samobójstwo...^#- Pisemny raport inspektora Angusa".
encyclo_enemy22_1="^Beth Barlow była optymistyczną starszą panią. Zawsze potrafiła znaleźć sposób, by zyskać praktycznie na wszystkim.#Kiedy w jej piwnicy pojawił się żarłoczny mimik, uznała to za okazję do pozbycia się karaluchów, szczurów, śmierdzących pijaków, irytujących sąsiadów, poborców podatkowych, chciwych wnuków - i wreszcie własnej nudy.^#- Paul Joyful, ^Siedem Zabójczych Zabaw^"
encyclo_enemy22_2="^Mimiki mogą spędzić lata czekając na swoją modłę, nie ruszając się w ogóle.^Nieustępliwość i skromność tych wspaniałych stworzeń zasługuje na wielki podziw.^Mają zdolność do stania się dominującym gatunkiem, a jednak pozostają wierne swoim zasadom i wciąż karzą chciwość ludzkości.^#- Z akademickiej pracy badawczej na temat tych diabłów."
encyclo_enemy23="Niewiele wiadomo o rybiarzach. Ale niektóre z ich najbardziej oczywistych cech są niesławne: mają paskudny temperament, ich bronie są śmiertelnie niebezpieczne, ich łuski szybko wysychają poza wodą, a ich wężowe ogony słabo nadają się do podróżowania lądem. A jednak rybiarze nie ustają w próbach podbicia lądu".
encyclo_enemy23_0="^Najbardziej podłe i krwiożercze ze wszystkich bestii. Siedzą w swoich głębinach, zbierając siły i knując przeciwko ludzkości.#W momencie, gdy widzimy ich agresywny statek - wystrzeliwujemy w niego naszą błogosławioną balistę.#A oni tylko udowadniają swoją nikczemną naturę, walcząc z nami. Albo - co gorsza - podstępnie próbują uciec, by dalej snuć swoje niecne plany przeciwko ludzkości.#Wciąż krzyczą coś przez skrzela, ale kto by słuchał tych drani! ^#- Jedno z opowiadań zebranych przez Gregora Podejrzanego"
encyclo_enemy23_1="^Do dziś język rybiarzy pozostaje tajemnicą. Piszą oni spiralami zamiast liniami prostymi, a znaczenie każdego symbolu zmienia się w zależności od jego położenia w spirali. Znaczenie każdego słowa może również różnić się w zależności od czasu, w którym zostało napisane lub wypowiedziane.#Wszystkie telepatyczne próby rozmowy potwierdzają, że proces myślowy rybiarzy wydaje się funkcjonować w ten sam sposób. Nie możemy nawiązać kontaktu nawet używając uproszczonej wymiany obrazów.^#- Lingwista Zeryck Yabar, ^Sztuki Językowe^"
encyclo_enemy23_2="^Przez pierwsze dni po ukąszeniu pacjent majaczył; ciągle szeptał coś o mieście pod morzem i jakimś wezwaniu dobiegającym z głębi.#Kiedy ukąszenie w końcu się zagoiło, zaczął krążyć po swoim pokoju i spędzać długie godziny w pobliżu stawu przylegającego do szpitala, po prostu patrząc na wodę.#W ciągu tygodnia wszystkie objawy ustąpiły. Zaleca się powrót pacjenta do czynnej służby.^#- Z wojskowych dzienników medycznych"
encyclo_enemy24="Pole pszenicy, którego nikt nigdy nie zasiał. Czy jest to dziwactwo zrodzone z paradoksu własnego istnienia, czy tylko nieunikniony wynik bycia w dziwnym miejscu w dziwnym czasie? Nawet jeśli skosisz to pole, nie zobaczysz żadnych uzbrojonych stworzeń wyłaniających się z pszenicznej dziczy. Zupełnie jakby nigdy nie było tam żadnej żywej istoty".
encyclo_enemy24_0="^Bezkształtna masa, dziecko paradoksu. Pełzające źdźbła trawy, wznoszące się kawałki ziemi. Metalowy połysk z jej licznych kłosów pszenicy.#I pomyślałem - może nie wie jak właściwie istnieć, więc istnieje najlepiej jak potrafi? Nieudolne, nieśmiałe i bezkształtne.^#- Słowa nieznanego nieznajomego"
encyclo_enemy25="Drewniana replika pewnego bohatera, który przemierza opustoszały świat. Dlaczego ta marionetka istnieje lub jak została powołana do życia jest dziwną tajemnicą. Z niewiarygodną dokładnością stara się naśladować każdy ruch, który widzi: jedyne, czego ta kulista lalka nie potrafi zrobić, to odejść na bok i ustąpić."
encyclo_enemy25_0="^Mówią, że nawet drzewa mają uszy.#Szelest kroków, brzęk zbroi, zgrzytliwy oddech.#Od olchy do klonu wysokiego, cicho szepną o tym, kim jesteś.#A kiedy usłyszysz śmiech odbijający się echem w ciemnych koronach drzew, zobaczysz własne skrzypiące odbicie potykające się w twoją stronę.^#- Plotka pospólstwa"
encyclo_enemy25_1="^Spotkałem tak dziwne stworzenie. Na początku myślałem, że to kolejny żołnierz taki jak ja i chciałem się z nim przywitać, ale potem zobaczyłem jego twarz.#Była zdeformowana, jak karykatura prawdziwego mężczyzny! - Jego skóra wyglądała jak ulepiona z roztopionej gliny.#Spojrzał na mnie z gniewem i nie miał na myśli nic poza krzywdą. Czerwony sok wylewał się z tego stwora przy każdym uderzeniu - i to mnie przerażało. Udało mi się pokonać tego potwora.#Nie mogę się doczekać powrotu do domu, do mojej korzennej matki, i drzemki w kupie jesiennych liści.^#- Notatka sporządzona na skrawku ludzkiej skóry"
encyclo_enemy25_2="^Kto zostawił tu tę drewnianą atrapę...! Hej, gdzie mnie ciągniesz...?#Chcesz opowieści o rybakach?... Pewnego razu tak mocno szarpnąłem wędką, że ryba poleciała mi prosto w twarz, a potem zaczęli mnie nazywać Ivor the Głupiec... #Co z goblinami...? Cóż, mój wujek jest jak jeden z nich, jedyne co umie to pić miód pitny...#Chcesz posłuchać o książkach...? Nie, nie umiem czytać. Nie mogę nawet znaleźć szyldu tawerny, jeśli nie ma na nim obrazka... #A teraz mnie rozwiąż... Jesteś dziwnym kawałkiem drewna, wiesz. Ale wydajesz się być w porządku. Siemka.^#- Z leśnych zapisków przygód Treevora Botanika"
encyclo_enemy26="O obserwatorach wiadomo niewiele. Zazwyczaj widuje się ich po prostu wpatrzonych w coś intesywnie. Rzadko wchodzą do swojej wieży, tylko po to, by niedługo potem wrócić i kontynuować swoją obserwację. Rzadko ingerują w jakiekolwiek rozgrywające się wydarzenia - chyba że bieg historii ulegnie drastycznej zmianie."
encyclo_enemy26_0="^...Powiedział mi, że gwiazdy gasną, jedna po drugiej. Najpierw te najbardziej odległe, niewidziane dla naszych oczu. Powiedział, że zaczęły znikać tysiące lat temu, a teraz nie pozostały już prawie żadne gwiazdy.#Nie uwierzyłem mu oczywiście. Nadal widzę wszystkie 18 gwiazd ze szczytu wzgórza, gdzie zawsze były...^#- Fragment raportu dla szefa Towarzystwa Astronomicznego"
encyclo_enemy26_1="^...Podczas oblężenia pojawiła się nieznana istota. Po prostu unosiło się w powietrzu i nic więcej, więc kontynuowaliśmy szturm.#Wkrótce potem naruszyliśmy wschodnie wrota, a wróg zaczął wylewać nam na głowy wrzący olej. I wtedy usłyszałem głos wewnątrz mojej głowy: ^To nie tak musi się dziać.^ I olej wcale nam nie zaszkodził!#Z powodzeniem naciskaliśmy dalej, przełamaliśmy obronę wroga...^#- Raport polowy kapitana Jero"
encyclo_enemy26_2="^Kiedy byłam małą dziewczynką, zgubiłam się i trafiłam na samotną wieżę. Jej drzwi były otwarte.#Wewnątrz zobaczyłam tysiące szklanych ścian, a na nich niewyobrażalne obrazy: wielkie świecące światła otoczone gwiazdami, stworzenia zupełnie jak w bajkach mojej babci, miasta ze światła i wody!#Wtedy mężczyzna w pelerynie powiedział mi: ^Linia Defilera nie może zostać przerwana. Musisz żyć.^ A w następnej chwili stałem przed moją rodzinną posiadłością.#Jesteś kolekcjonerem opowieści - niech moja opowieść [przekreślone] też znajdzie się w twojej kolekcji.^#- Jedna z opowieści zebranych przez Gregora Podejrzanego"
encyclo_enemy27="Czy to strażnik uzbrojony w wiedzę, czy też wiedza, która uzbroiła się w strażnika? Jakkolwiek by nie było, istota ta widzi coś złego w twoim istnieniu - i bardzo stara się to naprawić, zanim będzie za późno."
encyclo_enemy27_0="^Mój drogi Mariuszu - te brzydkie zuchwałe gremliny nie przestaną mnie niepokoić.#Ta okropna wieża czasu zaczęła pojawiać się przy mojej bibliotece przodków. Ich wstrętne oczka obserwują mnie z daleka! Czasami moje noce kończą się jeszcze przed wyjściem księżyca - a czasami trwają przez mglistą wieczność. Nie mogę zaspokoić głodu, a teraz moja reputacja jest w rozsypce. Ci strażnicy powinni się nas bać, ale ja jakoś nie jestem darzony takim szacunkiem. Potrzebuję twojej pomocy, Marius. Razem powinniśmy oczyścić stąd te irytujące szczury.^#- Fragment zaginionego listu"
encyclo_enemy27_1="^Wiedza magiczna może opętać umysł: ci magowie  są tego niezbitym dowodem.#Nie będąc już biernym patrolowcem, mag strażnik ingeruje w świat w sposób, który wymyka się zrozumieniu.#Mag strażnik może, w tej konkretnej kolejności: uratować królika przed stadem wilków, zniszczyć karawanę handlową, stworzyć dwanaście kamiennych kostek, a potem przestać się ruszać na kilka dni. ... i nie jest to nawet najdziwniejszy z ich znanych możliwych czynów.#Społeczeństwa magiczne zgadzają się, że działania te nie są chaotyczne ani przypadkowe: raczej dokonywane są w dążeniu do jakichś nieznanych dalekosiężnych celów.^#- Wspomnienia podróżującego maga"
encyclo_enemy27_2="^Kiedy moje ostrze przeszło przez jego ciało, nie wyrządzając żadnej krzywdy, przerażająca realizacja przeszła mi przez umysł: nie był częścią naszego świata.#Wymusza dostosowanie się do powszechnych reguł - jest ranny, bo są ku temu zewnętrzne warunki, i odczuwa ból, bo się na to zgodził. #Istota ta mogłaby z łatwością zignorować wszelkie efekty istnienia, ale wtedy istnienie zignorowałoby również jego próby interwencji.Dlatego mój atak nie wyrządził mu żadnej szkody - on po prostu nie widział, jak się skradam.^#- Wspomnienia podróżnika"
encyclo_enemy28="Miniaturowa czarna dziura, która przez jakiś dziwaczny kaprys stworzenia stała się psem. Jej oczy widzą miliony galaktyk, a kły potrafią rozerwać nawet samą próżnię. Każdy twój nieostrożny ruch będzie słyszany z drugiego końca wszechświata. Choć ukształtowana jak pies gończy, czarna dziura wciąż nie ma wystarczającej motywacji do niczego poza biernym istnieniem w pojedynczym punkcie przestrzeni... Ale ich wieczny pan i towarzysz może łatwo naprawić tę wadę."
encyclo_enemy28_0="- Niemożliwe! Czarna dziura to nie jakiś szczeniak, nie da się jej zmusić do poddaństwa!^# - To może się założymy? Jeśli mi się uda, nie będziesz nosił spodni przez tydzień.# - Ogary z czarnych dziur są nawet hipotetycznie niemoż...! Ty już jeden zrobiłeś, prawda? # - Nie! Oczywiście, że nie. Nie, nie, nie.#- Oh. Myślałem, że masz na myśli...# - Zrobiłem dwa, właściwie.^#- Wiadomość z dalekiego kosmosu"
encyclo_enemy29="Groteskowy robak o znacznych rozmiarach. Jego główne ciało pokryte jest grubą skórą, a głowa posiada rozbudowaną strukturę kości i chitynowych płytek dla dodatkowej ochrony. Gruba skóra tego stworzenia jest częścią jego systemu trawiennego: ogromnie wysoka temperatura jego wnętrzności wystarcza do stopienia nawet małych skał -robak rozpadłby się bez dobrej, grubej warstwy izolacji."
encyclo_enemy29_0="^Mówią, że robaki znalazły dom w ruinach, ponieważ żywią się magicznymi artefaktami starożytnej cywilizacji, a wkrótce same wymrą.#Ale biorąc pod uwagę wszystkich poszukiwaczy skarbów, którzy tam chodzą i kończą jako pokarm dla robaków, trudno mi w to uwierzyć.^#- Jedna z historii zebranych przez Gregora Podejrzliwego."
encyclo_enemy29_1="^Tego dnia najpierw oślepiły mnie lśniące skarby - a potem po raz drugi płonąca plwocina robaka.^#- Były odkrywca"
encyclo_enemy29_2="^Mężczyźni nauki są zdziwieni widząc, że ogniste robaki rzeczywiście pojawiają się w naszych bardzo własnych domach i pałacach. Nasza stolica jest teraz wypełniona stworzeniami, które należą tylko do opustoszałych ziem.#Uczeni uważają je za szkodniki, które żerują na umierających cywilizacjach. Więc jak to się stało, że te stworzenia są na naszych ziemiach? Nasza ziemia jest w świetnej kondycji, nie ważne kogo zapytasz - nasza potęga jest ogromna! Nie ma dla nas ani jednego poważnego zagrożenia i nie będzie go jeszcze przez tysiące lat.^#- Kroniki upadku Imperium Faradassa"
encyclo_enemy30="Krwawy bałagan napędzany zanikającymi wspomnieniami o formie i motywach, jakie miał za życia. Garstka kości tworzących szkielet tego nieumarłego ciała ledwo może go utrzymać - a jednak raz po raz próbuje podnieść się z ziemi i kontynuować walkę. Ale każdy niezdarny ruch i każdy atak tylko jeszcze bardziej go osłabia. Jego płynne ciało łatwo jest rozpryskać, ale trudno zranić. Walka ze skrzepem krwi to raczej ostatni hołd dla nieznanego wojownika, którym kiedyś był, aby w końcu spotkała go śmierć - nie od ran, ale od uświadomienia sobie, że jego długo oczekiwana porażka nastąpiła już dawno temu."
encyclo_enemy30_0="^Przecinając zakazaną droge, zdążyłem na czas na targ. Ale prawie kosztowało mnie to życie. Droga była okropna - moje koła ciągle grzęzły w krzewach i chlupoczącym błocie. Moje konie szalały. W ciemnościach nocy ledwo widziałam drogę... #Ale nawet nie wyobrażacie sobie, jak bardzo jestem za to wdzięczny! Gdybym widział to wszystko na własne oczy, na pewno straciłbym rozum! #Moje konie i wóz były oblane krwią, a z kół wystawały kości i kawałki zgniłego mięsa. Po raz pierwszy w życiu czułem, że przetrwanie jest ważniejsze niż zysk.^#- ^Opowieści z odległej dali^"
encyclo_enemy30_1="^Legenda mówi, że ukazują się ludziom, którzy dopuścili się jakiejś zdrady w miejscu zamieszkałym przez duchy.^- Ale nie mam pojęcia, dlaczego w takim razie mnie zaatakowało.^- To nie była zdrada - ona praktycznie sama się o to prosiła!"^#- Laurentia Czarna Porzeczka"
encyclo_enemy30_2="^Mariusz - to jest po prostu urocze. Te chłopy faktycznie myślą, że skrzepy krwi to sprawka wampirów! Takie bzdury! #Zagroziłem, że każdego, kto odważy się rozprzestrzenić te brudne plotki, zamienię własnymi rękami w skrzep krwi.#Ale teraz podejrzewam, że mogłem to pogorszyć - teraz pojawiają się szepty, że to na pewno moja sprawka.#Głoszenie przemówień nie jest moją mocną stroną, Mariuszu. Jestem przyzwyczajony do obnażania swoich kłów, a nie ukrywania ich za uśmiechem.#Jestem przekonana, że ty ze wszystkich istot wiesz, dlaczego te krwawe drogi wciąż się pojawiają - i że mógłbyś pomóc mi się z nimi uporać.^#- Fragment zaginionego listu"
encyclo_enemy31="Styl walki syreny jest tak całkowicie spektakularny, że mógłaby występywać na scenie. Jej zaklęcia są melodyjne, a eleganckie ruchy czarujące. Jednak syrena aktywnie stara się przyciągnąć do siebie zachwyconą publiczność: każdego, kto za bardzo zahipnotyzuje się tym widowiskiem, czeka tragiczny los."
encyclo_enemy31_0="^Rybiarze się zbliżają, ale nie poddamy się. Mamy wystarczająco dużo prowiantu, a nasze morale jest wysokie. Jesteśmy w stanie odeprzeć wszystkie ich ataki, nie ponosząc żadnych strat!# -----------------# Ich ataki ustały. Słyszymy śpiew, który przyszedł wraz z burzą dwa dni temu. Jak coś tak pięknego może być zagrożeniem? Zwycięstwo czeka na nas poza tymi murami! Musimy otworzyć bramy za wszelką cenę!^#- Z odkrytego dziennika placówki straży morskiej"
encyclo_enemy31_1="^Cholerni rybiarze ścigają nas od tygodni! Przywołały sztormy, darły się na nas przez grzmoty i drapały pazurami po kadłubie.#Czyżby chodziło im o tę przeklętą trumnę, którą podnieśliśmy...? Ryby nie dbały o zmarłych. Chodziło o ich morską siostrę, która cicho wzywała ich ze swojej klatki. #Trumna owinięta łańcuchami była przeznaczona dla żywych, nie dla zmarłych. I mam wielką nadzieję, że tak pozostanie.#Ukryłem się w trumnie i modliłem się, by fale były miłosierne.^#- Jedno z opowiadań zebranych przez Gregora Podejrzanego."
encyclo_enemy31_2="^Syreny są bardzo nietypowymi przeciwnikami - a ich magiczne zdolności są dalekie od jedynego powodu, dla którego należy obawiać się tych stworzeń.Obserwowanie oddziału wrogich rybiarzy w walce obnaży prawdziwą rolę syren - są one przywódcami oddziału, a inni rybiarze są gotowi i chętne poświęcają swoje życie dla każdej syreny, jeśli zajdzie taka potrzeba. #Syreny są w stanie wydawać rozkazy swoim oddziałom z dużej odległości.Podsumowanie: do syren należy podejść zarówno jako do oficerów wroga, jak i do kluczowego elementu oddziałów rybiarzy.^#- ^Przewodnik Po Taktyce I Strategii Inteligentnych Istot^"
encyclo_enemy32="Niewielki ułamek głodu wampira wyrażony w tym świecie. Można je łatwo pomylić z rojącymi się magicznymi stworzeniami, ale tak naprawdę to nic innego, jak uzewnętrznione pragnienie krwi pojedynczego wampira. Czerwone futro oraz skrzypienie i trzepotanie setek skrzydeł - to nieomylne oznaki karmazynowego roju."
encyclo_enemy32_0="^A co z ich zwyczajem tworzenia zwierząt domowych z własnej krwi? Co jest z nimi nie tak, chciałbym wiedzieć?! A gdybym odciął sobie nogę i kazał jej pełzać dookoła - też nazwałbyś to zwierzątkiem domowym? A piski, jakie wydają te pasożyty - nawet ich panowie nie mogą tego znieść! Drewniany stołek byłby lepszym towarzyszem! ^#- ^Jak Nabijałem na pal Burżujów^ autorstwa Kedlo Threnn, łowcy wampirów."
encyclo_enemy32_1="^Nie widziałem tylu krwiopijców od czasu urodzin mojej matki^#- Z listów hrabiny z Doliny Kwiatów"
encyclo_enemy32_2="^Nasza wioska nigdy nie służyła żadnemu krwiopijcy, nawet podczas głodu, który nastał po wojnie.#Kiedy gobliny zeszły z gór, wielu ludzi zginęło. Każdy by zginął, gdyby nie Mariusz.#Przecinając swój nadgarstek, stworzył rój karmazynowych nietoperzy z własnej krwi.#Rój rozprawił się z maruderami i zmusił ocalałe gobliny do odwrotu. Wampir przyniósł zbawienie i przyjęliśmy go jako naszego obrońcę. Ale teraz, gdy mam stać się jego pożywieniem... Nie wstydzę się powiedzieć, że przez te wszystkie lata zawsze nienawidziłem Mariusza.Lepiej umrzeć jako ludzie niż żyć jako bydło.^#- Jedno z opowiadań zebranych przez Gregora Podejrzanego"
encyclo_enemy33="Eteryczna istota pozbawiona ciała, umysłu i jakiegokolwiek uzasadnienia istnienia. Rój chaotycznie splecionych upiornych ciał, które są zaskakująco zsynchronizowane w swoich działaniach. Być może to ich nienawiść do wszystkich żyjących łączy ich razem... i to całkiem dosłownie."
encyclo_enemy33_0="^Posłuchaj mnie, tak - jest ona po prostu szalona. Jeśli uznamy ducha za esencję życia i umysłu, to czym ma być ^duch ducha^? #Esencja życia całej linii krwi załamana poprzez upadek pojedynczej istoty? Złożoną manifestacją całego gatunku? #Jeśli chcesz poznać moją opinię, to to z czym mamy do czynienia to ogromny ból szyi - to wszystko co musisz wiedzieć o tych istotach.^#- Hivaldo, grabarz"
encyclo_enemy33_1="^Wszyscy moi krewni, od braci i sióstr po najbardziej odległych dziadków, zawsze kochali moją prababkę.#Dlatego nikt nie był bardzo zdziwiony, gdy po tym, jak wynajęty przeze mnie egzorcysta ostatecznie wygnał ją z mojego ślubu, pojawiła się cała masa upiornych głów.^#- Laurentia Czarna Porzeczka"
encyclo_enemy33_2="^Widziałam taką zabawkę zrobioną w dalekich krainach - lalkę z ładnie pomalowanego drewna.#Jeśli ją otworzysz, w środku jest mniejsza lalka, tak po prostu. I mniejsza tamta - i tak dalej, a one wciąż stają się coraz mniejsze.#^Kto w ogóle pomyślał o czymś takim?^ Pomyślałem wtedy.#A potem pewnej nocy wpadłem w niezłe tarapaty na drodze przy polu bitwy.... Ledwo uszedłem z życiem. I teraz rozumiem, co mogło zainspirować twórcę tego drobiazgu...^#- ^Opowieści z Dali^ Księga III".
encyclo_enemy34="Istota nie do pojęcia. Nie ma słów, by ją w pełni opisać - ani słów, by opisać ją choćby częściowo. Zarówno nic, jak i wszystko. Równocześnie."
encyclo_enemy34_0="^To pisanie jest o mnie. Piszę twoimi rękami. Czytam twoimi oczami.^Wiem, że tego nie rozumiem, bo ty nie rozumiesz.^Bo ja jestem wszystkim. Każda żywa istota jest mną.^#- Powtarzający się fragment znaleziony w wielu różnych źródłach"
encyclo_enemy35="Gobliny, które odkrywają zalety walki na odległość, stają się przykrą niespodzianką dla wszystkich w ich zasięgu. Słabo wyszkolony goblin posługujący się kiepskim goblińskim łukiem i uzbrojony w równie kiepskie goblińskie strzały wciąż jest zdolny do godnych pochwały wyczynów celnościowych. Często jednak goblińska strzała przelatuje w powietrzu i ląduje na plecach innego goblina - ale trafienie to trafienie."
encyclo_enemy35_0="^Mamy to szczęście, że gobliny są bardzo złymi łucznikami.#Nie potrafią się powstrzymać od krzyków i grymasów, a także ujawniania swoich pozycji. Ich cel jest tak zły, że często zabijają swoich jeszcze zanim dołączą do walki.#Ledwie mają siłę naciągnąć cięciwę łuku, a jeśli zdarzy im się kogoś trafić, to mogą się tak podekscytować, że wstają i na jakiś czas zapominają o walce.#Więc pytam was: jaka zielona goblińska dupa wypluła was na ten świat, skoro strzelacie dokładnie tak jak oni?!^#- Sierżant Dobby Jasper uczy łucznictwa nowych rekrutów"
encyclo_enemy35_1="^Pochodzenie goblińskiego łucznika można poznać po sposobie trzymania broni.Jeśli wkłada strzałę między palce - pochodzi z zachodnich dolin. Na czubku palca - jest górski.#Trzyma strzałę w dłoni i próbuje cię nią dźgnąć? Uczył się od innych goblinów.^#- Marta, odkrywczyni".
encyclo_enemy35_2="^Głód potrafi zastać posłańca w środku swojej podróży. Tego dnia miałam szczęście natrafić na królika, który niedawno został zastrzelony. Strzała znalazła go nie dawno, ale nikt nie przyszedł po swoje trofeum.#Jak smażyłem tego królika według starego przepisu mojej matki, nie miałem pojęcia, że prześladuje mnie jednooki gobliński łucznik. Udało mu się podejść bardzo blisko, ponieważ mój umysł był pochłonięty nadchodzącą kolacją.#Ale ku mojemu zaskoczeniu, po prostu złapał królika i szybko uciekł ze zdobyczą. Po latach rozpoznałem mojego jednookiego gościa na miejskim placu wśród innych schwytanych goblinów, czekających na egzekucję ze strony sfory psów.#Wykupiłem go, wyniosłem za miasto i odwiązałem. Dałem mu torbę z jedzeniem, z kilkoma przyprawami mojej matki w środku. I nigdy nie żałowałem podjęcia tej decyzji.^#- Wstęp do książki pod tytułem ^Goblin, który nie chciał strzelać^"
encyclo_enemy36="Posiadacz broni o surowej kości. Jego pochodzenie nie różni się zbytnio od jego braci dzierżących ostrza. Jedyną różnicą między nimi jest niechęć do zbliżania się do swoich celów."
encyclo_enemy36_0="^Narzekałem ci na miecze, które ludzie wkładają do grobów swoich zmarłych krewnych, utrudniając nam pracę. Prosiłem cię, żebyś coś z tym zrobił - i nie miałem pojęcia, że będziesz w stanie sprawić, że będzie to o wiele gorsze!"#Wczoraj postępowałem zgodnie z moim zwykłym zwyczajem - rzucałem kamieniem ogłuszającym z daleka, zanim pójdę i zbiorę rdzeń kręgowy - ale wtedy odkryłem strzałę wystającą z mojej nogi!"#Masz szczęście, że noga miała już martwicę.^#- Z prywatnych listów kultu nekrotycznego"
encyclo_enemy36_1="^Jednej rzeczy wciąż nie mogę zrozumieć - dlaczego szkieletowi łucznicy w ogóle potrzebują kołczanów? Gdybym został łucznikiem po śmierci, natychmiast pozbyłbym się kołczanu i trzymał wszystkie strzały w żebrze.#To praktyczne, innowacyjne, stylowe! Nekromanci powiedzieliby: ^Patrzcie, w tym facecie jest coś innego.^ To nic wielkiego, ale i tak byłoby miło.^#- Trochę plotek"
encyclo_enemy36_2="^To niesamowite, ale broń tej nieumarłej istoty trzeba uznać za część jej bytu. Żaden łuk czy strzała nie przetrwałaby nawet kilkunastu lat zakopana w glebie.#Kiedy  łucznik powstaje z grobu, jego kości nie są jedyną rzeczą, która jest utrzymywana w magiczny sposób. Jeśli przyjrzysz się jego broni wystarczająco blisko, zobaczysz liczne rozdarcia i pęknięcia.#Choć ^żywe^ szkielety same są w stanie poruszać się bez żadnych mięśni czy więzadeł, ich broń również podąża za tym tropem - w jakiś sposób funkcjonując, będąc jednocześnie absolutnie nieużyteczną.#Ta zdolność do przekazywania nieumarłych cech nieożywionym przedmiotom zawiera w sobie wielki potencjał.Z księgi badań nekrotycznych."
encyclo_enemy37="Harpie są mądre, piękne i śmiertelnie niebezpieczne. Dar przewidywania pomaga im znaleźć ofiarę, ich bystre oczy dostrzegają najlepszy sposób jej schwytania, a silne skrzydła zapewniają środki do realizacji planu. Ich pazury, tak ostre, że z łatwością wbijają się w kamień, z nawiązką rekompensują lekkość i kruchość ich ciał."
encyclo_enemy37_0="^Psychiczne połączenie harpii ze światem jest nie tylko niezwykle silne, ale i kluczowe dla ich życia. Im mniej istot żyje w ich obecności, tym silniejszy staje się ich wewnętrzny wzrok.#Większy obraz splecionych ze sobą wydarzeń trudniej dostrzec, gdy czyjeś przeznaczenie złożone z chaosu i potencjału przesłania widok z bliska.#Może to jest powód, dla którego budują swoje gniazda na mroźnych szczytach największych gór, z dala od tych, którzy cenią sobie długie i wygodne życie.^#- Wspomnienia podróżującego maga"
encyclo_enemy37_1="^Podróżując przez miejsca zamieszkane przez harpie, należy zawsze mieć przy sobie trochę filetu z ryby. Gdyby harpia postanowiła cię zaatakować, nie jest wykluczone, że wymienisz wspomniany filet na swoje życie.^- Dziewięć na dziesięć harpii wolałoby miękkiego halibuta niż podróżnika ze skórą i kośćmi.^- A jeśli to się nie uda - cóż, przynajmniej próbowałeś. Nie powinieneś był wchodzić na ziemię harpii.^#- ^Przewodnik po górach i innych surowych miejscach^."
encyclo_enemy37_2="Ivor spędził całą noc na piciu,#A potem, nad ranem, wyszedł z domu.#Z okropnym kacem#Wciąż próbował liczyć krowy.#^Co to jest? Nie mogę uwierzyć! Krowy latają po niebie! Przez tydzień lub dwa harpie#Jadły wołowinę każdego dnia i nocy.#- Ludowa piosenka o Ivorze Głupku"
encyclo_enemy38="Zaczarowany posąg, który porzucił swoje stanowisko. Choć stworzony przez magię, gargulec nie jest magicznym stworzeniem samym w sobie. Można się tylko domyślać, jak ta kupa skały potrafi latać - i dlaczego woli walczyć w zwykły sposób, zamiast po prostu przygnieść ofiarę swoim ciężarem z góry."
encyclo_enemy38_0="^Najzwyklejsza kupa skał, której rdzeń stanowi dość niecodzienne zaklęcie.# Wystrój jest zbędny: jej kamienne skrzydła nie są potrzebne do lotu, a granitowe szczęki nie są w stanie gryźć ani żuć.#Dawno temu zdałem sobie sprawę, że najbardziej obrzydliwą rzeczą w tych stworzeniach są ich twórcy. Wiedzieli, że ich twory będą zabijać ludzi.#A jednak nie tylko przystąpili do tworzenia tej broni - uznali również, że słodko będzie ją ozdobić. To jest nieludzkie nawet dla okrutnego serca.^#- Hivaru Shatt, ^Mniejsze Kompedium Bestii^"
encyclo_enemy38_1="^Tylko dziś! Niewiarygodnie hojna oferta! Zaczarowanie* co trzeciego posągu za jedyne pół ceny!#Darmowe inkrustowane rubiny w oczodołach** i dodatkowa opcjonalna złota powłoka*** przy zamówieniu na 10 lub więcej zaczarowań!.# ------------------#*Oferta kwalifikuje się tylko na zaczarowania wykonywane przez akolitów#**Rubiny mogą być zastąpione magicznie transmutowanym szkłem#***Złota farba wymagana do powłoki sprzedawana oddzielnie# ------------------#Oferta ograniczona czasowo!^#- Z ulotki Gildii Zaklinaczy"
encyclo_enemy38_2="^Nie, nie, nie, nic nie rozumiesz! A jeśli ukradniemy samego gargulca?! Nie będziemy dotykać żadnego skarbu, więc on nas nie skrzywdzi! #Przyniesiemy go do domu i ustawimy tam ładnie i porządnie, a potem zaczniemy przynosić do niego resztę skarbu - więc technicznie rzecz biorąc, gargulec nadal będzie go strzegł.#Co oznacza, że go nie ukradniemy! Wręcz przeciwnie, będziemy zwracać skarby do jego posągu! #A jeśli dom wokół posągu jest mój, to skarby też są moje! Więc będę mógł je wydać jak zechcę, a gargulec nie powie ani słowa. Mądry plan, prawda? ^#- Słowa Marka Marzyciela, wypowiedziane na jego pogrzebie".
encyclo_enemy39="Pływające stworzenie wykonane w całości z wody. Jego stan ciekły nie zniechęca go do rzucania się na przeciwników, ale nie chroni też przed byciem rozciętym lub oblepionym. Na polu bitwy meduzy są zwykle postrzegane jako sługusy syren, których pieśni są w stanie zaczarować nawet samą wodę."
encyclo_enemy39_0="^Syreny walczą atakując falami wody. Gdyby jednak cel syreny był zbyt daleko do osiągnięcia, przyzywa ona swoich towarzyszy walki - meduzy.#Niewiele wiadomo o tych stworzeniach. Są stworzone w całości z wody i nie wiadomo, co służy za rdzeń ich istnienia.#Czy należy je uznać za wodne golemy, czy pełnoprawne żywiołaki? A może mamy do czynienia z jakimś rodzajem nekromancji, która wiąże ducha morskiego stworzenia z małym zbiornikiem wodnym? ^#- Wspomnienia podróżującego maga"
encyclo_enemy40="Furia niebios, zawarta w zbroi i nosząca parę skrzydeł. Tylko najbardziej sprawiedliwi mogą wzywać pomocy aniołów, a oni w pełni zaufają temu wezwaniu i będą je realizować w walce ze złem. Możesz nie zgadzać się z ich opinią, że jesteś nieczysty, ale nie trać oddechu próbując zmienić ich zdanie. Oni nie osądzają: oni tylko wykonują wyrok".
encyclo_enemy40_0="^Spojrzenie czystego rozczarowania. Zapytałem ją, czym są anioły i skąd się biorą, i to była jedyna odpowiedź, jakiej mi udzieliła.#^Czy to ma znaczenie? Czy absolutnie musisz zbadać cud, zanim będziesz mógł go podziwiać?^ To właśnie próbowała mi powiedzieć.#I miała całkowitą rację. Nie wiem, czego bardziej się wstydzę: tego, że zadawałem te pytania, czy tego, że wciąż tęsknię za poznaniem odpowiedzi...^#- Z pamiętnika nieznanego akolity"
encyclo_enemy47="Chciwi nędzarze to obowiązkowy widok wokół każdej dobrze sytuowanej wioski. Gdziekolwiek zabrzęczą monety, tam podążają sztylety. W przeciwieństwie do miejskich złodziei, którzy są skryci z konieczności i rozpierzchają się, gdy widzą choćby cień strażnika, ci wiejscy bandyci robią swoje porachunki na otwartej przestrzeni i wiedzą, że uciekną bez szwanku. Jedyne, czego się obawiają, to brak możliwości udźwignięcia wszystkich łupów naraz".
encyclo_enemy47_0="^Tej nocy zostałem pobity na miazgę i napadnięty w samym środku wioski. Miejscowi przez kilka dni dbali o moje zdrowie, po czym dali mi trochę starych ubrań i obietnicę odnalezienia czarnoksiężników i ukarania ich z całą surowością miejscowej tradycji. Nie mogłem jednak zdobyć się na to, by im uwierzyć. Powodem tego, między innymi, było to, że zauważyłem, jak niektórzy z życzliwych noszą moje własne rzeczy.^#- Trochę plotek"
encyclo_enemy47_1="^Veliar di Penny był najbardziej chciwy w całej historii złodziejstwa. Ogołacał wiejskie chaty ze wszystkiego, co posiadały, nie oszczędzał nawet kocich misek.Żebracy chowali swoje kapelusze z jałmużną; kupcy chwytali  kapustę i rzepę jak swoje najdroższe dzieci.Legowisko złoczyńcy zostało odkryte pół wieku po jego śmierci: było wypełnione po brzegi zarówno skarbami, jak i przypadkowymi gratami. Zrabował tak wiele, że 16 podziemnych poziomów ledwo starczało na pomieszczenie wszystkich dóbr.^#- Paul Joyful, ^Siedem Zabójczych Zabaw^"
encyclo_enemy47_2="^Za dużo tu łupów, mówię ci! Rolnicy tego hrabstwa szaleją od dobrego życia - wystarczy spojrzeć na srebro! Powiedzcie, gdzie jest Mikolash i reszta? #Relaks - wampir nie położy na nas palca. Ludzie są dla nich jak robaki. Co z tego, że zginęła para? Przecież nie zauważy tego ze swojego zamku, prawda? Z "10 Śmiertelnych Pomyłek Złodzieja Świerzaka ", Almanachu Gildii Złodziei".
encyclo_enemy48="Istota stworzona z piasku, magii i woli Wielkiej Pustyni. Jego ziarniste ciało wygląda jakby miało się rozpaść od jednego złego ruchu, ale nie spodziewaj się łatwej walki. Wielka Pustynia pielęgnuje swoje wszechobecne dzieci i czule okrywa każde z nich ochronnym całunem magicznego ciepła."
encyclo_enemy48_0="^Było to surowo zabronione, ale Ibhan i tak zabrał ze sobą swoją zaczarowaną beczkę z wodą. Beczka z wodą mogła napełnić się sama po wstrząśnięciu - bezcenny cud, jako że droga karawany leżała przez pustynię. Nie jesteśmy jeszcze przyzwyczajeni do upału południowych dróg.#Atak był nagły i szybki. Strumienie piasku przewracały wozy i nabijały na pal bydło. Napastnicy poruszali się swobodnie w burzy piaskowej. Ocalałych było niewielu. Napełniliśmy nasze worki z wodą krwią wielbłąda, wiedząc dobrze, jak trudno będzie wrócić do domu pieszo. Znalazłem wysuszone ciało Ibhana. Jego torba na wodę była bezużyteczna, jakby pozbawiona wszelkiej magii...^#- Ostatni wpis w księdze Caara Kupca".
encyclo_enemy48_1="^Odrzuć ciało. Stań się moim krewnym. Twoja droga będzie promienną wiecznością.^#Tak powiedział mi piaskowy podróżnik, gdy spotkaliśmy się po raz pierwszy. Wyśmiałem jego sugestię, gdy dobyłem miecza, zbyt chętny, by wyciąć swoją odpowiedź w jego kruchym ciele.#Ale teraz jestem bardzo stary, moja śmierć jest w zasięgu ręki i to mnie przeraża. Ze smutkiem w oczach patrzę na tę ziemię, która powoli starzała się w pustynię, i mam nadzieję, że tam nadal oczekują ode mnie przyjęcia oferty.^#- Z pamiętnika nieznanego człowieka"
encyclo_enemy48_2="^Mówię ci, że mam wielbiciela! I w dodatku jest gorący. Wysoki i przystojny - cóż, raczej tajemniczy typ, więc nie widziałam dokładnie twarzy, ale - patrzcie, nie o to chodzi. #On jest we mnie. Chodzi za mną wszędzie. Do wsi, przez pole, wśród bagien... jeśli to nie jest prawdziwa miłość, to co nią jest? Myślę, że jest po prostu zbyt nieśmiały, by przełamać lody. Jutro ja przejmę inicjatywę.^#- z listu Edny"
encyclo_enemy49="Wiedźma nigdy nie przegapi okazji, by przyłączyć się do walki, nawet jeśli nie ma w niej żadnego udziału. Jej liczne teorie medyczne zbyt natarczywie domagają się sprawdzenia w terenie, by je ignorować, a pełne ran bitwy są poligonami doświadczalnymi jej marzeń."
encyclo_enemy49_0="^Nie, to TWOJE metody są zdecydowanie zbyt okrutne! Rozumiem, że nie znosisz krzywdzenia ludzi, ja również.#Ale jak masz zamiar pomagać żywym, jeśli dokonujesz jedynie sekcji zmarłych? "# Mam tego dość! Już znalazłem sobie ładny skrawek ziemi na przyszły dom, gdzie żadni idioci ani ich głupie moralizatorstwo nie będą mi przeszkadzać.^#- Z listów Akademii Medycznej Morel City"
encyclo_enemy49_1="^Byliśmy tylko dziećmi. Szczurowilk dopadł nas obie tamtej strasznej nocy - rozpruł mi brzuch i przegryzł czaszkę, po czym wbił się w gardło mojej siostry.#Kiedy się obudziłam, byłam w chacie wiedźmy, a wszystkie moje rany zniknęły. Siostry nigdzie nie było widać.#^Dlaczego jej nie uratowałaś?^ - zawołałem.#^Miałam czas uratować tylko jedno z was,^ - odpowiedziała, wskazując na drzwi.#^Dlaczego ja, a nie ona?^#Twoje rany były bardziej ekscytujące.^#- Jedno z opowiadań zebranych przez Gregora Podejrzanego"
encyclo_enemy49_2="^To moja ostatnia szansa właśnie tam,^ Jonah mruknął, gdy na chwiejnych nogach poszedł do lasu. Rano powrócił, sprawny jak skrzypce. Czarownica wyleczyła jego okropny kaszel i czarne znamiona ospy: przez cały miesiąc wszystko było w porządku.# Potem wszystko się pogorszyło. W Kościany Piątek Jonasz zaczął mruczeć i bulgotać jak wściekły śledź. W Jasny Tydzień próbował pożreć żonę starszego.#Kiedy zamknęliśmy biedaka w spichlerzu, zdrętwiał i skurczył się w ciągu nocy.#^A kiedy ciągnęliśmy zwłoki Jonasza do grobu, obróciły się w pył - i wtedy zobaczyliśmy, że za serce ma zrzędliwą ropuchę!^#- Wiejska plotka".
encyclo_enemy50="Określenie ^totem^ może być zbyt mocnym słowem dla tego przeciwnika. Nie ma w nim nic magicznego, ot kilka przeciętnych żelaznych tarcz przywiązanych liną do solidnego słupa. To wiedźma odwraca wszelką nadmierną przemoc od swoich aktualnych obiektów testowych i do totemu - w końcu ożywianie zmarłych nie leży w jej kompetencjach."
encyclo_enemy50_0="^Sierżant znów odmówił mi urlopu i po raz trzeci w tym tygodniu zostawił mnie na warcie. Powiedział, że nie wrócę do domu, dopóki nie nauczę się prosto strzelać. Ale ja jestem dobry z łuku, przysięgam! Zawsze trafiam w cel ze stu kroków na strzelnicy, odpowiednio dbam o swój łuk, sprawdzam go przed każdym patrolem. Ale w momencie, gdy wchodzę na wieżę, to tak jakby wszystkie strzały chciały zamieszkać w lesie. Przypuszczam, że jestem po prostu nerwowy.#Wieczorem jest cicho. Może niedługo wrócę do domu. Pozdrów ode mnie ojca. Z poważaniem.^#- List z linii frontu"


encyclo_item0_0="^Zupełnie cudowny element stolarki! Widząc eleganckie rzeźbienia na nim, przesyła mi dreszcze w dół kręgosłupa. Te wszystkie dziury i zagłębienia, które wymykają się mojemu zrozumieniu! Taka tabliczka powinna wisieć nad drzwiami, żebyś mógł się nią zachwycać za każdym razem, gdy wchodzisz. A przynajmniej ja bym tak zrobił. Nasz chłopak powiedział, że umieści na niej kilka fiolek, ale on nie wie nic o estetyce.Czułem przypływ energii podczas jej ładowania ^#- Z pamiętnika Volgrima, pierwszego woźnicy"
encyclo_item1_0="^Wyśmienicie wykonany mebel do siedzenia, pasujący tylko do najbardziej wysoko urodzonych szlachciców. Czerwone poduszki i drewniane... ehm... elementy drewna tworzą idealne połączenie kolorystyczne, które przynosi radość dla oczu. Wiele razy podczas podróży rozważałem odpoczynek na nim, ale obawiałem się, że moje nieładne ubranie podróżne nie będzie pasowało do tak okazałego mebla. Poczekam, aż w obozie znajdę porządną  marynarkę.Podczas ładowania bardzo chciało mi się pić ^#- Z pamiętnika Volgrima, pierwszego dorożkarza".
encyclo_item2_0="^Jeden z bardziej wspaniałych i odbiegających od wymiarów mebli, jakie kiedykolwiek widziałem lub przewoziłem w moim powozie. Rzeźbienia na drzwiach i półkach, pozłacane uchwyty, delikatna aluzja do niezmierzonego bogactwa ubrań, które musi zawierać, och, co za mistrzowskie rzemiosło! - tak właśnie mówiłem sobie, gdy oglądałem ją w drodze do domu.#Zdrętwiały mi plecy podczas ładowania ^#- Z pamiętnika Volgrima, pierwszego dorożkarza"
encyclo_item3_0="^Jak patrzyłem na ten rozrzut małych, kutych kawałków żelaza przede mną, próbowałem wyobrazić go sobie jako rzecz piękną. Bez wątpienia było to kiedyś fachowe dzieło szewca i jestem pewien, że w przeszłości spełniało całkiem godne podziwu funkcje... Ale co jeszcze można powiedzieć o gwoździach? Wszystkie mają taką samą długość, szerokość i wygląd, nie ma na nich skomplikowanych wzorów ani złożonych proporcji geometrycznych. Niektórzy mogliby nawet powiedzieć, że nie mają żadnej wartości estetycznej! Ale mimo wszystko cieszyłem się tym widokiem, nawet jeśli nie wywoływał on żadnych wzniosłych myśli. W tych gwoździach musi tkwić proste piękno.#Przebiłem sobie palec podczas ich ładowania.^#- Z pamiętnika Volgrima, pierwszego dorożkarza".
encyclo_item4_0="^Kiedy pierwszy raz zawiesiłem na tym nożu, uderzył mnie zachwyt - niewiarygodnie doskonałe połączenie wydobywającego się z niego ziołowego zapachu i promieni światła odbijających się od ostrza. Och, jakże zazdroszczę osobie wystarczająco zręcznej, by naprawdę władać tym cudownym narzędziem! W drodze powrotnej kilka razy rozważałem nawet zmianę zawodu; ale odgoniłem tę myśl. Dobry woźnica nie może mieć głowy w chmurach - a jeśli nie potrafię nawet poprawnie obsługiwać swojego powozu, to nie powinienem nawet rozważać obsługi tak ostrych narzędzi! #Zraniłem się podczas ładowania. Chociaż tylko trochę. Już się zagoiło.^#- Z pamiętnika Volgrima, pierwszego dorożkarza"
encyclo_item5_0="^Co za wspaniałe narzędzie do cięcia drewna, które znalazło się w moim powozie tej... jakiejkolwiek porze dnia. Ani metal ani drewno tego narzędzia nie nosi żadnych wykwintnych rzeźbień - ale prawdziwe piękno tego topora leży w jego funkcji i przeznaczeniu. Jest prosty, a jednocześnie tak wygodny i praktyczny! Samo uchwycenie go ręką sprawia, że czuję się, jakbym robił coś pożytecznego! Myślałem o ścięciu kilku drzew, ale drewno i tak nie przetrwałoby do obozu - więc tylko niepotrzebnie stępiłoby ostrze. A nawet myśl o tym sprawia, że się drżę.#Zarobiłem drzazgę podczas ładowania.^#- Z pamiętnika Volgrima, pierwszego dorożkarza"
encyclo_item6_0="Wielka miska, a w niej wspaniałe jadalne orzechy. Podczas gdy ja jechałem przez wzgórza, one skakały i grzechotały w obrębie swojej miski, wytwarzając swoistą muzykę. Mam nadzieję, że jest tam wystarczająco dużo orzechów nerkowca. Lubię oczywiście orzechy wszelkiego rodzaju, ale jeśli w mojej porcji nie będzie nerkowców to będę dość zdenerwowany.#Myślałem o wypiciu kufla piwa podczas ich ładowania.^#- Z pamiętnika Volgrima, pierwszego dorożkarza"
encyclo_item7_0="^Zawsze podobało mi się, jak wędliny często owija się sznurkiem, tworząc artystyczny wzór - i jak sznurek nadal pozostaje na swoim miejscu, gdy odetniesz plasterek. Szczerze mówiąc, zawsze myślałam, że owijanie jest po to, by mięso dobrze wyglądało, ale nasz kucharz powiedział mi, że robi się to po to, by szynka zachowała swój kształt, gdy jest zawieszona w powietrzu. Codziennie człowiek uczy się czegoś nowego!# Myślałem o tym, żeby do tego mięsa dołożyć jakiś dodatek, kiedy je ładowałem.^#- Z pamiętnika Volgrima, pierwszego dorożkarza"
encyclo_item8_0="^Czosnek nie ma prawie żadnych negatywnych cech. Nie każdy go lubi, a niewielu pocałowałoby cię po jego zjedzeniu. Ale też nie każdy zrobiłby to przed czosnkiem. Tak czy inaczej, nawet gdyby miał więcej negatywnych cech, to i tak uwielbiałbym sposób, w jaki wygląda, gdy zwisa z sufitu w tych zgrabnych małych pęczkach. Można go przechowywać miesiącami i używać do doprawienia niemal każdej potrawy.#Czułem sie zdrowszy, gdy go ładowałem.^#- Z dziennika Volgrima, pierwszego dorożkarza"
encyclo_item9_0="^Och, jakże chciałbym uścisnąć dłoń mistrzowi sztuki stojącemu za tą metaloplastyką i rzeźbiarstwem! Każda krzywa odbija światło świecy w sposób, który ujawnia staranne intencje stojące za każdym najmniejszym szczegółem tego funkcjonalnego arcydzieła. Nie mogę sobie nawet wyobrazić, jak wspaniale wyglądałby na kominku w rezydencji, z wszystkimi trzema świecami zapalonymi i błyszczącymi. Jestem pewien, że byłby w stanie oślepić każdego swoim pięknem... W dobry sposób, oczywiście.#Musiałem zmrużyć oczy podczas ładowania go.^#- Z dziennika Volgrima, pierwszego dorożkarza"
encyclo_item10_0="^ Dawno żaden obraz nie zrobił na mnie takiego wrażenia. Ale też dawno nie widziałem ostatnio żadnego obrazu. Ale ten fakt nie umniejsza walorów tego konkretnego portretu. Wspaniałe dzieło sztuki - zapierające dech w piersiach pociągnięcia pędzla! - i taka wykwintna złota rama wokół niego. A jednak muszę przyznać, że sam obraz kogoś mi przypomina. Może znałam jego twórcę? Powinienem zapytać w obozie.Czułem, jakby siły wyższe obserwowały mnie, gdy go ładowałem.^#- Z dziennika Volgrima, pierwszego dorożkarza"
encyclo_item11_0="^Jeśli masz zjeść porządny obiad, twierdzę, że powinieneś się nim delektować tylko z talerza takiego jak ten. Chociaż jedzenie jest zawsze świetne samo w sobie, nigdy nie należy zapominać o rytuale. Nie chodzi tylko o napełnienie żołądka, ale także o rozkoszowanie się widokiem i wzbogacenie poczucia piękna. Myślę, że obecność tego szlachetnego, czystego, pięknie wytrawionego metalu powinna zdziałać cuda na trawienie.#Poczułem silne pragnienie życia i poczucia życia podczas ładowania go.^#- Z pamiętnika Volgrima, pierwszego dorożkarza"
encyclo_item12_0="^Ciężki, ale wciąż wspaniały mebel! W drodze powrotnej nie mogłem się powstrzymać i zatrzymałem swój powóz, by uciąć sobie szybką drzemkę. Oczywiście nie powinienem był tego robić - ale czasem trzeba sobie pobłażać, zwłaszcza mając w pobliżu tak wspaniałe łóżko. Nie ma oczywiście nic złego w spaniu w powozie czy namiocie, ale to właśnie takie rzeczy jak to łóżko naprawdę wydobywają zalety cywilizowanego życia.#Nadwyrężyłem sobie plecy podczas ładowania, ale po powrocie do obozu wszystko było w porządku.^#-  Z pamiętnika Volgrima, pierwszego dorożkarza"
encyclo_item13_0="^Jak dobrze ten stół jest zbity! Większość ludzi widzi tylko kilka desek i ich pozorną chropowatość, ale ja widzę pracę prawdziwego inżyniera celującego wysoko! Nogi stołu są umieszczone dokładnie tak, by utrzymać ciężar każdej uczty, a deski są tak dobrze spasowane - aż do najmniejszych nacięć na szorstkich krawędziach - że nawet okruchy chleba nie wpadną między nie.#Myślałem o zjedzeniu kolacji podczas ładowania go.^#- Z dziennika Volgrima, pierwszego dorożkarza".
encyclo_item14_0="^Moim zdaniem takie meble trzeba ustawiać w pobliżu okien, żeby można było zobaczyć, jak pięknie światło zachodzącego lub wschodzącego słońca oświetla witraż i wszystkie przedmioty za nim. Nawet jeśli teraz nie ma słońca, to wciąż mam nadzieję, że kiedyś powróci - a ta półka będzie na nie czekała, stojąc we właściwym miejscu.#Chciałam położyć coś na półkach podczas załadunku.^#- Z pamiętnika Volgrima, pierwszego dorożkarza"
encyclo_item15_0="^Rzadki kawał metalu usiany dziurami z rdzy, ledwo trzymający się kija dzięki jednemu niewygodnemu gwoździowi. Nie wiem kto go używał - ale wiem, że nigdy nie pozwoliłbym tej osobie zbliżyć się do moich narzędzi.#Przyciąłem sobie wszystkie palce podczas ładowania.^#- Z pamiętnika Wizgrema, drugiego dorożkarza"
encyclo_item16_0="^Pokryty jakimś parszywym włosem, który sprawia, że moje alergie zaczynają działać! Czy naprawdę tak trudno jest umyć nóż po skończeniu jego używania? Może lepiej go po prostu wyrzucić, i tak jest taki tępy. Nie dziwię się, że jest pokryty włosami - musiałbyś uderzyć szczurowilka z tysiąc razy, żeby zrobić jedno cięcie. A może wilkoszczura...? meh, bez znaczenia!#Kichałem podczas ładowania^#- Z pamiętnika Wizgrema, drugiego dorożkarza".
encyclo_item17_0="^Jestem pewien, że nasz kowal ma taką samą gdzieś w swoim składzie. Po co, do cholery, potrzebowali mnie, żebym go przyniósł? A nawet jeśli nie ma - to tylko kawałek metalu do uderzania w inne kawałki metalu, na pewno można go zastąpić czymś innym. A skoro mowa o kowalstwie, to czy kowal nie ma ich sam wykonać? Czy nie dlatego nazywa się go kowalem? #Upadł mi na stopę podczas ładowania. Dobrze, że moje palce są dość mocne, nic nie poczułem ^#- Z pamiętnika Wizgrema, drugiego dorożkarza"
encyclo_item18_0="^Poważnie? Wysyłasz cały powóz za kawałkiem spalonego chleba?! Jakbym nie miał nic więcej do roboty poza jeżdżeniem tam i z powrotem po połamanym terenie tylko dla przyjemności! Cóż, jak się zastanowić - tak, to jest właśnie ten przypadek. Ale jeśli ten chłopak może wyjść tam i przynieść z powrotem jakieś kłody i kamienie, to mógł też przynieść ze sobą coś tak małego!#Byłem wściekły podczas załadunku.^#- Z pamiętnika Wizgrema, drugiego dorożkarza"
encyclo_item19_0="^Nie wiem nawet czego bardziej nienawidzę: tej miski spleśniałej zupy, czy koordynacji naszego obozu. Kto w ogóle myśli, że powóz jadący po wyboistej drodze to idealny sposób na transport naczynia bez pokrywki, pełnego płynu! No cóż, wielkie dzięki! Teraz będę musiał wyczyścić te obrzydliwe plamy z mojego powozu!#Wylałem troche podczas ładowania. Tylko po to, żeby mniej się rozlewało, nic więcej.^#- Z pamiętnika Wizgrema, drugiego dorożkarza"
encyclo_item20_0="^Jeśli jest coś, czego naprawdę nienawidzę wożąc się w powozie, to jest to jedzenie. Śmierdzi, zostawia wszędzie okruchy i plamy, a czasem nawet przyciąga zapachem bestie z drogi. A ser to najgorsze jedzenie, jakie istnieje, spełnia wszystkie kryteria. Może poza tym, że nie przyciąga potworów - obecnie tylko szlamy atakują powóz, a nawet to jest rzadkie. Zastanawiam się nawet nad usunięciem stalowych płyt z boków, żeby przyspieszyć jazdę.#Zatknąłem nos podczas załadunku.^#- Z pamiętnika Wizgrema, drugiego dorożkarza"
encyclo_item21_0="^Och, Volgrim byłby taki szczęśliwy, gdyby mógł dostarczyć to coś. ^Takie rzemiosło, spójrzcie na tę metaloplastykę, co za rzeźba - bla bla bla!^ Jest tak przeszczęśliwy, że może dostarczyć absolutnie cokolwiek i jechać gdziekolwiek - po co w ogóle ciągle rzucamy tą cholerną monetą, żeby zobaczyć, kto pojedzie? Szlag by to! W każdym razie - ten wisiorek jest właściwie całkiem piękny, poniekąd. Gdyby nie był tak stary, a srebro nie było tak matowe, może nawet nie czułbym się zakłopotany, przynosząc go do obozu.#Czułem się nieco spokojniejszy podczas ładowania go.^#- Z pamiętnika Wizgrema, drugiego dorożkarza"
encyclo_item22_0="^To jest po prostu świetne. Książka, której nawet nie da się przeczytać. Po co nam w ogóle ta kupa rozłożonych stron? Nie można jej nawet zabrać do kibla, z takich czy innych powodów. A nawet gdybyś mógł ją przeczytać - z pewnością ludzie z powrotem w obozie mają coś o wiele ważniejszego do roboty podczas apokalipsy niż czytanie książek!#Zgubiono stronę podczas ładowania.^#- Z pamiętnika Wizgrema, drugiego dorożkarza"
encyclo_item23_0="^Gdybym miał zrobić listę wszystkich moich najbardziej ulubionych przedmiotów, które dostarczyłem w moim powozie, to lustro z pewnością znalazłoby się w pierwszej trójce. Oczywiście każdy może zauważyć, że kunszt jest absolutnie mistrzowski - nie ma potrzeby opisywać go szczegółowo. Ale to, co jest w nim najlepsze, to fakt, że tak doskonale wszystko odbija. Udało mi się nawet rzucić okiem na naszą Weterankę podczas wjeżdżania do obozu. Może i jej twarz jest dość surowa i nikt nigdy nie widział jej uśmiechu, ale to nie umniejsza jej urody ani trochę.#Pobawiłem się trochę promieniami odbitego światła podczas ładowania go.^#- Z pamiętnika Volgrima, pierwszego dorożkarza"
encyclo_item24_0="^Nie wiem komu potrzebne jest to kolejne surowe narzędzie. Przecież my nawet nie mamy kopalni! Ten kilof będzie zbierał kurz w kącie i tyle! I też jest kiepsko wykonany - nie jestem mistrzem dłubania w kilofie ani nic, ale nawet jedno spojrzenie wystarczy, żeby zobaczyć, że samo chwycenie zafundowało ci drzazgi w dłoni. A jego metalowa końcówka tylko czeka na okazję, by przelecieć ci przez stopę.#Potknąłem się o kamień podczas ładowania.^#- Z pamiętnika Wizgrema, drugiego dorożkarza"
encyclo_item25_0="^Dlaczego zawsze dostaję takie obrzydliwe przesyłki? Układaj ją starannie, pilnuj stale, nie pozwól, by się zepsuła w czasie podróży, mówią! Czy ja kiedykolwiek byłem nieostrożny, choćby raz! I czy mój ładunek kiedykolwiek rzeczywiście wymagał ostrożnego obchodzenia się z nim? I znowu to samo: tylko kilka kawałków szkła. Co jest w tym takiego wspaniałego? Nikt by nawet nie zauważył, gdyby na każdym z nich był tuzin pęknięć.#Złapałem monetę na ziemi podczas załadunku.^#- Z pamiętnika Wizgrema, drugiego dorożkarza"
encyclo_item26_0="^Po raz pierwszy w życiu moje ciało faktycznie buntowało sie przed załadunkiem tego. Cała ta sadza i smalec, którego nie da się zmyć... Nawet nie potrafię sobie wyobrazić, jaki chłystek używał tej patelni. I, oczywiście, musimy zabrać to z powrotem do domu w moim powozie, zamiast po prostu zostawić te śmieci tam, gdzie ich miejsce.#Czułem się chory podczas załadunku. Polepszyło się po powrocie do obozu.^#- Z dziennika Wizgrema, drugiego dorożkarza".
encyclo_item27_0="^Nie można powiedzieć o tym nic dobrego. Ostrze jest całe stępione; rękojeść jest nie poręczna i na pewno przyprawi cię o odciski. Na pewno złamie się po kilku niezdarnych uderzeniach o kuchenny stół. Może posłuży do odstraszenia niektórych bardzo tchórzliwych ludzi. Jest zbyt mały, by być dobrą bronią - i zbyt straszny, by być dobrym przyborem kuchennym. Ale kim ja jestem, żeby mówić to specjalistom od zaopatrzenia? #Nawet nie skaleczyłem się podczas ładowania.^#- Z dziennika Wizgrema, drugiego dorożkarza".
encyclo_item28_0="^Więc co - rzecz, którą każde dziecko może zbudować z garści patyków też jest teraz uważana za ważny ładunek? A dziecko mogłoby to zrobić o wiele lepiej! Ten stołek wygląda tak, że wolałbym siedzieć na ziemi. Jest o wiele bardziej miękki i nie złamie się pod tyłkiem.Uderzyłem się o niego kolanem podczas załadunku.^#- Z pamiętnika Wizgrema, drugiego dorożkarza"
encyclo_item29_0="^Zupełnie bezużyteczny przedmiot w obecnym stanie. Zamek jest dosłownie zepsuty - i nie zrzędzę tym razem, on naprawdę jest zepsuty, możesz zapytać każdego! A komu przydałaby się skrzynia bez zamka? Nie ochroni cię przed złodziejami, zbiera kurz i utrudnia chwytanie rzeczy, które do niej włożyłeś. Obiektywnie nie ma z niej żadnego pożytku.#Potknąłem się o nią i upadłem podczas ładowania. Nie upuściła niczego, jak sądzę.^#- Z pamiętnika Wizgrema, drugiego dorożkarza"


encyclo_res1_0="Można by pomyśleć, że to tylko kawałek zwykłego drewna, ale nawet zwykłe drewno jest teraz dość rzadkie. Moje wspomnienia o istnieniu gałęzi drzew są dość mgliste i nie wystarczają, aby je w pełni zmaterializować.Prawie wszystkie patyki, które jestem w stanie znaleźć podczas moich podróży dosłownie wyparowują, jeśli tylko tak bardzo wyciągniesz po nie rękę.Te kilka gałęzi i kłód, które wciąż pozostają w moich rękach, z pewnością zostaną wykorzystane do odbudowy tego świata."
encyclo_res3_0="Gdy idę ścieżką, czasami znajduję pod stopami kawałki gruzu i skały - i za każdym razem, gdy podnoszę jeden, mam wrażenie, że nigdy wcześniej tego nie robiłem. Ale w tym świecie każdy mały kawałek skały się liczy.#To dziwne, ale kiedy zbieram w kieszeni wystarczającą ilość kamyków, w jakiś sposób łączą się one w jedną dużą skałę.#Wydaje się, że świat próbuje się odbudować. Przypuszczam, że będę mu w tym pomagał".
encyclo_res5_0="Jeśli przez jakiś czas używam jakiejś broni lub elementu zbroi, przyzwyczajam się do niej. Staje się zwykłą częścią otaczającego mnie świata.#Jeśli jednak wymienię ją na coś nowego, to częściej niż szybko nie będę w stanie pamiętać nic o starym sprzęcie. Pamiętam jedynie, że było to ^coś bezużytecznego i wykonanego z metalu.^# Tak właśnie w moich kieszeniach pojawiają się te drobne kawałki metalu. Przywierają do siebie, jakby były namagnesowane - i w końcu wtapiają się w pełnoprawne sztabki metalu."
encyclo_res7_0="Znalezienie jedzenia w tym wymazanym świecie jest coraz trudniejsze. Muszę chwytać wszystko, co da się znaleźć - pszenicę z pól, mięso szczurowilka i tak dalej.Jedyną dobrą rzeczą w tej globalnej amnezji jest to, że wpływa ono również na uczucie głodu: nie odciąga mnie od wszystkich innych kłopotów."
encyclo_res8_0="Mała kula. Nie jestem pewien - ale chyba pojawiła się w mojej kieszeni po walce z dużą sforą potworów.Kula pulsuje w mojej dłoni i mam wrażenie, że powiększa się, ale w rzeczywistości nie jest.Gdy na nią patrzę, nabieram przemożnego pragnienia, by uczynić otaczający świat lepszym. Powinienem dać go budowniczym w naszym obozie".
encyclo_res9_0="Nie wiedzieć czemu nazwałem to ^kulą^ - chyba po prostu, żeby jakoś to nazwać. Wygląda raczej jak czaszka: nie ludzka jednak.#Uczucie wielkiej rozpaczy ogarnia mnie ilekroć na nią patrzę. Tracę wszelką chęć do walki, czy w ogóle do robienia czegokolwiek - nawet życia. Naprawdę nie powinienem na to patrzeć. Ale oto najdziwniejsza rzecz: gdy ściskam go w pięści, robi coś zupełnie przeciwnego - napełnia mnie przemożną wolą życia. Co za dziwna rzecz.#W jakiś sposób czuję, że jeśli znajdę się u drzwi śmierci, ta kula da mi wystarczająco dużo siły, aby uciec z powrotem do obozu."
encyclo_res11_0="^Książka^ to trochę za mocne słowo, ale zostawmy to.Większość stron w środku jest pusta, a inne są albo na wpół zapisane, albo napisane w nieznanym języku.Powinienem przynieść to z powrotem do obozu: Myślę, że powinienem być w stanie znaleźć kogoś, kto będzie w stanie wydobyć z tego jakieś informacje."
encyclo_res13_0="Świat już nie istnieje, ale wciąż pamiętam niektóre jego części. Choć moja pamięć często mnie zawodzi: rzeczy, które uważałem za pewne, czasem stają się czymś innym.#Łąka pełna świeżej trawy zaczyna kwitnąć, jeśli zamknę oczy tylko na sekundę. Skalne urwisko - a byłem pewien, że to tylko wielka skała - w mgnieniu oka zmienia się w górski szczyt.#Kiedy takie przemiany się nawarstwiają, rodzi się kompletna i fizycznie odczuwalna metamorfoza. Nie potrafię jej w ogóle opisać, bo jej forma zmienia się nieustannie zupełnie przypadkowo."
encyclo_res15_0="Skupisko szczególnie uroczystych, smutnych wspomnień.Czy to szkielet powstały z grobu wbrew swojej woli, czy wampir zmuszony do zadawania cierpienia wszystkim innym, każdy nieumarły przypomina mi o śmierci. Wszystko na świecie jest zapomniane - nawet sens śmierci.#Muszę sobie o tym ciągle przypominać. Na szczęście w dzisiejszych czasach mogę fizycznie nosić te myśli i wspomnienia ze sobą - jako żałosne szczątki, lub jako bardziej namacalne Orby Życia Pozagrobowego."
encyclo_res17_0="Kawałek samego kosmosu. Odłamek czasu. Fragment czegoś nieskończonego i niezmierzonego.#Nie czuję jego kształtu nawet trzymając go w dłoni: to tak, jakbym nic nie chwytał.#Rzeczy tego typu trafiają do naszego świata wraz z różnymi istotami zdolnymi do magii. Tylko one potrafią wydobyć kawałki płaszczyzny astralnej i wykorzystać je do własnych potrzeb."
encyclo_res19_0="Zmaterializowany okruch inspiracji. Kiedy widzę czyjś kunszt lub ręczną robotę, czuję chęć stworzenia czegoś również. Wstyd, że nie mam do tego umiejętności.#Ale nie mogę się powstrzymać od zbierania różnych kawałków pozostałych po misternych skrzyniach czy dziwacznych żywych strachach na wróble, które napotykam.#Jestem pewien, że mogę znaleźć jakichś zręcznych rzemieślników z powrotem w obozie, którzy będą w stanie znaleźć dobre zastosowanie dla tej nowo znalezionej inspiracji."
encyclo_res21_0="Świata już nie ma, ale natura zawsze się dostosowuje - a żywa tkanka jest tego dowodem. To jest mały korzeń, który jest w ciągłym ruchu.#Skręca się i wije w mojej dłoni, jakby próbował znaleźć jakąś glebę do wzrostu. Wiele korzeni przylega do siebie i tworzy jedną kulę: dopiero wtedy uspokajają się i zapadają w jakąś formę drzemki.#Wydaje się, że te korzenie próbują zbliżyć się do innych roślin i żywych istot w tym pustym świecie. Myślę jednak, że nie powinniśmy ich sadzić przy obozie. Nie chcielibyśmy, aby wyrosło z nich coś paskudnego."
encyclo_res23_0="Kulista kropla, zimna w dotyku i sprawiająca wrażenie płynnej - ale to nie do końca prawda.#Zatapia się w mojej dłoni jak wielka kropla, po czym zaczyna pełzać po niej jak rój drobnych owadów. Nie mogę być pewien, że to nie są faktycznie zrobione owady, ale nie mogę udowodnić, że jest inaczej. Jeśli zbiorę wystarczająco dużo tej bezkształtnej masy, tworzy ona małą kulę i przestaje zachowywać się jak żywa. Zamierzam nazwać te sfery ^Kulą Jedności^# Początkowo myślałem, że te kropelki to śluzowate babole. Ale wygląda na to, że ten materiał można znaleźć wokół wszelkiego rodzaju płynnych lub rojących się stworzeń."

encyclo_res1_how="- Karty Las i Gaj#-Łup ze skarbu#- 
Wypada z niektórych wrogów"
encyclo_res3_how="- Karty Skały i Góry#-Łup ze skarbu#- 
Wypada z niektórych wrogów"
encyclo_res5_how="- Nieużywany sprzęt w inwentarzu rozkłada się na Złom#-Łup ze skarbu#- 
Wypada z niektórych wrogów"
encyclo_res7_how="- Dropi po walce na polach bitewnych#-Łup ze skarbu#- 
