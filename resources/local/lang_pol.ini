[res]
res0_1="Kawałek patyka"
res0_2="Jakoś pamięć o tych patykach nie zaginęła."
res0_3="kawałków patyka tworzy kłodę drewna."

res1_1="Kłoda drewna"
res1_2="Kłoda, która w jakiś sposób zdołała zachować swoją integralność strukturalną pomimo ogólnego chaosu."

res2_1="Małe kamyczki"
res2_2="Małe kamyczki, które wciąż pamiętają, jak kiedyś wyglądał świat. Kiedy trzymasz je w ręku, jesteś w stanie przez kilka sekund go sobie przypomnieć."
res2_3="małych kamyczków tworzy solidny głaz."

res3_1="Solidny głaz"
res3_2="Najwyraźniej nietknięty przez klątwę Licza i dzięki temu nadający się do budowy, mimo bezkształtności świata."

res4_1="Kawałki złomu"
res4_2="Małe kawałki metalu, które przetrwały klątwę Licza. Czasami to wszystko, co pozostaje ze zbroi lub miecza, na który nie patrzyłeś od dłuższego czasu."
res4_3="kawałków złomu tworzy sztabkę metalu."

res5_1="Sztabka metalu"
res5_2="Sztabka metalu uratowana przed pożarciem przez Licza. Sztabki trzymają się razem jak namagnesowane."

res6_1="Racja żywnościowa"
res6_2="Niewielka ilość jedzenia. O dziwo, wciąż może zaspokoić głód. Takie rzeczy to teraz prawdziwy luksus."
res6_3="racji żywnościowych stanowi całość zaopatrzenia dla paczki żywności."

res7_1="Paczka żywności"
res7_2="Mała paczka z jedzeniem znaleziona w ruinach nowego świata. W przeciwieństwie do reszty świata, głód wciąż tu panuje i będziesz potrzebował wszelkich środków, aby z nim walczyć."

res8_1="Orbital ekspansji"
res8_2="Fizyczna manifestacja rozszerzającej się przestrzeni w postaci małej kuli."

res9_1="Artefakt wskrzeszania"
res9_2="Zazwyczaj śmierć jest niestabilna. Ten artefakt sprawia, że nie ma jej przez kilka sekund. To zwykle wystarcza, aby uniknąć tego makabrycznego losu."

res10_1="Fragment pamięci"
res10_2="Plotki, mity, czyjeś urojenia. Zrozumienie tego wszystkiego zajmie tygodnie. I miną lata, zanim zdecydujesz, czy naprawdę tego potrzebujesz."
res10_3="fragmentów układa się w kompletną księgę wspomnień."

res11_1="Księga wspomnień"
res11_2="Tylko fakty i wiele prawd. Ale tylko o jednej rzeczy. I tylko raz."

res12_1="Odłamek zmiany"
res12_2="To wystarczy, aby zmienić gąsienicę w motyla, nasiono w kiełek, lub kroplę wody w parę. Zamieni się w coś innego, jeśli zbierzesz jej wystarczająco dużo."
res12_3="odłamków zmiany tworzy kulę metamorfozy."

res13_1="Kula Metamorfozy"
res13_2="Zdolność świata do zmian i transformacji została starannie oderwana od jego istnienia, umieszczona w orbicie i zniszczona. To miłe, że nie jest to nieodwracalne."

res14_1="Nędzne szczątki"
res14_2="Życie, które ktoś przeżył. Pragnienie, by żyć dalej. Smutny los."
res14_3="szczątków tworzy cały orbital życia pozagrobowego."

res15_1="Orbital życia pozagrobowego"
res15_2="Wszystkie istnienia mają zdolność do umierania. Możesz uważać to za straszne, ale świat nie mógłby istnieć bez swojej kruchości i przemijania."

res16_1="Odłamek czasu"
res16_2="Prawa tego świata są zazwyczaj oparte na przestrzeni i czasie. Ale przestrzeń jest rozbita. I tak samo czas, jak widać."
res16_3="odłamków tworzy całą sferę astralną."

res17_1="Sfera astralna"
res17_2="Pustka wypełniona echami światła odległych gwiazd. Brak gwiazd na niebie sugeruje, że i one zostały zabrane z tego świata."

res18_1="Fragment projektu"
res18_2="Delikatne okucie, mistrzowska rzeźba. Fragmenty pracy wykonanej przez czyjeś zręczne ręce."
res18_3="fragmentów tworzy kompletny projekt."

res19_1="Kompletny projekt"
res19_2="Praca, która została wykonana bezbłędnie. Życie spędzone na poszukiwaniu perfekcji."

res20_1="Żywa tkanka"
res20_2="Fragment tkanki, który żyje, rośnie, a nawet się starzeje. Ogólnie rzecz biorąc, substancja o bardzo ciekawej strukturze."
res20_3="kawałków tkanki tworzy cały orbital ewolucji."

res21_1="Orbital ewolucji"
res21_2="Próba poprawy, adaptacji i przetrwania. Odwieczna walka o miejsce pod sklepieniem niebieskim."

res22_1="Bezkształtna masa"
res22_2="Płynna masa jednorodnych elementów. Elastyczny obraz o pasywnej plastyczności."
res22_3="jej cząstek tworzy orbital jedności."

res23_1="Orbital jedności"
res23_2="Oddzielenie uczynione całością. Sposób, by stać się czymś więcej niż tylko sumą swoich składników. Porządek stworzony z chaosu."



