perk_16="^Zabójcze osłabienie^#Każde 10% utraconego hp daje ci @% szansy na natychmiastowe zadanie 1000% obrażeń."
perk_17="^Nic nie jest święte^#+@ hp po zabiciu wroga."
perk_18="^Mistrz szermierki^#@% szansy na zaatakowanie jednocześnie dwóch przeciwników."
perk_19="^Krawędź niemożliwości^#@% szansy przy przywołaniu ostatniego możliwego szkieletu na przywołanie dwóch zamiast jednego."
perk_20="^Praktyka w terenie^#+@ do poziomu szkieletów na pętlę (zaczynając od pętli, w której otrzymano tę umiejętność)."
perk_21="^Sztuka kontroli^#+1 do maksymalnej liczby szkieletów."
perk_22="^Resztki ciepła^#Wchłaniasz [@*pętla] hp po śmierci każdego szkieletu (leczenie)."
perk_23="^Ambicje umarłych^#Po zabiciu przeciwnika, szkielet w pełni się leczy; jego obrażenia i hp są zwiększone o @% do końca walki."
perk_24="^Kontratak^#Po otrzymaniu przez bohatera obrażeń bezpośrednich wszystkie szkielety mają @% szans na natychmiastowe wykonanie kontrataku."
perk_25="^Przygotowanie do ceremonii^#Pierwsze dwa szkielety przywołane w ciągu dnia zostaną wzmocnione."
perk_26="^Niewidzialna opieka^#Stała premia +@ do Osł. astralnej za każdego przywołanego szkieleta, do końca wyprawy."
perk_27="^Horda^#3 wzmocnione szkielety będą dołączać do bohatera na każdej pętli, aby pomóc w walce."
perk_28="^Oddanie życia^#Wszelkie bezpośrednie obrażenia bohatera zostaną równo rozdzielone pomiędzy niego i jego szkielety."
perk_29="^Ostre karty^#@% szansy na zachowanie karty po jej zagraniu (nie działa dla złotych kart)."
perk_30="^Geodeta^#Leczy [@*pętla] hp bohatera, odbierane na Pustkowiu przy zabudowanym segmencie, podczas mijania tego segmentu."
perk_31="^Druga myśl^#Zdobądź nowy zestaw 3 umiejętności (nie wydajesz punktu)."
perk_32="^Dostawy^#Bohater pozostawia @% swoich 'znalezisk' w Magazynie zasobów, gdy przechodzi przez Przytulne obozowisko."
perk_33="^Surwiwalista^#Jeśli twoje hp spadnie poniżej @%, twoja 'Regen. na sek.' jest podwajana."
perk_34="^Beztroska ignorancja^#Daje ci pełną rękę kart ^Szczelina^. Od tej pory używanie kart ^Szczelina^ leczy bohatera o @% jego maksymalnego hp."
perk_35="^Głębokie kieszenie^#Limit surowców w trakcie tej wyprawy zostaje zwiększony o @%."
perk_36="^Pochylenie osi^#Czas biegnie @% szybciej."
perk_37="^Technika Omicrona^#+1 ładunek wskrzeszenia z pełnym uzdrowieniem."
perk_38="^Przebudzony fragment^#@% szansy na otrzymanie całej Księgi zamiast jednego Fragmentu pamięci."
perk_39="^Poszukiwacz skarbów^#@% szansy na pojawienie się skrzyni z łupami, po zabiciu wroga."
perk_40="^Dar krwi^#Po trafieniu przeciwnika bohater może przywołać Krwawą błyskawicę z niewiadomą szansą."
perk_40_0="^Ofiara krwi^#Po trafieniu przeciwnika bohater może przywołać Krwawą błyskawicę. Szansa jest równa wampiryzmowi."
perk_40_1="^Kunszt krwi^#Po trafieniu przeciwnika bohater może przywołać Krwawą błyskawicę. Szansa jest równa szansie na trafienie krytyczne."
perk_40_2="^Dary krwi^#Po trafieniu przeciwnika bohater lub jego szkielet może przywołać Krwawą błyskawicę. (Szansa @%)."
perk_41="^Myto pośmiertne^#@% szansy na otrzymanie losowego surowca podstawowego po zabiciu wroga."
perk_42="^Wykwalifikowany architekt^#Za każdym razem, gdy stawiasz jakikolwiek 'segment' w trakcie wyprawy, bohater otrzymuje [@*pętla] doświadczenia."
perk_43="^Boże oko^#@% szansy, że wrogowie będą mieli jedną umiejętność mniej. Nie ma wpływu na bossów."
perk_44="^Tarcza wiary^#Po zabiciu wroga bohater otrzymuje jedeno Odbicie lustrzane, które może go chronić z @% szansą. @ Odbicia lustrzane max."
perk_45="^Ich własne zagrożenie^#Bohater ma @% szans na odbicie strzału z dystansu w losowego przeciwnika."
perk_46="^Butelka bez dna^#@% szansy na ponowne napełnienie eliksiru leczniczego przy wypiciu."
perk_47="^Ślepa furia^#Raz na bitwę bohater atakuje 4 razy z podwójną prędkością, gdy jego zdrowie spadnie poniżej @%."
perk_48="^Szybsi od błyskawicy^#bohater lub jego szkielety mają @% szans na wykonanie szybkiego combo (3-trafienia), przy czym każde trafienie zadaje @% obrażeń."
perk_48_0="^Szybki jak błyskawica^#bohater ma @% szans na wykonanie szybkiego combo (3-trafienia), przy czym każde trafienie zadaje @% obrażeń."
perk_48_1="^Szybcy jak błyskawica^#Przywołane szkielety mają @% szans na wykonanie szybkiego combo (3-trafienia), przy czym każde trafienie zadaje @% obrażeń."
perk_49="^Znak Łowcy^#Po zabiciu przeciwnika, twój następny atak zada [@*pętla] dodatkowych obrażeń."

