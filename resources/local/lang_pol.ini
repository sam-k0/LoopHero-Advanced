[tutorial]
tutorial_pc="(Spacja, prawy klik, przełącznik trybów)"
tutorial_mob="(Przełącznik jest na górze lub po prawej stronie ekranu)"
tutorial_joy="(%btn2)"
tutorial_1="Aby zmienić tryb między ^Przygodą^ (podróżowanie po mapie) a ^Planowaniem^ (zatrzymanie) naciśnij przełącznik"
tutorial_1_1=", Prawym przyciskiem myszy lub Spacją.##"
tutorial_1_2="Albo po prostu wciśnij przycisk w prawym dolnym rogu.##"
tutorial_1_3="- Kontynuuj swoją podróż zmieniając tryb gry."
tutorial_1_joy="Aby zmienić tryb pomiędzy ^Przygodą^ (podróżowanie po mapie) a ^Planowaniem^ (zatrzymanie) naciśnij %btn2.##"
tutorial_2="Zwróć uwagę na pasek postępu dnia u góry ekranu. Nowi wrogowie pojawiają się zazwyczaj pod koniec dnia.##- Kontynuuj swoją podróż zmieniając tryb gry."
tutorial_3="Podróżowanie, walka i większość innych akcji odbywa się automatycznie. Gracz nie może na nie bezpośrednio wpływać.##- Naciśnij gdziekolwiek, aby kontynuować."
tutorial_3_joy="Podróżowanie, walka i większość innych akcji odbywa się automatycznie. Gracz nie może wpływać na nie bezpośrednio.##- Naciśnij %btn1 aby kontynuować."
tutorial_4="Masz inwentarz i slot na przedmioty. Wiesz co robić.##- Wyposaż się w przedmiot, aby kontynuować."
tutorial_4_1="(Przytrzymaj %btnZR aby przełączyć się na wybór przedmiotów i wyposaż miecz za pomocą %btn1)"
tutorial_5="Możesz użyć kart, które zostają po pokonaniu wrogów, aby dodać różne nowe obiekty do mapy. Do tego właśnie służy tryb ^Planowania^.##- Przeciągnij kartę w odpowiednie miejsce, aby ^Pamiętać^ o krainie."
tutorial_5_1="(Przytrzymaj %btnZL, aby przełączyć się na wybór kart i umieść kartę za pomocą Lewego Drążka i %btn1)"
tutorial_6="Dobrze.##- Teraz kontynuuj swoją podróż."
tutorial_8="Jak już pewnie zauważyłeś, podczas walki możesz zdobyć nowe przedmioty i karty.Niektóre przedmioty mają unikalne cechy, podobnie jak większość kart.@##- Wyposaż nową broń i umieść swoje nowe karty na mapie, aby kontynuować."
tutorial_8_1="Najeżdżając na przedmiot lub kartę możesz sprawdzić jej właściwości."
tutorial_8_2="Klikając na przedmiot lub kartę możesz sprawdzić jego właściwości."
tutorial_8_3="Przytrzymując %btnZR lub %btnZL i wybierając przedmiot lub kartę możesz sprawdzić jej właściwości."
tutorial_9="Niektóre z twoich akcji przyniosą zasoby, których będziesz potrzebował później, ale nie teraz. Nie powinno cię to jednak powstrzymać od przyjrzenia się im już teraz.##- Kontynuuj swoją podróż zmieniając tryb gry."
tutorial_10="Sama gra jest podróżą po zapętlonej ścieżce. Tylko ty zdecydujesz, kiedy nadejdzie czas powrotu bohatera do obozu... Albo ty, albo kły i pazury wrogów, oczywiście.#Możesz wycofać się niemal w każdej chwili, ale specjalna animacja da ci znać, kiedy będzie bezpieczniej.##- Wycofaj się do obozu, wciskając przycisk."
tutorial_10_joy="Sama gra jest podróżą po zapętlonej ścieżce. Tylko Ty zdecydujesz, kiedy nadejdzie czas, by bohater wrócił do obozu... Albo ty, albo kły i pazury wrogów, oczywiście.#Możesz wycofać się niemal w każdej chwili, ale specjalna animacja da ci znać, kiedy będzie bezpieczniej.##- Wycofaj się do obozu, wciskając %btn4"
tutorial_11="Ładne miejsce na rozbicie obozu.#To właśnie wtedy przydadzą się wszystkie zasoby, które zgromadziłeś. Kto by pomyślał? Masz akurat tyle drewna i kamieni, że możesz rozpalić ognisko! Co za miły zbieg okoliczności!#Zbuduj ognisko używając funkcji budowy będąc w obozie.##- Naciśnij przycisk Build, wybierz ognisko i umieść je."
tutorial_12="Gratulacje! Pokonałeś ten irytujący tutorial.#Możesz teraz rozpocząć swoją pierwszą wyprawę... Albo i nie... Zrób jak chcesz.##- Kliknij gdziekolwiek, aby zakończyć samouczek."


