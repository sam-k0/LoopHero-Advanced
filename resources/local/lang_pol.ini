[cardroad]
crd-1_1="Szczelina"
crd-1_2="Odrobina magii Licza. Powoduje, że wszystko zostaje całkowicie zapomniane."
crd-1_3="• Wymazuje wskazane pole.#• Odsyła wszystkie potwory na wskazanym polu.#• Po aktywowaniu odpowiedniej umiejętności leczy bohatera."

crd0_1="Pustkowia"
crd0_2="Nie ma tu absolutnie nic... No, poza szlamem..."
crd0_3="• 5% szansy na pojawienie się Szlamu raz dziennie."

crd1_1="Cmentarz"
crd1_2="Miejsce dla zmarłych... I dla niektórych żywych, od czasu do czasu."
crd1_3="• Wskrzesza Szkieleta co 3 dni."

crd2_1="Wioska"
crd2_2="Najpierw cię nakarmią, potem zmuszą do pracy."
crd2_3="• Po wejściu leczy @ hp.#• Co jakiś czas przydziela zadanie."
crd2_4="[15+5*pętla]"

crd3_1="Zagajnik"
crd3_2="Delikatny szelest liści, trzask suchych gałęzi i poczucie bycia obserwowanym."
crd3_3="• Co 2 dni rodzi Szczurowilka. Może on przejść na przylegające pole."

crd4_1="Pola pszenicy"
crd4_2="Snopki pszenicy wyglądają jak przytulne miejsce do odpoczynku, ale trzeba iść dalej."
crd4_3="• Mogą być umieszczone tylko w pobliżu segmentu Wioski.#• +@ HP do leczenia w przylegających Wioskach.#• Tworzy Stracha na wróble co 4 dni#"
crd4_4="[5*pętla]"

crd5_1="Gniazdo pająków"
crd5_2="Jedwabisty bastion ośmionożnych łowców."
crd5_3="• Raz dziennie tworzy Pająka na przylegającym polu."

crd6_1="Posiadłość wampirów"
crd6_2="Głodne oczy śledzą każdy twój ruch, przez dziury w dachu."
crd6_3="• Dodaje Wampira do bitew na sąsiednich polach."

crd7_1="Pole bitwy"
crd7_2="Pachnie krwią i stalą."
crd7_3="• Na początku każdej pętli pojawia się Kufer z łupami.#• Wrogowie na sąsiednich polach, po śmierci w bitwie, mogą powstać jako Duchy."

crd8_1="Obóz goblinów"
crd8_2="Dźwięk zdrady słychać z bardzo daleka."
crd8_3="• Na przylegającym polu pojawia się jeden Goblin dziennie.#• Obóz goblinów powstaje za każde 10 Gór/Wzgórz."

crd9_1="Lampion"
crd9_2="Punkt orientacyjny w świecie, w którym nie ma kierunku."
crd9_3="• +40% do prędkości ruchu w zasięgu Lampionu.#• +20% do prędkości ataku dla wszystkich stworzeń, w zasięgu Lampionu."

crd10_1="Wzgórza"
crd10_2="Ich wspaniały wygląd daje Ci siłę."
crd10_3="• +@ hp.#• +@ więcej do hp za każdą sąsiadującą Górę/Wzgórze."
crd10_4="• +1% do bazowego hp.#• +1% dla każdej przylegającej Góry lub Wzgórza."

crd11_1="Góry"
crd11_2="Coś jak wzgórza, ale naprawdę duże."
crd11_3="• +@ hp za każdą przylegającą Górę/Wzgórze."
crd11_4="• +2% do bazowego HP za każdą sąsiadującą Górę/Wzgórze."

crd12_1="Las"
crd12_2="Gęsty las. Nikt nie wie, kto lub co może czaić się w głuszy. To sprawia, że jesteś trochę zdenerwowany."
crd12_3="• +@% do szybkości ataku bohatera."

crd13_1="Puszcza"
crd13_2="Jest tak gęsta, że nie przebije jej nawet jeden promień słońca. Tylko najszybsi mogą tu przetrwać."
crd13_3="• +@% do szybkości ataku bohatera."

crd14_1="Krwawy gaj"
crd14_2="Żywy las. Mięsożerne korzenie, żerują na rannych istotach w okolicy. Mogą zrodzić coś strasznego z ich szczątków."
crd14_3="• Może być umieszczony w sąsiedztwie 'zalesionych' terenów. Na polu przylegającym do Pustkowi.#• Jego korzenie pożerają wrogów, którym pozostało mniej niż 15% hp."

crd15_1="Świątynia burzy"
crd15_2="Miejsce kultu starożytnego boga piorunów. Jego imię jest dawno zapomniane."
crd15_3="• Co 5 sekund uderza piorunem w 2 losowe cele w zasięgu. Piorunów nie można uniknąć.#• Efekty kilku Świątyń mogą się sumować."

crd16_1="Biblioteka"
crd16_2="Archiwum starożytnych tomów. Możesz tu zdobyć wiedzę w zamian za... inną wiedzę."
crd16_3="• Gdy przechodzisz obok, wymienia trzy karty z ręki na losowe.#• Niszczeje po 20 wymianach."

crd17_1="Opuszczona biblioteka"
crd17_2="Twoja chciwość uwolniła starożytne księgi, które teraz poszukują uzdolnionych czarodziejów."
crd17_3="• Dodaje Tomiszcza do bitew na sąsiednich polach."

crd18_1="Rzeka"
crd18_2="Płynie nie wiadomo skąd i nie wiadomo gdzie. To sprawia, że jest to być może jedyna rzecz na tym świecie, która ma swój koniec."
crd18_3="• Podwaja efekty przylegających segmentów 'terenowych'."

crd19_1="Latarnia uliczna"
crd19_2="Mała plamka światła w tym ponurym świecie."
crd19_3="• Zmniejsza maksymalną liczbę potworów na sąsiednich polach.#• Efekt ten może się sumować."

crd20_1="Bagno"
crd20_2="Smród jest morderczy. A może to trucizna."
crd20_3="• Co 3 dni pojawia się Komar.#• Wszystkie efekty lecznicze zadają tutaj obrażenia. Z wyjątkiem eliksirów, one nadal są po twojej stronie."

crd21_1="Arsenał"
crd21_2="Centralny ośrodek dla prawdziwych mistrzów wojennego rzemiosła. Mogą oni nauczyć walczyć każdego wszelaką bronią."
crd21_3="• Tworzy bohaterowi dodatkowy slot na przedmiot.#• Obniża jakość przedmiotów ekwipunku o @%."

crd22_1="Labirynt wspomnień"
crd22_2="Misterna struktura jego ścian zmusza Cię do użycia pamięci i zapamiętania dużej części tego świata."
crd22_3="• Nic nie robi.#• Zajmuje dużo miejsca."

crd23_1="Prastary monolit"
crd23_2="Pomnik pierwszego kroku postawionego przez pierwszego odkrywcę."
crd23_3="• Równomiernie zmienia moc potworów w zależności od ich położenia na segmentach Pustkowi. Osłabia te, które znajdują się blisko Monolitu, a wzmacnia te, które są daleko.#• Nie wpływa na bossów."

crd24_1="Splądrowana wioska"
crd24_2="Rolnicy nie mogli walczyć z głodnym wampirem. Mogliby jednak walczyć z twoją pomocą!."
crd24_3="• Raz na pętlę tworzy do 4 Ghuli.#• Po 3 pętlach zamienia się w coś użytecznego."

crd25_1="Ziemie hrabiego"
crd25_2="Wioska kwitnie pod opieką wampira, a jej mieszkańcy są bardzo hojni."
crd25_3="• Po wejściu leczy @ hp.#• Co jakiś czas, oferuje zadanie z lepszą nagrodą."
crd25_4="[15+15*pętla]"

crd26_1="Kuźnia Smitha"
crd26_2="Gildia kowali wytwarza zbroje z metalu, czasem może wytworzyć rodzaj życia' z samej zbroi."
crd26_3="• Usuwa do 2 przedmiotów z ekwipunku.#• Przydziela efekt (na @ trafień za każdy usunięty przedmiot), który daje dodatkowe @% defensywy."

crd27_1="Trzcina"
crd27_2="Pojawia się nad rzeką i przy drogach; coś łuskowatego obserwuje cię stamtąd."
crd27_3="• Co 3 dni pojawia się Rybiarz."

crd28_1="Most"
crd28_2="Solidny i niezawodny. Umieszczany pomiędzy brzegami rzek w celu ich połączenia."
crd28_3="• Nie robi nic.#• Tylko nieliczni rozumieją, że nie tylko Most przeprawia się przez Rzekę, ale również Rzeka przeprawia się przez Most."

crd29_1="Pałac Liczów"
crd29_2="To właśnie tutaj czarnoksiężnik Omicron przeprowadzał swoje daremne eksperymenty, próbując powstrzymać śmierć cieplną Wszechświata."
crd29_3="• Każdy pałac zwiększa hp i obrażenia Licza o @%."

crd30_1="Zarośnięte pole"
crd30_2="Nikt go nie zasiał i nikt nie zbierze jego plonów. A jednak w jakiś sposób wciąż tu jest."
crd30_3="• Co 4 dni pojawia się Strach na wróble.#• Podczas walki na pustych polach tworzy się Żywy cierń."

crd31_1="Zarośnięta wioska?"
crd31_2="Wynik prób zrozumienia ludzkiej cywilizacji przez las."
crd31_3="• Co 2 dni pojawia się Leśny golem.#• Zarośnięta wioska powstaje za każde 10 segmentów Lasu/Puszczy."

crd32_1="Nienasycone ciernie"
crd32_2="Ciernie, które straciły połączenie z żywicielem. W ciągłej agonii z powodu swojej irracjonalnej egzystencji."
crd32_3="• Od czasu do czasu atakuje bohatera (@ obrażeń).#• Pożera wrogów, którym pozostało mniej niż 20% hp."
crd32_4="[@+@*pętla]"

crd33_1="Kryształy Chrono"
crd33_2="Kryształy, które są w stanie załamać nie tylko światło wschodzącego słońca, ale i sam świat."
crd33_3="• Podwaja efekt upływu jednego dnia na sąsiednich polach, dla segmentów z dziennymi cyklami."

crd34_1="Latarnia temporalna"
crd34_2="Jej światło jest tak jasne, że pozwala zapomnieć o upływającym czasie."
crd34_3="• W jej zasięgu każdy dzień mija @% szybciej. Efekt ten może się sumować.#• Potrafi zrodzić w swojej aurze Strażnika czasu, który boi się Wampirów."

crd35_1="Wypalony las"
crd35_2="Drzewa, które zostały uderzone przez piorun i spalone na popiół, napełniają się nową mocą."
crd35_3="• +@ obrażeń magicznych."

crd36_1="Ruiny"
crd36_2="Istnienie tej cywilizacji zakończyło się na długo przed klątwą Licza. Ale jej pozostałości mogą ci się jeszcze przydać."
crd36_3="• Daje losowe zasoby przy odwiedzinach.#• Tworzy Robaka zgorzelinowego co 2 dni."

crd37_1="Szlak krwi"
crd37_2="Nie tylko duchy powstają na polach bitew."
crd37_3="• Co 4 dni tworzy się Skrzep krwi."

crd38_1="Wrak okrętu"
crd38_2="Statki handlowe często padają ofiarą ekspansji Rybaków, i nie tylko."
crd38_3="• Na początku każdej pętli pojawia się Syrena.#• Na początku każdej pętli pojawia się Kufer z łupami, bez Mimika.#• Wrogowie na sąsiednich polach, po śmierci w bitwie, mogą powstać jako Duchy."

crd39_1="Czatownia goblinów"
crd39_2="Niestety, nawet bagna nie wystarczą, aby pozbyć się Goblinów. One potrafią przyzwyczaić się do wszystkiego."
crd39_3="• Dodaje Goblińskiego łucznika do bitew na sąsiednich polach."

crd40_1="Pustynia"
crd40_2="Pustynny żar spala wszystko na swojej drodze, nie tylko ciebie."
crd40_3="• Obniża hp każdej istoty o 0.5%."

crd41_1="Wydmy"
crd41_2="Gorący wiatr od wydm sprawia, że wszyscy czują straszne pragnienie."
crd41_3="• Obniża hp każdej istoty o 1%."

crd42_1="Oaza"
crd42_2="Woda z małego strumyka ukrytego w wydmach działa na Ciebie uspokajająco."
crd42_3="• -0.5% do prędkości ataku bohatera.#• -1% prędkości ataku dla wszystkich innych stworzeń."

crd43_1="Posterunek"
crd43_2="Strażnik z tego posterunku zawsze chętnie pomoże podróżnemu. Ale nie za darmo."
crd43_3="• Na przylegających polach do walki dołączy Strażnik.#• Wszelki 'pomarańczowy' i 'żółty' ekwipunek upuszczony w walce zostanie wydany jako zapłata za jego pracę."
crd43_4="• Nekromanta nie jest tu mile widziany. Strażnik zaatakuje jego i wszystkich w pobliżu."

crd44_1="Szczyt górski"
crd44_2="Kamienny gigant. Mógłby utrzymać niebo, gdyby jeszcze było..."
crd44_3="• +@ hp.#• +@ dodatkowe hp za każdy przylegający segment Góry/Wzgórza.#• Tworzy Harpię co 2 dni."

crd45_1="Skarbiec"
crd45_2="Grube mury strzegą wszelkiego rodzaju bogactw przed złodziejami i poprzednimi właścicielami."
crd45_3="• Daje losowy zasób po umieszczeniu czegokolwiek na sąsiednim polu.#• Nie może być zbudowany w sąsiedztwie czegokolwiek."

crd46_1="Pusty skarbiec"
crd46_2="Skarbiec bez skarbu. Pusta skorupa. Przykry widok. Zwłaszcza dla jego kamiennych strażników, którzy przespali swoją wieczną wartę..."
crd46_3="• Co 3 dni pojawia się Gargulec."

crd47_1="Łąka"
crd47_2="Ziemia pokryta gęstym dywanem trawy. Nic ciekawego... chyba że jest się krową, oczywiście..."
crd47_3="• Odnawia 2 hp bohatera na początku każdego dnia."

crd48_1="Krypta rodowa"
crd48_2="Miejsce ostatniego spoczynku pradawnej rodziny. Śmierć i te lekcje, których uczy, są tu honorowane."
crd48_3="• +3 max hp za każdego zabitego wroga z duszą.#• Usuwa bonus hp ze zbroi.#• Dodaje jedno wskrzeszenie z pełnym uzdrowieniem bohatera."

crd49_1="Kwiecista łąka"
crd49_2="Kwiaty wyłaniają się z traw i roztaczają przyjemny zapach."
crd49_3="• Odnawia 3 hp bohatera na początku każdego dnia."

crd50_1="Peryferia"
crd50_2="Zaczynasz pamiętać wielkie kamienne budynki. Ale nie ludzi, którzy je zamieszkiwali."
crd50_3="• Mogą być umieszczone tylko w pobliżu innych Peryferii (jeśli już takie powstały).#• Zwiększa doświadczenie zdobywane za zabicie wroga o 1."

crd51_1="Miasto"
crd51_2="Pęknięcia w ścianach i starożytne zwoje mogą powiedzieć Ci wiele rzeczy o ludziach, którzy kiedyś tu mieszkali."
crd51_3="• Zwiększa doświadczenie zdobywane za zabicie wroga o 2."

crd52_1="Wrota wymiarów"
crd52_2="Zbliżając się do wrót, odczuwasz rosnący niepokój."
crd52_3="• Czy jesteś gotowy stawić czoła temu, co znajduje się po drugiej stronie?"

crd53_1="Obóz bandytów"
crd53_2="Mistrzowie przehandlowania swojej biedy za cudze życie."
crd53_3="• Co 2 dni w wiosce pojawi się Bandyta.#• Bandyci lubią szabrować wioski .#• Obóz pojawia się co @ segmenty Wiosek."

crd54_1="Zygurat"
crd54_2="Piaski próbują pomóc światu w odbudowie. To jest rezultat."
crd54_3="• Na każdej pętli pojawia się Duch Pustyni.#• Każdy Duch Pustyni ma @% szans na dołączenie do bitwy w dowolnym miejscu na Pustkowiu.#• Pojawia się co @ segmentów Pustyni/Wydm."

crd55_1="Chata Wiedźmy"
crd55_2="Składowisko skorupek robaków, żabich udek i korzeni roślin. Mieszka tu również lokalna wiedźma."
crd55_3="• Daje ci Miksturę zdrowia za każdym razem, gdy przechodzisz obok.#• Dodaje Wiedźmę do bitew na sąsiednich polach.#• Kartę Chata Wiedźmy otrzymujesz co @ segmentów Bagna."

crd56_1="Ciernie"
crd56_2="Kolczaści mieszkańcy suchych ziem."
crd56_3="• Wrogowie zadają o @% mniej obrażeń (nie mniej niż -@%).#• Wrogowie atakują o @% szybciej (nie więcej niż +@%)."
















crd1000_1="Przytulne obozowisko"
crd1000_2="Wygodne miejsce do odpoczynku. Jest tajemnicze, ale wszystkie potwory starają się trzymać od niego z daleka."
crd1000_3="• Uzdrawia @% hp przy odwiedzinach."

crd1001_1="Totem Inwazji"
crd1001_2="Promieniują potężną energią, która pożera przestrzeń i czas."
crd1001_3="• Nadszedł czas, aby stawić czoła przeznaczeniu tego świata."


[camp]
cmp1_0_1="Przytulne obozowisko"
cmp1_0_2="Wspólne ognisko. Ciepłe i przytulne. Potwory trzymają się od niego z daleka, więc jest to miłe miejsce na odpoczynek między wyprawami. Jest to również centrum Twojego obozu i punkt startowy Twoich wypraw."
cmp1_0_3="• Po wejściu do Przytulnego obozowiska, bohater przywraca @% swojego maksymalnego HP."

cmp2_0_1="Kuchnia polowa"
cmp2_0_2="Bardzo ważne miejsce dla każdego obozu. Jeśli twój nos nie kłamie, to mają tu dobre jedzenie."
cmp2_0_3="• +10% do mocy leczniczej obozowiska.#• Odblokowuje kartę ^Krwawy gaj^."
cmp2_1_1="Stołówka"
cmp2_1_2="Bardzo ważne miejsce w każdym obozie. Unosi się stąd subtelny zapach zupy."
cmp2_1_3="• +18% do mocy leczniczej Przytulnego obozowiska.#• Odblokowuje kartę ^Krwawy gaj^."
cmp2_2_1="Knajpa"
cmp2_2_2="Bardzo ważne miejsce w każdym obozie. Przy wejściu witają Cię korzenne zapachy."
cmp2_2_3="• +24% do mocy leczniczej Przytulnego obozowiska.#• Twój bohater może tu dodatkowo odpocząć przed walką z bossem.#• Odblokowuje kartę ^Krwawy gaj^."
cmp2_3_1="Karczma"
cmp2_3_2="Bardzo ważne miejsce w każdym obozie. Smak niesamowitych przysmaków można poczuć nawet z daleka."
cmp2_3_3="• +40% do mocy leczniczej Przytulnego obozowiska.#• Twój bohater może tu dodatkowo odpocząć przed walką z bossem.#• Odblokowuje kartę ^Krwawy gaj^."

cmp3_0_1="Chata zielarza"
cmp3_0_2="Ręce zielarza zawsze pamiętają, jak mieszać suszone zioła i warzyć lecznicze mikstury."
cmp3_0_3="• Eliksir leczy 4% maksymalnego hp.#• Możesz zabrać ze sobą do 3 eliksirów; 2 eliksiry uzupełniają się w Obozowisku.#• Odblokowuje kartę ^Bagno^"
cmp3_1_1="Chata uzdrowiciela"
cmp3_1_2="Uzdrowiciel zna receptury na wiele skutecznych mikstur. Ale w jego ogrodzie są materiały tylko do niektórych z nich."
cmp3_1_3="• Eliksir leczy 6% maksymalnego hp.#• Możesz zabrać ze sobą do 5 eliksirów; 2 eliksiry uzupełnia się w Obozowisku.#• Odblokowuje kartę ^Bagno^."
cmp3_2_1="Wytwórca eliksirów"
cmp3_2_2="Wykorzystując swoją wiedzę na temat tajemniczych mikstur, wytwórca eliksirów potrafi uwarzyć przyzwoitą miksturę leczniczą."
cmp3_2_3="• Eliksir leczy 7% maksymalnego hp.#• Możesz zabrać ze sobą do 6 eliksirów; 3 eliksiry uzupełnia się w Obozowisku.#• Odblokowuje kartę ^Bagno^."
cmp3_3_1="Chata aptekarza"
cmp3_3_2="Mieszając odpowiednie zioła w odpowiednich proporcjach, aptekarz może uwarzyć doskonałą miksturę leczniczą."
cmp3_3_3="• Eliksir leczy 8% maksymalnego hp.#• Możesz zabrać ze sobą do 6 eliksirów; 4 eliksiry uzupełnia się w Obozowisku.#• Odblokowuje kartę ^Bagno^."
cmp3_4_1="Chata lekarza"
cmp3_4_2="Dzięki znajomości sztuki destylacji i filtrowania lekarz jest w stanie sporządzić krystalicznie czystą, doskonałą miksturę leczniczą."
cmp3_4_3="• Eliksir leczy 10% maksymalnego hp.#• Możesz zabrać ze sobą do 6 eliksirów; 4 eliksiry uzupełnia się w Obozowisku.#• Odblokowuje kartę ^Bagno^."

cmp4_0_1="Kuźnia"
cmp4_0_2="Dla kowala zawsze znajdzie się praca, apokalipsa czy nie."
cmp4_0_3="• Pozwala rozpocząć wyprawę z podstawowym wyposażeniem wojownika.#• Odblokowuje możliwość ^wytwarzanie^ narzędzi dla Magazynu zasobów, jeśli jest zbudowany."
cmp4_1_1="Profesjonala kuźnia"
cmp4_1_2="Lepsze narzędzia pozwalają kowalowi wykonać coś bardziej skomplikowanego niż prostą tarczę."
cmp4_1_3="• Pozwala rozpocząć wyprawę z podstawowym ekwipunkiem dla każdej klasy.#• Odblokowuje możliwość ^wytwarzanie^ narzędzi dla Magazynu zasobów, jeśli jest zbudowany.#• Odblokowuje kartę ^Kuźnia Smitha^."

cmp5_0_1="Lepianka"
cmp5_0_2="Rudera zrobiona z patyków i błota. Mieszka w niej tylko jedna osoba. Każdy mieszkaniec przybliża cię do zwycięstwa. Zbuduj więcej takich lepianek!"
cmp5_0_3="• Możesz dać mieszkańcom mebel lub żywność do przechowania."
cmp5_1_1="Szałas"
cmp5_1_2="Mały szałas zbudowany z liści, kamieni i gałęzi. Mieszczą się w niej dwie osoby. Każdy mieszkaniec przybliża Cię do zwycięstwa. Zbuduj więcej szałasów!"
cmp5_1_3="• Możesz dać mieszkańcom mebel, narzędzia lub żywność do przechowania."
cmp5_2_1="Mały domek"
cmp5_2_2="Prosty dom wykonany z drewna, kamieni i siana. Mieści trzy osoby. Każdy mieszkaniec przybliża Cię do zwycięstwa. Zbuduj więcej domków!"
cmp5_2_3="• Możesz dać mieszkańcom dwa meble, narzędzie, trochę jedzenia lub biżuterii do przechowania."
cmp5_3_1="Dom"
cmp5_3_2="Dobrze zbudowany dom z cegły, dachówki i łupka. Mieści cztery osoby. Każdy mieszkaniec przybliża Cię do zwycięstwa. Zbuduj więcej domów!"
cmp5_3_3="• Możesz dać mieszkańcom dwa meble, narzędzie, trochę jedzenia lub biżuterii do przechowania."

cmp6_0_1="Magazyn zasobów"
cmp6_0_2="Rzeczoznawca z przyjemnością zidentyfikuje wszystkie dziwne przedmioty, które znajdziesz w trakcie wyprawy, i przekaże je ludziom, którzy najbardziej ich potrzebują."
cmp6_0_3="• Odblokowuje funkcję ^Dostawy^.#• Od tej pory zaczniesz znajdować przydatne przedmioty dla swoich ludzi.#• Odblokowuje możliwość ^wytwarzania^ przedmiotów, jeśli posiadasz niezbędne budynki.#• Odblokowuje kartę ^Ruiny^."

cmp7_0_1="Chata drwala"
cmp7_0_2="Ponury, ale doświadczony drwal woli towarzystwo drzew i swojej siekiery."
cmp7_0_3="• Po wyprawie daje ci 1 Kawałek patyka za każdą ukończoną pętlę, ale nie więcej niż ilość płytek Lasu wokół Chaty drwala .#• Odblokowuje możliwość ^wytwarzania^ mebli, jeśli zostanie zbudowany Magazyn zasobów."

cmp8_0_1="Las"
cmp8_0_2="Majestatyczny szelest liści słychać już na skraju twojej wioski."
cmp8_0_3="• To jest domena Drwala.#• Odblokowuje karty ^Las^ i ^Puszcza^."

cmp9_0_1="Huta"
cmp9_0_2="Dodatek do kuźni. Sprawia, że życie kowala jest trochę lepsze. Więc twoje życie też stanie się lepsze."
cmp9_0_3="• Odblokowuje kartę ^Świątynia Burzy^.#• Odblokowuje złotą kartę ^Arsenał^, jeśli zbudowane jest Centrum wywiadu.#• +30 do bazowego hp."

cmp10_0_1="Centrum wywiadu"
cmp10_0_2="Wszystkie informacje, które znajdziesz o świecie, zasobach lub potworach są rejestrowane i przechowywane tutaj."
cmp10_0_3="• Odblokowuje ^Encyklopedię^.#• Odblokowuje karty ^Pustynia^ i ^Wydmy^.#• Odblokowuje możliwość dodawania złotych kart do talii"

cmp11_0_1="Schronienie"
cmp11_0_2="W tych ciężkich czasach twoim obowiązkiem jest niesienie pomocy potrzebującym. Może być zbudowane tylko obok kuchni polowej."
cmp11_0_3="• Odblokowuje nową klasę: Łotr."

cmp12_0_1="Biblioteka"
cmp12_0_2="Dodatek do centrum wywiadu. Biblioteki mogą rozszyfrować informacje i uzupełnić Twoją wiedzę o świecie."
cmp12_0_3="• Umożliwia odblokowanie dodatkowych stron w ^Encyklopedii^ w zamian za zasób ^Księga wspomnień^.#• Odblokowuje kartę ^Biblioteka^.#• Odblokowuje złotą kartę ^Labirynt wspomnień^, jeśli zbudowane jest Centrum Wywiadu."

cmp13_0_1="Rzeka"
cmp13_0_2="To niewiarygodne, ale to naprawdę było tutaj przez cały czas. Jakie ładne miejsce wybrałeś na rozbicie obozu!"
cmp13_0_3="• Odblokowuje kartę ^Rzeka^."

cmp14_0_1="Gospodarstwo"
cmp14_0_2="Plony rolnika są zawsze mile widzianym widokiem na stole."
cmp14_0_3="• Wszystkie puste segmenty wokół Gospodarstwa zamieniają się w ogrody. Po wyprawie daje ci 1 Rację żywnościową za każdą ukończoną pętlę, ale nie więcej niż jest płytek ogrodu wokół Gospodarstwa. Możesz budować na ogrodach.#• Odblokowuje zdolność ^wytwarzania^ żywności, jeśli zostanie zbudowany Magazyn zasobów.#• Odblokowuje kartę ^Pola pszenicy^."

cmp15_0_1="Magazyn"
cmp15_0_2="Przestronny dodatek do magazynu zasobów. Tutaj ludzie mogą przechowywać towary, na które nie ma miejsca w domu."
cmp15_0_3="• +10 do limitu przedmiotów w Magazynie zasobów."

cmp16_0_1="Cmentarz"
cmp16_0_2="Ponura, ale niezbędna część każdej wsi."
cmp16_0_3="• Przejście przez Cmentarz podczas wyprawy daje ci ^Fragment pamięci^.#• Po ulepszeniu może wskrzesić bohatera."
cmp16_1_1="Cmentarz"
cmp16_1_2="Ponura, ale niezbędna część każdej wsi."
cmp16_1_3="• Może wskrzesić bohatera z 15% hp raz podczas wyprawy.#• Przejście przez Cmentarz daje ci ^Fragment pamięci^.#• Po ulepszeniu może zwiększyć hp wskrzeszonego bohatera."
cmp16_2_1="Cmentarz"
cmp16_2_2="Ponura, ale niezbędna część każdej wsi.#• Po ulepszeniu może zwiększyć hp wskrzeszonego bohatera."
cmp16_2_3="• Może wskrzesić bohatera z 35% hp raz podczas wyprawy.#• Przejście przez Cmentarz daje ci ^Cragment pamięci^.#• Po ulepszeniu może zwiększyć hp wskrzeszonego bohatera."
cmp16_3_1="Cmentarz"
cmp16_3_2="Ponura, ale niezbędna część każdej wsi."
cmp16_3_3="• Może wskrzesić bohatera z 55% hp raz podczas wyprawy.#• Przejście przez Cmentarz daje ci ^Fragment pamięci^.#• Po ulepszeniu może zwiększyć hp wskrzeszonego bohatera."
cmp16_4_1="Cmentarz"
cmp16_4_2="Ponura, ale niezbędna część każdej wsi."
cmp16_4_3="• Może wskrzesić bohatera z 80% hp raz podczas wyprawy.#• Przejście przez Cmentarz daje ci ^Fragment pamięci^."

cmp17_0_1="Krypta"
cmp17_0_2="Umieszczona w pobliżu cmentarza.#Miejsce ostatniego spoczynku starożytnego bohatera. Zarówno magia jak i niestabilny stan świata odcisnęły na nim swoje piętno. Może jego historia obudzi w tobie jakieś nowe cechy."
cmp17_0_3="• Odblokowuje nową klasę: ^Nekromanta^.#• Odblokowuje złotą kartę ^Krypta rodowa^, jeśli zbudowano Centrum wywiadu."

cmp18_0_1="Obóz wojenny"
cmp18_0_2="Tor przeszkód z manekinami treningowymi i starym, zrzędliwym weteranem wojennym. Wystarczy, byś dłużej pożył w bitwie."
cmp18_0_3="• Zwiększa moc bohatera o 4%.#• Odblokowuje kartę ^Posterunek^."
cmp18_1_1="Obóz wojenny"
cmp18_1_2="Tor przeszkód z manekinami treningowymi i starym, zrzędliwym weteranem wojennym. Wystarczy, byś dłużej pożył w bitwie."
cmp18_1_3="• Zwiększa moc bohatera o 8%.#• Odblokowuje kartę ^Posterunek^."
cmp18_2_1="Obóz wojenny"
cmp18_2_2="Tor przeszkód z manekinami treningowymi i starym, zrzędliwym weteranem wojennym. Wystarczy, byś dłużej pożył w bitwie."
cmp18_2_3="• Zwiększa moc bohatera o 12%.#• Odblokowuje kartę ^Posterunek^."
cmp18_3_1="Obóz wojenny"
cmp18_3_2="Tor przeszkód z manekinami treningowymi i starym, zrzędliwym weteranem wojennym. Wystarczy, byś dłużej pożył w bitwie."
cmp18_3_3="• Zwiększa moc bohatera o 16%.#• Odblokowuje kartę ^Posterunek^."
cmp18_4_1="Obóz wojenny"
cmp18_4_2="Tor przeszkód z manekinami treningowymi i starym, zrzędliwym weteranem wojennym. Wystarczy, byś dłużej pożył w bitwie."
cmp18_4_3="• Zwiększa moc bohatera o 20%.#• Odblokowuje kartę ^Posterunek^."

cmp19_0_1="Most"
cmp19_0_2="Można z niego łowić ryby, lub po prostu przez niego przejść. To bardzo uniwersalna struktura."
cmp19_0_3="• Podczas wyprawy odblokowuje możliwość poprowadzenia Rzeki pod drogą (Pustkowia).#• W Obozie, nie można budować na zakolach Rzeki."

cmp20_0_1="Strażnica"
cmp20_0_2="Opuszczając obóz można zapomnieć wiele rzeczy. Ale nie zapomnisz strzał wystrzelonych stąd."
cmp20_0_3="• 1 Kusznik będzie ci pomagał z każdej Strażnicy w bitwach na polach sąsiadujących z Obozowiskiem. Dotyczy to tylko bitew z normalnymi przeciwnikami. Z bossami musisz radzić sobie sam.#• Możesz zbudować do 4 Strażnic."
cmp20_1_1="Strażnica"
cmp20_1_2="Opuszczając obóz można zapomnieć wiele rzeczy. Ale nie zapomnisz strzał wystrzelonych stąd."
cmp20_1_3="• 1 Kusznik z każdej Strażnicy pomoże ci w normalnych walkach, które są do 2 pól od Obozowiska. Z bossami musisz radzić sobie sam."
cmp20_2_1="Strażnica"
cmp20_2_2="Opuszczając obóz można zapomnieć wiele rzeczy. Ale nie zapomnisz strzał wystrzelonych stąd."
cmp20_2_3="• 1 Kusznik z każdej Strażnicy pomoże ci w normalnych walkach, które są do 2 pól od Obozowiska. Z bossami musisz radzić sobie sam."
cmp20_3_1="Strażnica"
cmp20_3_2="Opuszczając obóz można zapomnieć wiele rzeczy. Ale nie zapomnisz strzał wystrzelonych stąd."
cmp20_3_3="• 1 Kusznik z każdej Strażnicy pomoże ci w normalnych walkach, które są do 3 pól od Obozowiska. Z bossami musisz radzić sobie sam."
cmp20_4_1="Strażnica"
cmp20_4_2="Opuszczając obóz można zapomnieć wiele rzeczy. Ale nie zapomnisz strzał wystrzelonych stąd."
cmp20_4_3="• 1 Kusznik z każdej Strażnicy pomoże ci w normalnych walkach, które są do 3 pól od Obozowiska. Z bossami musisz radzić sobie sam."
cmp20_5_1="Strażnica"
cmp20_5_2="Opuszczając obóz można zapomnieć wiele rzeczy. Ale nie zapomnisz strzał wystrzelonych stąd."
cmp20_5_3="• 1 Kusznik z każdej Strażnicy pomoże ci w normalnych walkach, które są do 4 pól od Obozowiska. Z bossami musisz radzić sobie sam."

cmp21_0_1="Namiot Alchemika"
cmp21_0_2="Brzęk fiolek i niezwykły kolor dymu wskazuje, że żelazo jest przekształcane w złoto. Albo coś innego... w coś innego."
cmp21_0_3="• Odblokowuje ^Alchemię^.#• Odblokowuje umiejętność ^wytwarzania^ błyskotek, jeśli zbudowano Magazyn zasobów.#• Odblokowuje złotą kartę ^Prastary monolit^, jeśli zbudowano Centrum wywiadu."

cmp22_0_1="Gimnazjum"
cmp22_0_2="Miejsce, gdzie nauczysz się czytać, pisać i być grzecznym dla nauczyciela. Pierwszeństwo ma trening fizyczny."
cmp22_0_3="• Odblokowuje możliwość zdobywania ^specjalnych umiejętności^ przy zabijaniu potworów w trakcie wypraw (xp).#• Odblokowuje kartę ^Wioska^."
cmp22_1_1="Akademia"
cmp22_1_2="Miejsce, gdzie ci, którzy chcą się uczyć, spotykają tych, którzy chcą uczyć. To może mieć jakiś sens."
cmp22_1_3="• Odblokowuje możliwość zdobywania ^specjalnych umiejętności^ przy zabijaniu potworów w trakcie wypraw (xp).#• Odblokowuje kartę ^Wioska^.#• Odblokowuje kartę ^Peryferia^."

cmp23_0_1="Namioty ocalałych'"
cmp23_0_2="Obóz wypełniony wyczerpanymi ludźmi i ich ograniczonym dobytkiem."
cmp23_0_3="• Nie można go zniszczyć, ale jego mieszkańcy z chęcią przeniosą się do lepszych kwater, jeśli je zbudujesz."

cmphovel1_0_1="Namiot"
cmphovel1_0_2="Nikt nie wie, skąd się wziął."
cmphovel1_0_3="?"


