cmp20_0_1="หอระวังภัย"
cmp20_0_2="เมื่อคุณออกจากแค้ม์คุณจะ##ลืมเลือนหลายสิ่งหลายอย่าง##แต่คุณจะไม่มีวันลืมลูกธนู##ทีถูกยิงออกมาจากที่นี่"
cmp20_0_3="• 1 พลหน้าไม้จะช่วยคุณต่อสู้##ในช่องที่อยู่ใกล้กับแค้มป์##ช่วยสู้เฉพาะศัตรูทั่วไปเท่านั้น##ส่วนบอสคุณต้องจัดการเอง##• สร้างได้สูงสุด 4 หอคอย"
