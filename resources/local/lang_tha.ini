text_0="เจ้ารู้ไหมว่าผู้คนดีใจมากแค่ไหน##วันก่อนผนังยังเป็นโคลนอยู่เลย แต่ตอนนี้มันกลายเป็นบ้านจริง ๆ"
text_1="งั้นตอนนี้ข้าก็เป็นผู้ใหญ่บ้านใช่ไหมล่ะ?"
text_2="ใจเย็น ๆ ตอนนี้เรายังเป็นผู้กล้าผู้กอบกู้โลก ไม่ใช่นักการเมือง"
text_3="...."

[dia_camp_bld5_2]
dialog_list=H,-YOTA;
dialog_place=1,1,0,1,0;
text_0="นี่มันบ้านหลังใหญ่มากจริง ๆ ไม่นึกเลยว่าจะมีบ้านที่ใหญ่โตแบบนี้##ตอนนี้มันอยู่ตรงหน้าเรา มันเป็นของพวกเราทั้งหมด"
text_1="รู้มั๊ยว่าเจ้าควรพูดคุยกับคนอื่นบ้าง##หรือจะปล่อยให้ฮีโร่ที่ช่วยเหลือพวกเขากลายเป็นเพียงแค่เรื่องเล่าลือ##ไร้ตัวตน ฮีโร่บางคนก็ไปทำแต่ภารกิจ ภารกิจที่ไม่มีใครล่วงรู้"
text_2="เจ้าจำหน้าที่ของข้าได้ใช่ไหม?"
text_3="หน้าที่อะไร?"
text_4="...."

[dia_camp_bld5_3]
dialog_list=H,-YOTA;
dialog_place=1,0,1,0,1,0,1;
text_0="เจ้าว่าถ้าเรื่องทั้งหมดนี้จบลงเจ้าจะสร้างบ้านแล้วใช้ชีวิตอยู่ได้ไหม?##ใช้ชีวิตแบบปกติน่ะ?"
text_1="นั่นมันเป็นเรื่องของอนาคต##ข้ายังไม่รู้ว่าจะฟื้นฟูโลกได้ยังไง แล้วข้าก็ไม่แน่ใจว่าข้าจะทำได้"
text_2="เจ้าสร้างที่อยู่อาศัย เจ้าสร้างสิ่งมหัศจรรย์ให้ผู้คนเหล่านี้##ทั้งหมดนี้มันคือปาฏิหาริย์จริง ๆ##ทุกคนในแค้มป์นี้เชื่อว่าเจ้าจะกอบกู้โลกได้"
text_3="รวมถึงเจ้าด้วยใช่ไหม?"
text_4="ข้าก็ด้วย"
text_5="..."
text_6="ข้าพูดจริงจัง ครั้งนี้ข้าไม่ได้ล้อเล่น"



[dia_camp_bld22_1]
dialog_list=H,-SCIENT;
dialog_place=1,1,1;
text_0="สถานที่แห่งความรู้ที่แท้จริง สิ่งที่ยอดเยี่ยมที่สุด"
text_1="การเรียนรู้ความรู้ใหม่ ๆ ช่วยฝึกสมอง และความจำได้##อย่างน้อยก็กล้ามเนื้อของสมองน่ะแหละ..."
text_2="ข้าเสียดายวิชาภูมิศาสตร์โลกจริง ๆ##เพราะตอนนี้มันแทบไม่เหลืออะไรให้เรียนรู้อีกแล้ว"

[dia_camp_bld4_1]
dialog_list=H,-SMITH;
dialog_place=1,1,1;
text_0="นั่นมันเตาหลอม! ครั้งหนึ่งข้าเคยทำงานบนดาดฟ้าเรือ...##แต่ตอนนี้ข้าเป็นกัปตันของเรือช่างตีเหล็ก!"
text_1="โย่-โฮ่-โฮ่! ข้าจะดูแลรักษาเตาหลอมนี้อย่างดี##อุปกรณ์ชั้นยอดกำลังรอคอยให้ข้าสร้างสรรค์อยู่!"
text_2="นับตั้งแต่นี้การออกเดินทางใหม่ของเจ้า จะเต็มไปด้วยสรรพาวุธ!"






