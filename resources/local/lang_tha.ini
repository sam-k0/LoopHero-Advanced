res4_3="เศษเหล็กที่ต้องเก็บ##เพื่อรวบรวมเป็นเหล็ก"

res5_1="เหล็ก"
res5_2="ก้อนโลหะที่ไม่ได้ถูกลิชกลืนกิน##มันติดกันแน่นเหมือนแม่เหล็ก"

res6_1="วัตถุดิบ"
res6_2="วัตถุดิบชิ้นเล็ก ๆ มันน่าแปลก##ที่สามารถใช้บรรเทาความหิว##ของบางคนได้ แต่สถานการณ์##แบบนี้สามารถเรียกได้ว่าหรูหรา"
res6_3="วัตถุดิบที่ต้องเก็บ##เพื่อรวบรวมเป็นอาหาร"

res7_1="อาหาร"
res7_2="ห่ออาหารขนาดเล็กที่พบใน##ซากปรักหักพังของโลกใหม่##แม้โลกนี้จะสูญเสียสิ่งต่าง ๆ ไป##แต่ความหิวโหยยังคงอยู่##ทำได้แค่เพียงเผชิญหน้ากับมัน"

res8_1="ลูกแก้วแผ่ขยาย"
res8_2="วัตถุทรงกลมที่เป็นองค์ประกอบ##ของการขยับขยายพื้นที่"

res9_1="ลูกแก้วอมตะ"
res9_2="ความตายคือสิ่งที่ไม่แน่นอน##แต่ลูกแก้วนี้มันช่วยคุณได้##เพียงแค่ไม่กี่วินาทีก็เพียงพอ##ไม่ให้คุณพบจุดจบอันน่าเศร้า"

res10_1="เศษซากความทรงจำ"
res10_2="ข่าวลือ ตำนาน รวมไปถึง##ความหลงผิดของใครบางคน##มันต้องใช้เวลาหลายสัปดาห์##เพื่อทำความเข้าใจ และหลายปี##เพื่อดูว่าจำเป็นจริง ๆ หรือไม่"
res10_3="เศษซากที่ต้องเก็บ##เพื่อรวมเป็นหนังสือความทรงจำ"

res11_1="หนังสือความทรงจำ"
res11_2="หนังสือที่มีแต่ข้อเท็จจริง##และความจริง แต่คุณสามารถรู้##ได้ทีละเรื่องเท่านั้น"

res12_1="การเปลี่ยนแปลง"
res12_2="แค่สิ่งนี้ก็สามารถเปลี่ยนตัวอ่อน##ให้เป็นผีเสื้อ เปลี่ยนเมล็ดพืช##ให้แตกหน่อ และเปลี่ยนหยดน้ำ##ให้เป็นไอน้ำได้ ถ้าคุณมีมากพอ##มันก็จะกลายเป็นอย่างอื่น"
res12_3="การเปลี่ยนแปลงที่ต้องเก็บ##เพื่อรวมเป็นการเปลี่ยนรูปร่าง"

res13_1="การเปลี่ยนรูปร่าง"
res13_2="พลังการเปลี่ยนแปลงของโลก##ได้ถูกแยกออกมาจากโลก##ถูกเก็บเอาไว้ในวัตถุทรงกลม##และจากนั้นก็ถูกทำลาย##มันดีที่สามารถเอากลับมาได้"

res14_1="ซากที่น่าเวทนา"
res14_2="เศษซากชีวิตของใครบางคน##ที่ปรารถนาจะมีชีวิตต่อไป##สุดท้ายจบลงอย่างน่าเศร้า"
res14_3="ซากที่ต้องเก็บ เพื่อรวบรวม##เป็นลูกแก้วหลังความตาย"

res15_1="ลูกแก้วหลังความตาย"
res15_2="ทุกสิ่งทุกอย่างล้วนต้องตาย##มันเป็นความจริง แต่อาจจะ##ฟังดูแย่สำหรับคุณ แต่โลก##ไม่สามารถดำรงอยู่ได้หาก##ไร้ปราศจากความเปราะบาง##และความไม่ยั่งยืน"

res16_1="เศษเวลา"
res16_2="กฎเกณฑ์ของโลกนี้ตั้งอยู่บน##พื้นฐานของพื้นที่ และเวลา##แต่พื้นที่แตกกระจัดกระจาย##และเวลาก็เช่นเดียวกัน"
res16_3="เศษที่ต้องเก็บ เพื่อรวบรวม##เป็นลูกแก้วดวงดาว"

