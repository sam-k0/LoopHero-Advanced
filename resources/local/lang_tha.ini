[furniture]
frn0_1="ชั้นวางของ ปรุงยา"
frn0_2="ชั้นวางของที่มีแต่ขวด และสสาร##บางอันก็มีป้ายชื่อ และสิ่งของ##ลึกลับจากเจ้าของเดิม"
frn0_3="จำนวนยาสูงสุด +@$"

frn1_1="เก้าอี้ของเค้าต์"
frn1_2="เจ้านายคนก่อนหน้าคือแวมไพร์##มีไม้แหลมจำนวนมากประดับอยู่##ยังคงแผ่ออร่าพลังดูดเลือดออกมา"
frn1_3="+@% ให้กับการดูดเลือด##หากมีอุปกรณ์ หรือเอฟเฟกต์นี้$"

frn2_1="ตู้เสื้อผ้าโบราณ"
frn2_2="ตู้เสื้อผ้าโบราณที่สวยงาม##ไม่รู้ว่าผ่านแฟชั่นมากี่ยุคสมัย"
frn2_3="+@ พลังชีวิต ทุกครั้งที่ทำการ##สวมใส่อุปกรณ์ใหม่$"

frn3_1="เหล็กรองเท้า"
frn3_2="เหล็กขนาดเล็กสำหรับซ่อมรองเท้า"
frn3_3="ศัตรูที่โจมตีคุณรับความเสียหาย##@ หน่วย ต่อการโจมตีแต่ละครั้ง$"

frn4_1="เคียวหมอยา"
frn4_2="เครื่องมือเก็บเกี่ยวสมุนไพร##นักสมุนไพรทุกคนใช้มัน"
frn4_3="+@% พลังชีวิตจากการใช้ยา$"

frn5_1="ขวานตัดไม้"
frn5_2="เครื่องมือที่เก่าแก่ และทนทาน##มันใช้งานได้ดี ความสามารถ##ในการตัดไม้นั้นมันขึ้นอยู่##กับพละกำลังของคุณ"
frn5_3="ทุกครั้งที่ฮีโร่ได้รับกิ่งไม้ เขาจะ##มีโอกาส @% ที่จะได้รับเพิ่มอีก$"

frn6_1="ธัญพืช"
frn6_2="ตระกร้าเล็กที่เต็มไปด้วยธัญพืช##ไม่เน่าเสีย และทำให้อิ่มง่าย##เหมาะสำหรับเก็บไว้ในฤดูหนาว##และเป็นอาหารว่างยามค่ำคืน "
frn6_3="+@ พลังชีวิตสูงสุดให้กับฮีโร่##ต่อจำนวนพลังป้องกันที่มี$"

frn7_1="สโม๊คแฮม"
frn7_2="เนื้อรมควันแสนอร่อย ที่ต้อนรับ##แขกทุกคนบนโต๊ะอาหาร"
frn7_3="ฟื้นฟู @ พลังชีวิตทุกวัน##ตอนเริ่มวันใหม่$"

frn8_1="กระเทียม"
frn8_2="กลิ่นหอมที่เป็นเอกลักษณ์ของ##กระเทียมทำให้อาหารมีรสชาติดี##ไม่รู้ว่าทำไมแวมไพร์ถึงเกลียดมัน##บางทีสุดยอดพลังคงมีจุดอ่อน?"
frn8_3="โจมตีแวมไพร์แรงขึ้น +@ หน่วย$"

frn9_1="เชิงเทียน"
frn9_2="ปกติแล้วมักจะถูกใช้เชิงศิลปะ##แต่มันมีก็ประโยชน์มาก##การจุดเทียนสามเล่มพร้อมกัน##มันสิ้นเปลือง แต่ใครจะปฏิเสธ##แสงอันอบอุ่นในยุคมืดนี้ได้?"
frn9_3="พลังโจมตีของฮีโร่เพิ่ม 5%##เมื่ออยู่ในเขตโคมไฟ##หรือประภาคาร$"

frn10_1="ภาพวาดเก่า"
frn10_2="แค่มองเพียงครั้งเดียวก็ทำให้##นึกถึงใครบางคน แต่คุณจำ##ไม่ได้ว่าเป็นใคร ผืนผ้าใบ##และสีน้ำมันนี้ ไม่ทราบทั้งปี##และชื่อผู้สร้างสรรค์"
frn10_3="โจมตีบอสแรงขึ้น @%$"

frn11_1="เครื่องเงิน"
frn11_2="อุปกรณ์เครื่องครัวที่ทำให้การกิน##เป็นเรื่องง่ายขึ้น เครื่องเงินต้อง##ได้รับการดูแลรักษาแบบพิเศษ"
frn11_3="โจมตีผีดิบแรงขึ้น +@ หน่วย$"

frn12_1="เตียงไม้โอ๊ค"
frn12_2="หนัก แข็งแรง ทนทาน และเก่า##นอนหลับสบาย แต่เสียงที่ดัง##อาจทำให้คนในบ้านตื่นได้"
frn12_3="พลังชีวิตสูงสุด +@% เมื่อเดินผ่าน##ช่องแค้มป์ แต่การฟื้นฟู##จะลดลง @% จากช่องแค้มป์$"

frn13_1="โต๊ะกินข้าว"
frn13_2="คุณสามารถรับประทานอาหาร##ได้ที่นี่ หลังรับประทานเสร็จ##ต้องเช็ดให้สะอาดด้วย"
frn13_3="ฟื้นฟูพลังชีวิตเพิ่มเติม +@*ลูป##เมื่อเดินผ่านช่องแค้มป์$"

frn14_1="ชั้นวางโบราณ"
frn14_2="สิ่งที่อยู่ภายในได้รับการปกป้อง##จากฝุ่นละออง และความชื้น##ด้วยหน้าต่างที่ทำจากกระจก##คุณสามารถมองเข้าไปข้างในได้##ดูเหมือนว่าเฟอร์นิเจอร์ชิ้นนี้##อยู่ในสภาพที่ย่ำแย่มากแล้ว##ดังนั้นจึงไม่ควรใช้บ่อยเกินไป"
frn14_3="+@ พลังชีวิตสูงสุด ต่อจำนวน##ทรัพยากรที่ได้ในการผจญภัย$"

frn15_1="เคียวชาวนา"
frn15_2="ดูเหมือนมันขึ้นสนิมเล็กน้อย##แต่สามารถลับด้วยหินลับมีดได้##มันเป็นเครื่องมือที่ดีสำหรับการ##เก็บเกี่ยวข้าว หรือหญ้าแห้ง"
frn15_3="มีโอกาส @% จะได้รับ 1 วัตถุดิบ##เมื่อเดินผ่านช่องไร่นา##@% ของพลังโจมตี เป็นความ##เสียหายแบบทั้งหมด$"

frn16_1="มีดเลาะหนัง"
frn16_2="มีดที่ใช้สำหรับเลาะหนังสัตว์##มันไม่ได้อยู่ในสภาพใหม่##คงผ่านมาหลายมือแล้ว"
frn16_3="มีโอกาส @% ได้รับวัตถุดิบ##หลังฆ่าแรทวูล์ฟ##โจมตีแรทวูล์ฟแรงขึ้น +@ หน่วย$"

frn17_1="ค้อนช่างตีเหล็ก"
frn17_2="นี่คือเครื่องมือที่สำคัญสำหรับ##ช่างตีเหล็กทุก ๆ คน และมัก##จะถูกใช้งานในหนักเสมอ"
frn17_3="+@ ป้องกัน$"

frn18_1="ขนมปังก้อน"
frn18_2="ด้านหนึ่งเกรียมไปหน่อย##แต่ก็ยังมีรสชาติที่อร่อยดี##มันต้อนรับแขกทุกคนบนโต๊ะ##ไม่ว่าจะเป็นคนรวยหรือคนจน"
frn18_3="+@ พลังชีวิตสูงสุด$"

frn19_1="เนื้อตุ๋น"
frn19_2="ถ้วยเนื้อตุ๋นร้อน ๆ เป็นอาหาร##ที่ยอดเยี่ยมในคืนฤดูหนาว##สำหรับช่วงเวลาอื่นก็อร่อย##ได้เหมือนกัน มันมักจะถูก##ปรุงรสด้วยสมุนไพรแห้ง"
frn19_3="รับพลังชีวิตเพิ่มเติม @ หน่วย##เมื่อเดินผ่านหมู่บ้าน$"

frn20_1="ชีส"
frn20_2="อาหารที่เก็บได้ยาวนาน##และรสชาติดี อย่าผิดหวัง##ที่ไม่มีไวน์ให้ลิ้มลองไปด้วย##แค่ชีสเองก็อร่อยพอแล้ว"
frn20_3="+@ พลังชีวิต หลังจากฆ่าศัตรู$"

frn21_1="สร้อยคอเงิน"
frn21_2="เครื่องประดับโบราณที่สวยงาม##มีจี้เป็นเหรียญรูปค้างคาวที่ปีก##และขาของมันถูกโซ่สีเงินพันไว้"
frn21_3="- @ ความเสียหาย จากแวมไพร์$"

frn22_1="หนังสือหายาก"
frn22_2="เวลาช่างโหดร้าย และหนังสือ##เล่มนี้ก็ไม่สามารถอ่านได้อีก##ข้อความบางส่วนบอกถึงเวลา##และสถานที่ที่ถูกลืมเลือนไป##ข้อมูลเล็กน้อยแบบนี้มันไม่##สามารถทำให้ความทรงจำ##หรือความรู้สมบูรณ์ได้"
frn22_3="+@ ป้องกัน ต่อจำนวนการ์ด##ที่มีในมือ$"

frn23_1="กระจก"
frn23_2="มันดูหม่นไปบ้างแต่ก็ยังใช้ได้##และใช้ดีกว่าผิวน้ำหรือแผ่นโลหะ##กรอบของมันถูกแกะสลัก##เป็นรูปสายฟ้าขนาดเล็กจิ๋ว"
frn23_3="มีโอกาส @% ที่จะทำให้สายฟ้า##(จากวิหารพายุ) หรือเวทมนตร์##ไปสุ่มโจมตีศัตรู$"

frn24_1="อีเต้อ"
frn24_2="สุดยอดอาวุธที่ใช้สู้กับภูเขา##และไม่ว่าจะเป็นหินแบบไหน##ก็ไม่สามารถต้านทานมันได้"
frn24_3="ได้รับก้อนกรวด +@ ก้อน##เมื่อเดินผ่านช่องแค้มป์$"

frn25_1="แว่นขยาย"
frn25_2="เลนส์หลายตัวที่มีกำลังขยาย##ต่างกัน ติดอยู่ที่ด้ามจับขัดเงา##ช่วยให้พ่อค้าอัญมณีทำงานดีขึ้น"
frn25_3="เจอสิ่งของหายากมากขึ้น @%$"

frn26_1="กระทะเก่า"
frn26_2="เครื่องครัวที่ไม่มีสิ่งใดแทนได้##เมื่ออยู่ในมือของแม่บ้าน##มันจะเป็นอาวุธที่ร้ายแรง"
frn26_3="ฟื้นฟูพลังชีวิตเพิ่ม @ หน่วย##เมื่อเดินผ่านช่องแค้มป์$"

frn27_1="มีดทำครัว"
frn27_2="ส่วนมากใช้ถูกใช้หั่นผัก##แต่มันก็เป็นอันตรายได้##สำหรับกุ๊กที่ซุ่มซ่าม"
frn27_3="+@% พลังชีวิต ต่อทุก ๆ##สิ่งของประเภท ^อาหาร^##ที่ถูกใช้งานในช่องอาหาร##ของเมนูเสบียงในแค้มป์$"

frn28_1="ม้านั่ง"
frn28_2="สบาย และง่ายต่อการพกพา##อีกทั้งยังดูสวยงาม##และช่วยให้คุณเข้าถึงสิ่งของ##ที่อยู่ชั้นบนได้ด้วย"
frn28_3="พลังชีวิตฟื้นฟู +@ ต่อวินาที##หากมีอุปกรณ์ หรือเอฟเฟกต์นี้$"

frn29_1="หีบใส่ของ"
frn29_2="ฝาของหีบนี้หนักมาก ควรเปิด##ก็เมื่อจำเป็นเท่านั้น แล้วล็อก##ของมันก็ยังพังอีกด้วย"
frn29_3="ทรัพยากรที่สูญเสียเสียเมื่อ##ฮีโร่ตายลดลงจากปกติ @%$"



