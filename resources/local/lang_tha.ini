crd42_1="โอเอซิส"
crd42_2="สายน้ำที่ไหลจากลำห้วยเล็ก ๆ##ที่หลบซ่อนอยู่ในเนินทราย##มันส่งผลต่อคุณ และศัตรู"
crd42_3="• –0.5% ความเร็วการโจมตีฮีโร่##• –1% ความเร็วการโจมตีศัตรู"

crd43_1="ป้อม"
crd43_2="ทหารที่ป้อมนี้ยินดีที่จะช่วยเหลือ##แต่แน่นอนว่าไม่ได้ช่วยฟรี ๆ"
crd43_3="• ทหารจะช่วยในช่องที่ติดกัน##• สิ่งของสีเหลือง และสีส้มที่ได้##จากการต่อสู้จะเป็นของทหาร"
crd43_4="#• หมอผีไม่ได้รับการต้อนรับที่นี่##ทหารจะยิงทันที"

crd44_1="ภูเขาสูง"
crd44_2="ภูเขาหินขนาดใหญ่ มันคง##สูงทะลุท้องฟ้า หากท้องฟ้า##ไม่หายไปเสียก่อน"
crd44_3="• +@ พลังชีวิตสูงสุด##• +@ พลังชีวิตสูงสุด##ต่อหินหรือภูเขาที่อยู่ใกล้เคียง##• ฮาร์ปี้ปรากฏทุก ๆ 2 วัน"

crd45_1="สมบัติ"
crd45_2="สมบัติที่อยู่ในกำแพงหนา##ไกลเกินเอื้อมของโจร##หรือเจ้าของเดิม"
crd45_3="• สุ่มสิ่งของหลังจากวางการ์ด##บนช่องรอบข้าง##• ช่องรอบข้างต้องว่างก่อนวาง"

crd46_1="สมบัติว่างเปล่า"
crd46_2="สมบัติที่แต่ความว่างเปล่า##ผู้พิทักษ์หินที่ปกป้องมานาน##ต้องตื่นขึ้นจากการหลับใหล"
crd46_3="• การ์กอยล์ปรากฏทุก ๆ 3 วัน"

crd47_1="ทุ่งหญ้า"
crd47_2="ดินแดนที่ปกคลุมไปด้วยหญ้า##ไม่ได้มีอะไรน่าสนใจมากนัก##นอกจากว่าคุณจะเป็นวัว"
crd47_3="• ฟื้นฟู 2 พลังชีวิตทุกวัน##ตอนเริ่มวันใหม่"

crd48_1="สุสาน บรรพชน"
crd48_2="ที่พักสุดท้ายของตระกูลเก่าแก่##ความตายคือสิ่งที่ทรงเกียรติ"
crd48_3="• +3 พลังชีวิต เมื่อฆ่าศัตรู##ที่มีจิตวิญญาณ##• ไม่มีโบนัสพลังชีวิตจากเกราะ##• ชุบชีวิตฮีโร่ที่ตายได้หนึ่งครั้ง"

crd49_1="ทุ่งหญ้าเบ่งบาน"
crd49_2="ดอกไม้ที่ปรับตัวอยู่กับโลกใบนี้##เบ่งบานสะพรั่งพร้อมกลิ่นหอม"
crd49_3="• ฟื้นฟู 3 พลังชีวิตทุกวัน##ตอนเริ่มวันใหม่"

crd50_1="ชานเมือง"
crd50_2="คุณเริ่มจดจำบ้านหลังใหญ่ที่##สร้างมาจากหินได้ แต่จำคน##ที่อาศัยอยู่ในนั้นไม่ได้"
crd50_3="• วางติดกับชานเมืองอื่นเท่านั้น##• ได้ประสบการณ์เพิ่ม 1 หน่วย##จากการฆ่าศัตรู"

crd51_1="เมือง"
crd51_2="กำแพงแตก และม้วนหนังสือ##โบราณอธิบายถึงสิ่งที่เกิดขึ้น##กับผู้คนที่เคยอาศัยอยู่ที่นี่"
crd51_3="• ได้ประสบการณ์เพิ่ม 2 หน่วย##จากการฆ่าศัตรู"

crd52_1="รอยแยกของมิติ"
crd52_2="เมื่อคุณเข้าใกล้รอยแยกนี้##คุณจะรู้สึกวิตกกังวลมาก"
crd52_3="• คุณพร้อมที่จะเผชิญหน้า##กับสิ่งที่อยู่อีกฟากหรือไม่?"

crd53_1="ค่ายโจร"
crd53_2="ผู้เชี่ยวชาญที่ปล้นฆ่าคนรวย##และช่วยเหลือคนยากจน"
crd53_3="• โจรปรากฏที่ช่องใกล้เคียง##ทุก ๆ 2 วัน##• โจรชอบหมู่บ้าน##• ค่ายโจรโผล่ออกมาทุก ๆ##@ ช่องหมู่บ้าน"

crd54_1="ซิกกุรัต"
crd54_2="ทรายช่วยสร้างโลกใหม่##นี่คือผลลัพธ์ของมัน"
crd54_3="• วิญญาณทะเลทรายโผล่ทุกลูป##• วิญญาณทะเลทรายมีโอกาส##@% ที่จะร่วมต่อสู้ทุกที่บนถนน##• โผล่ทุก ๆ @ ทะเลทราย /เนินทราย"

crd55_1="กระท่อม แม่มด"
crd55_2="กระท่อมที่มีเปลือกแมลง##ขากบ และรากไม้มากมาย##เป็นบ้านของแม่มดด้วย"
crd55_3="• ได้รับยารักษาทุกครั้งที่ผ่าน#• จำนวนยาสูงสุด -@#• แม่มดต่อสู้ในช่องรอบข้าง#• การ์ดกระท่อมปรากฏทุก ๆ#การวาง @ บึง"

crd56_1="ป่ามากี"
crd56_2="ป่าที่แห้งแล้ง#และเต็มไปด้วยหนาม"
crd56_3="• ศัตรูโจมตีลดลง @% (ไม่ต่ำกว่า –@%)#• ศัตรูโจมตีไวขึ้น @% (ไม่สูงกว่า +@%)"

crd1000_1="แค้มป์"
crd1000_2="สถานที่พักผ่อนที่แสนสุขสบาย##น่าแปลกที่สัตว์ประหลาดทุกตัว##หลีกเลี่ยงสถานที่แห่งนี้"
crd1000_3="• ฟื้นฟูพลังชีวิต @% เมื่อเข้ามา"

crd1001_1="การจู่โจม"
crd1001_2="พลังงานอันยิ่งใหญ่ที่แผ่ออกมา##กลืนกินพื้นที่ และเวลา"
crd1001_3="• พบเจอกับชะตากรรมของโลก"


[camp]
cmp1_0_1="กองไฟ"
cmp1_0_2="กองไฟทั่วไป อบอุ่น และสุขสบาย##สัตว์ร้ายไม่เข้าใกล้ เหมาะสำหรับ##ใช้เป็นที่พักผ่อนระหว่างผจญภัย##ยังเป็นจุดศูนย์กลางของแค้มป์##และจุดเริ่มการผจญภัยของคุณ"
cmp1_0_3="• ฮีโร่ฟื้นฟูพลังชีวิต @%##เมื่อเข้าสู่ช่องที่มีแค้มป์"

cmp2_0_1="ครัวสนาม"
cmp2_0_2="สถานที่สำคัญสำหรับแค้มป์##หากจมูกคุณยังดี คุณจะเจอ##อาการชั้นเลิศที่นี่"
cmp2_0_3="• +10% ฟื้นฟูพลังชีวิตที่แค้มป์##• ปลดล็อกการ์ด ^ป่าเลือด^"
cmp2_1_1="โรงอาหาร"
cmp2_1_2="สถานที่สำคัญสำหรับแค้มป์##กลิ่นอาหารที่โอชะลอยอยู่ที่นี่"
cmp2_1_3="• +18% ฟื้นฟูพลังชีวิตที่แค้มป์##• ปลดล็อกการ์ด ^ป่าเลือด^"
cmp2_2_1="ร้านอาหาร"
cmp2_2_2="สถานที่สำคัญสำหรับแค้มป์##คุณจะถูกต้อนรับด้วยกลิ่น##อาหารที่เผ็ดร้อนเมื่อมาที่นี่"
cmp2_2_3="• +24% ฟื้นฟูพลังชีวิตที่แค้มป์##• ฮีโร่พักผ่อนก่อนสู้บอสได้##• ปลดล็อกการ์ด ^ป่าเลือด^"
cmp2_3_1="โรงแรม"
cmp2_3_2="สถานที่สำคัญสำหรับแค้มป์##คุณสามารถลิ้มลองรสชาติ##ของขนมที่น่าทึ่งได้ที่นี่"
cmp2_3_3="• +40% ฟื้นฟูพลังชีวิตที่แค้มป์##• ฮีโร่พักผ่อนก่อนสู้บอสได้##• ปลดล็อกการ์ด ^ป่าเลือด^"

cmp3_0_1="กระท่อม หมอยา"
cmp3_0_2="หมอสมุนไพรไม่เคยลืมเลือน##วิธีผสมสมุนไพร และวิธีปรุงยา"
cmp3_0_3="• ยาฟื้นฟูพลังชีวิตสูงสุด 4%##• นำยาติดตัวไปได้ 3 ขวด##2 ขวดจะถูกเติมที่ค่าย##• ปลดล็อกการ์ด ^บึง^"
cmp3_1_1="กระท่อมผู้รักษา"
cmp3_1_2="ผู้รักษารู้ว่าสมุนไพรไหนควรใช้##เป็นยา และสวนของเธอก็เป็น##แหล่งเดียวของยาวิเศษเหล่านี้"
cmp3_1_3="• ยาฟื้นฟูพลังชีวิตสูงสุด 6%##• นำยาติดตัวไปได้ 5 ขวด##2 ขวดจะถูกเติมที่ค่าย##• ปลดล็อกการ์ด ^บึง^"
cmp3_2_1="กระท่อมผู้ปรุงยา"
cmp3_2_2="ศาสตร์อันลึกลับในการปรุงยา##มีเพียงผู้ปรุงยาเท่านั้น##ที่จะรู้ความลับนี้ได้"
cmp3_2_3="• ยาฟื้นฟูพลังชีวิตสูงสุด 7%##• นำยาติดตัวไปได้ 6 ขวด##3 ขวดจะถูกเติมที่ค่าย##• ปลดล็อกการ์ด ^บึง^##• การ์ด ^กระท่อมแม่มด^ อาจจะโผล่ระหว่างผจญภัย"
cmp3_3_1="กระท่อมเภสัชกร"
cmp3_3_2="การผสมยาสมุนไพรชั้นเยี่ยม##ให้เข้ากันได้นั้นต้องใช้ศาสตร์##และศิลป์ของเภสัชกร"
cmp3_3_3="• ยาฟื้นฟูพลังชีวิตสูงสุด 8%##• นำยาติดตัวไปได้ 6 ขวด##4 ขวดจะถูกเติมที่ค่าย##• ปลดล็อกการ์ด ^บึง^##• การ์ด ^กระท่อมแม่มด^ อาจจะโผล่ระหว่างผจญภัย"
cmp3_4_1="กระท่อมแพทย์"
cmp3_4_2="เรื่องความรู้ความสามารถ##ในการรักษา ช่วยให้แพทย์##สร้างยาที่สมบูรณ์แบบได้"
cmp3_4_3="• ยาฟื้นฟูพลังชีวิตสูงสุด 10%##• นำยาติดตัวไปได้ 6 ขวด##4 ขวดจะถูกเติมที่ค่าย##• ปลดล็อกการ์ด ^บึง^##• การ์ด ^กระท่อมแม่มด^ อาจจะโผล่ระหว่างผจญภัย"

cmp4_0_1="โรงตีเหล็ก"
cmp4_0_2="ช่างตีเหล็กจะทำงานที่นี่เสมอ##แม้ว่าจะสิ้นโลกก็ตาม"
cmp4_0_3="• ออกผจญภัยด้วยอุปกรณ์##นักรบพื้นฐาน##• ปลดล็อกการ ^คราฟ^##เครื่องมือ หากคลังถูกสร้าง"
cmp4_1_1="โรงตีเหล็กชั้นดี"
cmp4_1_2="ด้วยเครื่องมือที่มีคุณภาพมากขึ้น##ช่างตีเหล็กก็สามารถสร้างสิ่งของ##ที่มีคุณภาพได้"
cmp4_1_3="• ออกผจญภัยด้วยอุปกรณ์ที่##เหมาะสมกับคลาสที่เลือก##• ปลดล็อกการ ^คราฟ^##เครื่องมือ หากคลังถูกสร้าง##• ปลดล็อกการ์ด ^เตาหลอม^"

cmp5_0_1="กระท่อมโคลน"
cmp5_0_2="บ้านที่ทำมาจากฟาง และโคลน##ยิ่งคุณมีผู้อยู่อาศัยมากเท่าไหร่##คุณก็เข้าใกล้ชัยชนะมากเท่านั้น##มาสร้างบ้านเพิ่มกันเถอะ!"
cmp5_0_3="• คุณสามารถจัดหาเฟอร์นิเจอร์##และอาหารให้ผู้อยู่อาศัยได้"
cmp5_1_1="กระท่อมไม้"
cmp5_1_2="กระท่อมขนาดเล็กที่สร้างจาก##ใบไม้ กิ่งไม้ ไม้ และหิน##บ้านสำหรับผู้อยู่อาศัยสองคน"
cmp5_1_3="• คุณสามารถจัดหาเฟอร์นิเจอร์##เครื่องมือ และอาหารให้กับ##ผู้อยู่อาศัยได้"
cmp5_2_1="บ้านหลังเล็ก"
cmp5_2_2="บ้านหลังเล็ก ที่สร้างมาจากไม้##หิน และฟาง บ้านสำหรับ##ผู้อยู่อาศัยสามคน"
cmp5_2_3="• คุณสามารถจัดหาเฟอร์นิเจอร์##เครื่องมือ อาหาร เครื่องประดับ##อย่างละ 2 ชิ้น ให้ผู้อยู่อาศัยได้"
cmp5_3_1="บ้านหลังใหญ่"
cmp5_3_2="บ้านหลังใหญ่ที่สร้างมาจากอิฐ##กระเบื้อง และหินชนวน##บ้านสำหรับผู้อยู่อาศัยสี่คน"
cmp5_3_3="• คุณสามารถจัดหาเฟอร์นิเจอร์##เครื่องมือ อาหาร เครื่องประดับ##อย่างละ 2 ชิ้น ให้ผู้อยู่อาศัยได้"

cmp6_0_1="คลัง"
cmp6_0_2="ผู้ดูแลคลังจะตีค่าสิ่งของต่าง ๆ##ที่คุณพบระหว่างการผจญภัย##และจะส่งต่อให้กับผู้ที่ต้องการ"
cmp6_0_3="• ปลดล็อกการใช้งาน ^เสบียง^##• จะพบสิ่งที่มีประโยชน์ต่อผู้คน##• ปลดล็อกการ ^คราฟ^ สิ่งของ##หากมีสิ่งก่อสร้างที่เหมาะสม##• ปลดล็อกการ์ด ^ปรักหักพัง^"

cmp7_0_1="กระท่อมตัดไม้"
cmp7_0_2="ช่างตัดไม้ที่มีฝีมือ และบึ้งตึง##เขาชอบกองไม้ และขวานของเขา"
cmp7_0_3="• ได้ 1 กิ่งไม้ทุกลูปการผจญภัย##(ไม่เกินช่องป่ารอบกระท่อม)##• ปลดล็อกการ ^คราฟ^##เฟอร์นิเจอร์ หากคลังถูกสร้าง"

cmp8_0_1="ป่า"
cmp8_0_2="คุณจะได้ยินเสียงใบไม้อันงดงาม##ของยอดไม้สูงตระหง่านกลางป่า##ได้จากภายนอกแค้มป์"
cmp8_0_3="• นี่คืออาณาเขตของคนตัดไม้##• ปลดล็อกการ์ด ^ป่า^ และ ^ป่าทึบ^"

cmp9_0_1="โรงหลอม"
cmp9_0_2="ส่วนเพิ่มเติมของโรงตีเหล็ก##ช่วยให้ช่างตีเหล็กทำงานง่ายขึ้น##รวมไปถึงคุณด้วยเช่นกัน"
cmp9_0_3="• ปลดล็อกการ์ด ^วิหารพายุ^##• การ์ดทอง ^คลังอาวุธ^##ถูกปลดล็อก หากมีศูนย์ข้อมูล##• +30 พลังชีวิต"

cmp10_0_1="ศูนย์ข้อมูล"
cmp10_0_2="ข้อมูลทุกอย่างรอบโลกจะอยู่ที่นี่"
cmp10_0_3="• ปลดล็อก ^สารานุกรม^##• ปลดล็อกการ์ด ^ทะเลทราย^##และ ^เนินทราย^ ##• ปลดล็อกการเพิ่มการ์ดทอง##เข้าสู่สำรับ"

cmp11_0_1="ที่พักพิง"
cmp11_0_2="ช่วยเหลือผู้เดือดร้อนคือหน้าที่##ต้องสร้างติดกับครัวสนามเท่านั้น"
cmp11_0_3="• ปลดล็อกคลาส: โจร"

cmp12_0_1="หอสมุด"
cmp12_0_2="อาคารที่เก็บข้อมูล และความรู้##ต่าง ๆ ที่เกี่ยวข้องกับของโลก"
cmp12_0_3="• ปลดล็อกเนื้อหาเพิ่มเติม##ที่อยู่ใน ^สารานุกรม^##โดยใช้ ^หนังสือความทรงจำ^##• ปลดล็อกการ์ด ^หอสมุด^##• การ์ดทอง ^วงกตแห่ง##ความทรงจำ^ ถูกปลดล็อก##หากมีศูนย์ข้อมูล"

cmp13_0_1="แม่น้ำ"
cmp13_0_2="ไม่น่าเชื่อเลยว่าแม่น้ำยังไหลอยู่##มันคงเป็นสถานที่ที่ดูดีมาก!"
cmp13_0_3="• ปลดล็อกการ์ด ^แม่น้ำ^"

cmp14_0_1="ไร่"
cmp14_0_2="พืชผลที่ชาวนาทำการเก็บเกี่ยว##จะกลายเป็นอาหารอยู่บนโต๊ะ##ให้กับผู้ที่หิวโหยอยู่เสมอ"
cmp14_0_3="• ที่ว่างรอบไร่จะกลายเป็นสวน##ได้ 1 วัตถุดิบทุกลูปการผจญภัย##(แต่ไม่เกินช่องสวนรอบไร่)##สามารถสร้างสิ่งอื่นทับสวนได้##• ปลดล็อกการ ^คราฟ^ อาหาร##หากคลังถูกสร้าง##• ปลดล็อกการ์ด ^ไร่นา^"

cmp15_0_1="โกดัง"
cmp15_0_2="โรงเก็บของเพิ่มเติมสำหรับคลัง##ผู้คนมักจะเก็บของไว้ที่นี่##หากบ้านของเขาไม่มีที่ว่าง"
cmp15_0_3="• +10 จำนวนสูงสุดของสิ่งของ##สำหรับแค้มป์"

