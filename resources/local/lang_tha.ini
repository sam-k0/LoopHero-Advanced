[dia_enemy47]
dialog_list=H,-BAND;
dialog_place=1,0,1,1,1,0,0,1;
text_0="เฮ้! ข้าไม่เห็นจะจำเจ้าได้ เจ้าดูไม่เหมือนคนแถวนี้"
text_1="ก็ไม่ใช่น่ะสิ"
text_2="อ๋อ แล้วเจ้าคิดว่าจะเดินไปมาแถวนี้เหมือนไม่มีอะไรเกิดขึ้นได้เหรอ?"
text_3="มันเป็นช่วงเวลาที่ยากลำบาก ไม่มีอะไรจะกินหรือดื่ม##นอกจากนี้เรายังต้องจัดการกับพวกคนแปลกหน้า##ที่ไม่ได้เห็นอกเห็นใจชีวิตอันน่าสังเวชของพวกเราอีก..."
text_4="อะไร? คิดว่าเจ้าดีกว่าพวกเราเหรอ?!"
text_5="...##ไม่"
text_6="ข้าควรตอบแบบนี้ใช่ไหม? มันใช่คำตอบที่ถูกต้องหรือไม่?##คำถามนี้ไม่ว่าข้าจะตอบยังไงมันก็มันก็ไม่ส่งผลต่อสิ่งที่จะเกิดขึ้น"
text_7="เจ้าเข้าใจได้ดี แต่เดี๋ยวเจ้าก็จะรู้ว่าเกิดอะไรขึ้น"


[dia_enemywin47]
dialog_list=H,-EMPTY;
dialog_place=0,0;
text_0="พอมาคิดดู โจรกับ ฆาตรกรก็เป็นส่วนหนึ่งของโลกนี้ด้วย##หากข้านำทุุกสิ่งทุกอย่างกลับคืนมาเหมือนเดิม##ข้าจะดีใจกับการที่พวกเขายังอยู่อีกไหม?"
text_1="แต่การถูกเข่นฆ่า และปล้นชิงก็เป็นส่วนหนึ่งของโลกนี้เช่นกัน##ดังนั้นข้าไม่จำเป็นต้องทำให้ทุกคนมีความสุข"

[dia_enemy48]
dialog_list=H,-SAND;
dialog_place=1,0,1,1,0,1,1,1,0;
text_0="เจ้า!"
text_1="เจ้าพูดได้! เจ้าเป็นสัตว์ประหลาดแบบไหนกัน?"
text_2="ข้าเคยเป็นเหมือนเจ้ามาก่อน แล้วทรายก็ได้ข้าไป##ตอนนี้ข้าเป็นเพียงเม็ดแร่ควอตซ์จำนวนหนึ่ง##ที่ถูกผูกไว้ด้วยเวทมนตร์แห่งยุคดึกดำบรรพ์##ข้ามีความรู้ และที่สำคัญกว่านั้นคือความเข้าใจ"
text_3="พวกเราไม่มั่นคง หายวับได้ในทันทีไป และแผ่นดินนี้ก็เช่นกัน##มันไร้รูปร่างมากกว่าผืนทรายที่เคลื่อนตัวตลอดเวลา##เจ้าคือสิ่งลวงตาที่น้อยที่สุดสำหรับพวกเรา##เราต้องการความช่วยเหลือจากเจ้า"
text_4="ในที่สุด! ข้ารอที่จะได้ยินสิ่งนี้มานานแล้ว##ดูเหมือนไม่มีใครรู้ว่าเกิดอะไรขึ้น##ทุกคนแสร้งทำเป็นว่ามันเป็นอย่างนี้มาตลอด!##ข้าอยากช่วยใครสักคนจริง ๆ"
text_5="...เราพูดถึงสิ่งต่าง ๆ ที่เปลี่ยนแปลง แต่เจ้ามีการดำรงอยู่อย่างแท้จริง##ทรายและเวทย์มนตร์สามารถทำอะไรได้มากมาย##แต่เราต้องอดทนให้นานมากพอ##เพราะเราแทบไม่มีรูปร่างเลยก่อนที่เราจะจากไปอีกครั้ง"
text_6="ข้าต้องการให้เจ้าตามข้ามา ไปตามทางของความร้อนและแสงแดด##เจ้าจะกลายเป็นหนึ่งในพวกเรา และเป็นโอกาสใหม่สำหรับทะเลทราย##ชั้นทรายที่ดำรงอยู่ ทรายที่มีชีวิตชีวาและกว้างใหญ่##เราจะเติมเต็มความว่างเปล่าอันหนาวเหน็บนี้ให้เต็ม"
text_7="เติมเต็มทุกสิ่ง"
text_8="อยากให้ข้ากลายเป็นทรายเหรอ? ไม่มีทางหรอก##แน่นอนว่าพวกเราจะแตกสลายตามกาลเวลา##แต่ข้าไม่ยอมแพ้ง่าย ๆ แบบนั้นหรอก"

[dia_enemywin48]
dialog_list=H,-SAND;
dialog_place=1,0;
text_0="ข้าเคยดื้นด้านเหมือนกับเจ้าตอนที่ข้ายังมีชีวิต และข้าก็เสียใจกับมัน##สักวันเจ้าก็จะเป็นเช่นนั้น"
text_1="แล้วเราจะได้รู้กัน"

[dia_enemy49]
dialog_list=H,-WITCH;
dialog_place=1,0,1,1,0,1,1;
text_0="ดูเจ้าสิ! เจ้าช่างเป็นอะไรที่ประหลาดมาก##เจ้าพาอะไรมาหาข้า? เลือดไหล? กระดูกหัก?##บาดเจ็บตรงไหนล่ะ?"
text_1="มันขึ้นอยู่กับว่าเจ้าอยู่ฝ่ายไหน ข้าไม่ทำร้ายผู้ที่ไม่ทำร้ายข้า"
text_2="เจ้าไม่ทำร้ายใครอย่างงั้นเหรอ?##นั่นแหละสิ่งที่ข้าอยากให้เจ้าทำ##ไปสิ ไปทำให้เนื้อของศัตรูเจ้าเต็มไปด้วยบาดแผล"
text_3="ชีวิตมันช่างเปราะบาง สลายได้ง่าย หาวิธีใหม่ในการรักษา...##คือความปรารถนาของข้า##ข้าไม่ใช่ศัตรูของเจ้า ศัตรูของข้าคือความตาย"
text_4="ข้าเคารพในการตัดสินใจของเจ้า มีชุมชนเล็ก ๆ อยู่ที่หนึ่ง##ข้าเชื่อว่าที่นั่นต้องยินดีรับความช่วยเหลือจากเจ้าแน่"
text_5="เจ้าอยากให้ข้ารักษาอาการปวดท้องและมือพุพองไหมล่ะ?##ขอบใจนะ แต่ข้าไม่ทำแบบนั้นหรอก การทำแบบนั้นมันช่างน่าสมเพช##ไม่ทำให้ข้าเป็นปรมาจารย์ด้านการรักษาได้ ลองคิดดูว่าข้าจะช่วย##ได้กี่ชีวิต หากข้าบรรลุขั้นสุดยอดของการรักษาแล้วน่ะ!"
text_6="ได้โปรดเถอะ ได้โปรดช่วยฆ่าทุกคนที่นี่ด้วย##ข้าต้องการฝึกฝนฝีมือในการรักษาของข้า"

[dia_enemywin49]
dialog_list=H,-WITCH;
dialog_place=1,0,1,1;
text_0="ล้มเหลว ยานี้อ่อนเกินไป##ให้ตายสิ! ข้ามั่นใจว่าวิธีการใหม่ของข้า##จะเอาชนะความตายได้แล้วแท้ ๆ...##น่าละอายเสียจริง"
text_1="น่าละอายจริง ๆ##ข้าชอบความมุ่งมั่นในการเป็นผู้รักษาของเจ้า##แต่เจ้าเอาชีวิตของข้าไปเสี่ยง เจ้ามันอันตรายมากเกินไป"
text_2="เจ้ากำลังพูดอะไร!##การมองโลกในแง่ร้ายของเจ้าไม่สามารถควบคุมได้##เจ้าก็ไม่ควรตัดสินคนอื่นเร็วเกินไป"
text_3="ข้ามีบางสิ่งให้กับเจ้า ข้าคิดว่าเจ้าสามารถใช้ยารักษาที่เยี่ยมยอดนี้ได้##ข้าเชื่อว่าสามารถปรับปรุงส่วนผสมบางอย่าง##และลองส่วนผสมใหม่ในครั้งหน้า หรือไม่ก็เปลี่ยนปริมาณ"

[dia_cutscene_intro]
dialog_list=YOTAGds,YOTAGds,YOTAGds,YOTAGds,YOTAGds,YOTAGds;
dialog_place=0,0,1,1,2,2,3,3,4,4,4,4;
text_0="ดวงดาวบนท้องฟ้าค่อย ๆ หายไปทีละดวง"
text_1="แต่ไม่มีใครสังเกตเห็น ไม่มีใครหยุดมันได้"
text_2="ข้ารีบไปยังสถานที่สุดท้าย ที่ซึ่งยังคงมีความหวัง"
text_3="ข้าต้องไปให้ถึงก่อนที่..."
text_4="ก่อนที่มันจะสายเกินไป"
text_5="เสียงของความเจ็บปวดจะหายไปอย่างรวดเร็ว"
text_6="โลกจะถูกทำลาย แม้แต่ความทรงจำก็จะสิ้นสลาย"
text_7="ถึงแม้ว่าจะไม่มีโอกาสนำมันกลับคืนมาได้..."
text_8="แต่ก็มักจะมีใครบางคนเต็มใจทำในสิ่งที่เป็นไปไม่ได้"
text_9="ในที่ที่ไร้ซึ่งดินแดน"
text_10="ไร้ซึ่งเวลา"
text_11="ไร้ซึ่งความทรงจำ"

[dia_bosssecret0_1]
dialog_list=H,-Dec,-Lim,-Fin,-Blin;
dialog_place=1,2,0,0,0,1,1,0,3,4,2,1;
text_0="เราคือผู้สร้างที่แท้จริงของโลกนี้ การดำรงอยู่ของเรามีมาก่อนแอลฟ่า##เจ้าพบเจอพวกเราแล้ว"
text_1="เจ้าถามสิ่งใดก็ได้ตามที่ต้องการ"
text_2="ที่จริงแล้วข้ามีคำถามมากมายเลยล่ะ"
text_3="ทำไมถนนไม่มีทางแยก?##ทำไมผู้รอดถึงชีวิตพยายามสร้างโรงเรียนก่อนที่อยู่อาศัย?"
text_4="...แล้วข้ามองเห็นสิ่งต่าง ๆ ได้ยังไงในเมื่อไม่มีดวงอาทิตย์อีกแล้ว?"
text_5="งั้นตอบคำถามเรื่องดวงอาทิตย์ก่อน##เจ้าก็เห็นนี่ว่าลิชทำลายทุกสิ่ง สภาพแวดล้อม ปรากฏการณ์ต่าง ๆ##หรือแม้แต่กฎของฟิสิกส์ สิ่งเหล่านี้มันไม่มีอีก##เขาทำให้เหมือนกับว่าทุกสิ่งทุกอย่างไม่เคยมีมาก่อน"
text_6="แม้เราจะนำแหล่งกำเนิดแสงออกไป แต่ความสามารถในการมองเห็น##ของสิ่งมีชีวิตต่าง ๆ ก็ยังคงอยู่ และลักษณะของพื้นที่ปิดนี้ทำให้##เกิดเงื่อนไขที่ผิดพลาดว่า ^สิ่งมีชีวิตไม่สูญเสียความสามารถ##ในการมองเห็นสิ่งต่าง ๆ แม้ในที่ไม่มีแสงก็ตาม^"
text_7="ถ้าอย่างนั้นทำไมไฟไม่ทำให้เราตาบอดล่ะ?"
text_8="คือ..."
text_9="ความจริงแล้ว... มันเป็นอะไรที่ซับซ้อนเกินกว่ามนุษย์จะเข้าใจได้##บางทีเราน่าจะฆ่าเขานะ?"
text_10="ใช่ ข้าเห็นด้วย"
text_11="ฟังดูมีเหตุผล"

[dia_bosssecretwin0_1]
dialog_list=H,-Dec,-Lim,-Fin,-Blin;
dialog_place=4,2,3,4,0,1,3,4,0,2,1;
text_0="อืม... นี่เราใส่ความเป็นไปได้นี้ลงในโค้ด ^จักรวาล^ เหรอ?"
text_1="จำไม่ได้เหมือนกัน..."
text_2="เราเคยเจอปสถานการณ์แบบนี้มาก่อน ถ้าจำไม่ผิดนะ"
text_3="นี่กำลังพูดถึงสถานการณ์ที่ต้องใช้ ^ปุ่มลับ^ ใช่ไหม?"
text_4="พูดอะไรน่ะ?"
text_5="กดมันได้ไหม? มันไม่สำคัญอีกแล้ว หรือว่าจะยอมแพ้ล่ะ..."
text_6="ได้สิ เอาเลย"
text_7="ดูเหมือนว่าจะไม่มีทางอื่นแล้วนะ กดเลย!"
text_8="นั่นไม่ยุติธรรมเลย!"
text_9="เจ้าจะได้ไม่ต้องถามซ้ำ ๆ อีก รอก่อนนะ"
text_10="กราฟิกส์แบบเต็มหน้าจออีกแล้ว..."

[dia_test1]
dialog_list=H,-EMPTY,-MOK,-ARM,-FISH,-GOB,-VAMP0,-VAMP1,-L;
dialog_place=0,8,0,8,3,0,3,3,0,5,6,4,6,4,8,7,5,0;
text_0="ทุกคน!##ยืนขึ้นเพื่อรายงานตัว!!!"
text_1="หนึ่ง!##ข้าคนแรกเสมอ!"
text_2="พวกเรารู้ลิช เจ้าไม่จำเป็นต้องบอกทุกครั้งก็ได้..."
text_3="แต่...##ข้า..."
text_4="ต่อไป!"
text_5="ชุดเกราะ บอกแล้วไงว่าอย่าทำแบบนั้น...##เจ้าก็รู้ว่าข้ามีที่เปิดกระป๋อง..."
text_6="(กรีดร้องอย่างตื่นตระหนก)"
text_7="สอง!"
text_8="...##เอาล่ะ..."
text_9="ข้า-สาม!"
text_10="เอ่อ วันตัวเลขของข้ามันเยอะมาก ข้าก็ไม่รู้เหมือนกัน..."
text_11="☄☊ 5 ♄"
