[tutorial]
tutorial_pc="(กดสเปซบาร์ หรือคลิกขวา เพื่อเปลี่ยนโหมด)"
tutorial_mob="(ปุ่มอยู่ด้านบน หรือด้านขวาของหน้าจอ)"
tutorial_joy="(%btn2)"
tutorial_1="การเปลี่ยนโหมดระหว่าง ^โหมดผจญภัย^ (การเดินบนแผนที่) และ ^โหมดวางแผน^ (หยุด)##กดปุ่มนี้"
tutorial_1_1=", คลิกขวา หรือกดสเปซบาร์##"
tutorial_1_2="หรือกดปุ่มที่ด้านล่างขวา##"
tutorial_1_3="- เล่นต่อโดยกดปุ่มเปลี่ยนโหมดของเกม"
tutorial_1_joy="การเปลี่ยนโหมดระหว่าง ^โหมดผจญภัย^ (การเดินบนแผนที่) และ ^โหมดวางแผน^ (หยุด)##กด %btn2##"
tutorial_2="คอยดูแถบช่วงเวลาของวันที่อยู่ด้านบนเอาไว้ ศัตรูใหม่มักจะโผล่มาช่วงท้ายของวัน##- เล่นต่อโดยกดปุ่มเปลี่ยนโหมดของเกม"
tutorial_3="การผจญภัย การต่อสู้ และการกระทำอื่น ๆ ส่วนใหญ่จะดำเนินการโดยอัตโนมัติ##ผู้เล่นไม่สามารถควบคุมได้โดยตรง##- คลิกตรงไหนก็ได้เพื่อดำเนินการต่อ"
tutorial_3_joy="การผจญภัย การต่อสู้ และการกระทำอื่น ๆ ส่วนใหญ่จะดำเนินการโดยอัตโนมัติ##ผู้เล่นไม่สามารถควบคุมได้โดยตรง##- กด %btn1 เพื่อดำเนินการต่อ"
tutorial_4="คุณมีช่องเก็บของ และช่องสิ่งของ คุณรู้ดีว่าต้องทำยังไง##- สวมใส่อาวุธเพื่อดำเนินการต่อ"
tutorial_4_1="(กดค้าง %btnZR เพื่อเปลี่ยนเป็นสิ่งของที่เลือก และสวมดาบด้วย %btn1)"
tutorial_5="คุณสามารถใช้การ์ดที่ได้มาจากการกำจัดศัตรูเพื่อเพิ่มสิ่งต่าง ๆ ลงไปบนแผนที่##นี่คือเหตุผลที่ต้องมี ^โหมดวางแผน^##- ลากการ์ดที่เหมาะสมเพื่อ ^จดจำ^ ภูมิประเทศ"
tutorial_5_1="(กดค้าง %btnZL เพื่อเปลี่ยนเป็นการ์ดที่เลือก และวางการ์ดด้วยคันโยกซ้าย และ %btn1)"
tutorial_6="ดี##- ผจญภัยต่อได้"
tutorial_8="คุณจะได้รับสิ่งของ และการ์ดใหม่จากการต่อสู้##สิ่งของบางอย่างก็มีความสามารถเฉพาะตัวเหมือนกับการ์ด@##- สวมใส่อาวุธใหม่ และลากการ์ดลงบนแผนที่เพื่อดำเนินการต่อ"
tutorial_8_3="กดค้าง %btnZR หรือ %btnZL และเลือกสิ่งของหรือการ์ด คุณจะสามารดูข้อมูลมันได้"
tutorial_8_1="การวางเมาส์บนสิ่งของ##หรือการ์ดจะทำให้คุณตรวจดูคุณสมบัติของมันได้"
tutorial_8_2="การคลิกที่สิ่งของ หรือการ์ดจะทำให้คุณตรวจดูคุณสมบัติของมันได้"
tutorial_9="การกระทำบางอย่างของคุณจะให้ทรัพยากรที่คุณจะต้องใช้ในภายหลัง ยังไม่ใช่ในตอนนี้##และนั่นก็ไม่ควรหยุดยั้งคุณจากการมองหามัน##- ผจญภัยต่อโดยเปลี่ยนโหมดของเกม"
tutorial_10="เกมนี้จะผจญภัยไปบนเส้นทางที่วนไปมา##คุณเท่านั้นที่จะเป็นผู้ตัดสินใจว่าเวลาใดที่ฮีโร่ควรกลับไปที่แค้มป์...##คุณสามารถถอยกลับไปที่แค้มป์ได้เกือบตลอดเวลา##แอนิเมชั่นพิเศษจะบอกให้คุณรู้เมื่อมันปลอดภัยที่จะทำ##- ถอยกลับไปที่แค้มป์โดยกดปุ่มนี้"
tutorial_10_joy="เกมนี้จะผจญภัยไปบนเส้นทางที่วนไปมา##คุณเท่านั้นที่จะเป็นผู้ตัดสินใจว่าเวลาใดที่ฮีโร่ควรกลับไปที่แค้มป์...##คุณสามารถถอยกลับไปที่แค้มป์ได้เกือบตลอดเวลา##แอนิเมชั่นพิเศษจะบอกให้คุณรู้เมื่อมันปลอดภัยที่จะทำ##- ถอยกลับไปที่แค้มป์โดยกดปุ่มนี้ %btn4"
tutorial_11="พื้นที่เหมาะสมสำหรับตั้งแค้มป์##ทรัพยากรทุกอย่างที่คุณหามาได้จะถูกใช้ประโยชน์ที่นี่ คุณมีไม้ ##และก้อนหินเพียงพอสำหรับสร้างกองไฟ! ยอดเยี่ยมจริง ๆ!##สร้างกองไฟโดยใช้คำสั่งสร้างขณะที่อยู่ในแค้มป์##- กดปุ่มสร้าง เลือกกองไฟ จากนั้นก็วางมัน"
tutorial_12="สุดยอดเลย! คุณจบสิ้นบทเรียนช่วยเล่นที่น่าเบื่อนี้แล้ว##ต่อไปนี้คุณสามารถเริ่มผจญภัยได้... หรือจะไม่เริ่ม... ก็แล้วแต่คุณ##- คลิกตรงไหนก็ได้เพื่อจบบทเรียนนี้"


