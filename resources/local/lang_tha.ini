cmp16_1_2="มันมืดมน แต่ก็เป็นที่ที่ขาดไม่ได้"
cmp16_1_3="• คืนชีพฮีโร่พร้อมพลังชีวิต 15%##ได้หนึ่งครั้งในการผจญภัย##• การเดินผ่านสุสานคุณจะได้รับ##^เศษซากความทรงจำ^##• อัปเกรดแล้วฮีโร่ที่ถูกชุบชีวิต##จะมีพลังชีวิตมากขึ้น"
