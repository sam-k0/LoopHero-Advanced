perk_31="^เปลี่ยนใจ^##เปลี่ยน 3 ความสามารถใหม่ (ไม่เสียแต้ม)"
perk_32="^เก็บรักษา^##ฮีโร่เก็บสิ่งที่หามาได้ @% ไว้ที่แค้มป์##เมื่อเดินผ่านช่องแค้มป์"
perk_33="^ผู้อยู่รอด^##หากพลังชีวิตของคุณต่ำกว่า @%##การฟื้นฟูของคุณจะกลายเป็นสองเท่า"
perk_34="^ไม่รู้! ไม่รู้!^##มือของคุณเต็มไปด้วยการ์ด ^ลืมเลือน^##หลังจากนั้นการใช้การ์ด ^ลืมเลือน^##จะฟื้นฟู @% ของพลังชีวิตสูงสุดให้กับฮีโร่"
perk_35="^มั่งคั่ง^##จำนวนทรัพยากรสูงสุดที่สามารถสะสม##ในการผจญภัยเพิ่มขึ้น @%"
perk_36="^เลื่อนเวลา^##เวลาเร็วมากขึ้น @%"
perk_37="^เทคนิคของโอไมครอน^##ชุบชีวิตได้อีก 1 ครั้ง"
perk_38="^เศษส่วนที่ถูกปลุก^##มีโอกาส @% จะได้รับทรัพยากรอันใหญ่##แทนที่จะเป็นเศษ หรือชิ้น"
perk_39="^นักล่าสมบัติ^##มีโอกาส @% ที่หีบสมบัติจะปรากฏ##หลังจากศัตรูตาย"
perk_40="^ของขวัญจากเลือด^##เมื่อโจมตี ฮีโร่มีโอกาสเรียกสายฟ้าเลือด##ออกมาได้"
perk_40_0="^ของขวัญจากเลือด^##เมื่อโจมตี ฮีโร่สามารถเรียกสายฟ้าเลือด##ออกมาได้ โดยมีโอกาสเท่ากับการดูดเลือด"
perk_40_1="^ของขวัญจากเลือด^##เมื่อโจมตี ฮีโร่สามารถเรียกสายฟ้าเลือด##ออกมาได้ โดยมีโอกาสเท่ากับโอกาสคริ"
perk_40_2="^ของขวัญจากเลือด^##เมื่อโจมตี ฮีโร่หรือสเกลเลตันของเขา##มีโอกาส @% ที่จะเรียกสายฟ้าเลือดได้"
perk_41="^ส่วยจากความตาย^##มีโอกาส @% ได้รับทรัพยากรแบบสุ่ม##เมื่อฆ่าศัตรู"
perk_42="^ยอดสถาปนิก^##ทุกครั้งที่วางการ์ดสิ่งก่อสร้าง ฮีโร่ได้รับ##ค่าประสบการณ์ @*ลูป"
perk_43="^ดวงตาเทพเจ้า^##มีโอกาส @% ที่ศัตรูจะมีความสามารถ##น้อยกว่า 1 อย่าง ใช้ไม่ได้กับบอส"
perk_44="^โล่แห่งศรัทธา^##เมื่อฆ่าศัตรู ฮีโร่จะได้รับกระจกป้องกัน##ซึ่งมีโอกาสป้องกัน @% สะสมได้ @ กระจก"
perk_45="^อันตรายที่รายรอบ^##มีโอกาส @% สะท้อนการโจมตีระยะไกล##ไปยังศัตรูแบบสุ่ม"
perk_46="^ขวดที่ไม่หมด^##มีโอกาส @% ที่จำนวนยาไม่ลด เมื่อใช้ยา"
perk_47="^โกรธจัด^##ฮีโร่โจมตี 4 ครั้งด้วยความเร็วสองเท่า##เมื่อพลังชีวิตต่ำกว่า @% (1 ครั้งในการต่อสู้)"
perk_48="^เร็วฟ้าผ่า^##ฮีโร่หรือสเกลเลตันของเขา มีโอกาส @%##ที่จะโจมตีเป็นชุด 3 ครั้ง แบบรวดเร็ว##แต่ละครั้งสร้างความเสียหาย @%"
perk_48_0="^เร็วฟ้าผ่า^##ฮีโร่มีโอกาส @% โจมตีเป็นชุด 3 ครั้ง##แต่ละครั้งสร้างความเสียหาย @%"
perk_48_1="^เร็วฟ้าผ่า^##สเกเลตันมีโอกาส @% ที่จะโจมตีเป็นชุด##3 ครั้ง แต่ละครั้งสร้างความเสียหาย @%"
perk_49="^เป้าหมายของฮันเตอร์^##หลังจากฆ่าศัตรู การโจมตีครั้งถัดไปของคุณ##สร้างความเสียหาย @*ลูป"

