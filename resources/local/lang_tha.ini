dead1="คุณตายในการต่อสู้##ความตายไม่ได้มอบโชคให้ผู้สูญเสีย##แต่มันมีข้อยกเว้นเล็กน้อยสำหรับคุณ"
dead2="ถอยกลับ:##- คุณจะได้"
