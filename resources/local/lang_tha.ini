cmp16_2_3="• คืนชีพฮีโร่พร้อมพลังชีวิต 35%##ได้หนึ่งครั้งในการผจญภัย.##• การเดินผ่านสุสานคุณจะได้รับ##^เศษซากความทรงจำ^##• อัปเกรดแล้วฮีโร่ที่ถูกชุบชีวิต##จะมีพลังชีวิตมากขึ้น"
